syntax = "proto3";

package proompteng.authz.v1;

import "proompteng/authz/v1/authz.proto";

option go_package = "github.com/proompteng/lab/gen/proompteng/authz/v1;authzv1";

service PlatformAuthorizationService {
  rpc BeginSignIn(BeginSignInRequest) returns (BeginSignInResponse);
  rpc ConsumeSignIn(ConsumeSignInRequest) returns (ConsumeSignInResponse);
  rpc EstablishSession(EstablishSessionRequest) returns (EstablishSessionResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc InspectSession(InspectSessionRequest) returns (InspectSessionResponse);
  rpc GetPlatformConfiguration(GetPlatformConfigurationRequest) returns (GetPlatformConfigurationResponse);
  rpc ListPlatformWorkspaces(ListPlatformWorkspacesRequest) returns (ListPlatformWorkspacesResponse);
  rpc GetPlatformWorkspace(GetPlatformWorkspaceRequest) returns (GetPlatformWorkspaceResponse);
  rpc ReadWorkspaceActivity(ReadWorkspaceActivityRequest) returns (ReadWorkspaceActivityResponse);
  rpc CheckPlatformAccess(CheckPlatformAccessRequest) returns (CheckPlatformAccessResponse);
  rpc DiscoverPlatformAccess(DiscoverPlatformAccessRequest) returns (DiscoverPlatformAccessResponse);
  rpc RecordPlatformExecution(RecordPlatformExecutionRequest) returns (RecordPlatformExecutionResponse);
  rpc GetPlatformExecution(GetPlatformExecutionRequest) returns (GetPlatformExecutionResponse);
  rpc ReadPolicyRelationships(ReadPolicyRelationshipsRequest) returns (ReadPolicyRelationshipsResponse);
  rpc WritePolicyRelationships(WritePolicyRelationshipsRequest) returns (WritePolicyRelationshipsResponse);
  rpc ListPlatformConnections(ListPlatformConnectionsRequest) returns (ListPlatformConnectionsResponse);
  rpc PutPlatformConnection(PutPlatformConnectionRequest) returns (PutPlatformConnectionResponse);
  rpc RevokePlatformConnection(RevokePlatformConnectionRequest) returns (RevokePlatformConnectionResponse);
  rpc CreatePlatformDelegation(CreatePlatformDelegationRequest) returns (CreatePlatformDelegationResponse);
  rpc ActivatePlatformDelegation(ActivatePlatformDelegationRequest) returns (ActivatePlatformDelegationResponse);
  rpc RevokePlatformDelegation(RevokePlatformDelegationRequest) returns (RevokePlatformDelegationResponse);
  rpc CreatePlatformAccessRequest(CreatePlatformAccessRequestRequest) returns (CreatePlatformAccessRequestResponse);
  rpc ReviewPlatformAccessRequest(ReviewPlatformAccessRequestRequest) returns (ReviewPlatformAccessRequestResponse);
  rpc CancelPlatformAccessRequest(CancelPlatformAccessRequestRequest) returns (CancelPlatformAccessRequestResponse);
  rpc ListPlatformAccessRequests(ListPlatformAccessRequestsRequest) returns (ListPlatformAccessRequestsResponse);
  rpc ListProviderConnections(ListProviderConnectionsRequest) returns (ListProviderConnectionsResponse);
  rpc BeginProviderConnection(BeginProviderConnectionRequest) returns (BeginProviderConnectionResponse);
  rpc CompleteProviderConnection(CompleteProviderConnectionRequest) returns (CompleteProviderConnectionResponse);
  rpc DisconnectProviderConnection(DisconnectProviderConnectionRequest) returns (DisconnectProviderConnectionResponse);
  rpc ResolveProviderCredential(ResolveProviderCredentialRequest) returns (ResolveProviderCredentialResponse);
}

enum ProviderConnectionState {
  PROVIDER_CONNECTION_STATE_UNSPECIFIED = 0;
  PROVIDER_CONNECTION_STATE_DISCONNECTED = 1;
  PROVIDER_CONNECTION_STATE_READY = 2;
  PROVIDER_CONNECTION_STATE_RECONNECT = 3;
}
message ProviderConnection {
  string profile_id = 1;
  string name = 2;
  string connector_id = 3;
  PlatformConnectionScope scope = 4;
  bool workspace_managed = 5;
  string connection_id = 6;
  ProviderConnectionState state = 7;
  string account_name = 8;
  repeated string provider_scopes = 9;
}
message ListProviderConnectionsRequest {
  PlatformHumanSession human = 1;
  string workspace_id = 2;
}
message ListProviderConnectionsResponse {
  repeated ProviderConnection connections = 1;
}
message BeginProviderConnectionRequest {
  string operation_id = 1;
  PlatformHumanSession human = 2;
  string profile_id = 3;
  string binding = 4;
  string return_path = 5;
}
message BeginProviderConnectionResponse {
  string authorization_url = 1;
  string connection_id = 2;
}
message CompleteProviderConnectionRequest {
  PlatformHumanSession human = 1;
  string profile_id = 2;
  string state = 3;
  string binding = 4;
  string code = 5;
  string error = 6;
  string issuer = 7;
}
message CompleteProviderConnectionResponse {
  string connection_id = 1;
  string return_path = 2;
  bool connected = 3;
  ProviderConnectionProblem problem = 4;
}
enum ProviderConnectionProblem {
  PROVIDER_CONNECTION_PROBLEM_UNSPECIFIED = 0;
  PROVIDER_CONNECTION_PROBLEM_CANCELLED = 1;
  PROVIDER_CONNECTION_PROBLEM_ACCOUNT_MISMATCH = 2;
  PROVIDER_CONNECTION_PROBLEM_AUTHORIZATION_FAILED = 3;
  PROVIDER_CONNECTION_PROBLEM_ACCESS_REMOVED = 4;
}
message DisconnectProviderConnectionRequest {
  string operation_id = 1;
  PlatformHumanSession human = 2;
  string profile_id = 3;
  string connection_id = 4;
}
message DisconnectProviderConnectionResponse {
  PlatformDecision decision = 1;
  bool provider_revocation_confirmed = 2;
}
message ResolveProviderCredentialRequest {
  string profile_id = 1;
  string destination = 2;
  CheckPlatformAccessRequest authorization = 3;
  string connector_id = 4;
}
message ResolveProviderCredentialResponse {
  string access_token = 1;
  string connection_id = 2;
  uint64 expires_at_unix_ms = 3;
}

message BeginSignInRequest {
  string state = 1;
  string binding = 2;
  string verifier = 3;
  string nonce = 4;
  string operation_id = 5;
  string return_path = 6;
}
message BeginSignInResponse {}
message ConsumeSignInRequest {
  string state = 1;
  string binding = 2;
}
message ConsumeSignInResponse {
  string verifier = 1;
  string nonce = 2;
  string operation_id = 3;
  string return_path = 4;
}

message EstablishSessionRequest {
  // Verified against the configured issuer, audience, signature and broker ID.
  string identity_token = 1;
  string nonce = 2;
  string operation_id = 3;
  // Browser cookie being replaced, if present. Revoked atomically with issuance.
  string previous_credential = 4;
  // Gateway-generated 256-bit base64url credential, reused only for an exact retry.
  // Ofz persists its hash and the request fingerprint, never this plaintext.
  string credential = 5;
}

message Session {
  string id = 1;
  string human_id = 2;
  uint64 expires_at_unix_ms = 3;
  uint64 idle_deadline_unix_ms = 4;
  uint64 mfa_at_unix_ms = 5;
  uint64 recovery_generation = 6;
  // Opaque random credential, returned only at establishment; hash stored centrally.
  string credential = 7;
  string github_id = 8;
  string display_name = 9;
  string email = 10;
  string image_url = 11;
}

message EstablishSessionResponse {
  Session session = 1;
}
message InspectSessionResponse {
  Session session = 1;
}
message RevokeSessionResponse {
  CommandReceipt receipt = 1;
}

message RevokeSessionRequest {
  // Possession revokes only this session, including a retry after revocation.
  string credential = 1;
  string operation_id = 2;
  string origin = 3;
}

message InspectSessionRequest {
  // Opaque credential from the gateway's HttpOnly cookie, not the public session ID.
  string session_id = 1;
}

message GetPlatformConfigurationRequest {}
message GetPlatformConfigurationResponse {
  uint64 policy_version = 1;
  string policy_catalog_json = 2;
  repeated RegisteredRelayClient relay_clients = 3;
  repeated RegisteredProviderProfile provider_profiles = 4;
}
message RegisteredProviderProfile {
  string id = 1;
  string connector_id = 2;
  string destination = 3;
}
message RegisteredRelayClient {
  string id = 1;
  repeated string identities = 2;
  string display_name = 3;
}

message RegisteredPlatformWorkspace {
  string id = 1;
  string name = 2;
  repeated RegisteredWorkspaceResource resources = 3;
}
message RegisteredWorkspaceResource {
  string name = 1;
  PlatformResource resource = 2;
}
message ListPlatformWorkspacesRequest {
  PlatformHumanSession administrator = 1;
}
message ListPlatformWorkspacesResponse {
  repeated RegisteredPlatformWorkspace workspaces = 1;
}
message GetPlatformWorkspaceRequest {
  PlatformHumanSession administrator = 1;
  string workspace_id = 2;
}
enum PlatformWorkspaceRole {
  PLATFORM_WORKSPACE_ROLE_UNSPECIFIED = 0;
  PLATFORM_WORKSPACE_ROLE_MEMBER = 1;
  PLATFORM_WORKSPACE_ROLE_ADMINISTRATOR = 2;
}
message PlatformWorkspaceMember {
  string human_id = 1;
  string github_id = 2;
  string display_name = 3;
  PlatformWorkspaceRole role = 4;
  bool admitted = 5;
}
message PlatformWorkspaceClient {
  RegisteredRelayClient client = 1;
  bool enabled = 2;
}
message GetPlatformWorkspaceResponse {
  RegisteredPlatformWorkspace workspace = 1;
  repeated PlatformWorkspaceMember members = 2;
  repeated PlatformWorkspaceClient clients = 3;
  uint64 policy_version = 4;
}
message ReadWorkspaceActivityRequest {
  PlatformHumanSession administrator = 1;
  string workspace_id = 2;
  string cursor = 3;
}
message ReadWorkspaceActivityResponse {
  repeated AuditReceipt receipts = 1;
  string cursor = 2;
}

message RecordPlatformExecutionRequest {
  string operation_id = 1;
  string authorization_receipt_id = 2;
  bytes request_hash = 3;
  string outcome = 4;
  uint32 upstream_status = 5;
  bytes result_hash = 6;
}
message RecordPlatformExecutionResponse {
  string audit_receipt_id = 1;
}

message GetPlatformExecutionRequest {
  CheckPlatformAccessRequest authorization = 1;
  bytes execution_request_hash = 2;
}
message PlatformExecution {
  string operation_id = 1;
  string outcome = 2;
  string authorization_receipt_id = 3;
  string execution_receipt_id = 4;
  uint32 upstream_status = 5;
  bytes result_hash = 6;
  bytes request_hash = 7;
  uint64 updated_at_unix_ms = 8;
}
message GetPlatformExecutionResponse {
  PlatformExecution execution = 1;
  PlatformDecision decision = 2;
}

message PlatformResource {
  string kind = 1;
  string id = 2;
  string target = 3;
}

message PlatformHumanSession {
  string human_id = 1;
  string session_id = 2;
  string origin = 3;
}

message PlatformDelegationProof {
  string delegation_id = 1;
  string credential = 2;
  string proof = 3;
}

message PlatformSubject {
  oneof identity {
    string workload_id = 1;
    PlatformHumanSession human = 2;
    PlatformDelegationProof delegation = 3;
  }
  string client_service = 4;
}

message DiscoverPlatformAccessRequest {
  PlatformSubject subject = 1;
}
message DiscoverPlatformAccessResponse {
  repeated PlatformConnectionScope scopes = 1;
}
message PlatformConnectionScope {
  string workspace_id = 1;
  string workspace_name = 2;
  PlatformResource resource = 3;
  string resource_name = 4;
  repeated string actions = 5;
}

message PlatformBinding {
  string service = 1;
  string id = 2;
  string generation = 3;
}

message CheckPlatformAccessRequest {
  string operation_id = 1;
  PlatformSubject subject = 2;
  string action = 3;
  repeated PlatformResource resources = 4;
  bytes request_hash = 5;
  PlatformBinding binding = 6;
  string audit_receipt_id = 7;
}

message PlatformDecision {
  bool allowed = 1;
  string revision = 2;
  string audit_receipt_id = 3;
  uint64 valid_until_unix_ms = 4;
  uint64 recovery_generation = 5;
}

message PolicyRelationship {
  PlatformResource resource = 1;
  string relation = 2;
  string subject_kind = 3;
  string subject_id = 4;
  bool enabled = 5;
}

message ReadPolicyRelationshipsRequest {
  PlatformHumanSession administrator = 1;
  PlatformResource resource = 2;
  string subject_kind = 3;
  string subject_id = 4;
  string workspace_id = 5;
}
message ReadPolicyRelationshipsResponse {
  uint64 policy_version = 1;
  repeated string relations = 2;
}

message WritePolicyRelationshipsRequest {
  string operation_id = 1;
  PlatformHumanSession administrator = 2;
  uint64 expected_policy_version = 3;
  repeated PolicyRelationship relationships = 4;
  string reason = 5;
  string workspace_id = 6;
}

message CreatePlatformDelegationRequest {
  string operation_id = 1;
  PlatformHumanSession issuer = 2;
  string client_service = 3;
  string agent_id = 4;
  repeated string actions = 5;
  repeated PlatformResource resources = 6;
  string proof_key_thumbprint = 7;
  uint64 expires_at_unix_ms = 8;
  PlatformBinding binding = 9;
  string connection_id = 10;
  uint64 expected_connection_version = 11;
}

message CreatePlatformDelegationResponse {
  string delegation_id = 1;
  string credential = 2;
  PlatformDecision decision = 3;
  uint64 credential_generation = 4;
}

message PlatformConnection {
  string id = 1;
  string client_service = 2;
  string client_reference = 3;
  repeated string actions = 4;
  repeated PlatformResource resources = 5;
  PlatformBinding binding = 6;
  uint64 version = 7;
  bool enabled = 8;
  string delegation_id = 9;
  PlatformBinding credential_binding = 10;
  string proof_key_thumbprint = 11;
  uint64 expires_at_unix_ms = 12;
  bool credential_active = 13;
  uint64 credential_generation = 14;
  uint64 recovery_generation = 15;
  string workspace_id = 16;
}
message ListPlatformConnectionsRequest {
  PlatformHumanSession issuer = 1;
  string client_service = 2;
  PlatformBinding binding = 3;
}
message ListPlatformConnectionsResponse {
  repeated PlatformConnection connections = 1;
  uint64 recovery_generation = 2;
  repeated PlatformConnectionScope available_scopes = 3;
  repeated PlatformConnectionScope requestable_scopes = 4;
  repeated PlatformAccessRequest access_requests = 5;
}

enum PlatformAccessRequestState {
  PLATFORM_ACCESS_REQUEST_STATE_UNSPECIFIED = 0;
  PLATFORM_ACCESS_REQUEST_STATE_PENDING = 1;
  PLATFORM_ACCESS_REQUEST_STATE_APPROVED = 2;
  PLATFORM_ACCESS_REQUEST_STATE_DECLINED = 3;
  PLATFORM_ACCESS_REQUEST_STATE_CANCELLED = 4;
}
enum PlatformAccessRequestDecision {
  PLATFORM_ACCESS_REQUEST_DECISION_UNSPECIFIED = 0;
  PLATFORM_ACCESS_REQUEST_DECISION_APPROVE = 1;
  PLATFORM_ACCESS_REQUEST_DECISION_DECLINE = 2;
}
message PlatformAccessRequest {
  string id = 1;
  string requester_human_id = 2;
  string client_service = 3;
  PlatformConnectionScope scope = 4;
  string reason = 5;
  PlatformAccessRequestState state = 6;
  string decision_reason = 7;
  uint64 created_at_unix_ms = 8;
  uint64 updated_at_unix_ms = 9;
}
message CreatePlatformAccessRequestRequest {
  string operation_id = 1;
  PlatformHumanSession requester = 2;
  string workspace_id = 3;
  PlatformResource resource = 4;
  repeated string actions = 5;
  string reason = 6;
}
message CreatePlatformAccessRequestResponse {
  string request_id = 1;
  PlatformDecision decision = 2;
}
message ReviewPlatformAccessRequestRequest {
  string operation_id = 1;
  PlatformHumanSession administrator = 2;
  string workspace_id = 3;
  string request_id = 4;
  PlatformAccessRequestDecision decision = 5;
  string reason = 6;
}
message ReviewPlatformAccessRequestResponse {
  PlatformDecision decision = 1;
}
message CancelPlatformAccessRequestRequest {
  string operation_id = 1;
  PlatformHumanSession requester = 2;
  string request_id = 3;
}
message CancelPlatformAccessRequestResponse {
  PlatformDecision decision = 1;
}
message ListPlatformAccessRequestsRequest {
  PlatformHumanSession administrator = 1;
  string workspace_id = 2;
}
message ListPlatformAccessRequestsResponse {
  repeated PlatformAccessRequest requests = 1;
}
message PutPlatformConnectionRequest {
  string operation_id = 1;
  PlatformHumanSession issuer = 2;
  string client_service = 3;
  string connection_id = 4;
  uint64 expected_version = 5;
  string client_reference = 6;
  repeated string actions = 7;
  repeated PlatformResource resources = 8;
  PlatformBinding binding = 9;
}
message PutPlatformConnectionResponse {
  string connection_id = 1;
  uint64 version = 2;
  uint64 credential_generation = 3;
  PlatformDecision decision = 4;
}
message RevokePlatformConnectionRequest {
  string operation_id = 1;
  PlatformHumanSession issuer = 2;
  string client_service = 3;
  string connection_id = 4;
}
message RevokePlatformConnectionResponse {
  string connection_id = 1;
  uint64 credential_generation = 2;
  PlatformDecision decision = 3;
}

message RevokePlatformDelegationRequest {
  string operation_id = 1;
  PlatformHumanSession issuer = 2;
  string delegation_id = 3;
}

message ActivatePlatformDelegationRequest {
  string operation_id = 1;
  PlatformHumanSession issuer = 2;
  string delegation_id = 3;
  string proof_key_thumbprint = 4;
}

message CheckPlatformAccessResponse {
  PlatformDecision decision = 1;
}

message WritePolicyRelationshipsResponse {
  PlatformDecision decision = 1;
}

message ActivatePlatformDelegationResponse {
  PlatformDecision decision = 1;
}

message RevokePlatformDelegationResponse {
  PlatformDecision decision = 1;
}
