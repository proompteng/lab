{{- if and .Values.metrics.enabled .Values.metrics.service.enabled }}
{{- $services := list (dict "suffix" "-metrics" "selector" "agents.selectorLabels" "type" .Values.metrics.service.type) }}
{{- if and .Values.controllers.enabled .Values.metrics.serviceMonitor.enabled }}
{{- $services = append $services (dict "suffix" "-controllers-metrics" "selector" "agents.controllersSelectorLabels" "type" "ClusterIP") }}
{{- end }}
{{- range $services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agents.fullname" $ }}{{ .suffix }}
  namespace: {{ $.Values.namespaceOverride | default $.Release.Namespace }}
  labels:
    {{- include "agents.labels" $ | nindent 4 }}
    app.kubernetes.io/component: metrics
    {{- with $.Values.metrics.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $.Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .type }}
  ports:
    - port: {{ $.Values.metrics.service.port }}
      targetPort: http
      protocol: TCP
      name: metrics
  selector:
    {{- include .selector $ | nindent 4 }}
{{- end }}
{{- end }}
