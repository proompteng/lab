{{- if .Values.agentsShell.enabled -}}
{{- $namespace := .Values.namespaceOverride | default .Release.Namespace -}}
{{- $image := .Values.agentsShell.image | default dict -}}
{{- $workspaceBootstrap := .Values.agentsShell.workspace.bootstrap | default dict -}}
{{- $workspaceVolumeMode := .Values.agentsShell.workspace.volumeMode | default "persistentVolumeClaim" -}}
{{- $workspaceSeedReadOnly := .Values.agentsShell.workspace.seedReadOnly | default false -}}
{{- $workspaceSeedSubPath := "" -}}
{{- if and $workspaceBootstrap.enabled $workspaceSeedReadOnly -}}
{{- $workspaceSeedTarget := required "agentsShell.workspace.bootstrap.targetPath is required when seedReadOnly is enabled" $workspaceBootstrap.targetPath -}}
{{- if not (hasPrefix "/workspace/" $workspaceSeedTarget) -}}
{{- fail "agentsShell.workspace.bootstrap.targetPath must be a child of /workspace" -}}
{{- end -}}
{{- $workspaceSeedSubPath = trimPrefix "/workspace/" $workspaceSeedTarget -}}
{{- if or (eq $workspaceSeedSubPath "") (contains ".." $workspaceSeedSubPath) -}}
{{- fail "agentsShell.workspace.bootstrap.targetPath must be a contained child without traversal" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents.agentsShellName" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents-shell
spec:
  replicas: {{ .Values.agentsShell.replicaCount }}
  {{- with .Values.agentsShell.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agents.agentsShellSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agents.agentsShellSelectorLabels" . | nindent 8 }}
        {{- with .Values.agentsShell.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.agentsShell.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agents.agentsShellServiceAccountName" . }}
      {{- if $image.pullSecrets }}
      imagePullSecrets:
        {{- range $image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.agentsShell.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentsShell.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentsShell.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentsShell.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.agentsShell.terminationGracePeriodSeconds }}
      {{- if $workspaceBootstrap.enabled }}
      initContainers:
        - name: bootstrap-workspace
          image: "{{ $image.repository }}:{{ $image.tag }}{{- if $image.digest }}@{{ $image.digest }}{{ end }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          {{- with .Values.agentsShell.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: GIT_REPOSITORY
              value: {{ required "agentsShell.workspace.bootstrap.repository is required when bootstrap is enabled" $workspaceBootstrap.repository | quote }}
            - name: GIT_BRANCH
              value: {{ default "main" $workspaceBootstrap.branch | quote }}
            - name: GIT_TARGET_PATH
              value: {{ required "agentsShell.workspace.bootstrap.targetPath is required when bootstrap is enabled" $workspaceBootstrap.targetPath | quote }}
            - name: GIT_DEPTH
              {{- if hasKey $workspaceBootstrap "depth" }}
              value: {{ $workspaceBootstrap.depth | quote }}
              {{- else }}
              value: "1"
              {{- end }}
            {{- with $workspaceBootstrap.tokenSecret }}
            {{- if .name }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key | default "token" }}
            {{- end }}
            {{- end }}
          command:
            - /bin/bash
            - -ec
          args:
            - |
              set -euo pipefail

              export HOME=/tmp/git-home
              export GIT_CONFIG_GLOBAL="${HOME}/gitconfig"
              export GIT_CONFIG_NOSYSTEM=1
              export GIT_CONFIG_SYSTEM=/dev/null
              export GIT_TERMINAL_PROMPT=0
              if [[ -L /workspace/.agents-shell ]]; then
                echo 'agents-shell control root must not be a symlink' >&2
                exit 1
              fi
              preserved_root=/workspace/.agents-shell-preserved-checkouts
              if [[ -L "${preserved_root}" ]]; then
                echo 'agents-shell preserved checkout root must not be a symlink' >&2
                exit 1
              fi
              mkdir -p "${HOME}" "$(dirname "${GIT_TARGET_PATH}")" /workspace/.agents-shell "${preserved_root}"
              if [[ ! -d "${preserved_root}" || -L "${preserved_root}" ]]; then
                echo 'agents-shell preserved checkout root must be a non-symlink directory' >&2
                exit 1
              fi
              chown -h 0:0 "${preserved_root}"
              chmod 0700 "${preserved_root}"
              if [[ "$(stat -c '%u:%g:%a' "${preserved_root}")" != '0:0:700' ]]; then
                echo 'agents-shell preserved checkout root metadata is invalid' >&2
                exit 1
              fi
              legacy_preserved=/workspace/.agents-shell/checkouts
              if [[ -L "${legacy_preserved}" ]]; then
                echo 'discarding legacy preserved checkout symlink' >&2
                rm -f -- "${legacy_preserved}"
              elif [[ -d "${legacy_preserved}" ]]; then
                legacy_destination="${preserved_root}/legacy-checkouts-$(date -u +%Y%m%dT%H%M%SZ)-${RANDOM}"
                echo "migrating legacy preserved checkouts to ${legacy_destination}" >&2
                mv "${legacy_preserved}" "${legacy_destination}"
              elif [[ -e "${legacy_preserved}" ]]; then
                echo 'legacy preserved checkout path must be a directory or symlink' >&2
                exit 1
              fi
              if [[ -n "$(find /workspace/.agents-shell -type l -print -quit)" ]]; then
                echo 'agents-shell control tree must not contain symlinks' >&2
                exit 1
              fi
              if [[ -n "$(find /workspace/.agents-shell -type f -links +1 -print -quit)" ]]; then
                echo 'agents-shell control tree must not contain hard-linked files' >&2
                exit 1
              fi
              lease_state=/workspace/.agents-shell/leases.json
              if [[ -e "${lease_state}" && ! -f "${lease_state}" ]]; then
                echo 'agents-shell lease state must be a regular file' >&2
                exit 1
              fi
              if [[ -f "${lease_state}" && "$(stat -c '%u:%g' "${lease_state}")" != '0:0' ]]; then
                echo 'discarding untrusted legacy agents-shell lease state' >&2
                rm -f "${lease_state}"
              fi
              chown -hR 0:0 /workspace/.agents-shell
              chmod 0711 /workspace/.agents-shell

              if [[ -n "${GIT_TOKEN:-}" ]]; then
                umask 077
                printf 'https://x-access-token:%s@github.com\n' "${GIT_TOKEN}" > /tmp/git-credentials
                git config --file "${GIT_CONFIG_GLOBAL}" credential.helper 'store --file=/tmp/git-credentials'
              fi
              umask 022

              fetch_args=()
              clone_args=()
              if [[ "${GIT_DEPTH}" != "0" ]]; then
                fetch_args=(--depth="${GIT_DEPTH}")
                clone_args=(--depth="${GIT_DEPTH}")
              fi

              clone_checkout() {
                rm -rf "${GIT_TARGET_PATH}"
                git clone --no-hardlinks "${clone_args[@]}" --branch="${GIT_BRANCH}" "${GIT_REPOSITORY}" "${GIT_TARGET_PATH}"
                migrate_checkout
              }

              migrate_checkout() {
                local git_dir="${GIT_TARGET_PATH}/.git"
                local config="${git_dir}/config"
                local temporary="${config}.bootstrap.$$"

                chown -hR 0:0 "${GIT_TARGET_PATH}"
                rm -f "${temporary}"
                git config --file "${temporary}" core.repositoryFormatVersion 0
                git config --file "${temporary}" core.fileMode true
                git config --file "${temporary}" core.bare false
                git config --file "${temporary}" core.logAllRefUpdates true
                git config --file "${temporary}" core.hooksPath /dev/null
                git config --file "${temporary}" core.fsmonitor false
                git config --file "${temporary}" diff.external ''
                git config --file "${temporary}" interactive.diffFilter ''
                git config --file "${temporary}" submodule.recurse false
                git config --file "${temporary}" remote.origin.url "${GIT_REPOSITORY}"
                git config --file "${temporary}" --add remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
                chmod 0600 "${temporary}"
                mv -f "${temporary}" "${config}"
              }

              preserve_checkout() {
                local reason="$1"
                local backup_root="${preserved_root}"
                local backup_path="${backup_root}/$(basename "${GIT_TARGET_PATH}")-$(date -u +%Y%m%dT%H%M%SZ)"

                mkdir -p "${backup_root}"
                if [[ -e "${backup_path}" ]]; then
                  backup_path="${backup_path}-${RANDOM}"
                fi

                echo "preserving existing workspace checkout at ${backup_path}: ${reason}" >&2
                mv "${GIT_TARGET_PATH}" "${backup_path}"
              }

              discard_rejected_link() {
                local rejected_path="$1"
                local reason="$2"

                if [[ ! -L "${rejected_path}" ]]; then
                  echo "rejected checkout path is not a symlink: ${rejected_path}" >&2
                  exit 1
                fi
                echo "discarding rejected checkout link ${rejected_path}: ${reason}" >&2
                rm -f -- "${rejected_path}"
                if [[ -e "${rejected_path}" || -L "${rejected_path}" ]]; then
                  echo "failed to discard rejected checkout link: ${rejected_path}" >&2
                  exit 1
                fi
              }

              if [[ -L "${GIT_TARGET_PATH}" ]]; then
                discard_rejected_link "${GIT_TARGET_PATH}" "target path is a symlink"
                clone_checkout
              elif [[ -L "${GIT_TARGET_PATH}/.git" ]]; then
                discard_rejected_link "${GIT_TARGET_PATH}/.git" "git metadata is a symlink"
                preserve_checkout "git metadata symlink was discarded"
                clone_checkout
              elif [[ -d "${GIT_TARGET_PATH}/.git" ]]; then
                if [[ -n "$(find "${GIT_TARGET_PATH}/.git" -type l -print -quit)" ]]; then
                  echo 'git metadata must not contain nested symlinks' >&2
                  exit 1
                fi
                if [[ -n "$(find "${GIT_TARGET_PATH}/.git" -type f -links +1 -print -quit)" ]]; then
                  echo 'git metadata must not contain hard-linked files' >&2
                  exit 1
                fi
                migrate_checkout
                git -C "${GIT_TARGET_PATH}" remote set-url origin "${GIT_REPOSITORY}"
                if [[ "${GIT_DEPTH}" == "0" ]] && [[ "$(git -C "${GIT_TARGET_PATH}" rev-parse --is-shallow-repository 2>/dev/null)" == "true" ]]; then
                  git -C "${GIT_TARGET_PATH}" fetch --unshallow origin "${GIT_BRANCH}" || git -C "${GIT_TARGET_PATH}" fetch origin "${GIT_BRANCH}"
                else
                  git -C "${GIT_TARGET_PATH}" fetch "${fetch_args[@]}" origin "${GIT_BRANCH}"
                fi
                if timeout 60s git -C "${GIT_TARGET_PATH}" diff --quiet && timeout 60s git -C "${GIT_TARGET_PATH}" diff --cached --quiet; then
                  git -C "${GIT_TARGET_PATH}" checkout -B "${GIT_BRANCH}" FETCH_HEAD
                  git -C "${GIT_TARGET_PATH}" reset --hard FETCH_HEAD
                else
                  preserve_checkout "local changes or git dirty-check timeout"
                  clone_checkout
                fi
              elif [[ -e "${GIT_TARGET_PATH}" && -n "$(find "${GIT_TARGET_PATH}" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
                preserve_checkout "target exists and is not an empty git checkout"
                clone_checkout
              else
                clone_checkout
              fi

              git -C "${GIT_TARGET_PATH}" remote set-url origin "${GIT_REPOSITORY}"
              git -C "${GIT_TARGET_PATH}" config user.name "Greg Konush"
              git -C "${GIT_TARGET_PATH}" config user.email "greg@proompteng.ai"
              chown -hR 0:0 "${GIT_TARGET_PATH}"
              chmod -R a+rX "${GIT_TARGET_PATH}"
              rm -f /tmp/git-credentials
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      {{- end }}
      containers:
        - name: agents-shell
          image: "{{ $image.repository }}:{{ $image.tag }}{{- if $image.digest }}@{{ $image.digest }}{{ end }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          {{- with .Values.agentsShell.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: AGENTS_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $name, $value := .Values.agentsShell.env.vars }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.agentsShell.env.secrets }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key | default "value" }}
            {{- end }}
            {{- range .Values.agentsShell.env.config }}
            - name: {{ .name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ .configMapName }}
                  key: {{ .key | default .name }}
            {{- end }}
            {{- range .Values.agentsShell.env.extra }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.agentsShell.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.agentsShell.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.agentsShell.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.agentsShell.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.agentsShell.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.agentsShell.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.agentsShell.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.agentsShell.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.agentsShell.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.agentsShell.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.agentsShell.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.agentsShell.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.agentsShell.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            {{- if and $workspaceBootstrap.enabled $workspaceSeedReadOnly }}
            - name: workspace
              mountPath: {{ $workspaceBootstrap.targetPath | quote }}
              subPath: {{ $workspaceSeedSubPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: workspace
          {{- if eq $workspaceVolumeMode "emptyDir" }}
          emptyDir: {}
          {{- else if eq $workspaceVolumeMode "persistentVolumeClaim" }}
          {{- if not .Values.agentsShell.workspace.enabled }}
          {{- fail "agentsShell.workspace.enabled must be true when agentsShell.workspace.volumeMode is persistentVolumeClaim" }}
          {{- end }}
          persistentVolumeClaim:
            claimName: {{ include "agents.agentsShellWorkspaceClaimName" . }}
          {{- else }}
          {{- fail "agentsShell.workspace.volumeMode must be either persistentVolumeClaim or emptyDir" }}
          {{- end }}
{{- end }}
