{{- if or .Values.autoOntologyMcpGateway.enabled .Values.colabMcpGateway.enabled -}}
{{- range $account := list .Values.autoOntologyMcpGateway.runnerServiceAccountName "google-triage-runner" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account }}
  namespace: {{ $.Values.namespaceOverride | default $.Release.Namespace }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
