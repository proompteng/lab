{{- if .Values.autoOntologyMcpGateway.enabled -}}
{{- $config := .Values.autoOntologyMcpGateway -}}
{{- $namespace := .Values.namespaceOverride | default .Release.Namespace -}}
{{- $name := printf "%s-auto-ontology-mcp-gateway" (include "agents.fullname" .) -}}
{{- $selectorLabels := dict "app.kubernetes.io/name" "agents-auto-ontology-mcp-gateway" "app.kubernetes.io/instance" .Release.Name -}}
{{- $image := .Values.controllers.image -}}
{{- $repository := $image.repository | default .Values.image.repository -}}
{{- $tag := $image.tag | default .Values.image.tag -}}
{{- $digest := $image.digest | default .Values.image.digest -}}
{{- if and .Values.imagePolicy.requireDigest (not $digest) -}}
{{- fail "controllers.image.digest is required for the Auto Ontology MCP gateway when imagePolicy.requireDigest is true" -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $config.runnerServiceAccountName }}
  namespace: {{ $namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
  - apiGroups: ["agents.proompteng.ai"]
    resources: ["agentruns", "agents"]
    verbs: ["get"]
  - apiGroups: ["agents.proompteng.ai"]
    resources: ["agentproviders"]
    resourceNames: ["codex"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      {{- toYaml $selectorLabels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $selectorLabels | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 75
      {{- with $config.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with ($image.pullSecrets | default .Values.image.pullSecrets) }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ $repository }}:{{ $tag }}{{- if $digest }}@{{ $digest }}{{ end }}"
          imagePullPolicy: {{ $image.pullPolicy | default .Values.image.pullPolicy }}
          command: ["bun", "run", "src/auto-ontology-mcp/index.ts"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AUTO_ONTOLOGY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $config.apiTokenSecretName }}
                  key: AUTO_ONTOLOGY_API_TOKEN
            - name: AUTO_ONTOLOGY_API_URL
              value: {{ $config.apiUrl | quote }}
            - name: AUTO_ONTOLOGY_MCP_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AUTO_ONTOLOGY_MCP_TOKEN_AUDIENCE
              value: {{ $config.tokenAudience | quote }}
            - name: AUTO_ONTOLOGY_MCP_RUNNER_SERVICE_ACCOUNT
              value: {{ $config.runnerServiceAccountName | quote }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
            timeoutSeconds: 11
{{- $pdb := $config.podDisruptionBudget | default dict }}
{{- if $pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  {{- with $pdb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- toYaml $selectorLabels | nindent 6 }}
  {{- include "agents.podDisruptionBudgetAvailability" $pdb | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  selector:
    {{- toYaml $selectorLabels | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selectorLabels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              agents.proompteng.ai/provider: codex
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
