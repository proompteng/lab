version: v2
modules:
  - path: .
lint:
  use: [STANDARD]
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    PACKAGE_DEFINED:
      - spiffe/workloadapi.proto
    SERVICE_SUFFIX:
      - spiffe/workloadapi.proto
breaking:
  use: [FILE]
