[package]
name = "tengri"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.7", features = ["http1", "json", "tokio"] }
chrono = "0.4.45"
futures = "0.3.31"
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
kube = { version = "4.2.0", features = ["derive", "runtime"] }
rand = "0.9.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = "1.1.0"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[[bin]]
name = "crdgen"
path = "src/crdgen.rs"
