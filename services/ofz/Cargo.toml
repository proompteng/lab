[package]
name = "ofz"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tonic = "0.14.6"
tonic-prost = "0.14.6"
uuid = { version = "1.18.1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
