[package]
name = "relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
[dependencies]
anyhow = "1"
axum = "0.8.7"
futures = "0.3"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
jsonschema = { version = "0.58.6", default-features = false }
k8s-openapi = { version = "0.28", features = ["v1_36"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spiffe = { version = "0.16.1", features = ["x509-source"] }
spiffe-rustls = { version = "0.8", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
