<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome</title>
<style>
html,body,#screen{margin:0;width:100%;height:100%;overflow:hidden;background:#202124;color:#e8eaed;font:26px system-ui}
#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
#clipboard,#control,#chatgpt{position:absolute;bottom:24px;padding:14px 24px;background:#303134;border:2px solid #ffffff20;border-radius:16px;color:inherit;font:inherit;cursor:pointer}
#clipboard{right:24px}
#control{left:24px}
#chatgpt{left:50%;transform:translateX(-50%)}
@media(max-width:920px){#chatgpt{bottom:104px}}
[hidden]{display:none!important}
</style>
<div id="screen" aria-label="Chrome browser" tabindex="0"></div>
<div id="status" role="status">Connecting to Chrome…</div>
<button id="clipboard" hidden>Copy selected text</button>
<button id="control" title="Pause agent computer tools while you use Chrome">Take control</button>
<button id="chatgpt" title="Connect ChatGPT to this browser">Connect ChatGPT</button>
<script type="module" src="/browser.js"></script>
</html>
