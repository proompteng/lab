# Declarative PostgreSQL image plan for the galactic CNPG migration.
#
# This file is an operational plan, not a Kubernetes resource and must not be
# added to an application's Kustomization. `currentImage` is the image observed
# on the live Cluster at the configuration wave. `preparationImage` is the
# same-major, same-OS-family convergence target. `majorImage` is the approved
# PostgreSQL 18.6 target (or the 18.6 minor target for clusters already on
# PostgreSQL 18). The manifest path is the GitOps source that owns each image.
planVersion: 1
context: galactic-lan
clusters:
