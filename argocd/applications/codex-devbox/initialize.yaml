apiVersion: batch/v1
kind: Job
metadata:
  name: codex-turin-initialize
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      annotations:
        io.katacontainers.volume.devbox-data.mount_path: /persist
        io.katacontainers.volume.devbox-data.fs_type: ext4
        io.katacontainers.volume.devbox-data.initialization_token: codex-turin-977bdced-bd7f-4680-bebc-c30c8cf31423
    spec:
      restartPolicy: Never
      runtimeClassName: kata-fc
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: turin
        kubernetes.io/arch: amd64
        runtime.proompteng.ai/kata-fc-persistent-block: ready
      containers:
        - name: initialize
          image: mirror.gcr.io/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: [/bin/sh, -ec]
          args: ['test -d /persist/lost+found; touch /persist/.initialized']
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeDevices:
            - name: data
              devicePath: /dev/devbox-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: codex-turin
