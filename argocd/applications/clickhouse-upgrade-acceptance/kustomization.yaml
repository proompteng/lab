apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - retained-clickhouse-v4-configmap.yaml
  - retry-replica0-serial-26-3.yaml
  - retained-clickhouse-v3-configmap.yaml
  - preparation.yaml
  - rehearsal.yaml
  - keeper-rehearsal.yaml
configMapGenerator:
  - name: clickhouse-native-rehearsal-20260910-v6
    options:
      immutable: true
    files:
      - native-rehearsal.sh
      - expected-tables.tsv
      - verify-clickhouse-native-rehearsal.py
  - name: keeper-native-20260910-v2
    files:
      - keeper-native-rehearsal.sh
      - verify-keeper-native-rehearsal.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
patches:
  - target:
      group: batch
      version: v1
      kind: Job
      name: clickhouse-native-20260910-v4-0
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: clickhouse-native-20260910-v4-0
        namespace: clickhouse-upgrade-acceptance
      $patch: delete
