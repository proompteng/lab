        - python3
        - -c
        - "import json; from pathlib import Path\nfor replica in [0,1]:\n for name\
          \ in ['server.log','keeper.log']:\n  path=Path('/evidence'+str(replica)+'/v2/v25_3')/name\n\
          \  print(json.dumps({'replica':replica,'file':name,'tail':path.read_text()[-50000:]}),flush=True)"
