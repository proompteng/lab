  "data": {
    "native-rehearsal.sh": "#!/usr/bin/env bash\nset -Eeuo pipefail\numask 027\nexport LC_ALL=C\n\n: \"${REHEARSAL_VERSION:?}\" \"${EXPECTED_VERSION:?}\" \"${REPLICA:?}\"\n: \"${BACKUP_DIRECTORY:?}\" \"${BACKUP_MANIFEST_SHA256:?}\" \"${COMPATIBILITY:?}\"\n[[ \"$REHEARSAL_VERSION\" =~ ^v[0-9]+_[0-9]+$ ]]\n[[ \"$REPLICA\" =~ ^[01]$ ]]\n[[ \"$BACKUP_DIRECTORY\" =~ ^upgrade-20260910-v1-replica-[01]$ ]]\nfixture=\"/fixture/v3/$REHEARSAL_VERSION\"\nproof=\"/proof/v3/$REHEARSAL_VERSION\"\nbackup=\"/source/backups/$BACKUP_DIRECTORY\"\nmkdir -p /fixture/v3 /proof/v3\nmkdir \"$proof\"\nmkdir \"$fixture\"\nmkdir -p \"$fixture\"/{data,tmp,user_files,access,keeper/log,keeper/snapshots}\nwait_for_control() {\n  local file=$1\n  for ((attempt=0; attempt<1800; attempt++)); do\n    if [[ -f \"$file\" ]]; then return 0; fi\n    sleep 2\n  done\n  printf 'Runtime isolation control did not arrive: %s\\n' \"$file\" >&2\n  return 1\n}\nprintf 'waiting for live endpoint controls: %s replica %s\\n' \"$REHEARSAL_VERSION\" \"$REPLICA\"\nwait_for_control \"$proof/runtime-before.epoch\"\ncontrol_epoch=$(cat \"$proof/runtime-before.epoch\")\n[[ \"$control_epoch\" =~ ^[0-9]+$ && $(( $(date +%s) - control_epoch )) -ge 0 && $(( $(date +%s) - control_epoch )) -le 30 ]]\nmapfile -t production_targets < \"$proof/runtime-targets.txt\"\n[[ \"${#production_targets[@]}\" == 5 ]]\nfor endpoint in \"${production_targets[@]}\"; do\n  host=${endpoint%:*}\n  port=${endpoint##*:}\n  [[ \"$host\" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$ && \"$port\" =~ ^[0-9]+$ ]]\n  error=\"$proof/probe-$host-$port.stderr\"\n  if timeout 5 bash -c \"exec 3<>/dev/tcp/$host/$port\" 2>\"$error\"; then\n    printf 'Production endpoint is reachable: %s\\n' \"$endpoint\" >&2\n    exit 1\n  else\n    result=$?\n    if [[ \"$result\" == 124 ]]; then\n      outcome=TIMED_OUT\n    elif [[ \"$result\" == 1 ]] && grep -Fq \"/dev/tcp/$host/$port: Connection refused\" \"$error\"; then\n      outcome=REJECTED\n    else\n      printf 'Unclassified isolation failure: %s status %s\\n' \"$endpoint\" \"$result\" >&2\n      cat \"$error\" >&2\n      exit 1\n    fi\n  fi\n  printf '{\"endpoint\":\"%s\",\"exitCode\":%s,\"outcome\":\"%s\"}\\n' \"$endpoint\" \"$result\" \"$outcome\" >> \"$proof/isolation-probes.jsonl\"\n  printf '%s\\tDENIED\\n' \"$endpoint\" >> \"$proof/isolation.tsv\"\ndone\nwait_for_control \"$proof/runtime-after.epoch\"\nafter_epoch=$(cat \"$proof/runtime-after.epoch\")\n[[ \"$after_epoch\" =~ ^[0-9]+$ && $(( after_epoch - control_epoch )) -ge 0 && $(( after_epoch - control_epoch )) -le 90 ]]\nprintf '%s  %s\\n' \"$BACKUP_MANIFEST_SHA256\" \"$backup/.backup\" | sha256sum --check --strict\n[[ \"$(df --output=avail -B1 /fixture | tail -1 | tr -d ' ')\" -ge 21474836480 ]]\nserver_pid=''\nkeeper_pid=''\ncleanup() {\n  result=$?\n  trap - EXIT\n  if [[ \"$result\" != 0 ]]; then\n    tail -c 12000 \"$proof/server.log\" \"$proof/keeper.log\" >&2 || true\n  fi\n  for child in \"$server_pid\" \"$keeper_pid\"; do\n    if [[ -n \"$child\" ]] && kill -0 \"$child\" 2>/dev/null; then\n      kill -TERM \"$child\"\n      if ! wait \"$child\"; then result=1; fi\n    fi\n  done\n  printf '%s\\n' \"$result\" > \"$proof/process-exit\"\n  exit \"$result\"\n}\ntrap cleanup EXIT\ntrap 'exit 143' TERM\ntrap 'exit 130' INT\ncat > \"$fixture/config.xml\" <<EOF\n<clickhouse>\n  <logger><level>warning</level><console>1</console></logger>\n  <path>$fixture/data/</path><tmp_path>$fixture/tmp/</tmp_path>\n  <user_files_path>$fixture/user_files/</user_files_path><access_control_path>$fixture/access/</access_control_path>\n  <listen_host>127.0.0.1</listen_host><tcp_port>9000</tcp_port><http_port>8123</http_port>\n  <interserver_http_host>127.0.0.1</interserver_http_host><interserver_http_port>9009</interserver_http_port>\n  <interserver_listen_host>127.0.0.1</interserver_listen_host>\n  <max_server_memory_usage>4294967296</max_server_memory_usage>\n  <background_pool_size>4</background_pool_size><background_schedule_pool_size>16</background_schedule_pool_size>\n  <merge_tree><number_of_free_entries_in_pool_to_execute_mutation>2</number_of_free_entries_in_pool_to_execute_mutation>\n    <number_of_free_entries_in_pool_to_lower_max_size_of_merge>2</number_of_free_entries_in_pool_to_lower_max_size_of_merge>\n    <number_of_free_entries_in_pool_to_execute_optimize_entire_partition>2</number_of_free_entries_in_pool_to_execute_optimize_entire_partition>\n  </merge_tree>\n  <profiles><default><max_threads>2</max_threads><max_memory_usage>3221225472</max_memory_usage>\n    <compatibility>$COMPATIBILITY</compatibility><output_format_json_quote_64bit_integers>1</output_format_json_quote_64bit_integers>\n    <async_insert>0</async_insert></default></profiles>\n  <users><default><password></password><networks><ip>127.0.0.1</ip><ip>::1</ip></networks>\n    <profile>default</profile><quota>default</quota></default></users><quotas><default/></quotas>\n  <backups><allowed_path>/source/backups</allowed_path></backups>\n  <macros><cluster>torghut-clickhouse</cluster><shard>0</shard><replica>restore-$REPLICA</replica></macros>\n  <zookeeper><node><host>127.0.0.1</host><port>2181</port></node></zookeeper>\n</clickhouse>\nEOF\ncat > \"$fixture/keeper.xml\" <<EOF\n<clickhouse>\n  <logger><level>warning</level><console>1</console></logger><listen_host>127.0.0.1</listen_host>\n  <keeper_server><tcp_port>2181</tcp_port><server_id>1</server_id>\n    <log_storage_path>$fixture/keeper/log</log_storage_path><snapshot_storage_path>$fixture/keeper/snapshots</snapshot_storage_path>\n    <coordination_settings><operation_timeout_ms>10000</operation_timeout_ms><session_timeout_ms>30000</session_timeout_ms></coordination_settings>\n    <raft_configuration><server><id>1</id><hostname>127.0.0.1</hostname><port>9234</port></server></raft_configuration>\n  </keeper_server>\n</clickhouse>\nEOF\nclickhouse keeper --config-file=\"$fixture/keeper.xml\" > \"$proof/keeper.log\" 2>&1 &\nkeeper_pid=$!\nclickhouse-server --config-file=\"$fixture/config.xml\" > \"$proof/server.log\" 2>&1 &\nserver_pid=$!\nsql() { clickhouse-client --host 127.0.0.1 --query \"$1\" --format \"${2:-JSONEachRow}\"; }\nready=false\nfor ((attempt=0; attempt<90; attempt++)); do\n  kill -0 \"$server_pid\"\n  kill -0 \"$keeper_pid\"\n  if sql 'SELECT version()' TSVRaw > \"$proof/version\" 2>/dev/null; then ready=true; break; fi\n  sleep 2\ndone\nreported_version=$(cat \"$proof/version\")\n[[ \"$ready\" == true && \"${reported_version%.altinitystable}\" == \"$EXPECTED_VERSION\" ]]\nrestore=\"RESTORE DATABASE default, DATABASE signal, DATABASE torghut FROM File('$backup')\"\nsql \"$restore SETTINGS structure_only=1\" > \"$proof/structure-restore.jsonl\"\nsql \"SELECT database,name,engine FROM system.tables WHERE database IN ('default','signal','torghut') ORDER BY database,name\" TSVRaw > \"$proof/tables.tsv\"\ncmp /scripts/expected-tables.tsv \"$proof/tables.tsv\"\nwhile IFS=$'\\t' read -r database table engine; do\n  [[ \"$database\" =~ ^[A-Za-z_][A-Za-z0-9_]*$ && \"$table\" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]\n  if [[ \"$engine\" == *MergeTree ]]; then\n    sql \"SYSTEM STOP MERGES \\`$database\\`.\\`$table\\`\"\n    sql \"SYSTEM STOP TTL MERGES \\`$database\\`.\\`$table\\`\"\n  fi\ndone < \"$proof/tables.tsv\"\nreplicas_ready=false\nfor ((attempt=0; attempt<90; attempt++)); do\n  kill -0 \"$server_pid\"\n  kill -0 \"$keeper_pid\"\n  if [[ \"$(sql \"SELECT count()=11 AND countIf(is_readonly OR is_session_expired)=0 FROM system.replicas\" TSVRaw)\" == 1 ]]; then\n    replicas_ready=true\n    break\n  fi\n  sleep 2\ndone\n[[ \"$replicas_ready\" == true ]]\nsql \"$restore\" > \"$proof/data-restore.jsonl\"\nsql \"SELECT database,name,engine,engine_full,uuid FROM system.tables WHERE database IN ('default','signal','torghut') ORDER BY database,name\" > \"$proof/tables.jsonl\"\nsql \"SELECT database,table,name,type,default_kind,default_expression,compression_codec FROM system.columns WHERE database IN ('default','signal','torghut') ORDER BY database,table,position\" > \"$proof/columns.jsonl\"\nwhile IFS=$'\\t' read -r database table engine; do\n  relation=\"\\`$database\\`.\\`$table\\`\"\n  if [[ \"$engine\" == *MergeTree ]]; then\n    sql \"CHECK TABLE $relation SETTINGS check_query_single_value_result=1\" > \"$proof/check-$database-$table.jsonl\"\n    lanes=''\n    for ((lane=0; lane<4; lane++)); do\n      expression=\"reinterpretAsUInt64(substring(h,$((lane*8+1)),8))\"\n      lanes+=\",toString(sumWithOverflow($expression)) AS sum$lane,toString(groupBitXor($expression)) AS xor$lane\"\n    done\n    sql \"SELECT count() AS rows$lanes FROM (SELECT SHA256(toJSONString(tuple(*))) AS h FROM $relation)\" > \"$proof/fingerprint-$database-$table.jsonl\"\n    printf 'fingerprinted %s %s.%s\\n' \"$REHEARSAL_VERSION\" \"$database\" \"$table\"\n  elif [[ \"$engine\" == View ]]; then\n    sql \"SELECT count() AS rows FROM $relation\" > \"$proof/view-$database-$table.jsonl\"\n  fi\ndone < \"$proof/tables.tsv\"\nsql \"SELECT database,table,is_readonly,is_session_expired,queue_size,lost_part_count FROM system.replicas ORDER BY database,table\" > \"$proof/replicas.jsonl\"\nkill -TERM \"$server_pid\"\nwait \"$server_pid\"\nserver_pid=''\nprintf '0\\n' > \"$proof/server-exit\"\nkill -TERM \"$keeper_pid\"\nwait \"$keeper_pid\"\nkeeper_pid=''\nprintf '0\\n' > \"$proof/keeper-exit\"\nprintf 'native restore and fingerprint complete: %s replica %s\\n' \"$REHEARSAL_VERSION\" \"$REPLICA\"\n",
    "expected-tables.tsv": "signal\tadjusted_daily_bars_v1\tReplicatedReplacingMergeTree\nsignal\tadjusted_daily_bars_v2\tReplicatedMergeTree\nsignal\texchange_sessions_v1\tReplicatedMergeTree\nsignal\tintraday_bars_1m_v1\tReplicatedReplacingMergeTree\nsignal\tintraday_bars_1m_v2\tReplicatedReplacingMergeTree\nsignal\tintraday_quotes_v1\tReplicatedReplacingMergeTree\nsignal\tintraday_trades_v1\tReplicatedReplacingMergeTree\nsignal\tsnapshot_manifests_v1\tReplicatedMergeTree\nsignal\tsnapshot_manifests_v2\tReplicatedMergeTree\ntorghut\thyperliquid_asset_contexts\tReplacingMergeTree\ntorghut\thyperliquid_bbo\tReplacingMergeTree\ntorghut\thyperliquid_candles\tReplacingMergeTree\ntorghut\thyperliquid_funding\tReplacingMergeTree\ntorghut\thyperliquid_l2_books\tReplacingMergeTree\ntorghut\thyperliquid_market_catalog\tReplacingMergeTree\ntorghut\thyperliquid_raw\tReplacingMergeTree\ntorghut\thyperliquid_runtime_latest_features\tView\ntorghut\thyperliquid_status\tReplacingMergeTree\ntorghut\thyperliquid_ta_features\tReplacingMergeTree\ntorghut\thyperliquid_ta_features_candle_mv\tMaterializedView\ntorghut\thyperliquid_trades\tReplacingMergeTree\ntorghut\toptions_contract_bars_1s\tReplacingMergeTree\ntorghut\toptions_contract_features\tReplacingMergeTree\ntorghut\toptions_surface_features\tReplacingMergeTree\ntorghut\tta_microbars\tReplicatedReplacingMergeTree\ntorghut\tta_signals\tReplicatedReplacingMergeTree\n",
    "verify-clickhouse-native-rehearsal.py": "import datetime\nimport json\nimport os\nfrom pathlib import Path\n\n\nVERSIONS = {\n    \"v25_3\": \"25.3.6.10034\",\n    \"v25_8\": \"25.8.28.10001\",\n    \"v26_3\": \"26.3.16.10001\",\n}\n\n\ndef require(condition, message):\n    if not condition:\n        raise RuntimeError(message)\n\n\ndef read_rows(path):\n    rows = [json.loads(line) for line in path.read_text().splitlines() if line]\n    require(bool(rows), f\"Empty native result: {path.name}\")\n    return rows\n\n\ndef verify(proof, expected_tables):\n    expected = [tuple(line.split(\"\\t\")) for line in expected_tables.splitlines()]\n    require(len(expected) == 26, \"Expected source table inventory is incomplete\")\n    results = {}\n    for phase, version in VERSIONS.items():\n        root = proof / phase\n        reported_version = (root / \"version\").read_text().strip()\n        require(\n            reported_version.removesuffix(\".altinitystable\") == version,\n            f\"Wrong engine: {phase}\",\n        )\n        for name in [\"process-exit\", \"server-exit\", \"keeper-exit\"]:\n            require(\n                (root / name).read_text().strip() == \"0\",\n                f\"Unclean native exit: {phase}/{name}\",\n            )\n        before = json.loads((root / \"runtime-before.json\").read_text())\n        after = json.loads((root / \"runtime-after.json\").read_text())\n        endpoints = [item[\"endpoint\"] for item in before[\"targets\"]]\n        require(\n            len(endpoints) == 5 and len(set(endpoints)) == 5,\n            \"Invalid isolation inventory\",\n        )\n        require(\n            before[\"targets\"] == after[\"targets\"],\n            f\"Production target identity changed: {phase}\",\n        )\n        require(\n            0 <= after[\"epoch\"] - before[\"epoch\"] <= 90,\n            f\"Stale runtime isolation controls: {phase}\",\n        )\n        for target in before[\"targets\"]:\n            require(\n                target[\"positiveControl\"] == \"PASS\" and bool(target[\"podUID\"]),\n                f\"Missing positive control: {phase}\",\n            )\n        isolated = [\n            line.split(\"\\t\")\n            for line in (root / \"isolation.tsv\").read_text().splitlines()\n        ]\n        require(\n            isolated == [[endpoint, \"DENIED\"] for endpoint in endpoints],\n            f\"Isolation failed: {phase}\",\n        )\n        probes = read_rows(root / \"isolation-probes.jsonl\")\n        require(\n            [probe[\"endpoint\"] for probe in probes] == endpoints,\n            f\"Missing native isolation probe: {phase}\",\n        )\n        for probe in probes:\n            host, port = probe[\"endpoint\"].split(\":\")\n            error = (root / f\"probe-{host}-{port}.stderr\").read_text()\n            timed_out = probe[\"exitCode\"] == 124 and probe[\"outcome\"] == \"TIMED_OUT\"\n            rejected = (\n                probe[\"exitCode\"] == 1\n                and probe[\"outcome\"] == \"REJECTED\"\n                and f\"/dev/tcp/{host}/{port}: Connection refused\" in error\n            )\n            require(timed_out or rejected, f\"Unclassified isolation failure: {phase}\")\n        for name in [\"structure-restore.jsonl\", \"data-restore.jsonl\"]:\n            restored = read_rows(root / name)\n            require(\n                len(restored) == 1 and restored[0][\"status\"] == \"RESTORED\",\n                f\"Restore failed: {phase}/{name}\",\n            )\n        tables = read_rows(root / \"tables.jsonl\")\n        require(\n            [(t[\"database\"], t[\"name\"], t[\"engine\"]) for t in tables] == expected,\n            f\"Table inventory differs: {phase}\",\n        )\n        require(\n            len({t[\"uuid\"] for t in tables}) == len(tables),\n            f\"Duplicate restored table UUIDs: {phase}\",\n        )\n        columns = read_rows(root / \"columns.jsonl\")\n        data, views = {}, {}\n        for database, table, engine in expected:\n            key = database + \".\" + table\n            suffix = database + \"-\" + table + \".jsonl\"\n            if engine.endswith(\"MergeTree\"):\n                checked = read_rows(root / (\"check-\" + suffix))\n                require(\n                    all(row[\"result\"] == 1 for row in checked),\n                    f\"Native CHECK TABLE failed: {phase}/{key}\",\n                )\n                fingerprint = read_rows(root / (\"fingerprint-\" + suffix))\n                require(\n                    len(fingerprint) == 1,\n                    f\"Invalid fingerprint cardinality: {phase}/{key}\",\n                )\n                values = fingerprint[0]\n                keys = {\"rows\"} | {\n                    prefix + str(i) for prefix in [\"sum\", \"xor\"] for i in range(4)\n                }\n                require(\n                    set(values) == keys, f\"Incomplete row fingerprint: {phase}/{key}\"\n                )\n                require(\n                    all(0 <= int(value) < 2**64 for value in values.values()),\n                    f\"Invalid fingerprint values: {phase}/{key}\",\n                )\n                data[key] = {name: str(value) for name, value in values.items()}\n            elif engine == \"View\":\n                view = read_rows(root / (\"view-\" + suffix))\n                require(\n                    len(view) == 1 and int(view[0][\"rows\"]) >= 0,\n                    f\"View query failed: {phase}/{key}\",\n                )\n                views[key] = str(view[0][\"rows\"])\n        replicas = read_rows(root / \"replicas.jsonl\")\n        require(len(replicas) == 11, f\"Missing replicated tables: {phase}\")\n        for replica in replicas:\n            require(\n                all(\n                    int(replica[key]) == 0\n                    for key in [\n                        \"is_readonly\",\n                        \"is_session_expired\",\n                        \"queue_size\",\n                        \"lost_part_count\",\n                    ]\n                ),\n                f\"Unhealthy restored replica: {phase}/{replica['table']}\",\n            )\n        results[phase] = {\n            \"version\": version,\n            \"reportedVersion\": reported_version,\n            \"tables\": tables,\n            \"columns\": columns,\n            \"data\": data,\n            \"views\": views,\n            \"replicas\": replicas,\n            \"nativeCheck\": \"PASS\",\n            \"isolation\": \"PASS\",\n            \"isolationControls\": {\"before\": before, \"after\": after},\n            \"isolationProbes\": probes,\n            \"nativeExit\": \"PASS\",\n        }\n    baseline = results[\"v25_3\"]\n    for phase in [\"v25_8\", \"v26_3\"]:\n        candidate = results[phase]\n        require(\n            candidate[\"data\"] == baseline[\"data\"],\n            f\"Full row fingerprints differ: {phase}\",\n        )\n        require(\n            candidate[\"views\"] == baseline[\"views\"],\n            f\"View query results differ: {phase}\",\n        )\n        require(\n            candidate[\"columns\"] == baseline[\"columns\"],\n            f\"Column catalog differs: {phase}\",\n        )\n\n        def schema(result):\n            return [\n                {k: v for k, v in t.items() if k != \"uuid\"} for t in result[\"tables\"]\n            ]\n\n        require(\n            schema(candidate) == schema(baseline),\n            f\"Table engine definitions differ: {phase}\",\n        )\n    return {\n        \"status\": \"PASS\",\n        \"at\": datetime.datetime.now(datetime.UTC).isoformat(),\n        \"method\": \"Independent native restores; full SHA256 JSON row fingerprints with count and four UInt64 sum/XOR lanes\",\n        \"uuidComparison\": \"Native RESTORE creates independent table UUIDs; all other captured engine and column fields must match\",\n        \"rows\": sum(int(item[\"rows\"]) for item in baseline[\"data\"].values()),\n        \"tables\": len(expected),\n        \"results\": results,\n    }\n\n\ndef main():\n    proof = Path(\"/proof/v3\")\n    result = verify(proof, Path(\"/scripts/expected-tables.tsv\").read_text())\n    result[\"replica\"] = os.environ[\"REPLICA\"]\n    result[\"backupManifestSHA256\"] = os.environ[\"BACKUP_MANIFEST_SHA256\"]\n    output = json.dumps(result, sort_keys=True)\n    (proof / \"native-acceptance.json\").write_text(output + \"\\n\")\n    print(output, flush=True)\n\n\nif __name__ == \"__main__\":\n    main()\n"
  }
}
