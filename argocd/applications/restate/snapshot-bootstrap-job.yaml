apiVersion: batch/v1
kind: Job
metadata:
  name: restate-snapshot-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restate-snapshot-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snapshot-bootstrap
          image: docker.restate.dev/restatedev/restate:1.7.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ceu
            - |
              set -o pipefail
              address=http://restate-0.restate-cluster:5122

              for attempt in $(seq 1 30); do
                if restatectl --address "$address" status >/dev/null 2>&1; then
                  break
                fi
                if [ "$attempt" -eq 30 ]; then
                  echo "Restate did not become reachable for snapshot bootstrap" >&2
                  exit 1
                fi
                sleep 5
              done

              while [ "$SECONDS" -lt 840 ]; do
                if ! partitions="$(restatectl --address "$address" partitions list 2>&1)"; then
                  echo "Transient failure reading partition snapshot status; retrying" >&2
                  sleep 5
                  continue
                fi
                printf '%s\n' "$partitions"
                if printf '%s\n' "$partitions" | awk '
                  $1 ~ /^[0-9]+$/ {
                    seen[$1] = 1
                    if ($8 ~ /^[1-9][0-9]*$/) archived[$1] = 1
                  }
                  END {
                    for (i = 0; i < 24; i += 1) if (!(i in seen) || !(i in archived)) exit 1
                  }
                '; then
                  echo "All 24 partitions have an archived snapshot LSN"
                  exit 0
                fi

                missing="$(printf '%s\n' "$partitions" | awk '
                  $1 ~ /^[0-9]+$/ {
                    seen[$1] = 1
                    if ($8 ~ /^[1-9][0-9]*$/) archived[$1] = 1
                  }
                  END {
                    for (i = 0; i < 24; i += 1) if (!(i in seen) || !(i in archived)) print i
                  }
                ')"
                while IFS= read -r partition; do
                  [ -n "$partition" ] || continue
                  snapshot_output="$(restatectl --address "$address" snapshots create "$partition" 2>&1)" || true
                  printf '%s\n' "$snapshot_output"
                done <<< "$missing"
                sleep 5
              done

              echo "Snapshot bootstrap did not archive all partitions before the Job deadline" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 3000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
