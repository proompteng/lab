apiVersion: batch/v1
kind: Job
metadata:
  name: restate-singleton-rollback-guard
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restate-singleton-rollback-guard
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rollback-guard
          image: docker.restate.dev/restatedev/restate:1.7.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ceu
            - |
              set -o pipefail
              address=http://restate-0.restate-cluster:5122

              for attempt in $(seq 1 30); do
                nodes="$(restatectl --address "$address" nodes list --extra 2>/dev/null)" && break
                [ "$attempt" -lt 30 ] || { echo "Restate unavailable for singleton rollback guard" >&2; exit 1; }
                sleep 5
              done
              printf '%s\n' "$nodes"
              keep_id="$(printf '%s\n' "$nodes" | awk '$3 == "restate-0" { if (id) exit 2; id=$1 } END { if (!id) exit 1; print id }')"
              remove_ids="$(printf '%s\n' "$nodes" | awk '$3 == "restate-1" || $3 == "restate-2" { ids[++n]=$1 } END { for (i=1; i<=n; i++) printf "%s%s", i==1 ? "" : ",", ids[i]; print "" }')"
              remove_count="$(printf '%s\n' "$remove_ids" | awk -F, '{ print $0 == "" ? 0 : NF }')"

              create_all_partition_snapshots() {
                local output
                output="$(restatectl --yes --address "$address" snapshots create "$@" 2>&1)" || {
                  printf '%s\n' "$output" >&2
                  return 1
                }
                printf '%s\n' "$output"
                printf '%s\n' "$output" | awk '
                  $1 == "Snapshot" && $2 == "created" && $3 == "for" && $4 == "partition" && $5 ~ /^[0-9]+:$/ {
                    partition = $5
                    sub(/:$/, "", partition)
                    seen[partition] = 1
                  }
                  END { for (i = 0; i < 24; i += 1) if (!(i in seen)) exit 1 }
                '
              }

              snapshot_targets=/tmp/restate-rollback-snapshot-targets.$$
              capture_snapshot_targets() {
                local partitions
                partitions="$(restatectl --address "$address" partitions list 2>&1)" || {
                  printf '%s\n' "$partitions" >&2
                  return 1
                }
                printf '%s\n' "$partitions"
                printf '%s\n' "$partitions" | awk '
                  $1 ~ /^[0-9]+$/ && $7 ~ /^[0-9]+$/ {
                    seen[$1] = 1
                    if (!($1 in durable) || $7 + 0 > durable[$1] + 0) durable[$1] = $7
                  }
                  END {
                    for (i = 0; i < 24; i += 1) {
                      if (!(i in seen) || !(i in durable)) exit 1
                      print i, durable[i]
                    }
                  }
                ' >"$snapshot_targets"
              }

              wait_all_partitions_archived() {
                local partitions
                for attempt in $(seq 1 90); do
                  if partitions="$(restatectl --address "$address" partitions list 2>&1)"; then
                    printf '%s\n' "$partitions"
                    if awk '
                      NR == FNR {
                        target[$1] = $2
                        next
                      }
                      $1 ~ /^[0-9]+$/ {
                        seen[$1] = 1
                        if ($8 ~ /^[1-9][0-9]*$/ && (!($1 in archived) || $8 + 0 > archived[$1] + 0)) {
                          archived[$1] = $8
                        }
                      }
                      END {
                        for (i = 0; i < 24; i += 1) {
                          if (!(i in target) || !(i in seen) || !(i in archived) || archived[i] + 0 < target[i] + 0) {
                            exit 1
                          }
                        }
                      }
                    ' "$snapshot_targets" - <<<"$partitions"; then
                      return 0
                    fi
                  fi
                  sleep 5
                done
                return 1
              }

              singleton_converged() {
                local config metadata partitions logs_list logs_detail id
                config="$(restatectl --address "$address" config get)" || return 1
                printf '%s\n' "$config" | grep -Fq 'Partition replication: {node: 1}' || return 1
                printf '%s\n' "$config" | grep -Fq 'Log replication: {node: 1}' || return 1
                metadata="$(restatectl --address "$address" metadata-server list)" || return 1
                printf '%s\n' "$metadata" | awk -v keep="$keep_id" '
                  $1 ~ /^N[0-9]+$/ {
                    rows += 1
                    if ($1 == keep) { seen = 1; if ($2 != "Member" || $5 != "[" keep "]") bad += 1 }
                    else if ($5 != "[" keep "]") bad += 1
                  }
                  END { exit !(seen && rows >= 1 && bad == 0) }
                ' || return 1
                partitions="$(restatectl --address "$address" partitions list)" || return 1
                printf '%s\n' "$partitions" | awk -v keep="$keep_id" '
                  $1 ~ /^[0-9]+$/ { split($2, node, ":"); rows += 1; count[$1] += 1; if (node[1] != keep) bad += 1 }
                  END { if (rows != 24 || bad) exit 1; for (i=0; i<24; i++) if (count[i] != 1) exit 1 }
                ' || return 1
                logs_list="$(restatectl --address "$address" logs list)" || return 1
                printf '%s\n' "$logs_list" | awk '$1 ~ /^[0-9]+$/ { rows += 1; if ($0 !~ /\{node: 1\}/) bad += 1 } END { exit !(rows == 24 && bad == 0) }' || return 1
                [ "$remove_count" -eq 0 ] && return 0
                logs_detail="$(restatectl --address "$address" logs describe --all)" || return 1
                IFS=, read -ra ids <<< "$remove_ids"
                for id in "${ids[@]}"; do
                  printf '%s\n' "$partitions" | grep -Eq "(^|[^[:alnum:]_])${id}:" && return 1
                  printf '%s\n' "$logs_detail" | grep -Eq "(^|[^[:alnum:]_])${id}([^[:digit:]]|$)" && return 1
                done
                return 0
              }

              if singleton_converged; then
                echo "Restate is already safe for singleton GitOps state"
                exit 0
              fi
              [ "$remove_count" -eq 2 ] || { echo "Refusing singleton rollback without exactly two removable nodes" >&2; exit 1; }
              for node in restate-0 restate-1 restate-2; do
                printf '%s\n' "$nodes" | grep -Eq "[[:space:]]${node}[[:space:]].*Alive[[:space:]]+Ready[[:space:]]+Ready[[:space:]]+Ready[[:space:]]+Member" || {
                  echo "Refusing rollback while $node is not fully healthy" >&2
                  exit 1
                }
              done

              capture_snapshot_targets || { echo "Refusing rollback without a durable LSN target for all 24 partitions" >&2; exit 1; }
              create_all_partition_snapshots || { echo "Refusing rollback without 24 successful safety snapshots" >&2; exit 1; }
              wait_all_partitions_archived || { echo "Refusing rollback before safety snapshots cover every rollback target LSN" >&2; exit 1; }
              config="$(restatectl --address "$address" config get)"
              if printf '%s\n' "$config" | grep -Fq 'Partition replication: {node: 2}' && printf '%s\n' "$config" | grep -Fq 'Log replication: {node: 2}'; then
                restatectl --yes --address "$address" config set --replication 1
              elif ! printf '%s\n' "$config" | grep -Fq 'Partition replication: {node: 1}' || ! printf '%s\n' "$config" | grep -Fq 'Log replication: {node: 1}'; then
                echo "Refusing unexpected replication state during singleton rollback" >&2
                exit 1
              fi
              restatectl --yes --address "$address" nodes set-storage-state --nodes "$remove_ids" --storage-state read-only
              restatectl --yes --address "$address" nodes set-worker-state --nodes "$remove_ids" --worker-state draining
              restatectl --yes --address "$address" metadata-server remove-node "$remove_ids"
              create_all_partition_snapshots --trim-log || { echo "Trim snapshot did not succeed for all 24 partitions" >&2; exit 1; }

              for attempt in $(seq 1 90); do
                if singleton_converged; then
                  echo "Restate is safe for singleton StatefulSet downscale"
                  exit 0
                fi
                sleep 10
              done
              echo "Restate did not drain removed nodes before singleton downscale deadline" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 3000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
