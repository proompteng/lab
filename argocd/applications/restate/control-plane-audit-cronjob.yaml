apiVersion: batch/v1
kind: CronJob
metadata:
  name: restate-control-plane-audit
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restate-control-plane-audit
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 3000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: audit
              image: docker.restate.dev/restatedev/restate:1.7.2
              imagePullPolicy: IfNotPresent
              command:
                - /bin/bash
                - /opt/restate-resilience/control-plane-audit.sh
              env:
                - name: RESTATE_ADMIN_URL
                  value: http://restate:9070
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 3000
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /opt/restate-resilience
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: restate-resilience-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
