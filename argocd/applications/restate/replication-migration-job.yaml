apiVersion: batch/v1
kind: Job
metadata:
  name: restate-replication-migration
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1500
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restate-replication-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: replication-migration
          image: docker.restate.dev/restatedev/restate:1.8.1@sha256:cd5ee1abb1b3f91e813e327a024779280938aaff991ccdc5b241a3a3a4bddce1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ceu
            - |
              set -o pipefail
              address=http://restate-0.restate-cluster:5122

              read_nodes() {
                restatectl --address "$address" sql --json \
                  "SELECT plain_node_id, name, state, has_worker_role, has_admin_role,
                          has_log_server_role, has_metadata_server_role, storage_state, worker_state
                   FROM nodes ORDER BY name"
              }

              valid_nodes() {
                jq -e 'length == 3 and ([.[].name] | sort) == ["restate-0", "restate-1", "restate-2"]
                  and ([.[].plain_node_id] | unique | length) == 3
                  and all(.[]; .has_admin_role and .has_log_server_role and .has_metadata_server_role
                    and (.has_worker_role | type) == "boolean")' >/dev/null
              }

              nodes_ready() {
                nodes="$(read_nodes)" || return 1
                printf '%s\n' "$nodes"
                valid_nodes <<< "$nodes" || return 1
                jq -e 'all(.[]; .state == "alive" and .storage_state == "read-write"
                  and (.has_worker_role == false or .worker_state == "active"))' <<< "$nodes" >/dev/null || return 1
                status="$(restatectl --address "$address" nodes list --extra)" || return 1
                printf '%s\n' "$status"
                for node in restate-0 restate-1 restate-2; do
                  worker_status=Ready
                  if jq -e --arg name "$node" '.[] | select(.name == $name) | .has_worker_role == false' <<< "$nodes" >/dev/null; then
                    worker_status=-
                  fi
                  printf '%s\n' "$status" | grep -Eq "[[:space:]]${node}[[:space:]].*Alive[[:space:]]+Ready[[:space:]]+${worker_status}[[:space:]]+Ready[[:space:]]+Member" || return 1
                done
              }

              reactivate_retained_nodes() {
                nodes="$(read_nodes)" || return 1
                valid_nodes <<< "$nodes" || return 1
                retained="$(jq -r '.[] | select(.name == "restate-1" or .name == "restate-2") |
                  [.plain_node_id, .has_worker_role, .storage_state, (.worker_state // "absent")] | @tsv' <<< "$nodes")" || return 1
                while IFS=$'\t' read -r id has_worker storage_state worker_state; do
                  case "$storage_state" in
                    read-only) restatectl --yes --address "$address" nodes set-storage-state --nodes "$id" --storage-state read-write || return 1 ;;
                    read-write|provisioning) ;;
                    *) echo "Unexpected Restate storage state for $id: $storage_state" >&2; return 1 ;;
                  esac
                  if [ "$has_worker" = true ]; then
                    case "$worker_state" in
                      draining|disabled) restatectl --yes --address "$address" nodes set-worker-state --nodes "$id" --worker-state active || return 1 ;;
                      active|provisioning) ;;
                      *) echo "Unexpected Restate worker state for $id: $worker_state" >&2; return 1 ;;
                    esac
                  fi
                  restatectl --yes --address "$address" metadata-server add-node "$id" || return 1
                done <<< "$retained"
              }

              metadata_quorum_ready() {
                metadata_nodes="$(restatectl --address "$address" nodes list --extra)" || return 1
                expected_members="$(printf '%s\n' "$metadata_nodes" | awk '
                  $3 ~ /^restate-[0-2]$/ {
                    if (seen_name[$3]++ || seen_id[$1]++) duplicate = 1
                    ids[++count] = $1
                  }
                  END {
                    if (duplicate || count != 3) exit 1
                    for (i = 1; i <= count; i += 1) {
                      if (i > 1) printf ","
                      printf "%s", ids[i]
                    }
                    print ""
                  }
                ')" || return 1
                metadata="$(restatectl --address "$address" metadata-server list)" || return 1
                printf '%s\n' "$metadata"
                printf '%s\n' "$metadata" | awk -v expected="$expected_members" '
                  BEGIN {
                    expected_count = split(expected, expected_ids, ",")
                    for (i = 1; i <= expected_count; i += 1) expected_set[expected_ids[i]] = 1
                  }
                  $1 ~ /^N[0-9]+$/ {
                    rows += 1
                    if ($2 != "Member") bad += 1
                    members = $5
                    gsub(/^\[/, "", members)
                    gsub(/\]$/, "", members)
                    actual_count = split(members, actual, ",")
                    if (actual_count != expected_count) bad += 1
                    for (i = 1; i <= actual_count; i += 1) if (!(actual[i] in expected_set)) bad += 1
                    for (id in expected_set) {
                      found = 0
                      for (i = 1; i <= actual_count; i += 1) if (actual[i] == id) found = 1
                      if (!found) bad += 1
                    }
                  }
                  END { exit !(rows == 3 && bad == 0) }
                ' || return 1
              }

              snapshots_ready() {
                partitions="$(restatectl --address "$address" partitions list)" || return 1
                printf '%s\n' "$partitions"
                printf '%s\n' "$partitions" | awk '
                  $1 ~ /^[0-9]+$/ {
                    rows += 1
                    seen[$1] = 1
                    if ($8 ~ /^[1-9][0-9]*$/) archived[$1] = 1
                  }
                  END {
                    if (rows < 24) exit 1
                    for (i = 0; i < 24; i += 1) {
                      if (!(i in seen) || !(i in archived)) exit 1
                    }
                  }
                '
              }

              logs_replication_ready() {
                logs="$(restatectl --address "$address" logs list)" || return 1
                printf '%s\n' "$logs"
                sealed_ids="$(printf '%s\n' "$logs" | awk '
                  $1 ~ /^[0-9]+$/ {
                    rows += 1
                    if ($0 ~ /\{node: 2\}/) next
                    if ($4 == "sealed") {
                      sealed[++sealed_count] = $1
                      next
                    }
                    bad += 1
                  }
                  END {
                    if (rows != 24 || bad != 0) exit 1
                    for (i = 1; i <= sealed_count; i += 1) print sealed[i]
                  }
                ')" || return 1

                while IFS= read -r id; do
                  [ -n "$id" ] || continue
                  detail="$(restatectl --address "$address" logs describe --all --extra "$id")" || return 1
                  printf '%s\n' "$detail"
                  printf '%s\n' "$detail" | awk '
                    $1 ~ /^[0-9]+$/ && $3 == "replicated" { last_replicated = $0 }
                    END { exit !(last_replicated ~ /\{node: 2\}/) }
                  ' || return 1
                done <<< "$sealed_ids"
              }

              for attempt in $(seq 1 60); do
                if reactivate_retained_nodes && nodes_ready && metadata_quorum_ready && snapshots_ready; then
                  break
                fi
                if [ "$attempt" -eq 60 ]; then
                  echo "Three-node Restate membership did not converge safely" >&2
                  exit 1
                fi
                sleep 10
              done

              config="$(restatectl --address "$address" config get)"
              printf '%s\n' "$config"
              if printf '%s\n' "$config" | grep -Fq 'Partition replication: {node: 1}' && \
                printf '%s\n' "$config" | grep -Fq 'Log replication: {node: 1}'; then
                restatectl --yes --address "$address" config set --replication 2
              elif ! printf '%s\n' "$config" | grep -Fq 'Partition replication: {node: 2}' || \
                ! printf '%s\n' "$config" | grep -Fq 'Log replication: {node: 2}'; then
                echo "Refusing unexpected Restate replication configuration" >&2
                exit 1
              fi

              for attempt in $(seq 1 60); do
                config="$(restatectl --address "$address" config get)" || true
                partitions="$(restatectl --address "$address" partitions list)" || true
                if nodes_ready && \
                  printf '%s\n' "$config" | grep -Fq 'Partition replication: {node: 2}' && \
                  printf '%s\n' "$config" | grep -Fq 'Log replication: {node: 2}' && \
                  logs_replication_ready && \
                  ! printf '%s\n' "$partitions" | grep -Eq 'Catching Up|Starting|UNKNOWN|->' && \
                  printf '%s\n' "$partitions" | awk '$1 ~ /^[0-9]+$/ { count[$1] += 1; rows += 1 } END { if (rows != 48) exit 1; for (i = 0; i < 24; i += 1) if (count[i] != 2) exit 1 }' && \
                  metadata_quorum_ready; then
                  printf '%s\n' "$config"
                  printf '%s\n' "$partitions"
                  printf '%s\n' "$metadata"
                  echo "Restate replication 2 is converged across three nodes"
                  exit 0
                fi
                sleep 10
              done

              echo "Restate replication migration did not converge" >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 3000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
