apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restate-ingress
  labels:
    app.kubernetes.io/name: restate
spec:
  podSelector:
    matchLabels:
      app: restate
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: admin
          protocol: TCP
        - port: ingress
          protocol: TCP
        - port: node
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              restate.proompteng.ai/admin-access: "true"
      ports:
        - port: admin
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bayn
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-lifecycle-register
      ports:
        - port: admin
          protocol: TCP
    - from:
        - namespaceSelector: {}
      ports:
        - port: ingress
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: observability-cluster-metrics-alloy
      ports:
        - port: node
          protocol: TCP
