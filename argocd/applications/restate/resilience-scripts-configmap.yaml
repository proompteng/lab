apiVersion: v1
kind: ConfigMap
metadata:
  name: restate-resilience-scripts
data:
  partition-startup.sh: |
    #!/bin/bash
    set -euo pipefail
    : "${POD_NAME:?POD_NAME must identify this member}"

    read_state() {
      restatectl --single-address http://localhost:5122 \
        --connect-timeout 1000 --request-timeout 3000 sql --json "
        SELECT n.gen_node_id AS generation, n.state, n.has_worker_role, n.worker_state, r.partition_id,
               r.membership, s.replay_status, s.updated_at
        FROM nodes n
        LEFT JOIN partition_replica_set r ON r.plain_node_id = n.plain_node_id
        LEFT JOIN partition_state s
          ON s.partition_id = r.partition_id AND s.gen_node_id = n.gen_node_id
        WHERE n.name = '$POD_NAME'
        ORDER BY r.partition_id, r.membership"
    }

    recovered() {
      jq -e 'type == "array" and length > 0 and all(.[];
        .generation != null and .state == "alive"
      ) and (
        all(.[]; .has_worker_role == true and .worker_state == "active" and .partition_id != null and
          .membership == "current" and .replay_status == "active" and .updated_at != null)
        or (length == 1 and .[0].partition_id == null and .[0].has_worker_role == false)
      )' >/dev/null
    }

    first="$(read_state)"
    recovered <<< "$first"
    sleep 2
    second="$(read_state)"
    recovered <<< "$second"
    jq -e -n --argjson before "$first" --argjson after "$second" '
      ($before | length) as $count |
      $count == ($after | length) and all(range(0; $count); . as $i |
        $before[$i].generation == $after[$i].generation and
        $before[$i].has_worker_role == $after[$i].has_worker_role and
        $before[$i].worker_state == $after[$i].worker_state and
        $before[$i].partition_id == $after[$i].partition_id and
        ($after[$i].partition_id == null or $before[$i].updated_at < $after[$i].updated_at)
      )' >/dev/null
    echo "Member recovered in its current role"

  snapshot-restore.sh: |
    #!/bin/bash
    set -euo pipefail

    while [ "$SECONDS" -lt 1680 ]; do
      rm -rf /tmp/restate-snapshot-restore
      if output="$({
        restate-doctor snapshot s3://restate-snapshots/partitions \
          --aws-region "$AWS_REGION" \
          --aws-endpoint-url http://rook-ceph-rgw-objectstore.rook-ceph.svc.cluster.local \
          --aws-allow-http \
          --cache-dir /tmp/restate-snapshot-restore \
          --rocksdb-memory-budget 536870912 \
          --query "SELECT COUNT(*) AS invocation_rows FROM sys_invocation_status"
      } 2>&1)"; then
        doctor_status=0
      else
        doctor_status=$?
      fi
      printf '%s\n' "$output"
      if [ "$doctor_status" -eq 0 ] && \
        printf '%s\n' "$output" | grep -Fq 'Found 24 partition(s):' && \
        printf '%s\n' "$output" | grep -Fqi 'invocation_rows'; then
        echo "All 24 latest Restate partition snapshots opened in an isolated read-only store"
        exit 0
      fi
      echo "Snapshot repository is not complete yet; retrying isolated restore proof" >&2
      sleep 15
    done
    echo "Snapshot restore proof did not open all 24 partitions before the Job deadline" >&2
    exit 1
