apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-ofz-wal
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    storage.proompteng.ai/durability: postgresql-synchronous-replication-required
    storage.proompteng.ai/purpose: ofz-db-wal
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowedTopologies:
  - matchLabelExpressions:
      - key: kubernetes.io/hostname
        values:
          - talos-192-168-1-194
          - talos-192-168-1-85
          - turin
