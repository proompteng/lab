apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: compute-local
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: no-network-volumes
      expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v,
          !has(v.persistentVolumeClaim) && !has(v.cephfs) && !has(v.rbd) &&
          (!has(v.csi) || !v.csi.driver.endsWith('.csi.ceph.com')) &&
          (!has(v.ephemeral) ||
            (has(v.ephemeral.volumeClaimTemplate.spec.storageClassName) &&
              v.ephemeral.volumeClaimTemplate.spec.storageClassName in
                ['local-path', 'local-path-ryzen', 'local-path-ci-amd64', 'local-path-turin-nvme-intel', 'local-path-turin-nvme-transcend'])))
    - name: missing-compute-toleration
      expression: >-
        !has(object.spec.tolerations) || !object.spec.tolerations.exists(t,
          (!has(t.effect) || t.effect == '' || t.effect == 'NoSchedule') &&
          ((t.operator == 'Exists' && (!has(t.key) || t.key == '' || t.key == 'workload.proompteng.ai/compute-local')) ||
            (has(t.key) && t.key == 'workload.proompteng.ai/compute-local' && has(t.value) && t.value == 'true')))
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.tolerations) ? [JSONPatch{
            op: 'add',
            path: '/spec/tolerations/-',
            value: {'key': 'workload.proompteng.ai/compute-local', 'operator': 'Equal', 'value': 'true', 'effect': 'NoSchedule'}
          }] : [JSONPatch{
            op: 'add',
            path: '/spec/tolerations',
            value: [{'key': 'workload.proompteng.ai/compute-local', 'operator': 'Equal', 'value': 'true', 'effect': 'NoSchedule'}]
          }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: compute-local
spec:
  policyName: compute-local
