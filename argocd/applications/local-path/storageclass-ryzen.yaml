apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-ryzen
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    storage.proompteng.ai/durability: rebuildable
    storage.proompteng.ai/node: talos-192-168-1-194
    storage.proompteng.ai/prohibited-use: ceph-registry-kafka-database-torghut-durable-state
provisioner: rancher.io/local-path
parameters:
  nodePath: /var/mnt/local-path-provisioner
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowedTopologies:
  - matchLabelExpressions:
      - key: kubernetes.io/hostname
        values:
          - talos-192-168-1-194
