apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-runners-amd64
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: forgejo-runners
    app.kubernetes.io/component: runner
    app.kubernetes.io/instance: forgejo-runners-amd64
    app.kubernetes.io/part-of: forgejo-runners
spec:
  serviceName: forgejo-runners
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runners
      app.kubernetes.io/instance: forgejo-runners-amd64
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runners
        app.kubernetes.io/component: runner
        app.kubernetes.io/instance: forgejo-runners-amd64
        app.kubernetes.io/part-of: forgejo-runners
        forgejo-runners.proompteng.ai/arch: amd64
    spec:
      serviceAccountName: forgejo-runners
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 11400
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: forgejo-runners
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: register-runner
          image: data.forgejo.org/forgejo/runner:13.1.0@sha256:c4af85fd9f0dd03788676a534781a87c71aa2c6a37737143e017eb94d4312952
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -ec
            - |
              if [ -s /data/.runner ]; then
                echo 'Runner already registered, skipping registration.'
                exit 0
              fi

              if [ -z "${FORGEJO_RUNNER_REGISTRATION_TOKEN:-}" ]; then
                echo 'Missing FORGEJO_RUNNER_REGISTRATION_TOKEN.'
                exit 1
              fi

              forgejo-runner register --no-interactive \
                --instance "${FORGEJO_INSTANCE_URL}" \
                --token "${FORGEJO_RUNNER_REGISTRATION_TOKEN}" \
                --name "${RUNNER_NAME_PREFIX}-${HOSTNAME}" \
                --labels "${RUNNER_LABELS}" \
                -c /config/config.yaml
          env:
            - name: FORGEJO_INSTANCE_URL
              valueFrom:
                secretKeyRef:
                  name: forgejo-runners-token
                  key: FORGEJO_INSTANCE_URL
            - name: FORGEJO_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runners-token
                  key: FORGEJO_RUNNER_REGISTRATION_TOKEN
            - name: RUNNER_NAME_PREFIX
              value: forgejo-runners-amd64
            - name: RUNNER_LABELS
              value: ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-latest,docker:docker://ghcr.io/catthehacker/ubuntu:act-latest
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: dind-sock
              mountPath: /var/run
        - name: dind
          restartPolicy: Always
          image: docker:29.8.0-dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ''
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --storage-driver=overlay2
            - --feature=containerd-snapshotter=false
          startupProbe:
            exec:
              command: [docker, info]
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [docker, info]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 8Gi
            limits:
              cpu: '3'
              memory: 6Gi
              ephemeral-storage: 20Gi
          volumeMounts:
            - name: dind-sock
              mountPath: /var/run
            - name: docker-graph
              mountPath: /var/lib/docker
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13.1.0@sha256:c4af85fd9f0dd03788676a534781a87c71aa2c6a37737143e017eb94d4312952
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - forgejo-runner
            - daemon
            - -c
            - /config/config.yaml
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: '2'
              memory: 4Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: dind-sock
              mountPath: /var/run
      volumes:
        - name: config
          configMap:
            name: forgejo-runners-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: dind-sock
          emptyDir: {}
        - name: docker-graph
          emptyDir:
            sizeLimit: 20Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: rook-ceph-block
        resources:
          requests:
            storage: 20Gi
