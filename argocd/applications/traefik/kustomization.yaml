apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik

resources:
  - k8s-proompteng-ai-certificate.yaml
  - rgw-service.yaml
helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 43.0.0
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesFile: values.yaml

images:
  - name: docker.io/traefik
    newName: mirror.gcr.io/library/traefik
    newTag: v3.8.0
    digest: sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17
