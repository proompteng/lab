apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-webhook-eventing
  namespace: knative-eventing
spec:
  template:
    spec:
      containers:
        - name: kafka-webhook-eventing
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 8443
              scheme: HTTPS
              httpHeaders:
                - name: k-kubelet-probe
                  value: webhook
            failureThreshold: 24
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
