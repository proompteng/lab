apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-cassandra-509-v1-snapshot
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: cassandra-upgrade
    temporal.proompteng.ai/backup-generation: 509-v1
  annotations:
    argocd.argoproj.io/sync-wave: '-25'
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: cassandra-upgrade
        temporal.proompteng.ai/backup-generation: 509-v1
    spec:
      restartPolicy: Never
      serviceAccountName: temporal-cassandra-509-v1-gate
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1001
      containers:
      - name: snapshot
        image: docker.io/bitnami/kubectl@sha256:a67b11e95e953f550f020a41970185ccc5f83d78b86b8c575d02c904aa0f9cd7
        command:
        - /bin/bash
        - /scripts/cassandra-gate.sh
        - backup
        env:
        - name: SOURCE_IMAGE
          value: mirror.gcr.io/cassandra:4.1.12@sha256:3edbfb2be84f00f3467e206d7d785ddd4dbcf7042e6a126180e1d9faa5514474
        - name: TARGET_IMAGE
          value: mirror.gcr.io/cassandra:5.0.9@sha256:d35e159439b302146f964919904f84fd3c2cebf347272b8cb8c4368c1cf200e5
        - name: GENERATION
          value: 509-v1
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: temporal-cassandra-upgrade-scripts-509-v1
      - name: tmp
        emptyDir: {}
