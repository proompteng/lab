# Retained native backups and CSI clone from generation 31119-v4.
# The old rehearsal booted the live clone directory and failed on a later SSTable
# outside the native snapshot. These artifacts do not satisfy upgrade acceptance.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: temporal-cassandra-31119-v4-0
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: cassandra-upgrade
    temporal.proompteng.ai/backup-generation: 31119-v4
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  volumeSnapshotClassName: rook-ceph-block
  source:
    persistentVolumeClaimName: data-temporal-cassandra-0
