# Generation v5 stopped before copying data or starting either engine.
# The validator rejected Cassandra system.IndexInfo capitalization.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: temporal-cassandra-31119-v5-0
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: cassandra-upgrade
    temporal.proompteng.ai/backup-generation: 31119-v5
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  volumeSnapshotClassName: rook-ceph-block
  source:
    persistentVolumeClaimName: data-temporal-cassandra-0
