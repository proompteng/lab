apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-elasticsearch-snapshot-repository
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: elasticsearch-snapshot
    temporal.proompteng.ai/backup-generation: 81921-v1
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: rook-cephfs
  volumeMode: Filesystem
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-elasticsearch-snapshot
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: elasticsearch-snapshot
    temporal.proompteng.ai/backup-generation: 81921-v1
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-elasticsearch-snapshot
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: elasticsearch-snapshot
    temporal.proompteng.ai/backup-generation: 81921-v1
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/component: elasticsearch-snapshot
      temporal.proompteng.ai/backup-generation: 81921-v1
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: elasticsearch-master
    ports:
    - protocol: TCP
      port: 9200
---
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-elasticsearch-81921-v1-snapshot
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/component: elasticsearch-snapshot
    temporal.proompteng.ai/backup-generation: 81921-v1
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/component: elasticsearch-snapshot
        temporal.proompteng.ai/backup-generation: 81921-v1
    spec:
      serviceAccountName: temporal-elasticsearch-snapshot
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: snapshot
        image: mirror.gcr.io/python:3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
        command:
        - python3
        - /scripts/elasticsearch-snapshot.py
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: repository
          mountPath: /repository
      volumes:
      - name: scripts
        configMap:
          name: temporal-elasticsearch-upgrade-scripts
      - name: repository
        persistentVolumeClaim:
          claimName: temporal-elasticsearch-snapshot-repository
