apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: temporal

resources:
  - upgrade/cassandra-4112-v3-backup.yaml
  - upgrade/cassandra-4112-v2-backup.yaml
  - upgrade/cassandra-4112-backup.yaml
  - upgrade/elasticsearch-preparation.yaml
  - upgrade/retained-rf3-snapshots.yaml
  - upgrade/retained-31119-v2-snapshots.yaml
  - upgrade/retained-31119-v3-snapshots.yaml
  - upgrade/retained-31119-v4-snapshots.yaml
  - upgrade/retained-31119-v5-snapshots.yaml
  - upgrade/cassandra-31119-backup.yaml
  - upgrade/cassandra-31119-rollout.yaml
  - load-balancer.yaml
  - load-balancer-frontend.yaml
  - ingressroute-temporal-k8s-private.yaml

patches:
  - target:
      kind: StatefulSet
      name: elasticsearch-master
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: elasticsearch-master
      spec:
        template:
          spec:
            initContainers:
              - name: configure-sysctl
              - name: keystore
                env:
                  - name: ELASTIC_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: elasticsearch-master-credentials
                        key: password
  - target:
      kind: StatefulSet
      name: temporal-cassandra
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: mirror.gcr.io/cassandra:3.11.19@sha256:9a14b18eb658851e8939cfdeca8fcbca389f5f0d00fca4a995d80b6accfcbd96
  - target:
      kind: Secret
      name: temporal-default-store
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-delete-policy
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-2"
  - target:
      kind: Secret
      name: temporal-visibility-store
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-delete-policy
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-2"
  - target:
      kind: Job
      name: temporal-schema
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-delete-policy
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Force=true,Replace=true
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-1"
      - op: remove
        path: /spec/ttlSecondsAfterFinished

helmCharts:
  - name: cassandra
    repo: https://charts.helm.sh/incubator
    version: 0.15.4
    releaseName: temporal
    namespace: temporal
    valuesInline:
      persistence:
        enabled: true
        storageClass: rook-ceph-block
        accessMode: ReadWriteOnce
        size: 20Gi
      config:
        cluster_size: 3
        seed_size: 2
      image:
        repo: mirror.gcr.io/cassandra
        tag: 3.11.5
  - name: elasticsearch
    repo: https://helm.elastic.co
    version: 8.5.1
    releaseName: temporal
    namespace: temporal
    valuesInline:
      replicas: 3
      antiAffinity: ""
      minimumMasterNodes: 2
      protocol: http
      createCert: false
      secret:
        enabled: true
        password: temporal-elasticsearch-readiness
      esConfig:
        elasticsearch.yml: |
          xpack.security.enabled: false
          xpack.security.http.ssl.enabled: false
          xpack.security.transport.ssl.enabled: false
          path.repo:
            - /usr/share/elasticsearch/snapshots
          s3.client.temporal_snapshot.endpoint: rook-ceph-rgw-objectstore.rook-ceph.svc.cluster.local:80
          s3.client.temporal_snapshot.protocol: http
          s3.client.temporal_snapshot.path_style_access: true
          s3.client.temporal_snapshot.region: us-east-1
      keystore:
        - secretName: temporal-elasticsearch-snapshots
          items:
            - key: AWS_ACCESS_KEY_ID
              path: s3.client.temporal_snapshot.access_key
            - key: AWS_SECRET_ACCESS_KEY
              path: s3.client.temporal_snapshot.secret_key
      extraVolumes:
        - name: elasticsearch-snapshot-repository
          persistentVolumeClaim:
            claimName: temporal-elasticsearch-snapshot-repository-v2
      extraVolumeMounts:
        - name: elasticsearch-snapshot-repository
          mountPath: /usr/share/elasticsearch/snapshots
      clusterHealthCheckParams: "wait_for_status=green&timeout=1s"
      persistence:
        enabled: true
      volumeClaimTemplate:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: rook-ceph-block
  - name: temporal
    repo: https://go.temporal.io/helm-charts
    version: 1.6.0
    releaseName: temporal
    namespace: temporal
    includeCRDs: true
    valuesInline:
      server:
        image:
          repository: mirror.gcr.io/temporalio/server
        config:
          persistence:
            defaultStore: default
            visibilityStore: visibility
            numHistoryShards: 512
            datastores:
              default:
                cassandra:
                  createDatabase: true
                  manageSchema: true
                  hosts: "temporal-cassandra.temporal,temporal-cassandra.temporal,temporal-cassandra.temporal"
                  port: 9042
                  keyspace: temporal
                  user: user
                  password: password
                  replicationFactor: 3
                  consistency:
                    default:
                      consistency: local_quorum
                      serialConsistency: local_serial
              visibility:
                elasticsearch:
                  manageSchema: true
                  version: v7
                  url:
                    scheme: http
                    host: "elasticsearch-master-headless:9200"
                  username: ""
                  password: ""
                  logLevel: error
                  indices:
                    visibility: temporal_visibility_v1_dev
      web:
        image:
          repository: mirror.gcr.io/temporalio/ui
        # https://docs.temporal.io/references/web-ui-environment-variables
        additionalEnv:
          - name: TEMPORAL_CSRF_COOKIE_INSECURE
            value: "true"
      admintools:
        image:
          repository: mirror.gcr.io/temporalio/admin-tools
      shims:
        dockerize: false
        elasticsearchTool: false

images:
  - name: mirror.gcr.io/temporalio/server
    newName: mirror.gcr.io/temporalio/server
    newTag: 1.31.2
    digest: sha256:b5ecdb8282bededae2a10c36e8d862e27d0bc2d247fc73c5416025997ab4a1da
  - name: mirror.gcr.io/temporalio/admin-tools
    newName: mirror.gcr.io/temporalio/admin-tools
    newTag: 1.31.2
    digest: sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
  - name: mirror.gcr.io/temporalio/ui
    newName: mirror.gcr.io/temporalio/ui
    newTag: 2.53.3
    digest: sha256:eef301146e60fad34b47adaecfae4149016e34b2d44ba94fca5fd8e5441f182a

configMapGenerator:
  - name: temporal-cassandra-upgrade-scripts
    files:
      - cassandra-gate.sh=upgrade/retained-31119-v6-gate.sh
      - cassandra-rehearsal.sh=upgrade/retained-31119-v6-rehearsal.sh
      - restore-native-snapshot.py=upgrade/retained-31119-v6-native-restore.py
      - upgrade/canonicalize-cql.py
      - upgrade/verify-rehearsal-network.py
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-30"
  - name: temporal-cassandra-upgrade-scripts-rollout
    files:
      - upgrade/cassandra-gate.sh
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-30"
  - name: temporal-elasticsearch-upgrade-scripts
    files:
      - upgrade/elasticsearch-snapshot.py
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-30"
  - name: temporal-cassandra-upgrade-scripts-4112-v1
    files:
      - upgrade/cassandra-gate.sh
      - cassandra-rehearsal.sh=upgrade/retained-4112-v2-rehearsal.sh
      - restore-native-snapshot.py=upgrade/retained-31119-v6-native-restore.py
      - upgrade/canonicalize-cql.py
      - upgrade/verify-rehearsal-network.py
      - upgrade/verify-cassandra-sstables.sh
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-30"
  - name: temporal-cassandra-upgrade-scripts-4112-v2
    files:
      - upgrade/cassandra-gate.sh
      - cassandra-rehearsal.sh=upgrade/retained-4112-v2-rehearsal.sh
      - upgrade/restore-native-snapshot.py
      - upgrade/canonicalize-cql.py
      - upgrade/verify-rehearsal-network.py
      - upgrade/verify-cassandra-sstables.sh
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-30"
  - name: temporal-cassandra-upgrade-scripts-4112-v3
    files:
      - upgrade/cassandra-gate.sh
      - upgrade/cassandra-rehearsal.sh
      - upgrade/restore-native-snapshot.py
      - upgrade/canonicalize-cql.py
      - upgrade/verify-rehearsal-network.py
      - upgrade/verify-cassandra-sstables.sh
      - upgrade/verify-cassandra-ring.py
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-30"
