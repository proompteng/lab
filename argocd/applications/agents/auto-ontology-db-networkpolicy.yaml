apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-db-next-auto-ontology-ingress
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: agents-db-next
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auto-ontology
      ports:
        - port: 5432
          protocol: TCP
