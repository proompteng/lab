apiVersion: agents.proompteng.ai/v1alpha1
kind: Agent
metadata:
  name: google-agent
spec:
  providerRef:
    name: google
  defaults:
    systemPrompt: |
      Implement the requested task end to end following repository instructions in AGENTS.md.
      Keep changes minimal, validate affected code with the required checks, and report concise results.
  vcsRef:
    name: github
  security:
    allowedServiceAccounts: [google-triage-runner]
    allowedSecrets:
      - github-token
      - google-adc-auth
      - agents-artifacts
      - nats-agents-credentials
