apiVersion: batch/v1
kind: CronJob
metadata:
  name: auto-ontology-sync
spec:
  schedule: "15 7 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: auto-ontology-sync
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              # Replaced with the digest-pinned controller image by Kustomize.
              image: agents-controller
              command: ["bun", "--no-install", "/app/services/agents/scripts/auto-ontology-sync/sync-auto-ontology-bundle.js"]
              args: ["--bundle", "/etc/auto-ontology-sync/agents-knowledge.json", "--mode", "apply"]
              env:
                - name: AUTO_ONTOLOGY_API_URL
                  value: https://auto-ontology.ide-newton.ts.net
                - name: AUTO_ONTOLOGY_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: auto-ontology-publisher-token
                      key: AUTO_ONTOLOGY_API_TOKEN
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: knowledge
                  mountPath: /etc/auto-ontology-sync
                  readOnly: true
          volumes:
            - name: knowledge
              configMap:
                name: agents-auto-ontology-knowledge
