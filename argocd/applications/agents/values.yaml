  smoke:
    agentRun:
      apiVersion: agents.proompteng.ai/v1alpha1
      kind: AgentRun
      metadata:
        name: codex-spark-smoke
      spec:
        agentRef:
          name: codex-spark-smoke-agent
        implementationSpecRef:
          name: codex-spark-smoke-implspec
        goal:
          objective: Verify Codex app-server runner protocol, status, artifact collection, and the promoted runner image without
            external side effects.
          tokenBudget: 8000
        runtime:
          type: workflow
          config:
            serviceAccountName: agents-sa
            backoffLimit: 0
        ttlSecondsAfterFinished: 1800
        workflow:
          steps:
            - name: smoke
              timeoutSeconds: 900
              parameters:
                stage: implementation
        parameters:
          repository: proompteng/lab
          base: main
          head: codex/agents-smoke
          issueNumber: swarm-codex-smoke
          issueTitle: Codex Spark smoke validation
          objective: verify deterministic app-server runner protocol and the promoted runner image without VCS or external model
            calls
        secrets:
          - codex-auth
    additionalAgentRuns:
      - apiVersion: agents.proompteng.ai/v1alpha1
        kind: AgentRun
        metadata:
          name: agents-primitives-agentrun
        spec:
          agentRef:
            name: agents-primitives-agent
          ttlSecondsAfterFinished: 600
          implementation:
            inline:
              summary: Run the agents primitives smoke implementation
              text: Execute the sample implementation for the agents primitives workflow.
          runtime:
            type: workflow
          workflow:
            steps:
              - name: implementation
                timeoutSeconds: 600
                parameters:
                  stage: implementation
          parameters:
            repository: proompteng/lab
            base: main
            head: codex/issue-2425-6cedebf4
            stage: implementation
