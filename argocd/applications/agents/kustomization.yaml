apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
resources:
  - postgres-upgrade-backup.yaml
  - agents-audit-ro-db-sealedsecret.yaml
  - postgres-cluster.yaml
  - codex-auth-master-externalsecret.yaml
  - codex-auth-externalsecret.yaml
  - codex-auth-refresher.yaml
  - google-adc-externalsecret.yaml
  - workspace-cache-daemonset.yaml
  - hf-router-token-sealedsecret.yaml
  - agents-shell-tunnel-runtime-sealedsecret.yaml
  - agents-shell-tunnel-deployment.yaml
  - agents-shell-tunnel-networkpolicy.yaml
  - agents-shell-omni-externalsecret.yaml
  - agents-shell-bmc-externalsecret.yaml
  - agents-shell-paperless-secret.yaml
  - codex-secretbinding.yaml
  - codex-agent.yaml
  - codex-smoke-agentprovider.yaml
  - codex-smoke-agent.yaml
  - codex-smoke-agent-system-prompt-configmap.yaml
  - codex-smoke-implspec.yaml
  - anypi-agentprovider.yaml
  - anypi-agent.yaml
  - google-secretbinding.yaml
  - google-agentprovider.yaml
  - google-agent.yaml
  - codex-agentprovider.yaml
  - agentrun-triage-rbac.yaml
  - agentrun-triage-networkpolicy.yaml
  - observability-query.yaml
  - codex-agent-system-prompt-configmap.yaml
  - codex-versioncontrolprovider.yaml
  - codex-orchestrations.yaml
  - codex-github-events-kafkasource.yaml
  - sample-approvalpolicy.yaml
  - sample-budget.yaml
  - sample-signal.yaml
  - agents-primitives-agentprovider.yaml
  - agents-primitives-agent.yaml
  - agents-primitives-memory.yaml
  - agents-primitives-tool.yaml
  - agents-primitives-toolrun.yaml
  - agents-primitives-approvalpolicy.yaml
  - agents-primitives-signal.yaml
  - agents-primitives-signal-delivery.yaml
  - agents-artifacts-objectbucketclaim.yaml
  - agents-primitives-artifact.yaml
  - agents-primitives-budget.yaml
  - agents-primitives-workspace.yaml
  - agents-primitives-orchestration.yaml
  - agents-primitives-sub-orchestration.yaml
  - agents-primitives-orchestrationrun.yaml
  - ingressroute-agents-api.yaml
  - tailscale-service.yaml
  - tailscale-networkpolicy.yaml
  - auto-ontology-mcp-token-sealedsecret.yaml
  - ../../../docs/agents/ontology
  - auto-ontology-networkpolicy.yaml
  - auto-ontology-db-networkpolicy.yaml
  - auto-ontology-sync-cronjob.yaml
  - health-probe-networkpolicy.yaml
  - alloy-rbac.yaml
  - alloy-configmap.yaml
  - alloy-deployment.yaml
replacements:
  - source:
      kind: Deployment
      name: agents-controllers
      fieldPath: spec.template.spec.containers.0.env.[name=AGENTS_AGENT_RUNNER_IMAGE].value
    targets:
      - select:
          kind: DaemonSet
          name: agents-workspace-cache
        fieldPaths:
          - spec.template.spec.containers.[name=refresh].image
  - source:
      kind: Deployment
      name: agents-controllers
      fieldPath: spec.template.spec.containers.[name=agents-controllers].image
    targets:
      - select:
          kind: CronJob
          name: auto-ontology-sync
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=sync].image
  - source:
      kind: SealedSecret
      name: auto-ontology-mcp-token
      fieldPath: spec.encryptedData.AUTO_ONTOLOGY_API_TOKEN
    targets:
      - select:
          kind: Deployment
          name: agents-auto-ontology-mcp-gateway
        fieldPaths:
          - spec.template.metadata.annotations.[agents.proompteng.ai/ontology-key-version]
        options:
          create: true
  - source:
      kind: SealedSecret
      name: agents-shell-tunnel-runtime
      fieldPath: spec.encryptedData.api-key
    targets:
      - select:
          kind: Deployment
          name: agents-shell-tunnel
        fieldPaths:
          - spec.template.metadata.annotations.[agents-shell.proompteng.ai/runtime-key-version]
        options:
          create: true
patches:
  - target:
      kind: Deployment
      name: agents-shell
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agents-shell
      spec:
        template:
          spec:
            containers:
              - name: agents-shell
                volumeMounts:
                  - name: omni
                    mountPath: /var/run/secrets/agents-shell-omni
                    readOnly: true
                  - name: bmc
                    mountPath: /var/run/secrets/agents-shell-bmc
                    readOnly: true
                  - name: paperless
                    mountPath: /var/run/secrets/agents-shell-paperless
                    readOnly: true
            volumes:
              - name: omni
                secret:
                  secretName: agents-shell-omni
                  defaultMode: 0400
                  items:
                    - key: talosconfig
                      path: talosconfig
              - name: bmc
                secret:
                  secretName: agents-shell-bmc
                  defaultMode: 0440
              - name: paperless
                secret:
                  secretName: agents-shell-paperless
                  defaultMode: 0440
helmGlobals:
  chartHome: ../../../charts
helmCharts:
  - name: agents
    releaseName: agents
    namespace: agents
    valuesFile: values.yaml
    includeCRDs: true

configMapGenerator:
  - name: agents-observability-query
    files:
      - nginx.conf=observability-query.nginx.conf
  - name: agents-workspace-cache-refresh
    files:
      - refresh.sh=workspace-cache-refresh.sh
  - name: agents-relay-targets
    files:
      - relay-targets.json
