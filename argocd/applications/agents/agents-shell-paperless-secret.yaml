apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperless-agent-token-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: paperless-agent-api
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  provider:
    kubernetes:
      remoteNamespace: paperless
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: paperless-agent-token-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agents-shell-paperless
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: paperless-agent-api
  target:
    name: agents-shell-paperless
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: paperless-agent-api
        property: token
