apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agents-shell-omni
  namespace: agents
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: agents-shell-omni
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: service-account-key
      remoteRef:
        key: agents-shell-omni/service-account-key
    - secretKey: talosconfig
      remoteRef:
        key: agents-shell-omni/talosconfig
