worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr;
events {}

http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream mimir { server observability-mimir-gateway.observability.svc.cluster.local:80; }
    upstream loki { server observability-loki-v3-gateway.observability.svc.cluster.local:80; }
    upstream tempo { server observability-tempo-v3-gateway.observability.svc.cluster.local:80; }
    upstream alertmanager { server observability-mimir-alertmanager.observability.svc.cluster.local:8080; }
    upstream grafana { server observability-grafana.observability.svc.cluster.local:80; }

    map $uri $query_backend {
        default "";
        ~^/prometheus/api/v1/(alerts|rules|query|query_range|labels|series|label/[a-zA-Z0-9_]+/values)$ mimir;
        ~^/loki/api/v1/(query|query_range|labels|series|label/[a-zA-Z0-9_]+/values)$ loki;
        ~^/api/(v2/)?(search(/tags|/tag/[a-zA-Z0-9_.-]+/values)?|traces/[a-fA-F0-9]+)$ tempo;
        ~^/api/metrics/(query|query_range)$ tempo;
        ~^/alertmanager/api/v2/(alerts|alerts/groups|silences)$ alertmanager;
        ~^/api/(health|dashboards/uid/[a-zA-Z0-9_-]+)$ grafana;
    }

    server {
        listen 8080;
        if ($request_method != GET) { return 405; }
        location = /healthz { return 200 "ok\n"; }
        location / {
            if ($query_backend = "") { return 404; }
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Scope-OrgID anonymous;
            proxy_connect_timeout 5s;
            proxy_buffering off;
            # Route and forward the same normalized path, not the raw request URI.
            proxy_pass http://$query_backend$uri$is_args$args;
        }
    }
}
