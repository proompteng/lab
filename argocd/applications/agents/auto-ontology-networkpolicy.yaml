apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-auto-ontology-gateway-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agents-auto-ontology-mcp-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auto-ontology
      ports:
        - port: 3000
          protocol: TCP
        - port: 3001
          protocol: TCP
        - port: 3003
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # TokenReview and owner lookups need the Kubernetes Service and its API servers.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-auto-ontology-codex-egress
spec:
  # This gateway policy is additive to the AgentRun triage egress policy.
  podSelector:
    matchLabels:
      agents.proompteng.ai/provider: codex
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agents-auto-ontology-mcp-gateway
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auto-ontology
          podSelector:
            matchLabels:
              app.kubernetes.io/name: auto-ontology
              app.kubernetes.io/component: frontend
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auto-ontology
          podSelector:
            matchLabels:
              app.kubernetes.io/name: auto-ontology-mcp
      ports:
        - port: 3003
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agents-auto-ontology-google-egress
spec:
  podSelector:
    matchLabels:
      agents.proompteng.ai/provider: google
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agents-auto-ontology-mcp-gateway
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auto-ontology-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auto-ontology-sync
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auto-ontology
          podSelector:
            matchLabels:
              app.kubernetes.io/name: auto-ontology
              app.kubernetes.io/component: frontend
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
