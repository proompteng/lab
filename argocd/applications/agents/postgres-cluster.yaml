apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agents-db-next
  namespace: agents
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  postgresql:
    parameters:
      shared_buffers: 512MB
      wal_buffers: 16MB
  instances: 1
  managed:
    roles:
      - name: agents_audit_ro
        login: true
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: agents-audit-ro-db
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      memory: "4Gi"
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:13f5dc1b42c5d96233724be976740df031136ca013f98a56a2877a62b362b453
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: rook-ceph-block
    size: 50Gi
  bootstrap:
    initdb:
      database: agents
      owner: agents
      encoding: "UTF8"
      dataChecksums: true
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;
  backup:
    volumeSnapshot:
      className: rook-ceph-block
      snapshotOwnerReference: backup
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "pgadmin"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "pgadmin"
# The app-facing database secret is canonicalized as `agents-db-app`.
# Keep the physical CNPG cluster name on the existing live cluster until a backup/restore migration can rename it without pruning data.
