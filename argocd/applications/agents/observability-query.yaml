apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-observability-query
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agents-observability-query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents-observability-query
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: mirror.gcr.io/nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          command: [nginx, -e, stderr, -g, "daemon off;", -c, /etc/nginx/query/nginx.conf]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/query
              readOnly: true
            - name: temp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: agents-observability-query
        - name: temp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agents-observability-query
spec:
  selector:
    app.kubernetes.io/name: agents-observability-query
  ports:
    - name: http
      port: 8080
      targetPort: http
