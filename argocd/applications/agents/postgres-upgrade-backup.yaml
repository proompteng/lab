apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: agents-db-major-upgrade
  namespace: agents
  labels:
    app.kubernetes.io/name: agents-db-next
    app.kubernetes.io/component: postgres-upgrade-backup
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: agents-db-next
  method: volumeSnapshot
  online: false
  target: primary
