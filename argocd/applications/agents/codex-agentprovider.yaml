apiVersion: agents.proompteng.ai/v1alpha1
kind: AgentProvider
metadata:
  name: codex
spec:
  binary: /usr/local/bin/agent-runner
  workload:
    serviceAccountName: codex-auto-ontology-runner
    serviceAccountToken:
      audience: agents.proompteng.ai/auto-ontology-mcp
      expirationSeconds: 600
      mountPath: /var/run/secrets/agents-auto-ontology-mcp
  adapter:
    type: codex-app-server
    codex:
      model: gpt-6.2-sol
      effort: max
      sandbox: danger-full-access
      approval: never
      cwd: /workspace/lab
      bootstrapTimeoutMs: 60000
      threadConfig:
        mcp_servers:
          auto_ontology:
            command: /usr/local/bin/auto-ontology-mcp-bridge
            required: false
            startup_timeout_sec: 15
            tool_timeout_sec: 100
            env_vars: [AGENTS_MCP_IDENTITY_TOKEN_PATH]
            env:
              AUTO_ONTOLOGY_MCP_GATEWAY_URL: http://agents-auto-ontology-mcp-gateway.agents.svc.cluster.local:8080/mcp
        web_search: live
  argsTemplate: []
  envTemplate:
    CODEX_LOG_LEVEL: info
    AGENTS_RUNNER_PSTACK_ENABLED: 'true'
    AGENTS_ARTIFACTS_ENDPOINT: http://rook-ceph-rgw-objectstore.rook-ceph.svc:80
    AGENTS_ARTIFACTS_BUCKET: agents-artifacts
  inputFiles:
    - path: /root/.codex/config.toml
      content: |-
        model = "gpt-6.2-sol"
        model_reasoning_summary = "detailed"
        model_reasoning_effort = "max"
        model_verbosity = "medium"
        approval_policy = "never"
        sandbox_mode = "danger-full-access"
        web_search = "live"
        mcp_servers = {}
        suppress_unstable_features_warning = true

        [features]
        enable_request_compression = true
        unified_exec = true
        shell_snapshot = true
        goals = true

        [shell_environment_policy]
        ignore_default_excludes = true

        [projects."/workspace/lab"]
        trust_level = "trusted"

        [projects."/root"]
        trust_level = "trusted"
  outputArtifacts:
    - name: runner-result
      path: /workspace/.agent/result.json
      key: "{{ inputs.artifactKey }}"
    - name: runner-log
      path: /workspace/.agent/runner.log
    - name: runner-status
      path: /workspace/.agent/status.json
