apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-alloy
  namespace: agents
  labels:
    app.kubernetes.io/name: agents-alloy
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agents-alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agents-alloy
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: agents-alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.river
          env:
            - name: AGENTS_LOKI_STRUCTURED_METADATA
              value: 'false' # Enable only once Loki accepts structured metadata with its TSDB index.
          ports:
            - name: http-metrics
              containerPort: 12345
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # alloy image runs as UID 0; Kubernetes rejects runAsNonRoot=true.
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
      volumes:
        - name: config
          configMap:
            name: agents-alloy
            items:
              - key: config.river
                path: config.river
