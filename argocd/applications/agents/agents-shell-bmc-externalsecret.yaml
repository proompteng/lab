apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agents-shell-bmc
  namespace: agents
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: agents-shell-bmc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: altra-password
      remoteRef:
        key: agents-shell-bmc/altra-password
    - secretKey: turin-password
      remoteRef:
        key: agents-shell-bmc/turin-password
