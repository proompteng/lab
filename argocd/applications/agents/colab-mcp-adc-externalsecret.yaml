apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: colab-mcp-adc
  namespace: agents
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    # A missing 1Password item must not block the optional gateway's rollout.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: colab-mcp-adc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: credentials.json
      remoteRef:
        key: colab-mcp-adc/credentials.json
