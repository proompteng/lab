apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-csi/external-snapshotter/client/config/crd?ref=v8.6.0
  - https://github.com/kubernetes-csi/external-snapshotter/deploy/kubernetes/snapshot-controller?ref=v8.6.0
  - snapshot-classes.yaml

# The v8.6.0 upstream setup currently names the previous controller image tag.
# Pin the released v8.6.0 multi-architecture image while retaining the v8.6.0
# CRDs and RBAC from the upstream source above.
images:
  - name: registry.k8s.io/sig-storage/snapshot-controller
    newName: registry.k8s.io/sig-storage/snapshot-controller
    newTag: v8.6.0
    digest: sha256:81e79f205083f105e573ba2ebfe5964ede7f69a154e8627f53ebbbccd3ed9f70
