# GitOps-owned storage acceptance resources. The PVCs are retained and reused;
# the PostSync Jobs run only after the storage application has synchronized and
# Argo removes successful hook Jobs before the next creation. Failed hooks stay
# available for evidence and block the sync until they are reviewed.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-rbd-canary
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "10"
  labels:
    storage.proompteng.ai/purpose: upgrade-canary
    storage.proompteng.ai/backend: rbd
spec:
  accessModes:
    # RWOP makes the writer/readback handoff wait for the writer Pod to finish
    # and release its mount before Kubernetes schedules the readback Pod.
    - ReadWriteOncePod
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-ceph-block
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-cephfs-canary
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/sync-wave: "10"
  labels:
    storage.proompteng.ai/purpose: upgrade-canary
    storage.proompteng.ai/backend: cephfs
spec:
  accessModes:
    # Ceph-CSI supports RWOP for CephFS; use it here so the remount proof has
    # the same single-Pod completion/unmount gate as the RBD proof.
    - ReadWriteOncePod
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-cephfs
  volumeMode: Filesystem
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-rbd-canary-write
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "20"
  labels:
    storage.proompteng.ai/purpose: upgrade-canary
    storage.proompteng.ai/backend: rbd
    storage.proompteng.ai/phase: write
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        storage.proompteng.ai/purpose: upgrade-canary
        storage.proompteng.ai/backend: rbd
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: talos-192-168-1-194
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: write
          image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -ec
            - |
              mkdir -p /mnt/canary
              printf '%s\n' 'rook-ceph-rbd-upgrade-canary-v1' > /mnt/canary/marker.tmp
              mv /mnt/canary/marker.tmp /mnt/canary/marker
              sync
              test "$(cat /mnt/canary/marker)" = 'rook-ceph-rbd-upgrade-canary-v1'
              echo 'rbd write and readback: PASS'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: canary
              mountPath: /mnt/canary
      volumes:
        - name: canary
          persistentVolumeClaim:
            claimName: storage-rbd-canary
---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-rbd-canary-readback
  namespace: rook-ceph
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "21"
  labels:
    storage.proompteng.ai/purpose: upgrade-canary
    storage.proompteng.ai/backend: rbd
    storage.proompteng.ai/phase: readback
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        storage.proompteng.ai/purpose: upgrade-canary
        storage.proompteng.ai/backend: rbd
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: talos-192-168-1-85
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-writer
          image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -ec
            - |
              # The PostSync wave waits for the writer Job to complete. This
              # marker check also protects a reused PVC from an empty mount.
              for attempt in $(seq 1 60); do
                test -f /mnt/canary/marker && exit 0
                sleep 2
              done
              echo 'writer marker was not observed' >&2
              exit 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: canary
              mountPath: /mnt/canary
      containers:
        - name: readback
          image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -ec
            - |
              test "$(cat /mnt/canary/marker)" = 'rook-ceph-rbd-upgrade-canary-v1'
              echo 'rbd remount readback: PASS'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: canary
              mountPath: /mnt/canary
      volumes:
        - name: canary
          persistentVolumeClaim:
            claimName: storage-rbd-canary
---
