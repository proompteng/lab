apiVersion: apps/v1
kind: Deployment
metadata:
  name: proompteng
  namespace: proompteng
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Single-replica rollout in a resource-constrained cluster: avoid needing a surge pod.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: proompteng
  template:
    metadata:
      labels:
        app: proompteng
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proompteng
          image: registry.ide-newton.ts.net/lab/proompteng
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_CONVEX_URL
              value: https://convex.proompteng.ai
            - name: LANDING_CMS_URL
              value: https://cms.proompteng.ai
            - name: BETTER_AUTH_URL
              value: https://proompteng.ai
            - name: TENGRI_GRPC_ENDPOINT
              # The release promotion enables this endpoint atomically with
              # the Tengri ApplicationSet entry and immutable image digests.
              value: ""
            - name: TENGRI_GRPC_TLS
              value: "false"
            - name: TENGRI_BFF_SECRET_DIR
              value: /var/run/secrets/tengri-bff
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tengri-bff
              mountPath: /var/run/secrets/tengri-bff
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: tengri-bff
          secret:
            secretName: tengri-bff
