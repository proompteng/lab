apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-admin
  namespace: proompteng
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: platform-admin
  namespace: proompteng
spec:
  selector:
    app: platform-admin
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-admin
  namespace: proompteng
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: platform-admin
  unhealthyPodEvictionPolicy: AlwaysAllow
