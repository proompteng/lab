apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-admin
  namespace: proompteng
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-admin
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        inject.istio.io/templates: sidecar,spire
        sidecar.istio.io/nativeSidecar: 'true'
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyCPULimit: 500m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyMemoryLimit: 256Mi
      labels:
        app: platform-admin
        sidecar.istio.io/inject: 'true'
        spiffe.io/spire-managed-identity: 'true'
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: platform-admin
            topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      containers:
      - env:
        - name: SENTRY_DSN
          valueFrom:
            configMapKeyRef:
              name: proompteng-observability
              key: SENTRY_DSN
        - name: SENTRY_BROWSER_DSN
          valueFrom:
            configMapKeyRef:
              name: proompteng-observability
              key: SENTRY_BROWSER_DSN
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: proompteng-observability
              key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        - name: OFZ_GRPC_ENDPOINT
          value: ofz-api.ofz.svc.cluster.local:9443
        - name: PLATFORM_WEB_ORIGIN
          value: https://admin.proompteng.ai
        - name: PLATFORM_OIDC_ISSUER
          value: https://auth.proompteng.ai/realms/tengri
        - name: PLATFORM_OIDC_CLIENT_ID
          value: platform-admin
        - name: PLATFORM_OIDC_CONNECT_IP
          value: 100.100.244.181
        - name: PLATFORM_OIDC_CLIENT_SECRET_FILE
          value: /var/run/platform/oidc/client-secret
        - name: SPIFFE_ENDPOINT_SOCKET
          value: unix:///spiffe-workload-api/spire-agent.sock
        - name: SPIFFE_ID
          value: spiffe://proompteng.ai/ns/proompteng/sa/platform-admin
        - name: PLATFORM_PORTAL
          value: admin
        image: registry.ide-newton.ts.net/lab/proompteng
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
          periodSeconds: 30
        name: platform-admin
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
          periodSeconds: 10
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /var/run/platform/oidc
          name: oidc
          readOnly: true
        - mountPath: /spiffe-workload-api
          name: workload-api
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /app/apps/landing/.next/cache
          name: next-cache
      enableServiceLinks: false
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: platform-admin
      volumes:
      - name: oidc
        secret:
          defaultMode: 288
          secretName: platform-admin-oidc-client
      - csi:
          driver: csi.spiffe.io
          readOnly: true
        name: workload-api
      - emptyDir:
          sizeLimit: 128Mi
        name: tmp
      - emptyDir:
          sizeLimit: 256Mi
        name: next-cache
