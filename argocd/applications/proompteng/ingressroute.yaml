apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: proompteng-tengri-rate-limit
  namespace: proompteng
spec:
  rateLimit:
    average: 240
    burst: 240
    period: 1m
    # Use the connection peer, including a shared bucket for each tunnel Pod.
    # The LoadBalancer also accepts direct traffic with untrusted proxy headers.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: proompteng-auth-start-rate-limit
  namespace: proompteng
spec:
  rateLimit:
    average: 6
    burst: 6
    period: 1m
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proompteng
  namespace: proompteng
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`proompteng.ai`) && Method(`POST`) && (Path(`/api/auth/login`) || Path(`/api/auth/step-up`) || Path(`/api/auth/add-passkey`))
      priority: 200
      middlewares:
        - name: proompteng-auth-start-rate-limit
      services:
        - name: proompteng
          port: 80
    - kind: Rule
      match: Host(`proompteng.ai`) && (PathPrefix(`/api/tengri`) || PathPrefix(`/api/platform`))
      priority: 100
      middlewares:
        - name: proompteng-tengri-rate-limit
      services:
        - name: proompteng
          port: 80
    - kind: Rule
      match: Host(`proompteng.ai`)
      services:
        - name: proompteng
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform-admin
  namespace: proompteng
spec:
  entryPoints: [web, websecure]
  routes:
    - kind: Rule
      match: Host(`admin.proompteng.ai`) && Method(`POST`) && (Path(`/api/auth/login`) || Path(`/api/auth/step-up`) || Path(`/api/auth/add-passkey`))
      priority: 200
      middlewares:
        - name: proompteng-auth-start-rate-limit
      services:
        - name: platform-admin
          port: 80
    - kind: Rule
      match: Host(`admin.proompteng.ai`) && PathPrefix(`/api/platform`)
      priority: 100
      middlewares:
        - name: proompteng-tengri-rate-limit
      services:
        - name: platform-admin
          port: 80
    - kind: Rule
      match: Host(`admin.proompteng.ai`)
      services:
        - name: platform-admin
          port: 80
