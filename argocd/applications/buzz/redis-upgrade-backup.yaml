apiVersion: batch/v1
kind: Job
metadata:
  name: buzz-redis-save-before-8-10-1
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: save
          image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
          command: [redis-cli, -e, -h, buzz-redis, SAVE]
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: buzz-redis-auth
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: buzz-redis-before-8-10-1
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  volumeSnapshotClassName: rook-ceph-block
  source:
    persistentVolumeClaimName: buzz-redis-buzz-redis-0
