apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: buzz

resources:
  - admin-ingress.yaml
  - objectbucketclaims.yaml
  - secret-store.yaml
  - redis-auth-externalsecret.yaml
  - postgres-objectstore.yaml
  - postgres-upgrade-final-backup.yaml
  - postgres-cluster.yaml
  - postgres-scheduled-backup.yaml
  - redis-config.yaml
  - redis.yaml
  - redis-upgrade-backup.yaml
  - buzz-externalsecret.yaml
  - networkpolicy.yaml
  - alloy-rbac.yaml
  - alloy-configmap.yaml
  - alloy-deployment.yaml

# Chart 0.1.13 was verified as
# sha256:006a821d1ba27e8341e5ac93c665976836770533184b47c1c9127cc8509cabbb.
helmCharts:
  - name: buzz
    repo: oci://ghcr.io/block/buzz/charts
    version: 0.1.13
    releaseName: buzz
    namespace: buzz
    valuesFile: values.yaml

images:
  - name: ghcr.io/block/buzz
    newName: registry.ide-newton.ts.net/lab/buzz
    newTag: kargo-sha-121134afcb048a49b4da8ccb7bcec2fda2231e53
    digest: sha256:faf078c9378ba0662ee5e474aeb2ba287668315d2574242e06d68907c926db04

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: buzz
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "0"
