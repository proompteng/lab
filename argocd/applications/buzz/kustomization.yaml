apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: buzz

resources:
  - admin-ingress.yaml
  - objectbucketclaims.yaml
  - secret-store.yaml
  - redis-auth-externalsecret.yaml
  - postgres-objectstore.yaml
  - postgres-cluster.yaml
  - postgres-scheduled-backup.yaml
  - redis-config.yaml
  - redis.yaml
  - redis-upgrade-backup.yaml
  - buzz-externalsecret.yaml
  - networkpolicy.yaml
  - alloy-rbac.yaml
  - alloy-configmap.yaml
  - alloy-deployment.yaml

# Chart 0.1.7 was verified as
# sha256:2cfedd09f20902c84afdefadf838f2975c19de5b15eea6c63e7d0d5f666171a3.
helmCharts:
  - name: buzz
    repo: oci://ghcr.io/block/buzz/charts
    version: 0.1.7
    releaseName: buzz
    namespace: buzz
    valuesFile: values.yaml

images:
  - name: ghcr.io/block/buzz
    newName: registry.ide-newton.ts.net/lab/buzz
    newTag: kargo-sha-e6240b280a7e35c4f178c482b0e027d39216e883
    digest: sha256:9b08550f31973cfb958b4c3a969d6f8dab968dfb52a4e4222febb2a88608f5d0

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: buzz
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "0"
