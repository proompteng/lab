apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: buzz-redis
  labels:
    app.kubernetes.io/name: buzz-redis
    app.kubernetes.io/part-of: buzz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.10.1@sha256:d3ef5a7f11eb501034b6612b842c864e1946088c52c04b29a22f38b1fe37c99b
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: buzz-redis-auth
      key: password
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: false
  redisConfig:
    maxMemoryPercentOfLimit: 75
    additionalRedisConfig: buzz-redis-config
  redisExporter:
    enabled: true
    image: oliver006/redis_exporter:v1.91.1@sha256:c67a432dba6b4ae30f471e3c77cf14a289133bbeeb89abb0bb03e6092efb2836
    imagePullPolicy: IfNotPresent
    port: 9121
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
  storage:
    # The operator protects generated PVCs through these retention controls.
    # Its CRD prunes metadata from volumeClaimTemplate, so Argo annotations here
    # would create permanent drift without reaching the generated PVC.
    keepAfterDelete: true
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: rook-ceph-block
