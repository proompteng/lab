apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-canary
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-identity-canary
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-identity-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-identity-canary
    spec:
      serviceAccountName: identity-canary
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity
          image: ghcr.io/spiffe/spire-agent:1.15.3
          command: [/opt/spire/bin/spire-agent]
          args:
            - api
            - watch
            - -socketPath
            - /spiffe-workload-api/spire-agent.sock
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
