apiVersion: batch/v1
kind: Job
metadata:
  name: kube-router-policy-preflight
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-router
        app.kubernetes.io/component: policy-preflight
    spec:
      serviceAccountName: kube-router-policy-preflight
      automountServiceAccountToken: true
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify-policy-safety
          image: docker.io/bitnami/kubectl@sha256:a67b11e95e953f550f020a41970185ccc5f83d78b86b8c575d02c904aa0f9cd7
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
          command:
            - /bin/bash
            - -ec
          args:
            - |
              set -o pipefail
              expected_namespaces=$(
                {
                  printf '%s\n' agents argocd bayn bilig hermes kafka media pgadmin synthesis torghut
                  printf '%s\n' buzz observability proompteng restate restate-example temporal
                  if kubectl -n kube-system get namespace tengri >/dev/null 2>&1 &&
                    kubectl -n tengri get networkpolicies.networking.k8s.io -o json |
                      jq -e '.items | length > 0' >/dev/null; then
                    printf '%s\n' tengri
                  fi
                } | sort -u
              )
              actual_namespaces=$(
                kubectl -n kube-system get networkpolicies.networking.k8s.io --all-namespaces -o json |
                  jq -r '.items[].metadata.namespace' |
                  sort -u
              )

              if [[ "$actual_namespaces" != "$expected_namespaces" ]]; then
                echo 'NetworkPolicy namespace coverage changed; refusing to activate kube-router.' >&2
                diff -u <(printf '%s\n' "$expected_namespaces") <(printf '%s\n' "$actual_namespaces") >&2 || true
                exit 1
              fi

              while IFS= read -r namespace; do
                case "$namespace" in
                bayn)
                  kubectl -n "$namespace" get networkpolicy kube-router-rollout-allow-all -o json |
                    jq -e '
                      .spec.podSelector.matchLabels == {
                        "network-policy.proompteng.ai/retired-rollout-policy": "bayn"
                      } and
                      (.spec.policyTypes | sort) == ["Egress", "Ingress"] and
                      (.spec | has("ingress") | not) and
                      (.spec | has("egress") | not)
                    ' >/dev/null
                  ;;
                hermes)
                  expected_hermes_policy_hash=048056134b08a44eedf8530f3dccc2a5d8903432e31ee0bc7ead474bfe6586e3
                  actual_hermes_policy_hash=$(
                    kubectl -n "$namespace" get networkpolicies.networking.k8s.io -o json |
                      jq -cS '[.items[] | {name: .metadata.name, spec: .spec}] | sort_by(.name)' |
                      sha256sum |
                      cut -d ' ' -f1
                  )
                  if [[ "$actual_hermes_policy_hash" != "$expected_hermes_policy_hash" ]]; then
                    echo 'Hermes NetworkPolicies differ from the exact reviewed policy set.' >&2
                    exit 1
                  fi
                  ;;
                tengri)
                  expected_tengri_policy_hash=c91525ac54b23d81b0c240925e34837fe91abb98e1d645c6f4a7ca5bfc4e9ad5
                  actual_tengri_policy_hash=$(
                    kubectl -n "$namespace" get networkpolicies.networking.k8s.io -o json |
                      jq -cS '[.items[] | {name: .metadata.name, spec: .spec}] | sort_by(.name)' |
                      sha256sum |
                      cut -d ' ' -f1
                  )
                  if [[ "$actual_tengri_policy_hash" != "$expected_tengri_policy_hash" ]]; then
                    echo 'Tengri NetworkPolicies differ from the exact reviewed policy set.' >&2
                    exit 1
                  fi
                  ;;
                buzz|observability|proompteng|restate|restate-example|temporal)
                  case "$namespace" in
                  buzz) expected_reviewed_policy_hash=ee25664228868c28750e36ff48db913fe8d193e7b374f17b0e8f26d72675e369 ;;
                  observability) expected_reviewed_policy_hash=38284204aa837a57d235478ac55cb48215bb9e2f386b05ed6de0be009906d49e ;;
                  proompteng) expected_reviewed_policy_hash=fdbd44c9427a32ad4f6d8f8d5bb9a1bd6e0fdfff47dbd0ec8a459a26cabd1f99 ;;
                  restate) expected_reviewed_policy_hash=76f18dc30c1e0ab7e796a508bd4574e803018cd9b398aabfcdee1df4ee5118bd ;;
                  restate-example) expected_reviewed_policy_hash=8c60dd47fe42b26c7a3eb02269c35d07a440066cf905a3ae4c15c9ab9f53cf9e ;;
                  temporal) expected_reviewed_policy_hash=affa4a91e9481be1a52ff5a714da49e28b9a414961519985479a39b70b5feebf ;;
                  esac
                  actual_reviewed_policy_hash=$(
                    kubectl -n "$namespace" get networkpolicies.networking.k8s.io -o json |
                      jq -cS '[.items[] | {name: .metadata.name, spec: .spec}] | sort_by(.name)' |
                      sha256sum | cut -d ' ' -f1
                  )
                  if [[ "$actual_reviewed_policy_hash" != "$expected_reviewed_policy_hash" ]]; then
                    echo "Reviewed NetworkPolicies differ in $namespace." >&2
                    exit 1
                  fi
                  ;;
                *)
                  kubectl -n "$namespace" get networkpolicy kube-router-rollout-allow-all -o json |
                    jq -e '
                      .spec.podSelector == {} and
                      (.spec.policyTypes | sort) == ["Egress", "Ingress"] and
                      .spec.ingress == [{}] and
                      .spec.egress == [{}]
                    ' >/dev/null
                  ;;
                esac
              done <<< "$expected_namespaces"

              kubectl -n bayn get pods -l 'network-policy.proompteng.ai/retired-rollout-policy=bayn' -o json |
                jq -e '.items | length == 0' >/dev/null

              echo 'All existing NetworkPolicy namespaces have an approved rollout policy state.'
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
