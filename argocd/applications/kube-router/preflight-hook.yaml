apiVersion: batch/v1
kind: Job
metadata:
  name: kube-router-policy-preflight
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-2"
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-router
        app.kubernetes.io/component: policy-preflight
    spec:
      serviceAccountName: kube-router-policy-preflight
      automountServiceAccountToken: true
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify-policy-safety
          image: docker.io/bitnami/kubectl@sha256:a67b11e95e953f550f020a41970185ccc5f83d78b86b8c575d02c904aa0f9cd7
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
          command:
            - /bin/bash
            - -ec
          args:
            - |
              set -o pipefail
              expected_namespaces=$(
                {
                  printf '%s\n' agents argocd bayn bilig hermes kafka media pgadmin synthesis torghut
                  printf '%s\n' buzz codex-devbox froussard keycloak observability ofz opencode paperless pelican proompteng restate rook-ceph stash temporal
                  if kubectl -n kube-system get namespace tengri >/dev/null 2>&1 &&
                    kubectl -n tengri get networkpolicies.networking.k8s.io -o json |
                      jq -e '.items | length > 0' >/dev/null; then
                    printf '%s\n' tengri
                  fi
                  if kubectl -n kube-system get namespace relay >/dev/null 2>&1 &&
                    kubectl -n relay get networkpolicies.networking.k8s.io -o json |
                      jq -e '.items | length > 0' >/dev/null; then
                    printf '%s\n' relay
                  fi
                  if kubectl -n kube-system get namespace glitchtip >/dev/null 2>&1 &&
                    kubectl -n glitchtip get networkpolicies.networking.k8s.io -o json |
                      jq -e '.items | length > 0' >/dev/null; then
                    printf '%s\n' glitchtip
                  fi
                } | sort -u
              )
              actual_namespaces=$(
                kubectl -n kube-system get networkpolicies.networking.k8s.io --all-namespaces -o json |
                  jq -r '.items[].metadata.namespace' |
                  sort -u
              )

              if [[ "$actual_namespaces" != "$expected_namespaces" ]]; then
                echo 'NetworkPolicy namespace coverage changed; refusing to activate kube-router.' >&2
                diff -u <(printf '%s\n' "$expected_namespaces") <(printf '%s\n' "$actual_namespaces") >&2 || true
                exit 1
              fi

              while IFS= read -r namespace; do
                case "$namespace" in
                bayn)
                  kubectl -n "$namespace" get networkpolicy kube-router-rollout-allow-all -o json |
                    jq -e '
                      .spec.podSelector.matchLabels == {
                        "network-policy.proompteng.ai/retired-rollout-policy": "bayn"
                      } and
                      (.spec.policyTypes | sort) == ["Egress", "Ingress"] and
                      (.spec | has("ingress") | not) and
                      (.spec | has("egress") | not)
                    ' >/dev/null
                  ;;
                hermes)
                  expected_hermes_policy_hash=bfeb4503d73ed6e5cd59550e0f11dc0d38cad66a167c1cb7237f059e093116e3
                  actual_hermes_policy_hash=$(
                    kubectl -n "$namespace" get networkpolicies.networking.k8s.io -o json |
                      jq -cS '[.items[] | {name: .metadata.name, spec: .spec}] | sort_by(.name)' |
                      sha256sum |
                      cut -d ' ' -f1
                  )
                  if [[ "$actual_hermes_policy_hash" != "$expected_hermes_policy_hash" ]]; then
                    echo 'Hermes NetworkPolicies differ from the exact reviewed policy set.' >&2
                    exit 1
                  fi
                  ;;
                tengri)
                  expected_tengri_policy_hash=82a1075a565197cb3fd0af979fdbbe15f2eef6f7b2f8b84abdb75dc11bd3eb0a
                  actual_tengri_policy_hash=$(
                    kubectl -n "$namespace" get networkpolicies.networking.k8s.io -o json |
                      jq -cS '[.items[] | {name: .metadata.name, spec: .spec}] | sort_by(.name)' |
                      sha256sum |
                      cut -d ' ' -f1
                  )
                  if [[ "$actual_tengri_policy_hash" != "$expected_tengri_policy_hash" ]]; then
                    echo 'Tengri NetworkPolicies differ from the exact reviewed policy set.' >&2
                    exit 1
                  fi
                  ;;
                relay)
                  expected_relay_policy_hash=0d173b596ed115715695532ff5d551142bf704c65aa3eb31bb345eb9dfc250c3
                  actual_relay_policy_hash=$(
                    kubectl -n "$namespace" get networkpolicies.networking.k8s.io -o json |
                      jq -cS '[.items[] | {name: .metadata.name, spec: .spec}] | sort_by(.name)' |
                      sha256sum | cut -d ' ' -f1
                  )
                  if [[ "$actual_relay_policy_hash" != "$expected_relay_policy_hash" ]]; then
                    echo 'Relay NetworkPolicies differ from the exact reviewed policy set.' >&2
                    exit 1
                  fi
                  ;;
                glitchtip)
                  expected_glitchtip_policy_hash=77e61e67d4b3e97e61e77467501d2bf46c9e0c516f9be0dfea583d1ea4196dac
                  actual_glitchtip_policy_hash=$(
                    kubectl -n "$namespace" get networkpolicies.networking.k8s.io -o json |
                      jq -cS '[.items[] | {name: .metadata.name, spec: .spec}] | sort_by(.name)' |
                      sha256sum | cut -d ' ' -f1
                  )
                  if [[ "$actual_glitchtip_policy_hash" != "$expected_glitchtip_policy_hash" ]]; then
                    echo 'GlitchTip NetworkPolicies differ from the exact reviewed policy set.' >&2
                    exit 1
                  fi
                  ;;
                buzz|codex-devbox|froussard|keycloak|observability|ofz|opencode|paperless|pelican|proompteng|restate|rook-ceph|stash|temporal)
                  case "$namespace" in
                  buzz) expected_reviewed_policy_hash=da668d68ed6a1b164bd46d6e0a6851fe9fe18d4f729dfd644b16d71f4810e11a ;;
                  codex-devbox) expected_reviewed_policy_hash=cbed530fd151e4753b5d2f72a7aa29b167d2c61f40c605f9a8b8623995d842ef ;;
                  froussard) expected_reviewed_policy_hash=5033e69d6c8b8a2585d44eec1df70c4f6a90917761ccd078234beb628e95c1d0 ;;
                  keycloak) expected_reviewed_policy_hash=f684292a357941c6a41c29f41a8d8af5471dd7f47b08f729193c28a1d66a71d5 ;;
                  observability) expected_reviewed_policy_hash=bc98480fcfafda9fc71b8707689995fabf8aeecd02621d53cd4cb33c3dd4d38d ;;
                  ofz) expected_reviewed_policy_hash=4b4dd587be50f798059261d810285d0ab21701daf41d5fa611d9e688c7496fad ;;
                  opencode) expected_reviewed_policy_hash=cc8671be21d2e10a2758a97729b76e5da7b8c9793a8500dfc2c7ae7870c06cbc ;;
                  paperless) expected_reviewed_policy_hash=174d06c341da8f594d157ec41b3b2a3c66e98443f15243c29a73f3c54effca99 ;;
                  pelican) expected_reviewed_policy_hash=d67eb7e0bb254c9ce30e2338ca2ab4bbf6b2d802d0f56a54543b270c7b0bb959 ;;
                  proompteng) expected_reviewed_policy_hash=b869ee0dcb75f3071ce3bedeed428e281dd9cc1d49a469a62041ce395bf74e73 ;;
                  restate) expected_reviewed_policy_hash=e835a9694f394494a44600541f7f28aec57fec9e3c5e3c6fe49c1e0838addeea ;;
                  rook-ceph) expected_reviewed_policy_hash=0827941f4c30c003e17a7294e596fb80e9a5dc8502bf2e30fc33ca37301c3149 ;;
                  stash) expected_reviewed_policy_hash=8564654c8298dd42db2da5af776b925a6a146bdc05a303e87d26cd1caa89de54 ;;
                  temporal) expected_reviewed_policy_hash=affa4a91e9481be1a52ff5a714da49e28b9a414961519985479a39b70b5feebf ;;
                  esac
                  actual_reviewed_policy_hash=$(
                    kubectl -n "$namespace" get networkpolicies.networking.k8s.io -o json |
                      jq -cS '[.items[] | {name: .metadata.name, spec: .spec}] | sort_by(.name)' |
                      sha256sum | cut -d ' ' -f1
                  )
                  if [[ "$actual_reviewed_policy_hash" != "$expected_reviewed_policy_hash" ]]; then
                    echo "Reviewed NetworkPolicies differ in $namespace." >&2
                    exit 1
                  fi
                  ;;
                *)
                  kubectl -n "$namespace" get networkpolicy kube-router-rollout-allow-all -o json |
                    jq -e --arg namespace "$namespace" '
                      .spec.podSelector == (
                        if $namespace == "agents" then
                          {"matchExpressions":[{"key":"app.kubernetes.io/name","operator":"NotIn","values":["auto-ontology-sync"]}]}
                        else {} end
                      ) and
                      (.spec.policyTypes | sort) == ["Egress", "Ingress"] and
                      .spec.ingress == [{}] and
                      .spec.egress == [{}]
                    ' >/dev/null
                  ;;
                esac
              done <<< "$expected_namespaces"

              kubectl -n bayn get pods -l 'network-policy.proompteng.ai/retired-rollout-policy=bayn' -o json |
                jq -e '.items | length == 0' >/dev/null

              echo 'All existing NetworkPolicy namespaces have an approved rollout policy state.'
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
