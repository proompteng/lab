---
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: kargo-discord-smoke
spec:
  args:
  - name: namespace
  - name: resource
  - name: image
  metrics:
  - name: discord-login
    count: 1
    failureLimit: 0
    provider:
      job:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 300
          ttlSecondsAfterFinished: 300
          template:
            metadata:
              labels:
                app.kubernetes.io/name: kargo-smoke
            spec:
              automountServiceAccountToken: true
              restartPolicy: Never
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                seccompProfile:
                  type: RuntimeDefault
              containers:
              - name: smoke
                image: bitnami/kubectl@sha256:a67b11e95e953f550f020a41970185ccc5f83d78b86b8c575d02c904aa0f9cd7
                command:
                - /bin/sh
                - -ec
                - "kubectl -n \"{{args.namespace}}\" rollout status \"{{args.resource}}\" --timeout=60s\nkubectl -n \"{{args.namespace}}\"\
                  \ get \"{{args.resource}}\" -o json | jq -e --arg image \"{{args.image}}\" '(.status.observedGeneration\
                  \ >= .metadata.generation) and (.status.readyReplicas > 0) and any(.spec.template.spec.containers[]; .image\
                  \ == $image)' >/dev/null\npods=$(kubectl -n \"{{args.namespace}}\" get pods -l app.kubernetes.io/name=oirat\
                  \ -o json | jq -r --arg image \"{{args.image}}\" '.items[] | select(.metadata.deletionTimestamp == null)\
                  \ | select(any(.spec.containers[]; .image == $image)) | .metadata.name')\ntest -n \"$pods\"\nfor pod in\
                  \ $pods; do\n  kubectl -n \"{{args.namespace}}\" logs \"$pod\" -c oirat --tail=10000 | grep -Fq 'Discord\
                  \ mention bot ready as'\ndone\n"
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                    - ALL
                resources:
                  requests:
                    cpu: 25m
                    memory: 32Mi
                  limits:
                    cpu: 250m
                    memory: 128Mi
                volumeMounts:
                - name: tmp
                  mountPath: /tmp
              volumes:
              - name: tmp
                emptyDir: {}
              serviceAccountName: kargo-smoke
              nodeSelector:
                kubernetes.io/arch: amd64
