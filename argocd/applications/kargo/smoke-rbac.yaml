---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-smoke
  namespace: oirat-release
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kargo-release-smoke
  namespace: oirat
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - oirat
  verbs:
  - get
  - watch
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kargo-release-smoke
  namespace: oirat
subjects:
- kind: ServiceAccount
  name: kargo-smoke
  namespace: oirat-release
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kargo-release-smoke
