apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: app
  namespace: lab-delivery
  labels:
    delivery.proompteng.ai/managed-by: kargo
spec:
  interval: 1m0s
  freightCreationPolicy: Automatic
  freightCreationCriteria:
    expression: >-
      imageFrom('registry.ide-newton.ts.net/lab/app').Tag == 'kargo-sha-' +
      commitFrom('git@github.com:proompteng/lab.git').ID
  subscriptions:
    - git:
        repoURL: git@github.com:proompteng/lab.git
        branch: main
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20
        strictSemvers: true
        includePaths:
          - apps/app
          - packages/design
          - nix/images/app.nix
          - nix/images/bun-workspace-service.nix
          - nix/packages.nix
          - flake.nix
          - flake.lock
          - bun.lock
          - argocd/applications/app
          - package.json
          - bunfig.toml
          - .npmrc
          - patches
          - nix/images/relativize-bun-cache.sh
          - nix/images/prune-bun-dependency-metadata.sh
          - tsconfig.base.json
    - image:
        repoURL: registry.ide-newton.ts.net/lab/app
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 20
        strictSemvers: true
        allowTagsRegexes:
          - '^kargo-sha-[0-9a-f]{40}$'
        platform: linux/amd64
        cacheByTag: true
---
