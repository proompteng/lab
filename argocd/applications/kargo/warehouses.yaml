apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: agents
  namespace: lab-delivery
  labels:
    delivery.proompteng.ai/managed-by: kargo
spec:
  interval: 1m0s
  freightCreationPolicy: Automatic
  freightCreationCriteria:
    expression: >-
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Annotations['ai.proompteng.github-actions-run-id'] != nil &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Annotations['ai.proompteng.github-actions-run-id'] != '' &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Annotations['ai.proompteng.github-actions-build-conclusion'] == 'success' &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-controller').Annotations['ai.proompteng.github-actions-run-id'] ==
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Annotations['ai.proompteng.github-actions-run-id'] &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-controller').Annotations['ai.proompteng.github-actions-build-conclusion'] == 'success' &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-shell').Annotations['ai.proompteng.github-actions-run-id'] ==
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Annotations['ai.proompteng.github-actions-run-id'] &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-shell').Annotations['ai.proompteng.github-actions-build-conclusion'] == 'success' &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-codex-runner').Annotations['ai.proompteng.github-actions-run-id'] ==
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Annotations['ai.proompteng.github-actions-run-id'] &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-codex-runner').Annotations['ai.proompteng.github-actions-build-conclusion'] == 'success' &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Tag == 'kargo-sha-' +
      commitFrom('git@github.com:proompteng/lab.git').ID + '-run-' +
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Annotations['ai.proompteng.github-actions-run-id'] &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-controller').Tag ==
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Tag &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-shell').Tag ==
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Tag &&
      imageFrom('registry.ide-newton.ts.net/lab/agents-codex-runner').Tag ==
      imageFrom('registry.ide-newton.ts.net/lab/agents-control-plane').Tag
  subscriptions:
    - git:
        repoURL: git@github.com:proompteng/lab.git
        branch: main
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20
        strictSemvers: true
        includePaths:
          - packages/agent-contracts
          - packages/codex
          - packages/cx-tools
          - packages/otel
          - packages/scripts/src/agents/update-values.ts
          - packages/scripts/src/shared/oci.ts
          - packages/temporal-bun-sdk
          - services/agents
          - charts/agents/crds
          - nix/images/agents.nix
          - nix/images/openai-codex-cli.nix
          - .github/workflows/nix-oci-build-common.yml
          - nix/oci-push.sh
          - argocd/applications/agents
          - charts/agents
        excludePaths:
          - services/agents/agentctl
          - 'glob:services/agents/Dockerfile*'
          - 'glob:**/__tests__/**'
          - 'glob:**/__snapshots__/**'
          - 'glob:**/tests/**'
          - 'glob:**/*.test.ts'
          - 'glob:**/*.test.tsx'
          - 'glob:**/*.spec.ts'
          - 'glob:**/*.spec.tsx'
          - 'glob:**/*.md'
          - 'glob:**/*.mdx'
    - image:
        repoURL: registry.ide-newton.ts.net/lab/agents-controller
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 20
        strictSemvers: true
        allowTagsRegexes:
          - '^kargo-sha-[0-9a-f]{40}-run-[1-9][0-9]*$'
        platform: linux/amd64
        cacheByTag: true
    - image:
        repoURL: registry.ide-newton.ts.net/lab/agents-control-plane
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 20
        strictSemvers: true
        allowTagsRegexes:
          - '^kargo-sha-[0-9a-f]{40}-run-[1-9][0-9]*$'
        platform: linux/amd64
        cacheByTag: true
    - image:
        repoURL: registry.ide-newton.ts.net/lab/agents-shell
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 20
        strictSemvers: true
        allowTagsRegexes:
          - '^kargo-sha-[0-9a-f]{40}-run-[1-9][0-9]*$'
        platform: linux/amd64
        cacheByTag: true
    - image:
        repoURL: registry.ide-newton.ts.net/lab/agents-codex-runner
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 20
        strictSemvers: true
        allowTagsRegexes:
          - '^kargo-sha-[0-9a-f]{40}-run-[1-9][0-9]*$'
        platform: linux/amd64
        cacheByTag: true
