apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: proompteng
  namespace: lab-delivery
  labels:
    delivery.proompteng.ai/managed-by: kargo
spec:
  interval: 1m0s
  freightCreationPolicy: Automatic
  freightCreationCriteria:
    expression: >-
      imageFrom('registry.ide-newton.ts.net/lab/proompteng').Tag == 'kargo-sha-' +
      commitFrom('git@github.com:proompteng/lab.git').ID
  subscriptions:
    - git:
        repoURL: git@github.com:proompteng/lab.git
        branch: main
        commitSelectionStrategy: NewestFromBranch
        discoveryLimit: 20
        strictSemvers: true
        includePaths:
          - apps/landing
          - packages/backend
          - packages/design
          - services/tengri/proto
          - nix/images/proompteng.nix
          - nix/images/bun-workspace-service.nix
          - nix/packages.nix
          - nix/cache-push.sh
          - nix/ci-nix-oci-summary.sh
          - nix/ci-run-timed.sh
          - nix/oci-inspect-archive.sh
          - .github/workflows/nix-oci-build-common.yml
          - nix/oci-push.sh
          - flake.nix
          - flake.lock
          - bun.lock
          - argocd/applications/proompteng
    - image:
        repoURL: registry.ide-newton.ts.net/lab/proompteng
        imageSelectionStrategy: NewestBuild
        discoveryLimit: 20
        strictSemvers: true
        allowTagsRegexes:
          - '^kargo-sha-[0-9a-f]{40}$'
        platform: linux/amd64
        cacheByTag: true
---
