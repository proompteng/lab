apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: agents
  namespace: lab-delivery
  labels:
    delivery.proompteng.ai/managed-by: kargo
spec:
  vars:
    - name: gitRepo
      value: git@github.com:proompteng/lab.git
    - name: targetBranch
      value: kargo/agents
    - name: srcPath
      value: ./src
    - name: outPath
      value: ./out
    - name: imageRepo
      value: registry.ide-newton.ts.net/lab/agents-controller
    - name: agentsControllerImage
      value: registry.ide-newton.ts.net/lab/agents-controller
    - name: agentsControlPlaneImage
      value: registry.ide-newton.ts.net/lab/agents-control-plane
    - name: agentsShellImage
      value: registry.ide-newton.ts.net/lab/agents-shell
    - name: agentsCodexRunnerImage
      value: registry.ide-newton.ts.net/lab/agents-codex-runner
  requestedFreight:
    - origin:
        kind: Warehouse
        name: agents
      sources:
        direct: true
        autoPromotionOptions:
          selectionPolicy: NewestFreight
  promotionTemplate:
    spec:
      steps:
        - uses: fail
          as: validate-image-tags
          if: '${{ imageFrom(vars.agentsControllerImage).Tag != imageFrom(vars.agentsControlPlaneImage).Tag || imageFrom(vars.agentsControllerImage).Tag != imageFrom(vars.agentsShellImage).Tag || imageFrom(vars.agentsControllerImage).Tag != imageFrom(vars.agentsCodexRunnerImage).Tag }}'
          config:
            message: agents images must be built from the same commit
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            author:
              name: Kargo
              email: kargo@proompteng.ai
            checkout:
              - commit: ${{ commitFrom(vars.gitRepo).ID }}
                path: ${{ vars.srcPath }}
              - branch: ${{ vars.targetBranch }}
                create: true
                path: ${{ vars.outPath }}
        - uses: git-clear
          config:
            path: ${{ vars.outPath }}
        - uses: copy
          config:
            inPath: ${{ vars.srcPath }}
            outPath: ${{ vars.outPath }}
        - uses: yaml-update
          config:
            path: ./out/argocd/applications/agents/values.yaml
            updates:
              - key: image.repository
                value: '${{ vars.agentsControllerImage }}'
              - key: image.tag
                value: '${{ imageFrom(vars.agentsControllerImage).Tag }}'
              - key: image.digest
                value: '${{ imageFrom(vars.agentsControllerImage).Digest }}'
              - key: controllers.image.repository
                value: '${{ vars.agentsControllerImage }}'
              - key: controllers.image.tag
                value: '${{ imageFrom(vars.agentsControllerImage).Tag }}'
              - key: controllers.image.digest
                value: '${{ imageFrom(vars.agentsControllerImage).Digest }}'
              - key: controlPlane.image.repository
                value: '${{ vars.agentsControlPlaneImage }}'
              - key: controlPlane.image.tag
                value: '${{ imageFrom(vars.agentsControlPlaneImage).Tag }}'
              - key: controlPlane.image.digest
                value: '${{ imageFrom(vars.agentsControlPlaneImage).Digest }}'
              - key: controlPlane.env.vars.AGENTS_SOURCE_HEAD_SHA
                value: '${{ commitFrom(vars.gitRepo).ID }}'
              - key: controlPlane.env.vars.AGENTS_GITOPS_REVISION
                value: '${{ commitFrom(vars.gitRepo).ID }}'
              - key: controlPlane.env.vars.AGENTS_SOURCE_CI_RUN_ID
                value: "${{ quote(imageFrom(vars.agentsControlPlaneImage).Annotations['ai.proompteng.github-actions-run-id']) }}"
              - key: controlPlane.env.vars.AGENTS_SOURCE_CI_CONCLUSION
                value: "${{ quote(imageFrom(vars.agentsControlPlaneImage).Annotations['ai.proompteng.github-actions-build-conclusion']) }}"
              - key: controlPlane.env.vars.AGENTS_MANIFEST_IMAGE_DIGEST
                value: '${{ imageFrom(vars.agentsControlPlaneImage).Digest }}'
              - key: controlPlane.env.vars.AGENTS_SERVING_BUILD_COMMIT
                value: '${{ commitFrom(vars.gitRepo).ID }}'
              - key: controlPlane.env.vars.AGENTS_SERVING_IMAGE_DIGEST
                value: '${{ imageFrom(vars.agentsControlPlaneImage).Digest }}'
              - key: agentsShell.image.repository
                value: '${{ vars.agentsShellImage }}'
              - key: agentsShell.image.tag
                value: '${{ imageFrom(vars.agentsShellImage).Tag }}'
              - key: agentsShell.image.digest
                value: '${{ imageFrom(vars.agentsShellImage).Digest }}'
              - key: runner.image.repository
                value: '${{ vars.agentsCodexRunnerImage }}'
              - key: runner.image.tag
                value: '${{ imageFrom(vars.agentsCodexRunnerImage).Tag }}'
              - key: runner.image.digest
                value: '${{ imageFrom(vars.agentsCodexRunnerImage).Digest }}'
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.outPath }}
            message: |
              kargo(agents): promote ${{ ctx.targetFreight.name }}
        - uses: git-push
          as: push
          config:
            path: ${{ vars.outPath }}
            targetBranch: ${{ vars.targetBranch }}
        - uses: argocd-update
          as: deploy
          retry:
            timeout: 20m
            errorThreshold: 3
          config:
            apps:
              - name: agents
                namespace: argocd
                sources:
                  - repoURL: https://github.com/proompteng/lab.git
                    desiredRevision: ${{ outputs.commit.commit }}
---
