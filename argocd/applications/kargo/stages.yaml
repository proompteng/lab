---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: proompteng
  namespace: lab-delivery
  labels:
    delivery.proompteng.ai/managed-by: kargo
spec:
  vars:
    - name: gitRepo
      value: git@github.com:proompteng/lab.git
    - name: targetBranch
      value: kargo/proompteng
    - name: srcPath
      value: ./src
    - name: outPath
      value: ./out
    - name: imageRepo
      value: registry.ide-newton.ts.net/lab/proompteng
  requestedFreight:
    - origin:
        kind: Warehouse
        name: proompteng
      sources:
        direct: true
        autoPromotionOptions:
          selectionPolicy: NewestFreight
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            author:
              name: Kargo
              email: kargo@proompteng.ai
            checkout:
              - commit: ${{ commitFrom(vars.gitRepo).ID }}
                path: ${{ vars.srcPath }}
              - branch: ${{ vars.targetBranch }}
                create: true
                path: ${{ vars.outPath }}
        - uses: git-clear
          config:
            path: ${{ vars.outPath }}
        - uses: copy
          config:
            inPath: ${{ vars.srcPath }}
            outPath: ${{ vars.outPath }}
        - uses: kustomize-set-image
          config:
            path: ./out/argocd/applications/proompteng
            images:
              - image: ${{ vars.imageRepo }}
                digest: ${{ imageFrom(vars.imageRepo).Digest }}
        - uses: git-commit
          as: commit
          config:
            path: ${{ vars.outPath }}
            message: |
              kargo(proompteng): promote ${{ ctx.targetFreight.name }}
        - uses: git-push
          as: push
          config:
            path: ${{ vars.outPath }}
            targetBranch: ${{ vars.targetBranch }}
        - uses: argocd-update
          as: deploy
          retry:
            timeout: 20m
            errorThreshold: 3
          config:
            apps:
              - name: proompteng
                namespace: argocd
                sources:
                  - repoURL: https://github.com/proompteng/lab.git
                    desiredRevision: ${{ outputs.commit.commit }}
