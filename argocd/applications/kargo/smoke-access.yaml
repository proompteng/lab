---
apiVersion: v1
kind: Service
metadata:
  name: kargo-smoke-bumba
  namespace: jangar
spec:
  selector:
    app.kubernetes.io/name: bumba
  ports:
  - name: health
    port: 3001
    targetPort: 3001
---
apiVersion: v1
kind: Service
metadata:
