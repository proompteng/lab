---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kargo-smoke-proompteng
  namespace: proompteng
spec:
  podSelector:
    matchLabels:
      app: proompteng
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ofz-release
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kargo-smoke
    ports:
    - protocol: TCP
      port: http
