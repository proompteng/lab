apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - github-secrets.yaml
  - discord-secrets.yaml
  - webhook-admission-topic.yaml
  - github-webhook-topic.yaml
  - linear-webhook-topic.yaml
  - coder-workspace-access.yaml
  - knative-service.yaml
  - knative-host-middleware.yaml
  - ingressroute.yaml
patches:
  - patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: froussard-github-token
        namespace: froussard
        annotations:
          argocd.argoproj.io/sync-wave: "-1"
          argocd.proompteng.ai/wait-for-sealed-secret: "true"
