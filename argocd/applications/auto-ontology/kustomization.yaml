apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auto-ontology
resources:
  - sealedsecret.yaml
  - mcp.yaml
  - oauth-discovery.yaml
  - tailscale-ingress.yaml
configMapGenerator:
  - name: auto-ontology-oauth-discovery
    files:
      - haproxy.cfg=oauth-discovery.cfg
helmCharts:
  - name: auto-ontology
    releaseName: auto-ontology
    namespace: auto-ontology
    version: 1.3.0
    repo: https://helm.ngc.nvidia.com/nvidia
    valuesFile: values.yaml
patches:
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
      spec:
        template:
          spec:
            containers:
              - name: postgres
                args: ["-c", "synchronous_commit=off"]
                env:
                  - name: PGDATA
                    $patch: delete
                volumeMounts:
                  - mountPath: /var/lib/postgresql/data
                    $patch: delete
                  - name: data
                    mountPath: /var/lib/postgresql
