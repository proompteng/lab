apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auto-ontology
resources:
  - sealedsecret.yaml
  - mcp.yaml
  - oauth-discovery.yaml
  - tailscale-ingress.yaml
configMapGenerator:
  - name: auto-ontology-sql-routing
    files:
      - sql-routing.patch
  - name: auto-ontology-oauth-discovery
    files:
      - haproxy.cfg=oauth-discovery.cfg
helmCharts:
  - name: auto-ontology
    releaseName: auto-ontology
    namespace: auto-ontology
    version: 1.3.0
    repo: https://helm.ngc.nvidia.com/nvidia
    valuesFile: values.yaml
patches:
  - path: sql-routing-deployment.patch.yaml
  # Helm emits this Deployment without a namespace. Match the generated ConfigMap for hash rewriting.
  - target:
      kind: Deployment
      name: auto-ontology
    patch: |-
      - op: add
        path: /metadata/namespace
        value: auto-ontology
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres
      spec:
        template:
          spec:
            containers:
              - name: postgres
                args: ["-c", "synchronous_commit=off"]
                env:
                  - name: PGDATA
                    $patch: delete
                volumeMounts:
                  - mountPath: /var/lib/postgresql/data
                    $patch: delete
                  - name: data
                    mountPath: /var/lib/postgresql

replacements:
  - source:
      kind: Deployment
      name: auto-ontology
      fieldPath: spec.template.spec.containers.[name=backend].image
    targets:
      - select:
          kind: Deployment
          name: auto-ontology
        fieldPaths:
          - spec.template.spec.initContainers.[name=copy-sql-runtime].image
