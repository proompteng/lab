---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: auto-ontology-secrets
  namespace: auto-ontology
spec:
  encryptedData:
    AUTH_SECRET: 
    AUTO_ONTOLOGY_ADMIN_PASSWORD: 
    POSTGRES_PASSWORD: 
  template:
    data:
      AUTO_ONTOLOGY_ADMIN_EMAIL: admin@auto-ontology.ide-newton.ts.net
      POSTGRES_USER: auto_ontology
      POSTGRES_DATABASE: auto_ontology
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      INGESTION_SERVICE_URL: http://ingestion-service:3002
      DEFAULT_MODELS_API_KEY: local
      DEFAULT_MODELS_ENDPOINT: http://flamingo.flamingo.svc.cluster.local/v1
      DEFAULT_MODELS_MODEL: qwen38-flamingo
      EMBED_ENDPOINT: http://saigak.saigak.svc.cluster.local:11434/v1
      EMBED_MODEL: qwen3-embedding-saigak:8b
      RERANK_ENDPOINT: http://nemotron-rerank.nemotron-rerank.svc.cluster.local:8000/v1/ranking
      RERANK_MODEL: nvidia/Nemotron-3.5-Rerank-8B-BF16
    metadata:
      name: auto-ontology-secrets
      namespace: auto-ontology
    type: Opaque
