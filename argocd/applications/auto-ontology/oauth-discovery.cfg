global
  nbthread 1
  maxconn 128

defaults
  mode http
  timeout connect 2s
  timeout client 5s
  timeout server 5s
  timeout http-request 5s

frontend discovery
  bind :8080
  http-request return status 404 unless { path /.well-known/oauth-authorization-server/api/auth }
  http-request return status 405 hdr Allow "GET, HEAD" unless { method GET HEAD }
  http-request return status 400 if { req.hdr_val(content-length) gt 0 } || { req.hdr(transfer-encoding) -m found }
  # Discovery is public. Do not forward credentials or trust caller-supplied proxy headers.
  http-request del-header . -m reg
  http-request set-header Host auto-ontology.ide-newton.ts.net
  http-request set-header X-Forwarded-Proto https
  http-request set-uri /.well-known/oauth-authorization-server
  default_backend frontend

backend frontend
  server frontend frontend:3000
