apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-research-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-research
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode-research
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode-research
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: require-migrated-state
          image: opencode-main
          command: [bash, -c, 'until test -s /data/state/.migration-complete.json; do sleep 5; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /data
              readOnly: true
      containers:
        - name: research
          image: opencode-main
          command: [node, /app/opencode/research.js]
          env:
            - name: BAYN_PUBLIC_INFORMATION_PROXY
              value: http://bayn-egress-proxy.bayn.svc.cluster.local:3129
          ports:
            - name: proposal
              containerPort: 4096
          startupProbe:
            httpGet:
              path: /readyz
              port: proposal
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: proposal
          livenessProbe:
            httpGet:
              path: /readyz
              port: proposal
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /var/lib/bayn-opencode
              subPath: state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: opencode-research-state
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-research
spec:
  selector:
    app.kubernetes.io/name: opencode-research
  ports:
    - name: proposal
      port: 4096
      targetPort: proposal
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencode-research
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opencode-research
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bayn
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-research
      ports:
        - port: 4096
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bayn
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-egress-proxy
      ports:
        - port: 3129
          protocol: TCP
