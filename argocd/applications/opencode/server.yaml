apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencode
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-development
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
        spiffe.io/spire-managed-identity: "true"
    spec:
      serviceAccountName: opencode
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-workspace
          image: opencode-main
          command: [bash, -c, 'mkdir -p /data/home /data/workspace']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: development
              mountPath: /data
      containers:
        - name: opencode
          image: opencode-main
          ports:
            - name: http
              containerPort: 4096
          env:
            - name: RELAY_CLIENT_SERVICE
              value: opencode
            - name: RELAY_GRPC_TARGET
              value: relay.relay.svc.cluster.local:9443
            - name: SPIFFE_ID
              value: spiffe://proompteng.ai/ns/opencode/sa/opencode
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/spire-agent.sock
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
            limits:
              cpu: '8'
              memory: 16Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: development
              mountPath: /var/lib/opencode
              subPath: home
            - name: development
              mountPath: /workspace
              subPath: workspace
            - name: config
              mountPath: /etc/opencode
              readOnly: true
            - name: workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: development
          persistentVolumeClaim:
            claimName: opencode-development
        - name: config
          configMap:
            name: opencode-config
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
spec:
  selector:
    app.kubernetes.io/name: opencode
  ports:
    - name: http
      port: 4096
      targetPort: http
