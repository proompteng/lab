apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: observability.tempo.traces.v1
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    strimzi.io/cluster: kafka
spec:
  # Tempo 3 assigns one block-builder and one live-store to each partition.
  # Keep this equal to their static replica count until an autoscaling policy
  # is introduced and validated.
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    compression.type: lz4
    min.insync.replicas: 2
    retention.ms: 604800000
