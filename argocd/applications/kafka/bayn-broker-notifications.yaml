apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: bayn.broker-notifications.v1
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 3
  config:
    compression.type: lz4
    retention.ms: 604800000
    cleanup.policy: delete
    min.insync.replicas: 2
