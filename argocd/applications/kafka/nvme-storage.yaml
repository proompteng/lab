apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kafka-nvme
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-nvme-controller-altra
  labels:
    kafka.proompteng.ai/role: controller
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 30Gi
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kafka-nvme
  claimRef:
    namespace: kafka
    name: data-kafka-pool-a-1
  local:
    path: /var/mnt/local-path-provisioner/kafka-nvme/controller
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [talos-192-168-1-85]
---
