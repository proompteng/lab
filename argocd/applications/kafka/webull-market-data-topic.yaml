apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: dorvud.webull.raw.v1
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 3
  config:
    compression.type: lz4
    retention.ms: 604800000
    cleanup.policy: delete
    max.message.bytes: 8388608
