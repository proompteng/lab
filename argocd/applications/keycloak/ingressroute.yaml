apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`auth.proompteng.ai`)
      services:
        - name: keycloak
          port: 8080
  tls:
    secretName: auth-proompteng-ai-tls
