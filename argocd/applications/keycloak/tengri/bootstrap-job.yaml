apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-tengri-realm-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: '2'
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-tengri-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: python:3.12-alpine
          command: [python3, /realm/bootstrap.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: KEYCLOAK_ADMIN_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-tengri-broker
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-tengri-broker
                  key: GITHUB_CLIENT_SECRET
            - name: TENGRI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-tengri-bff
                  key: client-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: realm
              mountPath: /realm
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-tengri-realm
