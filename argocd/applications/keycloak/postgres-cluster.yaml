apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5a6a677d3fa2bc3fdc61874e0de8324b5a987eb676ddca133e71365a8467d6c1
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: rook-ceph-block
    size: 20Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      encoding: UTF8
      dataChecksums: true
  backup:
    volumeSnapshot:
      className: rook-ceph-block
      snapshotOwnerReference: backup
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: pgadmin
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: pgadmin
  monitoring:
    enablePodMonitor: true
  enablePDB: true
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    tolerations:
      - key: workload.proompteng.ai/compute-local
        operator: Equal
        value: "true"
        effect: NoSchedule
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
    parameters:
      archive_timeout: 60s
      max_connections: "100"
      max_slot_wal_keep_size: 4096MB
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: keycloak-db
        serverName: keycloak-db
