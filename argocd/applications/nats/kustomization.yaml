apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nats
resources:
  - nats-auth-secrets.yaml
  - alloy-configmap.yaml
  - alloy-deployment.yaml
  - alloy-rbac.yaml
  - nats-exporter-deployment.yaml
  - nats-exporter-service.yaml
  - stream-agent-comms.yaml
helmCharts:
  - name: nats
    repo: https://nats-io.github.io/k8s/helm/charts
    version: 2.15.3
    releaseName: nats
    namespace: nats
    valuesFile: ./values.yaml

patches:
  - target:
      kind: StatefulSet
      name: nats
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: nats
      spec:
        template:
          spec:
            nodeSelector:
              network.proompteng.ai/100g: "true"

images:
  - name: nats
    newName: mirror.gcr.io/library/nats
    newTag: 2.15.3-alpine
  - name: natsio/nats-server-config-reloader
    newName: mirror.gcr.io/natsio/nats-server-config-reloader
    newTag: 0.24.0
    digest: sha256:d758a82a9c20337e46c2f7356a413faa52cf4d6b02497c3ad81f72f1ba106464
  - name: natsio/nats-box
    newName: mirror.gcr.io/natsio/nats-box
    newTag: 0.20.2
    digest: sha256:5162fca0f56ebe6f78e612e1ded143ce978e088393476033020e6251358dba6f
  - name: docker.io/natsio/prometheus-nats-exporter
    newName: mirror.gcr.io/natsio/prometheus-nats-exporter
    newTag: 0.20.3
    digest: sha256:4b8ddc1c86fec360b5cd3d5e1fbc6fb52bdafd5805bba3901cc52926538af255
  - name: grafana/alloy
    newName: mirror.gcr.io/grafana/alloy
    newTag: v1.22.0
    digest: sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
