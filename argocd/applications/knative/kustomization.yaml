apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: knative
resources:
  - https://github.com/knative/operator/releases/download/knative-v1.23.0/operator.yaml
patches:
  # Transitional protection: the next stage removes the upstream Namespace so
  # ApplicationSet-managed namespace metadata becomes authoritative.
  - target:
      kind: Namespace
      name: knative-operator
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: knative-operator
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: knativeeventings.operator.knative.dev
    patch: |-
      - op: add
        path: /spec/conversion
        value:
          strategy: Webhook
          webhook:
            clientConfig:
              service:
                name: operator-webhook
                namespace: knative
                path: /resource-conversion
                port: 443
            conversionReviewVersions:
              - v1beta1
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: knativeservings.operator.knative.dev
    patch: |-
      - op: add
        path: /spec/conversion
        value:
          strategy: Webhook
          webhook:
            clientConfig:
              service:
                name: operator-webhook
                namespace: knative
                path: /resource-conversion
                port: 443
            conversionReviewVersions:
              - v1beta1
