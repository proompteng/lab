apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-server-17-0-2-rehearsal
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '-25'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-server-17-0-2-rehearsal
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-server-17-0-2-rehearsal-shared-deadline
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-server-17-0-2-rehearsal
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        # The snapshots already preserve PostgreSQL's and Forgejo's own UIDs.
        supplementalGroups: [26]
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: ghcr.io/cloudnative-pg/postgresql:18.6-system-bullseye@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
        command:
        - /bin/bash
        - /scripts/upgrade-db-rehearsal.sh
        env:
        - name: EXPECTED_SYSTEM_IDENTIFIER
          value: '7683726894608511096'
        - name: EXPECTED_SOURCE_MIGRATIONS_SHA256
          value: ef66dfdc40811825db4f13ec5f61b507381bb64a26ce46ac78f6b7a7958a41e5
        - name: EXPECTED_TARGET_MIGRATIONS_SHA256
          value: caa345f75fd453b2e9245160048c18b56414e6a3ce32339759729128dea3856e
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: &id001
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - &id002
          name: scripts
          mountPath: /scripts
          readOnly: true
        - &id003
          name: proof
          mountPath: /proof
        - name: db-clone
          mountPath: /var/lib/postgresql/data
        - name: postgres-tmp
          mountPath: /tmp
        - name: shm
          mountPath: /dev/shm
      - name: forgejo
        image: registry.ide-newton.ts.net/lab/forgejo@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04
        command:
        - /bin/bash
        - /scripts/upgrade-app-rehearsal.sh
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: *id001
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - *id002
        - *id003
        - name: data-clone
          mountPath: /data
        - name: forgejo-tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: forgejo-server-17-0-2-rehearsal
      - name: db-clone
        persistentVolumeClaim:
          claimName: forgejo-server-17-0-2-restore-db
      - name: data-clone
        persistentVolumeClaim:
          claimName: forgejo-server-17-0-2-restore-data
      - name: proof
        emptyDir: {}
      - name: postgres-tmp
        emptyDir: {}
      - name: forgejo-tmp
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
