kind: RoleBinding
metadata:
  name: forgejo-server-17-0-2-quiesced
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '-25'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-server-17-0-2-quiesced
subjects:
- kind: ServiceAccount
  name: forgejo-server-17-0-2-quiesced
  namespace: forgejo
---
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-server-17-0-2-quiesced
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '-15'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-server-17-0-2-quiesced
    spec:
      serviceAccountName: forgejo-server-17-0-2-quiesced
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: verify
        image: docker.io/library/python:3.14.7-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
        command:
        - python3
        - -c
        - "import json, os, ssl, time, urllib.request\nfrom pathlib import Path\n\
          token = Path('/var/run/secrets/kubernetes.io/serviceaccount/token').read_text()\n\
          tls = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')\n\
          base = 'https://' + os.environ['KUBERNETES_SERVICE_HOST'] + ':' + os.environ['KUBERNETES_SERVICE_PORT']\n\
          def get(path):\n    request = urllib.request.Request(base + path, headers={'Authorization':\
          \ 'Bearer ' + token})\n    with urllib.request.urlopen(request, context=tls,\
          \ timeout=15) as response:\n        return json.load(response)\ndeployment\
          \ = get('/apis/apps/v1/namespaces/forgejo/deployments/forgejo')\nassert\
          \ deployment['metadata']['uid'] == '559e3fef-818a-409e-8251-0a919a8756b3'\n\
          assert deployment['spec']['replicas'] == 0\nfor claim, uid in [('gitea-shared-storage',\
          \ '69b9fb12-8b79-4c3a-a0aa-2073b6d3905b'), ('forgejo-db-1', '145fb4c9-7528-4d84-a381-532cade46a68')]:\n\
          \    pvc = get('/api/v1/namespaces/forgejo/persistentvolumeclaims/' + claim)\n\
          \    assert pvc['metadata']['uid'] == uid and pvc['status']['phase'] ==\
          \ 'Bound'\nfor attempt in range(90):\n    pods = get('/api/v1/namespaces/forgejo/pods?labelSelector=app.kubernetes.io%2Fname%3Dforgejo')['items']\n\
          \    if not pods:\n        break\n    time.sleep(2)\nassert not pods, 'Forgejo\
          \ Pods remain; snapshots must not start'\nprint('PASS: original Deployment\
          \ stopped, every Forgejo Pod gone, both source PVC identities preserved.')\n"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-server-17-0-2-rehearsal
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '-25'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-server-17-0-2-rehearsal
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-server-17-0-2-rehearsal
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-server-17-0-2-rehearsal
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: ghcr.io/cloudnative-pg/postgresql:18.6-system-bullseye@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
        command:
        - /bin/bash
        - /scripts/upgrade-db-rehearsal.sh
        env:
        - name: EXPECTED_SYSTEM_IDENTIFIER
          value: '7683726894608511096'
        - name: EXPECTED_SOURCE_MIGRATIONS_SHA256
          value: ef66dfdc40811825db4f13ec5f61b507381bb64a26ce46ac78f6b7a7958a41e5
        - name: EXPECTED_TARGET_MIGRATIONS_SHA256
          value: caa345f75fd453b2e9245160048c18b56414e6a3ce32339759729128dea3856e
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: &id001
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - &id002
          name: scripts
          mountPath: /scripts
          readOnly: true
        - &id003
          name: proof
          mountPath: /proof
        - name: db-clone
          mountPath: /var/lib/postgresql/data
        - name: postgres-tmp
          mountPath: /tmp
        - name: shm
          mountPath: /dev/shm
      - name: forgejo
        image: code.forgejo.org/forgejo/forgejo:17.0.2-rootless@sha256:39362ab93a94c0c9b8b330d2a877ddbb3f02fa8c0cba1b8d686d437b39f36a04
        command:
        - /bin/bash
        - /scripts/upgrade-app-rehearsal.sh
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: *id001
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - *id002
        - *id003
        - name: data-clone
          mountPath: /data
        - name: forgejo-tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: forgejo-server-17-0-2-rehearsal
      - name: db-clone
        persistentVolumeClaim:
          claimName: forgejo-server-17-0-2-restore-db
      - name: data-clone
        persistentVolumeClaim:
          claimName: forgejo-server-17-0-2-restore-data
      - name: proof
        emptyDir: {}
      - name: postgres-tmp
        emptyDir: {}
      - name: forgejo-tmp
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
