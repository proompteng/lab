metadata:
  name: forgejo-server-17-0-2-quiesced
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '-25'
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - forgejo
  verbs:
