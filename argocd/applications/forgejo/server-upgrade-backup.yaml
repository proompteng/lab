apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-server-16-0-3-rehearsal-v2
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-server-16-0-3-rehearsal
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: ghcr.io/cloudnative-pg/postgresql:17.11@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
        command:
        - /bin/bash
        - /scripts/upgrade-db-rehearsal.sh
        env:
        - name: EXPECTED_SYSTEM_IDENTIFIER
          value: '7615849836285206557'
        - name: EXPECTED_IDENTITY_COUNTS
          value: 1|2|6|1|0|15
        - name: EXPECTED_SOURCE_MIGRATIONS_SHA256
          value: a2771d90f35a2caaaf06ce7953b97c0375a7c58f10dc76764d9da36e935774d5
        - name: EXPECTED_TARGET_MIGRATIONS_SHA256
          value: ef66dfdc40811825db4f13ec5f61b507381bb64a26ce46ac78f6b7a7958a41e5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: &id001
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - &id002
          name: scripts
          mountPath: /scripts
          readOnly: true
        - &id003
          name: proof
          mountPath: /proof
        - name: db-clone
          mountPath: /var/lib/postgresql/data
        - name: postgres-tmp
          mountPath: /tmp
        - name: shm
          mountPath: /dev/shm
      - name: forgejo
        image: code.forgejo.org/forgejo/forgejo:16.0.3-rootless@sha256:214f4ae63ee78be1e445e58573c88dc7215e72091210852e0df94eaac1a25685
        command:
        - /bin/bash
        - /scripts/upgrade-app-rehearsal.sh
        env:
        - name: EXPECTED_REFS_SHA256
          value: 228266f817f2c813bef5c0d20e055d4d76f052ae2c508bac81e3c412c1f7d192
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: *id001
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - *id002
        - *id003
        - name: data-clone
          mountPath: /data
        - name: forgejo-tmp
          mountPath: /tmp
      volumes:
      - name: scripts
        configMap:
          name: forgejo-server-16-0-3-rehearsal
      - name: db-clone
        persistentVolumeClaim:
          claimName: forgejo-server-16-0-3-restore-db-v2
      - name: data-clone
        persistentVolumeClaim:
          claimName: forgejo-server-16-0-3-restore-data-v2
      - name: proof
        emptyDir: {}
      - name: postgres-tmp
        emptyDir: {}
      - name: forgejo-tmp
        emptyDir: {}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
