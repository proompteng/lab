apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-server-16-0-3-quiesced
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '-15'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-server-16-0-3-quiesced
    spec:
      serviceAccountName: forgejo-server-16-0-3-quiesced
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: verify
        image: docker.io/library/python:3.14.7-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
        command:
        - python3
        - -c
        - "import json, os, ssl, time, urllib.request\nfrom pathlib import Path\n\
          token = Path('/var/run/secrets/kubernetes.io/serviceaccount/token').read_text()\n\
          tls = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')\n\
          base = 'https://' + os.environ['KUBERNETES_SERVICE_HOST'] + ':' + os.environ['KUBERNETES_SERVICE_PORT']\n\
          def get(path):\n    request = urllib.request.Request(base + path, headers={'Authorization':\
          \ 'Bearer ' + token})\n    with urllib.request.urlopen(request, context=tls,\
          \ timeout=15) as response:\n        return json.load(response)\ndeployment\
          \ = get('/apis/apps/v1/namespaces/forgejo/deployments/forgejo')\nassert\
          \ deployment['metadata']['uid'] == '559e3fef-818a-409e-8251-0a919a8756b3'\n\
          assert deployment['spec']['replicas'] == 0\nfor claim, uid in [('gitea-shared-storage',\
          \ '69b9fb12-8b79-4c3a-a0aa-2073b6d3905b'), ('forgejo-db-1', '145fb4c9-7528-4d84-a381-532cade46a68')]:\n\
          \    pvc = get('/api/v1/namespaces/forgejo/persistentvolumeclaims/' + claim)\n\
          \    assert pvc['metadata']['uid'] == uid and pvc['status']['phase'] ==\
          \ 'Bound'\nfor attempt in range(90):\n    pods = get('/api/v1/namespaces/forgejo/pods?labelSelector=app.kubernetes.io%2Fname%3Dforgejo')['items']\n\
          \    if not pods:\n        break\n    time.sleep(2)\nassert not pods, 'Forgejo\
          \ Pods remain; snapshots must not start'\nprint('PASS: original Deployment\
          \ stopped, every Forgejo Pod gone, both source PVC identities preserved.')\n"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: postgresql.cnpg.io/v1
