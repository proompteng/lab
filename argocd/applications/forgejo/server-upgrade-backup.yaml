  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: forgejo-db
  method: volumeSnapshot
  online: false
  target: primary
---
