apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo
patches:
- path: server-upgrade-quiesce.patch.yaml
resources:
- server-upgrade-backup.yaml
- kargo-upgrade-backup.yaml
- server-17-backup.yaml
- server-17-rehearsal.yaml
- postgres-upgrade-backup.yaml
- admin-sealedsecret.yaml
- postgres-cluster.yaml
- ingressroute-forgejo-k8s-private.yaml
helmCharts:
- name: forgejo
  repo: oci://code.forgejo.org/forgejo-helm
  version: 17.3.3
  releaseName: forgejo
  namespace: forgejo
  valuesFile: values.yaml
configMapGenerator:
- name: forgejo-server-17-0-2-cutover-rehearsal
  files:
  - upgrade-db-rehearsal.sh
  - upgrade-app-rehearsal.sh
  - upgrade-repository-refs.sh
  options:
    disableNameSuffixHash: true
    annotations:
      argocd.argoproj.io/sync-wave: "-25"
images:
- name: code.forgejo.org/forgejo/forgejo
  newName: registry.ide-newton.ts.net/lab/forgejo
  digest: sha256:b9a139951e54f5829c2cd2eb12e37d32916cc1dc4203d7941df006dd29e17476
