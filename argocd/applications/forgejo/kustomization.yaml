apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgejo
resources:
  - server-upgrade-backup.yaml
  - postgres-upgrade-backup.yaml
  - admin-sealedsecret.yaml
  - postgres-cluster.yaml
  - ingressroute-forgejo-k8s-private.yaml
helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: 17.1.4
    releaseName: forgejo
    namespace: forgejo
    valuesFile: values.yaml

configMapGenerator:
  - name: forgejo-server-16-0-3-rehearsal
    files:
      - upgrade-db-rehearsal.sh
      - upgrade-app-rehearsal.sh
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-25"
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: server-upgrade-quiesce.patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: forgejo
