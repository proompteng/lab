# Single-pod Forgejo with CNPG Postgres + PVC.
# For medium/large instances, add external Redis/Valkey for session/cache/queue.
replicaCount: 1

# Kargo writes the selected version and immutable image in its generated branch.
image:
  rootless: true
  tag: 16.0.3


podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

persistence:
  enabled: true
  size: 50Gi
  storageClass: rook-ceph-block

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: code.proompteng.ai
      paths:
        - path: /
          pathType: Prefix
          port: http
  tls:
    - hosts:
        - code.proompteng.ai
      secretName: code-proompteng-ai-tls

service:
  ssh:
    type: LoadBalancer
    annotations:
      metallb.io/address-pool: metallb-ip-pool
      metallb.io/allow-shared-ip: ingress-edge
      metallb.io/loadBalancerIPs: 100.100.244.181

gitea:
  podAnnotations:
    delivery.proompteng.ai/source-revision: 59c2829e7d09dafb9e35fc69f5d5b066b37ecdc2
    delivery.proompteng.ai/image-digest: sha256:c8fb414db317b0e521443a244f1809bc3bf2b80641eb355c1a66167c426b2b87
    delivery.proompteng.ai/upstream-digest: sha256:214f4ae63ee78be1e445e58573c88dc7215e72091210852e0df94eaac1a25685
    delivery.proompteng.ai/created: 2026-09-09T19:15:15-07:00
  admin:
    existingSecret: forgejo-admin
    username: kalmyk
    passwordMode: initialOnlyNoReset
  config:
    server:
      ROOT_URL: https://code.proompteng.ai
      DOMAIN: code.proompteng.ai
      SSH_DOMAIN: git.proompteng.ai
      SSH_PORT: 22
    database:
      DB_TYPE: postgres
      HOST: forgejo-db-rw:5432
      NAME: forgejo
      USER: forgejo
      SSL_MODE: disable
    service:
      DISABLE_REGISTRATION: true
    actions:
      ENABLED: true
      DEFAULT_ACTIONS_URL: https://code.proompteng.ai
  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-db-app
          key: password

test:
  enabled: false
