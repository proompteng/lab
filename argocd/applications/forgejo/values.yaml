# Single-pod Forgejo with CNPG Postgres + PVC.
# For medium/large instances, add external Redis/Valkey for session/cache/queue.
replicaCount: 1

# Kargo writes the selected version and immutable image in its generated branch.
image:
  rootless: true
  tag: 16.0.3


podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

persistence:
  enabled: true
  size: 50Gi
  storageClass: rook-ceph-block

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: code.proompteng.ai
      paths:
        - path: /
          pathType: Prefix
          port: http
  tls:
    - hosts:
        - code.proompteng.ai
      secretName: code-proompteng-ai-tls

service:
  ssh:
    type: LoadBalancer
    annotations:
      metallb.io/address-pool: metallb-ip-pool
      metallb.io/allow-shared-ip: ingress-edge
      metallb.io/loadBalancerIPs: 100.100.244.181

gitea:
  podAnnotations:
    delivery.proompteng.ai/source-revision: d316ac9f8e72d377f379584a7d5fa03586c4dc8d
    delivery.proompteng.ai/image-digest: sha256:29ef5e3eb1708b62185a8c49d739a5782a0639619ec103b1ba5cd4ead58e9a42
    delivery.proompteng.ai/upstream-digest: sha256:214f4ae63ee78be1e445e58573c88dc7215e72091210852e0df94eaac1a25685
    delivery.proompteng.ai/created: 2026-09-09T20:14:36-07:00
  admin:
    existingSecret: forgejo-admin
    username: kalmyk
    passwordMode: initialOnlyNoReset
  config:
    server:
      ROOT_URL: https://code.proompteng.ai
      DOMAIN: code.proompteng.ai
      SSH_DOMAIN: git.proompteng.ai
      SSH_PORT: 22
    database:
      DB_TYPE: postgres
      HOST: forgejo-db-rw:5432
      NAME: forgejo
      USER: forgejo
      SSL_MODE: disable
    service:
      DISABLE_REGISTRATION: true
    actions:
      ENABLED: true
      DEFAULT_ACTIONS_URL: https://code.proompteng.ai
  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-db-app
          key: password

test:
  enabled: false
