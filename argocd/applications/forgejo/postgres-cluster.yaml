apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11@sha256:70664ebcfa1100361b5bdc28bbf06fdbe08db2dc4ad7bd14de33c5e05fe8ea8e
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: rook-ceph-block
    size: 10Gi
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      encoding: 'UTF8'
      dataChecksums: true
  backup:
    volumeSnapshot:
      className: rook-ceph-block
      snapshotOwnerReference: backup
  monitoring:
    enablePodMonitor: true
# CNPG emits application credentials in `forgejo-db-app` (uri, user, password, host, port, dbname)
