apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bullseye@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: rook-ceph-block
    size: 10Gi
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      encoding: 'UTF8'
      dataChecksums: true
  backup:
    volumeSnapshot:
      className: rook-ceph-block
      snapshotOwnerReference: backup
  monitoring:
    enablePodMonitor: true
# CNPG emits application credentials in `forgejo-db-app` (uri, user, password, host, port, dbname)
