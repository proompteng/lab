apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  instances: 1
  postgresql:
    parameters:
      wal_buffers: 16MB
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:13f5dc1b42c5d96233724be976740df031136ca013f98a56a2877a62b362b453
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: rook-ceph-block
    size: 10Gi
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      encoding: 'UTF8'
      dataChecksums: true
  backup:
    volumeSnapshot:
      className: rook-ceph-block
      snapshotOwnerReference: backup
  monitoring:
    enablePodMonitor: true
# CNPG emits application credentials in `forgejo-db-app` (uri, user, password, host, port, dbname)
