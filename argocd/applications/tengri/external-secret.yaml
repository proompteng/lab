apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tengri-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: tengri-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: TENGRI_INTERNAL_HMAC_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: tengri-runtime/TENGRI_INTERNAL_HMAC_SECRET
        metadataPolicy: None
        nullBytePolicy: Fail
    - secretKey: TENGRI_TICKET_SIGNING_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: tengri-runtime/TENGRI_TICKET_SIGNING_SECRET
        metadataPolicy: None
        nullBytePolicy: Fail
