apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: relay-guest-identity
  namespace: tengri
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [runtime.proompteng.ai]
    resources: [microvms]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: relay-guest-identity
  namespace: tengri
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: relay-guest-identity
subjects:
  - kind: ServiceAccount
    name: relay
    namespace: relay
