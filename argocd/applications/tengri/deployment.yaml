apiVersion: apps/v1
kind: Deployment
metadata:
  name: tengri
  labels:
    app.kubernetes.io/name: tengri
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tengri
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      annotations:
        inject.istio.io/templates: sidecar,spire
        sidecar.istio.io/nativeSidecar: "true"
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyCPULimit: 500m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyMemoryLimit: 256Mi
      labels:
        sidecar.istio.io/inject: "true"
        app.kubernetes.io/name: tengri
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: tengri
        spiffe.io/spire-managed-identity: "true"
    spec:
      serviceAccountName: tengri
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tengri
          image: registry.ide-newton.ts.net/lab/tengri
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: gateway
              containerPort: 8080
              protocol: TCP
            - name: preview
              containerPort: 8081
              protocol: TCP
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/spire-agent.sock
            - name: SPIFFE_TRUST_DOMAIN
              value: proompteng.ai
            - name: TENGRI_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TENGRI_GUEST_ARCHITECTURE
              value: amd64
            - name: TENGRI_DEFAULT_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: tengri-release
                  key: NANOAGENT_IMAGE
            - name: TENGRI_PUBLIC_URL
              value: https://tengri.proompteng.ai
            - name: TENGRI_PREVIEW_URL_TEMPLATE
              value: https://tengri-{session}.proompteng.ai
            - name: TENGRI_DESKTOP_ORIGIN
              value: https://proompteng.ai
            - name: TENGRI_PREVIEW_ADDRESS
              value: 0.0.0.0:8081
            - name: TENGRI_RUNTIME_SECRET_DIRECTORY
              value: /var/run/secrets/tengri-runtime
            - name: TENGRI_AUTHZ_ENDPOINT
              value: http://ofz.ofz.svc.cluster.local:8443
            - name: TENGRI_AUTHZ_KEY_FILE
              value: /var/run/secrets/tengri-authz/preshared_key
            - name: TENGRI_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: tengri-runtime
          startupProbe:
            httpGet:
              path: /livez
              port: gateway
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: gateway
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
          volumeMounts:
            - name: workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: runtime-secret
              mountPath: /var/run/secrets/tengri-runtime
              readOnly: true
            - name: authz-secret
              mountPath: /var/run/secrets/tengri-authz
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: runtime-secret
          secret:
            secretName: tengri-runtime
        - name: authz-secret
          secret:
            secretName: tengri-spicedb-key
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
