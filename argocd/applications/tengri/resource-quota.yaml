apiVersion: v1
kind: ResourceQuota
metadata:
  name: tengri
spec:
  hard:
    count/microvms.runtime.proompteng.ai: "6"
    persistentvolumeclaims: "6"
    requests.storage: 96Gi
    pods: "8"
    secrets: "8"
    # Six 2 CPU/4 GiB guests, kata-fc's 250m/130Mi fixed overhead per guest,
    # and the Tengri control plane must all fit before Kubernetes admits a Pod.
    requests.cpu: "14"
    limits.cpu: "15"
    requests.memory: 26Gi
    limits.memory: 26Gi
