apiVersion: v1
kind: ResourceQuota
metadata:
  name: tengri
spec:
  hard:
    count/microvms.runtime.proompteng.ai: "6"
    count/leases.coordination.k8s.io: "6"
    persistentvolumeclaims: "6"
    requests.storage: 96Gi
    pods: "8"
    secrets: "8"
    # Six runners, six host supervisors, and the controller with its mesh proxy.
    requests.cpu: "26"
    limits.cpu: "27"
    requests.memory: 51Gi
    limits.memory: 51Gi
