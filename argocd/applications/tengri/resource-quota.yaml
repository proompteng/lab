apiVersion: v1
kind: ResourceQuota
metadata:
  name: tengri
spec:
  hard:
    count/microvms.runtime.proompteng.ai: "6"
    # Six retained 16 GiB homes plus six private 1 GiB image-built tool disks.
    persistentvolumeclaims: "12"
    requests.storage: 102Gi
    pods: "8"
    secrets: "8"
    # Six 4 CPU/8 GiB guests, kata-fc's 250m/130Mi fixed overhead per guest,
    # and the Tengri control plane must all fit before Kubernetes admits a Pod.
    requests.cpu: "26"
    limits.cpu: "27"
    requests.memory: 50Gi
    limits.memory: 50Gi
