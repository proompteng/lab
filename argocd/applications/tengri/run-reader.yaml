apiVersion: v1
kind: ServiceAccount
metadata:
  name: tengri-run-reader
  namespace: restate
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tengri-run-reader
  namespace: restate
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tengri-run-reader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tengri-run-reader
        app.kubernetes.io/part-of: tengri
        sidecar.istio.io/inject: 'true'
        spiffe.io/spire-managed-identity: 'true'
      annotations:
        inject.istio.io/templates: sidecar,spire
        sidecar.istio.io/nativeSidecar: 'true'
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyCPULimit: 500m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyMemoryLimit: 256Mi
    spec:
      serviceAccountName: tengri-run-reader
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reader
          image: registry.ide-newton.ts.net/lab/tengri
          args: [run-reader]
          env:
            - name: TENGRI_RESTATE_ADMIN
              value: http://restate.restate.svc.cluster.local:9070/
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tengri-run-reader
  namespace: restate
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  selector:
    app.kubernetes.io/name: tengri-run-reader
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: tengri-run-reader
  namespace: restate
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tengri-run-reader
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: tengri-run-reader
  namespace: restate
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tengri-run-reader
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [proompteng.ai/ns/tengri/sa/tengri]
      to:
        - operation:
            ports: ['8080']
            methods: [POST]
            paths: [/status, /active]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tengri-run-reader
  namespace: restate
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tengri-run-reader
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tengri
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tengri
              app.kubernetes.io/component: control-plane
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: restate
      ports:
        - protocol: TCP
          port: 9070
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istiod
      ports:
        - protocol: TCP
          port: 15012
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
