apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: tengri-run-worker
  namespace: tengri
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: 2
  revisionHistoryLimit: 2
  minReadySeconds: 5
  restate:
    register:
      service:
        name: restate
        namespace: restate
        port: 9070
  selector:
    matchLabels:
      app.kubernetes.io/name: tengri
      app.kubernetes.io/component: run-worker
  template:
    metadata:
      annotations:
        inject.istio.io/templates: sidecar,spire
        sidecar.istio.io/nativeSidecar: 'true'
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyCPULimit: 500m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyMemoryLimit: 256Mi
      labels:
        app.kubernetes.io/component: run-worker
        app.kubernetes.io/name: tengri
        app.kubernetes.io/part-of: tengri
        sidecar.istio.io/inject: 'true'
        spiffe.io/spire-managed-identity: 'true'
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: SENTRY_DSN
          valueFrom:
            configMapKeyRef:
              name: tengri-observability
              key: SENTRY_DSN
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: tengri-observability
              key: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        - name: OFZ_GRPC_ENDPOINT
          value: ofz-api.ofz.svc.cluster.local:9443
        - name: TENGRI_INTERNAL_HMAC_KEY_FILE
          value: /var/run/tengri/internal/TENGRI_INTERNAL_HMAC_SECRET
        - name: TENGRI_DATABASE_DSN
          value: host=ofz-db-rw.ofz.svc.cluster.local port=5432 dbname=tengri_control
            user=tengri_controller sslmode=require
        - name: TENGRI_DATABASE_PASSWORD_FILE
          value: /var/run/tengri/database/password
        - name: TENGRI_DATABASE_CA_FILE
          value: /var/run/tengri/database-ca/ca.crt
        - name: TENGRI_GUEST_SIGNING_KEY_FILE
          value: /var/run/tengri/guest-signing/key
        - name: TENGRI_GUEST_RECOVERY_GENERATION_FILE
          value: /var/run/tengri/guest-signing/recovery-generation
        - name: SPIFFE_ENDPOINT_SOCKET
          value: unix:///spiffe-workload-api/spire-agent.sock
        - name: SPIFFE_TRUST_DOMAIN
          value: proompteng.ai
        - name: TENGRI_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TENGRI_GUEST_ARCHITECTURE
          value: amd64
        - name: TENGRI_DEFAULT_IMAGE
          valueFrom:
            configMapKeyRef:
              key: NANOAGENT_IMAGE
              name: tengri-release
        - name: TENGRI_PUBLIC_URL
          value: https://tengri.proompteng.ai
        - name: TENGRI_PREVIEW_URL_TEMPLATE
          value: https://tengri-{session}.proompteng.ai
        - name: TENGRI_DESKTOP_ORIGIN
          value: https://proompteng.ai
        - name: TENGRI_PREVIEW_ADDRESS
          value: 0.0.0.0:8081
        - name: TENGRI_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TENGRI_RESTATE_INGRESS
          value: http://restate.restate.svc.cluster.local:8080
        - name: RESTATE_REQUEST_IDENTITY_KEYS
          value: publickeyv1_6PArFXa3x8V1xx69kZVRyB7uP1fUoZ44wes6vAHYF6NL
        image: registry.ide-newton.ts.net/lab/tengri
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 15
          timeoutSeconds: 2
          tcpSocket:
            port: restate
        name: tengri
        ports:
        - containerPort: 9080
          name: restate
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 5
          timeoutSeconds: 5
          tcpSocket:
            port: restate
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 2
          tcpSocket:
            port: restate
        volumeMounts:
        - mountPath: /spiffe-workload-api
          name: workload-api
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/tengri/internal
          name: internal-request-key
          readOnly: true
        - mountPath: /var/run/tengri/database
          name: database
          readOnly: true
        - mountPath: /var/run/tengri/database-ca
          name: database-ca
          readOnly: true
        - mountPath: /var/run/tengri/guest-signing
          name: guest-signing
          readOnly: true
        args:
        - run-worker
      enableServiceLinks: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: tengri
      terminationGracePeriodSeconds: 60
      volumes:
      - name: internal-request-key
        secret:
          defaultMode: 288
          secretName: tengri-internal-request-key
      - name: database
        secret:
          defaultMode: 288
          secretName: tengri-controller-db
      - name: database-ca
        secret:
          defaultMode: 288
          secretName: ofz-database-ca
      - name: guest-signing
        secret:
          defaultMode: 288
          items:
          - key: key
            path: key
          - key: recovery-generation
            path: recovery-generation
          secretName: tengri-guest-signing
      - csi:
          driver: csi.spiffe.io
          readOnly: true
        name: workload-api
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
        - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: tengri
            app.kubernetes.io/component: run-worker
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: tengri-run-worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: run-worker
      app.kubernetes.io/name: tengri
  mtls:
    mode: STRICT
  portLevelMtls:
    "9080":
      mode: DISABLE
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: tengri-run-worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: run-worker
      app.kubernetes.io/name: tengri
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: ["9080"]
