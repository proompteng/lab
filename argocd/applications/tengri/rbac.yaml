apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tengri
  namespace: tengri
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - runtime.proompteng.ai
    resources:
      - microvms
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - runtime.proompteng.ai
    resources:
      - microvms/status
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tengri
  namespace: tengri
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tengri
subjects:
  - kind: ServiceAccount
    name: tengri
    namespace: tengri
