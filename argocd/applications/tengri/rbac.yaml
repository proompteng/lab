apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tengri
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [nanoagent]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [runtime.proompteng.ai]
    resources: [microvms]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [runtime.proompteng.ai]
    resources: [microvms/status]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, secrets]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [tengri-auth-nonces]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tengri
subjects:
  - kind: ServiceAccount
    name: tengri
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tengri
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tengri-guest-identities
rules:
  - apiGroups: [spire.spiffe.io]
    resources: [clusterstaticentries]
    verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tengri-guest-identities
subjects:
  - kind: ServiceAccount
    name: tengri
    namespace: tengri
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tengri-guest-identities
