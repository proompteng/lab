apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-guest-bundle
  namespace: tengri
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-guest-bundle-publisher
  namespace: tengri
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [spire-guest-bundle]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-guest-bundle-publisher
  namespace: tengri
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spire-guest-bundle-publisher
