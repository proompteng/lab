apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: spire-db
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Shared SPIRE registrations, attested agents, and trust bundles
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5a6a677d3fa2bc3fdc61874e0de8324b5a987eb676ddca133e71365a8467d6c1
  enablePDB: true
  enableSuperuserAccess: false
  minSyncReplicas: 1
  maxSyncReplicas: 1
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  storage:
    storageClass: rook-ceph-block
    size: 10Gi
  bootstrap:
    initdb:
      database: spire
      owner: spire
      encoding: UTF8
      dataChecksums: true
  postgresql:
    parameters:
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3
      log_parameter_max_length: "0"
      log_parameter_max_length_on_error: "0"
  backup:
    volumeSnapshot:
      className: rook-ceph-block
      snapshotOwnerReference: backup
