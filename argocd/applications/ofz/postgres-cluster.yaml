apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ofz-db
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Shared SpiceDB permissions datastore
  inheritedMetadata:
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5a6a677d3fa2bc3fdc61874e0de8324b5a987eb676ddca133e71365a8467d6c1
  imagePullPolicy: IfNotPresent
  enablePDB: true
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  storage:
    storageClass: rook-ceph-block
    size: 20Gi
    resizeInUseVolumes: true
  bootstrap:
    initdb:
      database: spicedb
      owner: spicedb
      encoding: UTF8
      dataChecksums: true
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
    parameters:
      track_commit_timestamp: "on"
      max_connections: "200"
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: ofz-db
        serverName: ofz-db
  backup:
    volumeSnapshot:
      className: rook-ceph-block
      snapshotOwnerReference: backup
