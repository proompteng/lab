apiVersion: v1
kind: ServiceAccount
metadata:
  name: ofz-public-ca-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ofz-public-ca-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ofz-db-public-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ofz-public-ca-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ofz-public-ca-reader
subjects:
  - kind: ServiceAccount
    name: ofz-public-ca-reader
    namespace: ofz
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ofz-database-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  conditions:
    - namespaces: [tengri, proompteng]
  provider:
    kubernetes:
      remoteNamespace: ofz
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: ofz
          key: ca.crt
      auth:
        serviceAccount:
          name: ofz-public-ca-reader
          namespace: ofz
