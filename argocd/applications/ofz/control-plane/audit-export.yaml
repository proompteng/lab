apiVersion: v1
kind: ServiceAccount
metadata:
  name: ofz-audit-export
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ofz-audit-export
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ofz-audit-export
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ofz-audit-export
    spec:
      serviceAccountName: ofz-audit-export
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ofz-audit-export
      containers:
        - name: ofz-audit-export
          image: registry.ide-newton.ts.net/lab/ofz:unpromoted
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: OFZ_DATABASE_DSN
              value: host=ofz-db-rw.ofz.svc.cluster.local port=5432 dbname=ofz_control user=ofz_archiver sslmode=require
            - name: OFZ_DATABASE_PASSWORD_FILE
              value: /var/run/ofz/database/password
            - name: OFZ_DATABASE_CA_FILE
              value: /var/run/ofz/database-ca/ca.crt
            - name: OFZ_ARCHIVE_ACCESS_KEY_FILE
              value: /var/run/ofz/archive/access-key
            - name: OFZ_ARCHIVE_SECRET_KEY_FILE
              value: /var/run/ofz/archive/secret-key
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: database
              mountPath: /var/run/ofz/database
              readOnly: true
            - name: database-ca
              mountPath: /var/run/ofz/database-ca
              readOnly: true
            - name: archive
              mountPath: /var/run/ofz/archive
              readOnly: true
          command:
            - /bin/ofz-audit-export
      volumes:
        - name: database
          secret:
            secretName: ofz-archiver-db-auth
            defaultMode: 288
        - name: database-ca
          secret:
            secretName: ofz-db-ca
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 288
        - name: archive
          secret:
            secretName: ofz-audit-archive
            defaultMode: 288
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ofz-audit-export
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: ofz-audit-export
