apiVersion: v1
kind: ServiceAccount
metadata:
  name: ofz-ca-publisher
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ofz-ca-publisher
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [ofz-db-ca]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ofz-ca-publisher
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ofz-ca-publisher
subjects:
  - kind: ServiceAccount
    name: ofz-ca-publisher
    namespace: ofz
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ofz-ca-source
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  provider:
    kubernetes:
      remoteNamespace: ofz
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: ofz-ca-publisher
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ofz-db-public-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: ofz-ca-source
  target:
    name: ofz-db-public-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: ofz-db-ca
        property: ca.crt
