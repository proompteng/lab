apiVersion: authzed.com/v1alpha1
kind: SpiceDBCluster
metadata:
  name: ofz
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  version: v1.56.2
  credentials:
    datastoreURI:
      secretName: ofz-db-app
      key: uri
    presharedKey:
      secretName: ofz-spicedb-key
      key: preshared_key
    migrationSecrets:
      skip: true
  config:
    image: ghcr.io/authzed/spicedb:v1.56.2@sha256:aa96009a0477f8a759149823407d47ad16d1a74390bae3102b3b0b7143502764
    datastoreEngine: postgres
    datastoreTLSSecretName: ofz-db-ca
    replicas: 3
    httpEnabled: true
    telemetryEndpoint: ""
    pdb:
      maxUnavailable: "1"
  patches:
    - kind: Deployment
      patch:
        spec:
          template:
            spec:
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: ofz-spicedb
              containers:
                - name: spicedb
                  env:
                    - name: PGSSLMODE
                      value: verify-full
                    - name: PGSSLROOTCERT
                      value: /spicedb-db-tls/ca.crt
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      cpu: "2"
                      memory: 1Gi
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop:
                        - ALL
    - kind: Job
      patch:
        spec:
          backoffLimit: 6
          template:
            spec:
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: migrate
                  env:
                    - name: PGSSLMODE
                      value: verify-full
                    - name: PGSSLROOTCERT
                      value: /spicedb-db-tls/ca.crt
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: "1"
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop:
                        - ALL
