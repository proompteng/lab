apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: saigak
  labels:
    app.kubernetes.io/name: saigak
    app.kubernetes.io/component: embeddings
spec:
  serviceName: saigak
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saigak
      app.kubernetes.io/component: embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saigak
        app.kubernetes.io/component: embeddings
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: talos-192-168-1-194
      tolerations:
        - key: workload.proompteng.ai/compute-local
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: model-init
          image: ollama/ollama:0.40.19-rocm@sha256:4f73cdd3226204f3778e1c81f87c0b10ed92fd33270ccfcc815ffffc0b2600cd
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -eu
              export OLLAMA_HOST=127.0.0.1:11435
              ollama serve &
              server_pid="$!"
              trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
              for i in $(seq 1 120); do
                if ollama list >/dev/null 2>&1; then
                  break
                fi
                if [ "$i" = "120" ]; then
                  echo "ollama did not become ready" >&2
                  exit 1
                fi
                sleep 2
              done
              ollama pull qwen3-embedding:8b
              ollama create qwen3-embedding-saigak:8b -f /config/qwen3-embedding-8b.modelfile
              ollama show qwen3-embedding-saigak:8b >/dev/null
              ollama rm qwen3-embedding:8b
          env:
            - name: OLLAMA_HOST
              value: 127.0.0.1:11435
            - name: OLLAMA_MODELS
              value: /var/lib/ollama
          volumeMounts:
            - name: model-cache
              mountPath: /var/lib/ollama
            - name: runtime-config
              mountPath: /config
              readOnly: true
      containers:
        - name: ollama
          image: ollama/ollama:0.40.19-rocm@sha256:4f73cdd3226204f3778e1c81f87c0b10ed92fd33270ccfcc815ffffc0b2600cd
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: 127.0.0.1:11435
            - name: OLLAMA_MODELS
              value: /var/lib/ollama
            - name: OLLAMA_CONTEXT_LENGTH
              value: "32768"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_QUEUE
              value: "512"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          livenessProbe:
            exec:
              command:
                - ollama
                - list
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
              amd.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 24Gi
              amd.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /var/lib/ollama
        - name: embedding-proxy
          image: python:3.15.2-slim@sha256:08a4c22c92b79ec821a7ad49768480039ee5b7accac3955228e75366e30abc8e
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/proxy.py
          env:
            - name: SAIGAK_UPSTREAM_URL
              value: http://127.0.0.1:11435
            - name: SAIGAK_EMBEDDING_MODEL
              value: qwen3-embedding-saigak:8b
            - name: SAIGAK_EMBEDDING_DIMENSION
              value: "2048"
            - name: SAIGAK_PROXY_TIMEOUT_SECONDS
              value: "120"
            - name: SAIGAK_REQUIRE_GPU_RESIDENCY
              value: "true"
          ports:
            - name: http
              containerPort: 11434
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 120
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-config
              mountPath: /app
              readOnly: true
      volumes:
        - name: runtime-config
          configMap:
            name: saigak-runtime
        - name: model-cache
          persistentVolumeClaim:
            claimName: saigak-ryzen-data
      restartPolicy: Always
