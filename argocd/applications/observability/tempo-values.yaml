gateway:
  enabled: true
  replicas: 0

global:
  extraEnv:
    - name: OBS_S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: rook-ceph-rgw-loki
          key: AccessKey
    - name: OBS_S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: rook-ceph-rgw-loki
          key: SecretKey

traces:
  otlp:
    http:
      enabled: true
    grpc:
      enabled: true

distributor:
  replicas: 0
  extraArgs:
    - -config.expand-env=true

ingester:
  replicas: 3
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
              app.kubernetes.io/instance: observability-tempo
              app.kubernetes.io/component: ingester
          topologyKey: kubernetes.io/hostname
  podDisruptionBudget:
    enabled: true
  maxUnavailable: 1
  persistence:
    enabled: false
  extraArgs:
    - -config.expand-env=true

compactor:
  replicas: 0
  persistence:
    enabled: true
    size: 20Gi
    storageClass: rook-ceph-block
  extraArgs:
    - -config.expand-env=true

querier:
  replicas: 0
  extraArgs:
    - -config.expand-env=true

queryFrontend:
  replicas: 0
  extraArgs:
    - -config.expand-env=true

storage:
  trace:
    backend: s3
    s3:
      endpoint: rook-ceph-rgw-tls.rook-ceph.svc:443
      bucket: tempo-traces
      access_key: ${OBS_S3_ACCESS_KEY}
      secret_key: ${OBS_S3_SECRET_KEY}
      insecure: false
      tls_server_name: ceph.k8s.proompteng.ai
      forcepathstyle: true
