apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ci-observability
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-observability
  labels:
    app.kubernetes.io/name: ci-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ci-observability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ci-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: docker.io/library/python:3.14.7-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
          command: [python3, /app/collector.py]
          ports:
            - name: metrics
              containerPort: 9101
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: github_token
            - name: LOKI_PUSH_URL
              value: http://observability-loki-loki-distributed-gateway.observability.svc.cluster.local/loki/api/v1/push
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: app
          configMap:
            name: ci-observability
        - name: data
          persistentVolumeClaim:
            claimName: ci-observability
---
apiVersion: v1
kind: Service
metadata:
  name: ci-observability
  labels:
    app.kubernetes.io/name: ci-observability
spec:
  selector:
    app.kubernetes.io/name: ci-observability
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
