global:
  extraEnv:
    - name: OBS_S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: rook-ceph-rgw-loki
          key: AccessKey
    - name: OBS_S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: rook-ceph-rgw-loki
          key: SecretKey
    - name: OBS_S3_REGION
      value: us-east-1

image:
  repository: docker.io/grafana/mimir
  tag: 3.2.1

mimir:
  structuredConfig:
    ingest_storage:
      enabled: true
      kafka:
        # Use the same internal listener as Tempo; port 9092 requires SCRAM.
        address: kafka-kafka-bootstrap.kafka.svc.cluster.local:9093
        topic: observability.mimir.ingest.v1
        auto_create_topic_enabled: false
        auto_create_topic_default_partitions: 3
        # Kafka owns offsets; a new topic starts from its beginning. Never apply
        # an offset file from another Kafka cluster to this topic.
        consumer_group_offset_commit_file_enforced: false
    alertmanager:
      external_url: https://mimir.ide-newton.ts.net/alertmanager
    limits:
      ingestion_rate: 20000
      ingestion_burst_size: 400000
    blocks_storage:
      backend: s3
      bucket_store:
        sync_dir: /data/tsdb-sync
      s3:
        endpoint: rook-ceph-rgw-tls.rook-ceph.svc:443
        bucket_name: mimir-blocks
        access_key_id: ${OBS_S3_ACCESS_KEY}
        secret_access_key: ${OBS_S3_SECRET_KEY}
        region: ${OBS_S3_REGION}
        insecure: false
        http:
          tls_server_name: ceph.k8s.proompteng.ai
        bucket_lookup_type: path
    alertmanager_storage:
      backend: s3
      s3:
        endpoint: rook-ceph-rgw-tls.rook-ceph.svc:443
        bucket_name: mimir-alertmanager
        access_key_id: ${OBS_S3_ACCESS_KEY}
        secret_access_key: ${OBS_S3_SECRET_KEY}
        region: ${OBS_S3_REGION}
        insecure: false
        http:
          tls_server_name: ceph.k8s.proompteng.ai
        bucket_lookup_type: path
    ruler_storage:
      backend: s3
      s3:
        endpoint: rook-ceph-rgw-tls.rook-ceph.svc:443
        bucket_name: mimir-ruler
        access_key_id: ${OBS_S3_ACCESS_KEY}
        secret_access_key: ${OBS_S3_SECRET_KEY}
        region: ${OBS_S3_REGION}
        insecure: false
        http:
          tls_server_name: ceph.k8s.proompteng.ai
        bucket_lookup_type: path
    ruler:
      # /data/ruler is the writable working directory used by the ruler.
      # Rule groups are stored in object storage via ruler_storage (S3 backend).
      rule_path: /data/ruler
    usage_stats:
      enabled: false
      installation_mode: helm
  runtimeConfig:
    overrides:
      anonymous:
        ingestion_rate: 20000
        ingestion_burst_size: 400000

rollout_operator:
  enabled: false

admin_api:
  replicas: 1

distributor:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi

ingester:
  replicas: 3
  statefulStrategy:
    type: RollingUpdate
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    enabled: true
    size: 20Gi
    storageClass: rook-ceph-block

querier:
  replicas: 1

query_frontend:
  replicas: 1

query_scheduler:
  replicas: 1

ruler:
  replicas: 1

store_gateway:
  replicas: 1
  strategy:
    type: RollingUpdate
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    enabled: true
    size: 20Gi
    storageClass: rook-ceph-block

compactor:
  replicas: 1
  strategy:
    type: RollingUpdate
  persistentVolume:
    enabled: true
    size: 20Gi
    storageClass: rook-ceph-block

alertmanager:
  replicas: 1
  statefulStrategy:
    type: RollingUpdate
  zoneAwareReplication:
    enabled: false
  fallbackConfig: |
    # Real fallback config is rendered by External Secrets into the
    # observability-alertmanager-email Secret and mounted over this file.
    route:
      receiver: default-receiver
    receivers:
      - name: default-receiver
  persistentVolume:
    enabled: true
    # Preserve the existing immutable 1Gi claim template, which omits a class.
    # Its bound PVC already uses the default rook-ceph-block StorageClass.
    storageClass: null
    size: 1Gi

kafka:
  enabled: false

metaMonitoring:
  dashboards:
    enabled: false

minio:
  enabled: false
