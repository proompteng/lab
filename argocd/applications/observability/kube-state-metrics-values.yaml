fullnameOverride: observability-kube-state-metrics
image:
  registry: registry.k8s.io
  repository: kube-state-metrics/kube-state-metrics
  tag: v2.20.0
  sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
prometheusScrape: false
replicas: 1

collectors:
  - cronjobs
  - daemonsets
  - deployments
  - namespaces
  - nodes
  - pods
  - replicasets
  - services
  - statefulsets

rbac:
  extraRules:
    - apiGroups:
        - kargo.akuity.io
      resources:
        - stages
      verbs:
        - list
        - watch
    - apiGroups:
        - argoproj.io
      resources:
        - applications
      verbs:
        - list
        - watch
    - apiGroups:
        - postgresql.cnpg.io
      resources:
        - backups
        - scheduledbackups
      verbs:
        - list
        - watch
    - apiGroups:
        - restate.dev
      resources:
        - restatedeployments
      verbs:
        - list
        - watch

customResourceState:
  enabled: true
  config:
    kind: CustomResourceStateMetrics
    spec:
      resources:
        - groupVersionKind:
            group: kargo.akuity.io
            version: v1alpha1
            kind: Stage
          metricNamePrefix: kube_kargo
          labelsFromPath:
            namespace: [metadata, namespace]
            stage: [metadata, name]
          metrics:
            - name: stage_last_promotion_info
              help: The terminal phase of a Stage's last promotion.
              each:
                type: Info
                info:
                  path: [status, lastPromotion, status]
                  labelsFromPath:
                    phase: [phase]
            - name: stage_current_promotion_started_at
              help: Current promotion start timestamp in Unix seconds; absent when no promotion is active.
              each:
                type: Gauge
                gauge:
                  path: [status, currentPromotion, status, startedAt]
                  nilIsZero: false
        - groupVersionKind:
            group: argoproj.io
            version: v1alpha1
            kind: Application
          metricNamePrefix: kube_argocd
          labelsFromPath:
            application:
              - metadata
              - name
            namespace:
              - metadata
              - namespace
          metrics:
            - name: application_deployment_history_info
              help: Argo CD application has at least one persisted successful deployment.
              each:
                type: Info
                info:
                  path:
                    - status
                    - history
                    - "0"
                  labelsFromPath:
                    deployed_at:
                      - deployedAt
                    revision:
                      - revision
        - groupVersionKind:
            group: postgresql.cnpg.io
            version: v1
            kind: Backup
          metricNamePrefix: kube_cnpg
          labelsFromPath:
            namespace:
              - metadata
              - namespace
            backup:
              - metadata
              - name
            cluster:
              - metadata
              - labels
              - cnpg.io/cluster
            scheduled_backup:
              - metadata
              - labels
              - cnpg.io/scheduled-backup
            phase:
              - status
              - phase
          metrics:
            - name: backup_stopped_at
              help: CloudNativePG backup completion timestamp in Unix seconds.
              each:
                type: Gauge
                gauge:
                  path:
                    - status
                    - stoppedAt
        - groupVersionKind:
            group: postgresql.cnpg.io
            version: v1
            kind: ScheduledBackup
          metricNamePrefix: kube_cnpg
          labelsFromPath:
            namespace:
              - metadata
              - namespace
            scheduled_backup:
              - metadata
              - name
            cluster:
              - spec
              - cluster
              - name
          metrics:
            - name: scheduled_backup_last_schedule_time
              help: CloudNativePG most recent scheduled backup timestamp in Unix seconds.
              each:
                type: Gauge
                gauge:
                  path:
                    - status
                    - lastScheduleTime
        - groupVersionKind:
            group: restate.dev
            version: v1beta1
            kind: RestateDeployment
          metricNamePrefix: kube_restate
          labelsFromPath:
            namespace:
              - metadata
              - namespace
            restate_deployment:
              - metadata
              - name
          metrics:
            - name: deployment_spec_replicas
              help: Desired replica count from the RestateDeployment specification.
              each:
                type: Gauge
                gauge:
                  path:
                    - spec
                    - replicas
            - name: deployment_status_ready_replicas
              help: Ready pods of the updated RestateDeployment revision, excluding retained revisions.
              each:
                type: Gauge
                gauge:
                  path: [status, readyReplicas]
                  nilIsZero: false
            - name: deployment_metadata_generation
              help: Desired RestateDeployment object generation.
              each:
                type: Gauge
                gauge:
                  path: [metadata, generation]
                  nilIsZero: false
            - name: deployment_status_observed_generation
              help: RestateDeployment generation observed by its controller.
              each:
                type: Gauge
                gauge:
                  path: [status, observedGeneration]
                  nilIsZero: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
