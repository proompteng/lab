apiVersion: v1
kind: ConfigMap
metadata:
  name: bayn-cache-performance-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Trading
data:
  bayn-cache-performance.json: |
    {
      "uid": "bayn-cache-performance",
      "title": "Bayn performance",
      "schemaVersion": 41,
      "version": 3,
      "tags": [
        "bayn",
        "valkey",
        "postgresql"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "editable": true,
      "links": [
        {
          "title": "Trading operations",
          "url": "/d/bayn-cycle-operations",
          "type": "link",
          "targetBlank": false
        },
        {
          "title": "Broker traces",
          "url": "/explore?schemaVersion=1&panes=%7B%22broker-traces%22%3A%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22tempo%22%2C%22uid%22%3A%22tempo%22%7D%2C%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7B%20resource.service.version%20%3D%20%5C%22$source_revision%5C%22%20%26%26%20name%20%3D%20%5C%22bayn.broker.observation.poll%5C%22%20%7D%22%2C%22limit%22%3A20%2C%22tableType%22%3A%22traces%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22$__from%22%2C%22to%22%3A%22$__to%22%7D%7D%7D",
          "type": "link",
          "targetBlank": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "source_revision",
            "label": "Source",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prom"
            },
            "query": {
              "query": "query_result(max by(source_revision) (bayn_operation_metrics_expected{job=\"bayn\",namespace=\"bayn\"}))",
              "refId": "StandardVariableQuery"
            },
            "regex": "/source_revision=\"(?<value>(?<text>[0-9a-f]{8})[0-9a-f]{32})\"/",
            "refresh": 2,
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 103,
          "title": "API data",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "description": "API processes with a heartbeat newer than 90 seconds. Expected 2. A partial rollout remains visible. Heartbeats more than five seconds ahead of the collector clock are rejected.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "Unknown",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "0 / 2",
                      "color": "red"
                    },
                    "1": {
                      "text": "1 / 2",
                      "color": "red"
                    },
                    "2": {
                      "text": "2 / 2",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "count((bayn_telemetry_heartbeat_timestamp_seconds{namespace=\"bayn\",service=\"bayn\",source_revision=~\"$source_revision\"} > time() - 90) and (bayn_telemetry_heartbeat_timestamp_seconds{namespace=\"bayn\",service=\"bayn\",source_revision=~\"$source_revision\"} <= time() + 5))",
              "legendFormat": "API data",
              "range": false,
              "instant": true,
              "interval": "30s",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "text": {
              "valueSize": 28
            }
          }
        },
        {
          "id": 104,
          "title": "Worker data",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "description": "Execution workers with a heartbeat newer than 90 seconds. Expected 2. Heartbeats more than five seconds ahead of the collector clock are rejected.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "Unknown",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "0 / 2",
                      "color": "red"
                    },
                    "1": {
                      "text": "1 / 2",
                      "color": "red"
                    },
                    "2": {
                      "text": "2 / 2",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "count((bayn_telemetry_heartbeat_timestamp_seconds{namespace=\"bayn\",service=\"bayn-execution-controller\",source_revision=~\"$source_revision\"} > time() - 90) and (bayn_telemetry_heartbeat_timestamp_seconds{namespace=\"bayn\",service=\"bayn-execution-controller\",source_revision=~\"$source_revision\"} <= time() + 5))",
              "legendFormat": "Worker data",
              "range": false,
              "instant": true,
              "interval": "30s",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "text": {
              "valueSize": 28
            }
          }
        },
        {
          "id": 132,
          "title": "Age / limit",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "description": "Age of the latest complete position snapshot as a fraction of the configured reconciliation freshness limit. 100% exhausts that limit. Uses healthy API scrapes from the selected source; missing or future-dated snapshots remain unknown.",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "Unknown",
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "Unknown",
                      "color": "gray",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.75
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "max((((time() - bayn_broker_position_snapshot_observed_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}) >= 0) / on(instance) (bayn_reconciliation_stale_threshold_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} > 0)) and on(instance) bayn_build_info{job=\"bayn\",namespace=\"bayn\",service=\"bayn\",source_revision=~\"$source_revision\"} and on(instance) (up{job=\"bayn\",namespace=\"bayn\"} == 1))",
              "legendFormat": "Broker freshness budget used",
              "range": false,
              "instant": true,
              "interval": "30s",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "text": {
              "valueSize": 28
            }
          }
        },
        {
          "id": 133,
          "title": "Cycles / min",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "description": "Successful top-level execution-cycle operations per minute. This measures controller work, not orders or fills. An absent series remains unknown.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "Unknown",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "decimals": 2,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "sum(rate(bayn_operation_duration_seconds_count{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=\"bayn.execution.cycle-pass\",outcome=\"succeeded\"}[$__rate_interval])) * 60",
              "legendFormat": "Completed execution cycles / min",
              "range": false,
              "instant": true,
              "interval": "30s",
              "editorMode": "code"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "wideLayout": true,
            "text": {
              "valueSize": 28
            }
          }
        },
        {
          "id": 107,
          "title": "Critical-path latency · p95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 12,
            "h": 8
          },
          "description": "Successful top-level execution-cycle and broker-refresh wall time. Child stages are deliberately excluded from this comparison. Histogram estimates need traffic; compare with outcomes per minute.",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "Unknown",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 4,
                "showPoints": "never",
                "spanNulls": false,
                "axisLabel": "",
                "axisPlacement": "auto",
                "axisBorderShow": false,
                "scaleDistribution": {
                  "type": "linear"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "histogram_quantile(0.95, sum by(le) (rate(bayn_operation_duration_seconds_bucket{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=\"bayn.execution.cycle-pass\",outcome=\"succeeded\"}[$__rate_interval])))",
              "legendFormat": "Execution cycle",
              "range": true,
              "instant": false,
              "interval": "30s",
              "editorMode": "code"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "histogram_quantile(0.95, sum by(le) (rate(bayn_operation_duration_seconds_bucket{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=\"bayn.broker.observation.poll\",outcome=\"succeeded\"}[$__rate_interval])))",
              "legendFormat": "Broker refresh",
              "range": true,
              "instant": false,
              "interval": "30s",
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 134,
          "title": "Critical-path outcomes / min",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 12,
            "h": 8
          },
          "description": "Successful, failed and interrupted top-level execution cycles and broker refreshes. Child operations are excluded to avoid counting one failure multiple times. Counters begin with their first event; absent series are not zero-filled.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "Unknown",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 4,
                "showPoints": "never",
                "spanNulls": false,
                "axisLabel": "",
                "axisPlacement": "auto",
                "axisBorderShow": false,
                "scaleDistribution": {
                  "type": "linear"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Execution cycle · succeeded"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Broker refresh · succeeded"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".* · failed"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".* · interrupted"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "sum by(outcome) (rate(bayn_operation_duration_seconds_count{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=\"bayn.execution.cycle-pass\"}[$__rate_interval])) * 60",
              "legendFormat": "Execution cycle · {{outcome}}",
              "range": true,
              "instant": false,
              "interval": "30s",
              "editorMode": "code"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "sum by(outcome) (rate(bayn_operation_duration_seconds_count{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=\"bayn.broker.observation.poll\"}[$__rate_interval])) * 60",
              "legendFormat": "Broker refresh · {{outcome}}",
              "range": true,
              "instant": false,
              "interval": "30s",
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 109,
          "title": "Cache access latency · p95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 12,
            "h": 8
          },
          "description": "Read includes queueing and reconnect. Write includes SET and the full replica acknowledgement loop. SET and replica acknowledgement are separate child measurements. Do not add nested durations. Percentiles are histogram estimates and need enough traffic.",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "Unknown",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 4,
                "showPoints": "never",
                "spanNulls": false,
                "axisLabel": "",
                "axisPlacement": "auto",
                "axisBorderShow": false,
                "scaleDistribution": {
                  "type": "linear"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "histogram_quantile(0.95, sum by(le,stage) (rate(bayn_operation_duration_seconds_bucket{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=~\"bayn.valkey.get\",outcome=\"succeeded\"}[$__rate_interval])))",
              "legendFormat": "Read",
              "range": true,
              "instant": false,
              "interval": "30s",
              "editorMode": "code"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "histogram_quantile(0.95, sum by(le,stage) (rate(bayn_operation_duration_seconds_bucket{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=~\"bayn.valkey.put\",outcome=\"succeeded\"}[$__rate_interval])))",
              "legendFormat": "Write + replica",
              "range": true,
              "instant": false,
              "interval": "30s",
              "editorMode": "code"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "histogram_quantile(0.95, sum by(le,stage) (rate(bayn_operation_duration_seconds_bucket{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=~\"bayn.valkey.replica-ack\",outcome=\"succeeded\"}[$__rate_interval])))",
              "legendFormat": "Replica acknowledgement",
              "range": true,
              "instant": false,
              "interval": "30s",
              "editorMode": "code"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "histogram_quantile(0.95, sum by(le,stage) (rate(bayn_operation_duration_seconds_bucket{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=~\"bayn.valkey.set\",outcome=\"succeeded\"}[$__rate_interval])))",
              "legendFormat": "SET command",
              "range": true,
              "instant": false,
              "interval": "30s",
              "editorMode": "code"
            }
          ],
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 110,
          "title": "Durable write latency · p95",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 11,
            "w": 12,
            "h": 8
          },
          "description": "Compare writer coordination, transaction commit and reconciliation. Reconciliation includes child database work. Expand PostgreSQL details for index, waits and replication evidence. Percentiles are histogram estimates and need enough traffic.",
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "Unknown",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 4,
                "showPoints": "never",
                "spanNulls": false,
                "axisLabel": "",
                "axisPlacement": "auto",
                "axisBorderShow": false,
                "scaleDistribution": {
                  "type": "linear"
                },
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "histogram_quantile(0.95, sum by(le,stage) (rate(bayn_operation_duration_seconds_bucket{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=~\"bayn.postgres.writer-fence\",outcome=\"succeeded\"}[$__rate_interval])))",
              "legendFormat": "Writer fence",
              "range": true,
              "instant": false,
              "interval": "30s",
              "editorMode": "code"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "expr": "histogram_quantile(0.95, sum by(le,stage) (rate(bayn_operation_duration_seconds_bucket{namespace=\"bayn\",service=~\"bayn|bayn-execution-controller\",source_revision=~\"$source_revision\",stage=~\"bayn.postgres.commit\",outcome=\"succeeded\"}[$__rate_interval])))",
              "legendFormat": "Commit",
              "range": true,
              "instant": false,
              "interval": "30s",
              "editorMode": "code"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
