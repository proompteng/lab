rule_files:
  - rules.yaml
evaluation_interval: 30s
tests:
  - name: readiness keeps two-minute detection and requires five minutes of recovery
    interval: 30s
    input_series:
      - series: torghut_ws_readyz_status{job="torghut",namespace="torghut",service="torghut-ws",instance="old",pod="old"}
        values: 0+0x9 1+0x3 0+0x3 1+0x15
    promql_expr_test:
      - expr: count(ALERTS{alertname="TorghutWSForwarderNotReady",alertstate="firing"}) or vector(0)
        eval_time: 1m30s
        exp_samples: [{labels: '{}', value: 0}]
      - expr: count(ALERTS{alertname="TorghutWSForwarderNotReady",alertstate="firing"})
        eval_time: 2m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: count(ALERTS{alertname="TorghutWSForwarderNotReady",alertstate="firing"})
        eval_time: 6m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: count(ALERTS{alertname="TorghutWSForwarderNotReady",alertstate="firing"})
        eval_time: 13m30s
        exp_samples: [{labels: '{}', value: 1}]
      - expr: count(ALERTS{alertname="TorghutWSForwarderNotReady",alertstate="firing"}) or vector(0)
        eval_time: 14m
        exp_samples: [{labels: '{}', value: 0}]
  - name: pod replacement preserves the existing readiness incident
    interval: 30s
    input_series:
      - series: torghut_ws_readyz_status{job="torghut",namespace="torghut",service="torghut-ws",instance="old",pod="old"}
        values: 0+0x7 stale
      - series: torghut_ws_readyz_status{job="torghut",namespace="torghut",service="torghut-ws",instance="new",pod="new"}
        values: _ _ _ _ _ _ _ _ 0+0x20
    promql_expr_test:
      - expr: ALERTS{alertname="TorghutWSForwarderNotReady",alertstate="firing"}
        eval_time: 4m
        exp_samples:
          - labels: 'ALERTS{alertname="TorghutWSForwarderNotReady",alertstate="firing",job="torghut",namespace="torghut",service="torghut-ws",severity="critical"}'
            value: 1
  - name: a healthy replacement prevents an old replica from opening a service incident
    interval: 30s
    input_series:
      - series: torghut_ws_readyz_status{job="torghut",namespace="torghut",service="torghut-ws",instance="old"}
        values: 0+0x20
      - series: torghut_ws_readyz_status{job="torghut",namespace="torghut",service="torghut-ws",instance="new"}
        values: 1+0x20
      - series: up{job="torghut",namespace="torghut",service="torghut-ws",instance="old"}
        values: 0+0x20
      - series: up{job="torghut",namespace="torghut",service="torghut-ws",instance="new"}
        values: 1+0x20
    promql_expr_test:
      - expr: count(ALERTS{alertname=~"TorghutWSForwarder(NotReady|Down)"}) or vector(0)
        eval_time: 10m
        exp_samples: [{labels: '{}', value: 0}]
  - name: scrape outage keeps five-minute detection and recovery
    interval: 30s
    input_series:
      - series: up{job="torghut",namespace="torghut",service="torghut-ws",instance="old",pod="old"}
        values: 0+0x13 1+0x16
    promql_expr_test:
      - expr: count(ALERTS{alertname="TorghutWSForwarderDown",alertstate="firing"}) or vector(0)
        eval_time: 4m30s
        exp_samples: [{labels: '{}', value: 0}]
      - expr: count(ALERTS{alertname="TorghutWSForwarderDown",alertstate="firing"})
        eval_time: 5m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: count(ALERTS{alertname="TorghutWSForwarderDown",alertstate="firing"})
        eval_time: 11m30s
        exp_samples: [{labels: '{}', value: 1}]
      - expr: count(ALERTS{alertname="TorghutWSForwarderDown",alertstate="firing"}) or vector(0)
        eval_time: 12m
        exp_samples: [{labels: '{}', value: 0}]
