apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: observability-mimir-kafka-before-4-3-1
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  volumeSnapshotClassName: rook-ceph-block
  source:
    persistentVolumeClaimName: kafka-data-observability-mimir-kafka-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observability-mimir-kafka-restore-4-3-1
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 20Gi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: observability-mimir-kafka-before-4-3-1
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-mimir-kafka-restore-4-3-1
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mimir-kafka-restore-rehearsal
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: batch/v1
kind: Job
metadata:
  name: observability-mimir-kafka-restore-4-3-1-v2
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir-kafka-restore-rehearsal
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restore
          image: docker.io/apache/kafka:4.3.1
          command: [/bin/bash, /scripts/mimir-kafka-restore-check.sh]
          env:
            - name: CLUSTER_ID
              value: 5L6g3nShT-eMCtK--X86sw
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://127.0.0.1:9092
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@127.0.0.1:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "-1"
            - name: KAFKA_HEAP_OPTS
              value: -Xms1g -Xmx1g
            - name: LOG_DIR
              value: /tmp/kafka-logs
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: snapshot
              mountPath: /var/lib/kafka
            # Override the JVM image's nested VOLUME with the existing data.
            - name: snapshot
              mountPath: /var/lib/kafka/data
              subPath: data
            - name: config
              mountPath: /opt/kafka/config
            - name: tmp
              mountPath: /tmp
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: snapshot
          persistentVolumeClaim:
            claimName: observability-mimir-kafka-restore-4-3-1
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: observability-mimir-kafka-restore-check
