apiVersion: v1
kind: ConfigMap
metadata:
  name: bayn-cycle-operations-dashboard
  namespace: observability
data:
  bayn-cycle-operations-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Current Bayn trading readiness and lifecycle state. Read top-to-bottom: execution prerequisites, current decision path, session timing, then history and diagnostics. Current-state cards use instant, replica-reduced queries; OBSERVE is safe but is not trade-enabled.",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "All currently scraped Bayn status replicas report the bounded runtime ready.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "DEGRADED"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "READY"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "NO DATA",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "min(bayn_runtime_ready{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})",
              "instant": true,
              "legendFormat": "runtime",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Runtime",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "The durable Restate controller is configured, readable, and active on every current status replica.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "BLOCKED"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "ACTIVE"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "NO DATA",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "min(bayn_execution_controller_configured{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}) * min(bayn_execution_controller_read_available{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}) * min(bayn_execution_controller_active{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})",
              "instant": true,
              "legendFormat": "controller",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Execution controller",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "The configured broker is readable and the observed account matches the bound account reference.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "UNAVAILABLE"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "BOUND"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "NO DATA",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "min(bayn_broker_configured{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}) * min(bayn_broker_read_available{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}) * min(bayn_broker_account_bound{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})",
              "instant": true,
              "legendFormat": "broker",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Broker binding",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Reconciliation is exact, covers the latest mutation, and no mutation remains unresolved.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "BLOCKED"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "EXACT"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "NO DATA",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "min(bayn_reconciliation_exact{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}) * min(bayn_reconciliation_covers_latest_mutation{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}) * (1 - clamp_max(max(bayn_unresolved_mutations{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}), 1))",
              "instant": true,
              "legendFormat": "ledger",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Ledger safety",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Durable effective execution authority. OBSERVE is fail-closed and cannot submit orders.",
          "fieldConfig": {
            "defaults": {
              "noValue": "UNKNOWN"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "id": 5,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (authority) (bayn_authority_effective{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1)",
              "instant": true,
              "legendFormat": "{{authority}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Execution authority",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Current canonical cycle condition from the PostgreSQL-backed projection.",
          "fieldConfig": {
            "defaults": {
              "noValue": "UNKNOWN"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "id": 6,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (condition) (bayn_cycle_condition{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1)",
              "instant": true,
              "legendFormat": "{{condition}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Cycle condition",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Exact reason for the current cycle condition. Use this before inspecting lower-level telemetry.",
          "fieldConfig": {
            "defaults": {
              "noValue": "UNKNOWN"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 4
          },
          "id": 7,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (reason) (bayn_cycle_reason{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1)",
              "instant": true,
              "legendFormat": "{{reason}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Current reason",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Current durable cycle phase, or the latest terminal phase when no cycle is active.",
          "fieldConfig": {
            "defaults": {
              "noValue": "UNKNOWN"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 4
          },
          "id": 8,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (phase) (bayn_cycle_phase{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1)",
              "instant": true,
              "legendFormat": "{{phase}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Cycle phase",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Whether all prerequisites for the current active session are ready. Outside an active session, NOT READY can be expected.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "yellow",
                      "index": 0,
                      "text": "NOT READY"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "READY"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "NO ACTIVE SESSION",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "yellow",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 4
          },
          "id": 9,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "min(bayn_execution_session_preflight_ready{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})",
              "instant": true,
              "legendFormat": "preflight",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Session preflight",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Whether the current durable cycle has an immutable decision binding.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "blue",
                      "index": 0,
                      "text": "PENDING"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "BOUND"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "NO ACTIVE CYCLE",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 4
          },
          "id": 10,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max(bayn_cycle_decision_bound{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})",
              "instant": true,
              "legendFormat": "decision",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Decision",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Durable broker mutations whose final outcome is not yet reconciled.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "green",
                      "index": 0,
                      "text": "NONE"
                    }
                  },
                  "type": "value"
                }
              ],
              "min": 0,
              "noValue": "NO DATA",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 4
          },
          "id": 11,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max(bayn_unresolved_mutations{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})",
              "instant": true,
              "legendFormat": "unresolved",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Unresolved mutations",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Status of the latest immutable forward-performance receipt. No receipt means no completed economic proof, not zero profit.",
          "fieldConfig": {
            "defaults": {
              "noValue": "NO COMPLETED RECEIPT"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 8
          },
          "id": 20,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (status) ((bayn_forward_performance_evidence{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1) and on(instance) topk(1, bayn_forward_performance_receipt_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}))",
              "instant": true,
              "legendFormat": "{{status}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Economic evidence",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Profitability classification from the immutable receipt after all recorded costs. It remains unavailable until a closed, reconciled execution exists.",
          "fieldConfig": {
            "defaults": {
              "noValue": "UNDETERMINED"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 8
          },
          "id": 21,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (profitability) ((bayn_forward_performance_profitability{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1) and on(instance) topk(1, bayn_forward_performance_receipt_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}))",
              "instant": true,
              "legendFormat": "{{profitability}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Profitability",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Immutable net realized P&L after broker fees, other charged costs, and recorded cash yield. Running partial accounting is never substituted here.",
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "noValue": "NO COMPLETED RECEIPT",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 0.000001
                  }
                ]
              },
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 8
          },
          "id": 22,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max(bayn_forward_performance_net_realized_pnl_after_costs_dollars{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} and on(instance) topk(1, bayn_forward_performance_receipt_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}))",
              "instant": true,
              "legendFormat": "net after all costs",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Net realized after all costs",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Immutable net realized return after all recorded costs. It is unavailable until a closed, reconciled performance receipt exists.",
          "fieldConfig": {
            "defaults": {
              "decimals": 3,
              "noValue": "NO COMPLETED RECEIPT",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 0.000001
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 8
          },
          "id": 26,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max(bayn_forward_performance_net_realized_return_ratio{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} and on(instance) topk(1, bayn_forward_performance_receipt_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}))",
              "instant": true,
              "legendFormat": "net realized return",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Net realized return",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Gross realized P&L. Uses the immutable receipt when present, otherwise the durable running accounting total after at least one transaction.",
