apiVersion: v1
kind: ConfigMap
metadata:
  name: bayn-cycle-operations-dashboard
  namespace: observability
data:
  bayn-cycle-operations-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Bayn trading operations from eligibility through strategy decision, broker execution, reconciliation, exposure, and economics. Read left-to-right and top-to-bottom; zero orders are explained by the first stage that did not advance.",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
