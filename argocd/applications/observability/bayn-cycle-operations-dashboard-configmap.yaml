            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "DEGRADED",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "READY",
                      "color": "green",
                      "index": 1
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "NO DATA",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
