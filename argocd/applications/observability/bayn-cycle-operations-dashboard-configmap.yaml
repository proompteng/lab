apiVersion: v1
kind: ConfigMap
metadata:
  name: bayn-cycle-operations-dashboard
  namespace: observability
data:
  bayn-cycle-operations-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Bayn trading operations from eligibility through strategy decision, broker execution, reconciliation, exposure, and economics. Read left-to-right and top-to-bottom; zero orders are explained by the first stage that did not advance.",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "Critical-path performance",
          "url": "/d/bayn-cache-performance",
          "type": "link"
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "All Bayn status replicas agree the service and required dependencies are ready.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "DEGRADED",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "READY",
                      "color": "green",
                      "index": 1
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "NO DATA",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "min(bayn_runtime_ready{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})",
              "instant": true,
              "legendFormat": "runtime",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Runtime",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Effective durable authority. Observe blocks new orders; execution still requires the configured account, strategy, grants, reconciliation and risk checks.",
          "fieldConfig": {
            "defaults": {
              "noValue": "UNKNOWN"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "execution"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Execution"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "observe"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Observe"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "id": 5,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (authority) (bayn_authority_effective{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1)",
              "instant": true,
              "legendFormat": "{{authority}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Authority",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Latest reconciliation is exact, covers the latest mutation, and no mutation is unresolved.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "BLOCKED",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "EXACT",
                      "color": "green",
                      "index": 1
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "NO DATA",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "min(bayn_reconciliation_exact{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} * bayn_reconciliation_covers_latest_mutation{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} * (bayn_unresolved_mutations{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == bool 0))",
              "instant": true,
              "legendFormat": "ledger",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Ledger safety",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Durable transactions and receipts cover all persisted fills when EXACT.",
          "fieldConfig": {
            "defaults": {
              "noValue": "UNKNOWN"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "exact"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Exact"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "gap"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Gap"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "idle"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "No fills"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 3
          },
          "id": 30,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (state) ((bayn_accounting_state{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1) and on(instance) topk(1, bayn_runtime_projection_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}))",
              "instant": true,
              "legendFormat": "{{state}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Accounting",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Canonical operating condition derived from the durable cycle, authority, mutation, and reconciliation state.",
          "fieldConfig": {
            "defaults": {
              "noValue": "UNKNOWN"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "running"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Running"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "waiting"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Waiting"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "blocked"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Blocked"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "failed"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Failed"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "idle"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Idle"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 8,
            "h": 3
          },
          "id": 6,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (condition) (bayn_cycle_condition{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1)",
              "instant": true,
              "legendFormat": "{{condition}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Cycle condition",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "The exact bounded reason Bayn is waiting, running, stalled, or failed. This is the first no-trade diagnostic.",
          "fieldConfig": {
            "defaults": {
              "noValue": "UNKNOWN"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "active"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "No blocker"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "x": 8,
            "y": 3,
            "w": 8,
            "h": 3
          },
          "id": 7,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (reason) (bayn_cycle_reason{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1)",
              "instant": true,
              "legendFormat": "{{reason}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Current blocker",
          "type": "stat",
          "transformations": [
            {
              "id": "renameByRegex",
              "options": {
                "regex": "/_/g",
                "renamePattern": " "
              }
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Exact planner outcome and reason for the current or latest terminal cycle. NO DECISION means cycle evidence exists but planning has not completed; NO CYCLE means no cycle evidence exists.",
          "fieldConfig": {
            "defaults": {
              "noValue": "NO CYCLE"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "planned · none"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "Planned"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "x": 16,
            "y": 3,
            "w": 8,
            "h": 3
          },
          "id": 12,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "max by (status, reason) (bayn_cycle_target_plan_info{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} and on(instance) topk(1, bayn_runtime_projection_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}))",
              "instant": true,
              "legendFormat": "{{status}} · {{reason}}",
              "range": false,
              "refId": "A"
            },
            {
              "expr": "max(((bayn_cycle_unfinished_count{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} >= bool 0) and on(instance) topk(1, bayn_runtime_projection_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})) unless on(instance) (bayn_cycle_target_plan_info{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} and on(instance) topk(1, bayn_runtime_projection_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})))",
              "instant": true,
              "legendFormat": "NO DECISION",
              "range": false,
              "refId": "B"
            }
          ],
          "title": "Target plan",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Current or latest terminal cycle targets, intents, orders and fills in execution order. An absent Targets stage has no recorded decision; inspect Target plan above. Counts are durable observations, not health scores.",
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "min": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 9
          },
          "id": 17,
          "options": {
            "displayMode": "gradient",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(bayn_execution_funnel_count{job=\"bayn\",namespace=\"bayn\",service=\"bayn\",stage=\"targets\"} and on(instance) topk(1, bayn_runtime_projection_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}))",
              "instant": true,
              "range": false,
              "legendFormat": "Targets"
            },
            {
              "refId": "B",
              "expr": "max(bayn_execution_funnel_count{job=\"bayn\",namespace=\"bayn\",service=\"bayn\",stage=\"intents\"} and on(instance) topk(1, bayn_runtime_projection_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}))",
              "instant": true,
              "range": false,
              "legendFormat": "Intents"
            },
            {
              "refId": "C",
              "expr": "max(bayn_execution_funnel_count{job=\"bayn\",namespace=\"bayn\",service=\"bayn\",stage=\"orders\"} and on(instance) topk(1, bayn_runtime_projection_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}))",
              "instant": true,
              "range": false,
              "legendFormat": "Orders"
            },
            {
              "refId": "D",
              "expr": "max(bayn_execution_funnel_count{job=\"bayn\",namespace=\"bayn\",service=\"bayn\",stage=\"fills\"} and on(instance) topk(1, bayn_runtime_projection_timestamp_seconds{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"}))",
              "instant": true,
              "range": false,
              "legendFormat": "Fills"
            }
          ],
          "title": "Latest cycle funnel",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "description": "Canonical reason history without per-pod duplicates. Use the exact reason before opening logs or traces.",
          "fieldConfig": {
            "defaults": {
              "noValue": "NO DATA",
              "custom": {
                "axisWidth": 220
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "orange"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^(kill[ _]active|authority[ _]maximum[ _]mismatch|observation[ _]unavailable|reconciliation[ _](stale|predates[ _]mutation)|last[ _]cycle[ _]blocked)$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^(active|last[ _]cycle[ _]completed)$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^last[ _]cycle[ _]no[ _]trade$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "gray"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 9
          },
          "id": 32,
          "options": {
            "alignValue": "left",
            "mergeValues": true,
            "rowHeight": 0.8,
            "showValue": "never",
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "expr": "max by (reason) (bayn_cycle_reason{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} == 1)",
              "instant": false,
              "legendFormat": "{{reason}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Blocker history",
          "type": "state-timeline",
          "transformations": [
            {
              "id": "renameByRegex",
              "options": {
                "regex": "/_/g",
                "renamePattern": " "
              }
            }
          ]
        },
        {
          "id": 1001,
          "type": "row",
          "title": "Execution details",
          "description": "Planner outcome, session boundaries, intent latency and source provenance.",
          "collapsed": true,
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 24,
            "h": 1
          },
          "panels": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "description": "The Restate controller is readable and active; this is scheduling health, not proof of a trade.",
              "fieldConfig": {
                "defaults": {
                  "mappings": [
                    {
                      "options": {
                        "0": {
                          "text": "UNAVAILABLE",
                          "color": "red",
                          "index": 0
                        },
                        "1": {
                          "text": "ACTIVE",
                          "color": "green",
                          "index": 1
                        }
                      },
                      "type": "value"
                    }
                  ],
                  "noValue": "NO DATA",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red",
                        "value": null
                      },
                      {
                        "color": "green",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": {
                "x": 0,
                "y": 16,
                "w": 6,
                "h": 3
              },
              "id": 2,
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "center",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "value",
                "wideLayout": true
              },
              "targets": [
                {
                  "expr": "min(bayn_execution_controller_read_available{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} * bayn_execution_controller_active{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})",
                  "instant": true,
                  "legendFormat": "controller",
                  "range": false,
                  "refId": "A"
                }
              ],
              "title": "Execution controller",
              "type": "stat"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "description": "The configured broker account is readable, identity-bound, and execution-eligible.",
              "fieldConfig": {
                "defaults": {
                  "mappings": [
                    {
                      "options": {
                        "0": {
                          "text": "BLOCKED",
                          "color": "red",
                          "index": 0
                        },
                        "1": {
                          "text": "ELIGIBLE",
                          "color": "green",
                          "index": 1
                        }
                      },
                      "type": "value"
                    }
                  ],
                  "noValue": "NO DATA",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red",
                        "value": null
                      },
                      {
                        "color": "green",
                        "value": 1
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": {
                "x": 6,
                "y": 16,
                "w": 6,
                "h": 3
              },
              "id": 3,
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "center",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "value",
                "wideLayout": true
              },
              "targets": [
                {
                  "expr": "min(bayn_broker_read_available{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} * bayn_broker_account_bound{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"} * bayn_broker_execution_eligible{job=\"bayn\",namespace=\"bayn\",service=\"bayn\"})",
                  "instant": true,
                  "legendFormat": "broker",
                  "range": false,
                  "refId": "A"
                }
              ],
              "title": "Broker binding",
              "type": "stat"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              },
              "description": "Current durable cycle phase, or the most recent terminal phase while idle.",
              "fieldConfig": {
                "defaults": {
                  "noValue": "UNKNOWN"
                },
                "overrides": []
              },
              "gridPos": {
                "x": 12,
                "y": 16,
                "w": 6,
                "h": 3
              },
              "id": 8,
              "options": {
                "colorMode": "none",
                "graphMode": "none",
                "justifyMode": "center",
                "orientation": "auto",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "name",
                "wideLayout": true
              },
