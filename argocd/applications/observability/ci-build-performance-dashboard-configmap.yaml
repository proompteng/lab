apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-build-performance-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  ci-build-performance.json: |
    {
      "uid": "ci-build-performance",
      "title": "CI Build Performance",
      "description": "Attempt-aware image-build timing, cache evidence and runner resources. Polling target is 60 seconds; the historical rerun scan covers 90 days every three cycles. Detail records retain GitHub event times. Metrics have bounded labels and omit run IDs, revisions and Pod names.",
      "schemaVersion": 42,
      "version": 1,
      "refresh": "30s",
      "timezone": "browser",
      "tags": [
        "ci",
        "arc",
        "builds"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "workflow",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prom"
            },
            "query": "label_values(ci_job_phase_duration_seconds_count, workflow)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "architecture",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prom"
            },
            "query": "label_values(ci_job_phase_duration_seconds_count, architecture)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "runner_pool",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prom"
            },
            "query": "label_values(ci_job_phase_duration_seconds_count, runner_pool)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "arc",
              "value": "arc"
            }
          },
          {
            "name": "job_role",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prom"
            },
            "query": "label_values(ci_job_phase_duration_seconds_count, job_role)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "build",
              "value": "build"
            }
          },
          {
            "name": "job_family",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prom"
            },
            "query": "label_values(ci_job_phase_duration_seconds_count, job_family)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "event",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prom"
            },
            "query": "label_values(ci_job_phase_duration_seconds_count, event)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "push",
              "value": "push"
            }
          },
          {
            "name": "cache_state",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prom"
            },
            "query": "label_values(ci_job_duration_samples, cache_state)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "runner_pod",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "description": "Select a runner from a build-record link, or enter its exact Pod name."
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Running jobs",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ci_jobs_active{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",state=\"in_progress\"}) or vector(0)",
              "legendFormat": "running",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "title": "Queued jobs",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ci_jobs_active{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",state!=\"in_progress\"}) or vector(0)",
              "legendFormat": "queued",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "title": "Completed jobs in last hour",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(ci_jobs_completed{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",window=\"1h\"}) or vector(0)",
              "legendFormat": "jobs",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "title": "Failed jobs in last hour",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(ci_jobs_completed{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",window=\"1h\",outcome=~\"failure|timed_out\"}) or vector(0)) / clamp_min(sum(ci_jobs_completed{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",window=\"1h\"}), 1)",
              "legendFormat": "failure fraction",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 5,
          "title": "Seconds since successful poll",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - max(ci_observability_last_poll_timestamp_seconds)",
              "legendFormat": "age",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 6,
          "title": "Attempts awaiting collection",
          "type": "stat",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(ci_observability_pending_attempts)",
              "legendFormat": "attempts",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 7,
          "title": "Active jobs by state and architecture",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (state, architecture) (ci_jobs_active{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\"})",
              "legendFormat": "{{state}} {{architecture}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 8,
          "title": "Build volume by outcome, trailing hour",
          "type": "timeseries",
          "description": "Counts use actual GitHub completion times, including during historical backfill.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (outcome) (ci_jobs_completed{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",window=\"1h\"})",
              "legendFormat": "{{outcome}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 9,
          "title": "Job execution p50 and p95",
          "type": "timeseries",
          "description": "Successful jobs only. Rolling one-hour samples; cache classes and runner pools stay separate.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ci_job_duration_percentile_seconds{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",cache_state=~\"$cache_state\",outcome=\"success\",phase=\"execution\",window=\"1h\"}",
              "legendFormat": "{{workflow}} {{job_family}} {{architecture}} {{cache_state}} p{{percentile}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 10,
          "title": "Queue time p50 and p95",
          "type": "timeseries",
          "description": "Successful jobs only. Rolling one-hour samples; cache classes and runner pools stay separate.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ci_job_duration_percentile_seconds{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",cache_state=~\"$cache_state\",outcome=\"success\",phase=\"queue\",window=\"1h\"}",
              "legendFormat": "{{workflow}} {{job_family}} {{architecture}} {{cache_state}} p{{percentile}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 11,
          "title": "Median execution against prior seven-day baseline",
          "type": "timeseries",
          "description": "The baseline excludes the most recent hour. Unknown cache evidence is explicit; changes are observational, not causal proof.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ci_job_duration_percentile_seconds{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",cache_state=~\"$cache_state\",outcome=\"success\",phase=\"execution\",percentile=\"50\"}",
              "legendFormat": "{{workflow}} {{job_family}} {{architecture}} {{cache_state}} {{window}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 12,
          "title": "Comparison sample counts",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ci_job_duration_samples{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",cache_state=~\"$cache_state\",outcome=\"success\",phase=\"execution\"}",
              "legendFormat": "{{workflow}} {{job_family}} {{architecture}} {{cache_state}} {{window}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 13,
          "title": "Time spent by step phase, trailing hour",
          "type": "timeseries",
          "description": "Step names map to bounded phases. Unattributed time covers gaps between GitHub step timestamps. Build-and-publish steps remain combined where GitHub does not expose a split.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (phase) (ci_job_phase_total_seconds{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",cache_state=~\"$cache_state\",window=\"1h\",phase!~\"execution|queue|buildkit_.*\"})",
              "legendFormat": "{{phase}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 14,
          "title": "BuildKit cache and image export p50/p95",
          "type": "timeseries",
          "description": "Exporter timings parsed from BuildKit logs. These can overlap main step durations and must not be added to the phase partition.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 28,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ci_job_duration_percentile_seconds{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",cache_state=~\"$cache_state\",window=\"1h\",phase=~\"buildkit_.*\"}",
              "legendFormat": "{{workflow}} {{job_family}} {{architecture}} {{phase}} p{{percentile}}",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 15,
          "title": "Collection freshness and Loki backlog",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - ci_observability_last_history_scan_timestamp_seconds",
              "legendFormat": "history scan age",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            },
            {
              "refId": "B",
              "expr": "ci_observability_oldest_loki_pending_seconds",
              "legendFormat": "oldest unshipped record age",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 16,
          "title": "API headroom and collection errors",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 12,
            "y": 36,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "ci_observability_github_rate_limit_remaining",
              "legendFormat": "GitHub requests remaining",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            },
            {
              "refId": "B",
              "expr": "ci_observability_collection_errors_total",
              "legendFormat": "collection errors",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 17,
          "title": "Build records and GitHub links",
          "type": "table",
          "description": "Loki timestamps are observation times; completed_at is GitHub completion time. Click the runner to view its historical resources. Raw job logs and credentials are not shipped.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 44,
            "w": 24,
            "h": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "run_url"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open GitHub",
                        "url": "${__value.raw}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "job_url"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open GitHub",
                        "url": "${__value.raw}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "runner_name"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Runner resources during this job",
                        "url": "${__data.fields[\"resource_url\"]}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "started_at_ms"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "completed_at_ms"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "resource_url"
                },
                "properties": [
                  {
                    "id": "custom.hidden",
                    "value": true
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{service=\"ci-observability\",kind=\"job\",workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\"} | json",
              "queryType": "range",
              "maxLines": 200
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          },
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "source": "Line",
                "format": "json",
                "replace": true,
                "keepTime": false
              }
            },
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "completed_at",
                    "workflow",
                    "architecture",
                    "job_name",
                    "job_family",
                    "outcome",
                    "queue_seconds",
                    "execution_seconds",
                    "build_seconds",
                    "publish_seconds",
                    "cache_state",
                    "cache_hits",
                    "cache_total",
                    "cache",
                    "runner_name",
                    "resource_url",
                    "head_sha",
                    "run_url",
                    "job_url",
                    "started_at_ms",
                    "completed_at_ms"
                  ]
                }
              }
            }
          ]
        },
        {
          "id": 18,
          "title": "Selected runner CPU",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 56,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"arc\",pod=~\"$runner_pod\",container=\"runner\"}[2m]))",
              "legendFormat": "{{pod}} cores",
              "datasource": {
                "type": "prometheus",
                "uid": "prom"
              }
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          }
        },
