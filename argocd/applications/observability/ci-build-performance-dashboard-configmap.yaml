          "targets": [
            {
              "refId": "A",
              "expr": "sum by (workflow, architecture) (ci_buildkit_run_instructions{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",window=\"1h\",result=\"hit\"}) / clamp_min(sum by (workflow, architecture) (ci_buildkit_run_instructions{workflow=~\"$workflow\",architecture=~\"$architecture\",runner_pool=~\"$runner_pool\",job_role=~\"$job_role\",job_family=~\"$job_family\",event=~\"$event\",window=\"1h\"}), 1)",
              "legendFormat": "{{workflow}} {{job_family}} {{architecture}}",
              "datasource": {
