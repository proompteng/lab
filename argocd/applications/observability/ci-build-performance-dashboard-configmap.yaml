          "id": 22,
          "title": "BuildKit cached RUN instructions, trailing hour",
          "type": "timeseries",
          "description": "The ratio covers Dockerfile RUN vertices with available log evidence, not all layers or cache transport.",
          "datasource": {
            "type": "prometheus",
            "uid": "prom"
          },
          "gridPos": {
            "x": 0,
            "y": 72,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1
            },
            "overrides": []
