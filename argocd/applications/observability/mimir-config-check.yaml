apiVersion: batch/v1
kind: Job
metadata:
  name: observability-mimir-config-check
  namespace: observability
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: docker.io/grafana/mimir:3.2.0
          # Mimir validates the loaded configuration before listing modules
          # and exiting. No services start and no credentials are expanded.
          args:
            - -config.file=/conf/mimir.yaml
            - -modules
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-mimir-config
            items:
              - key: mimir.yaml
                path: mimir.yaml
