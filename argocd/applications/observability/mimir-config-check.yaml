# Validate each deployed role separately; their data directories are in
# different Pods. Native -modules validates configuration without starting services.
apiVersion: batch/v1
kind: Job
metadata:
  name: observability-mimir-config-check
  namespace: observability
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: verify-alertmanager
        image: docker.io/grafana/mimir:3.2.1
        args:
        - -config.file=/conf/mimir.yaml
        - -target=alertmanager
        - -modules
        resources: &id001
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext: &id002
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts: &id003
        - name: config
          mountPath: /conf
          readOnly: true
      - name: verify-compactor
        image: docker.io/grafana/mimir:3.2.1
        args:
        - -config.file=/conf/mimir.yaml
        - -target=compactor
        - -modules
        resources: *id001
        securityContext: *id002
        volumeMounts: *id003
      - name: verify-distributor
        image: docker.io/grafana/mimir:3.2.1
        args:
        - -config.file=/conf/mimir.yaml
        - -target=distributor
        - -modules
        resources: *id001
        securityContext: *id002
        volumeMounts: *id003
      - name: verify-ingester
        image: docker.io/grafana/mimir:3.2.1
        args:
        - -config.file=/conf/mimir.yaml
        - -target=ingester
        - -modules
        resources: *id001
        securityContext: *id002
        volumeMounts: *id003
      - name: verify-overrides-exporter
        image: docker.io/grafana/mimir:3.2.1
        args:
        - -config.file=/conf/mimir.yaml
        - -target=overrides-exporter
        - -modules
        resources: *id001
        securityContext: *id002
        volumeMounts: *id003
      - name: verify-querier
        image: docker.io/grafana/mimir:3.2.1
        args:
        - -config.file=/conf/mimir.yaml
        - -target=querier
        - -modules
        resources: *id001
        securityContext: *id002
        volumeMounts: *id003
      - name: verify-query-frontend
        image: docker.io/grafana/mimir:3.2.1
        args:
        - -config.file=/conf/mimir.yaml
        - -target=query-frontend
        - -modules
        resources: *id001
        securityContext: *id002
        volumeMounts: *id003
      - name: verify-query-scheduler
        image: docker.io/grafana/mimir:3.2.1
        args:
        - -config.file=/conf/mimir.yaml
        - -target=query-scheduler
        - -modules
        resources: *id001
        securityContext: *id002
        volumeMounts: *id003
      - name: verify-ruler
        image: docker.io/grafana/mimir:3.2.1
        args:
        - -config.file=/conf/mimir.yaml
        - -target=ruler
        - -modules
        resources: *id001
        securityContext: *id002
        volumeMounts: *id003
      containers:
      - name: verify-store-gateway
        image: docker.io/grafana/mimir:3.2.1
        args:
        - -config.file=/conf/mimir.yaml
        - -target=store-gateway
        - -modules
        resources: *id001
        securityContext: *id002
        volumeMounts: *id003
      volumes:
      - name: config
        configMap:
          name: observability-mimir-config
          items:
          - key: mimir.yaml
            path: mimir.yaml
