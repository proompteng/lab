apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-tempo-v3-migration-vulture
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo-migration-vulture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo-migration-vulture
        app.kubernetes.io/instance: observability-tempo-v3
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-tempo
          image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          command: [sh, -ec]
          args:
            - |
              for endpoint in \
                http://observability-tempo-v3-distributor:3200/ready \
                http://observability-tempo-v3-query-frontend:3200/ready; do
                status="$(curl --fail --silent --show-error --output /dev/null \
                  --connect-timeout 2 --max-time 5 --retry 60 --retry-delay 5 \
                  --retry-all-errors --retry-max-time 300 --write-out '%{http_code}' \
                  "$endpoint")"
                test "$status" = 200
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: vulture
          image: docker.io/grafana/tempo-vulture:3.0.3@sha256:c80f272b5a842c4812ea1772faea3bba0af1f35fccd1ce6ac43b852c9c8fd1d0
          args:
            - --tempo-query-url=http://observability-tempo-v3-query-frontend:3200
            - --tempo-push-url=http://observability-tempo-v3-distributor:4317
            - --tempo-query-livestore=true
            - --tempo-retention-duration=48h
            - --prometheus-listen-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
