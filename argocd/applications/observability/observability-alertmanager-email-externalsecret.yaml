apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-alertmanager-email
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: observability-alertmanager-email-brevo
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        smtp-username: '{{ .username }}'
        smtp-password: '{{ .password }}'
        smtp-from: '{{ .from }}'
        email-to: '{{ .to }}'
        alertmanager_fallback_config.yaml: |
          global:
            resolve_timeout: 5m
            smtp_smarthost: smtp-relay.brevo.com:587
            smtp_from: "{{ .from }}"
            smtp_auth_username: "{{ .username }}"
            smtp_auth_password: "{{ .password }}"
            smtp_require_tls: true
          route:
            receiver: default-receiver
            group_by: [alertname, namespace, service, severity]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: critical-email
                matchers:
                  - alertname = "CephHostReadLatencyHigh"
                  - severity = "critical"
                  - notify = "email"
                group_by: [alertname, service, node]
                group_wait: 10s
                group_interval: 15m
                repeat_interval: 4h
                continue: false
              - receiver: critical-email
                matchers:
                  - severity = "critical"
                  - notify = "email"
                group_wait: 10s
                group_interval: 5m
                repeat_interval: 1h
                continue: false
              - receiver: critical-email
                matchers:
                  - severity = "warning"
                  - notify = "email"
                group_wait: 10s
                group_interval: 15m
                repeat_interval: 4h
                continue: false
          inhibit_rules:
            - source_matchers:
                - alertname = "BaynMetricsUnavailable"
              target_matchers:
                - alertname = "BaynOperationMetricsUnavailable"
              equal: [namespace, service]
          receivers:
            - name: default-receiver
            - name: critical-email
              email_configs:
                - to: "{{ .to }}"
                  send_resolved: true
                  headers:
                    subject: '[lab] {{ "{{" }} .Status | toUpper {{ "}}" }}: {{ "{{" }} .CommonLabels.alertname {{ "}}" }} [{{ "{{" }} .CommonLabels.service {{ "}}" }}; {{ "{{" }} len .Alerts.Firing {{ "}}" }} firing, {{ "{{" }} len .Alerts.Resolved {{ "}}" }} resolved]'
  dataFrom:
    - extract:
        key: brevo
