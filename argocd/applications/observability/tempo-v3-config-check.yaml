apiVersion: batch/v1
kind: Job
metadata:
  name: observability-tempo-v3-config-check
  namespace: observability
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: docker.io/grafana/tempo:3.0.3
          # Native verification parses the full rendered config and rejects
          # configuration warnings. It does not connect to Kafka or S3; leave
          # credential placeholders unexpanded and do not expose Secrets.
          args:
            - -target=distributor
            - -config.file=/conf/tempo.yaml
            - -config.verify=true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: observability-tempo-v3-config
            items:
              - key: tempo.yaml
                path: tempo.yaml
