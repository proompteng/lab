# Versioned snapshot and restore rehearsal. These resources do not mount or
# mutate the live Grafana volume. The completed Job is not rerun on every sync.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: observability-grafana-before-13-2-1
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  volumeSnapshotClassName: rook-ceph-block
  source:
    persistentVolumeClaimName: observability-grafana
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observability-grafana-restore-13-2-1
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 10Gi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: observability-grafana-before-13-2-1
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-grafana-restore-13-2-1
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-restore-rehearsal
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: batch/v1
kind: Job
metadata:
  name: observability-grafana-restore-13-2-1
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-restore-rehearsal
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: sqlite-backup
          image: docker.io/library/python:3.14.7-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
          command: [python3, /scripts/grafana-sqlite-backup.py, prepare]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: snapshot
              mountPath: /snapshot
            - name: restore
              mountPath: /restore
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: restored-grafana
          restartPolicy: Always
          image: docker.io/grafana/grafana:12.3.1@sha256:2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f
          env:
            - name: GF_PATHS_DATA
              value: /restore
            - name: GF_PATHS_LOGS
              value: /restore/logs
            - name: GF_PATHS_PLUGINS
              value: /snapshot/plugins
            - name: GF_PATHS_PROVISIONING
              value: /restore/provisioning
            - name: GF_UNIFIED_STORAGE_INDEX_PATH
              value: /restore/search
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "false"
            - name: GF_ALERTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_LOG_LEVEL
              value: error
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 2
            failureThreshold: 120
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: snapshot
              mountPath: /snapshot
              readOnly: true
            - name: restore
              mountPath: /restore
            - name: temporary
              mountPath: /tmp
      containers:
        - name: verify-restore
          image: docker.io/library/python:3.14.7-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
          command: [python3, /scripts/grafana-sqlite-backup.py, verify-runtime]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: snapshot
              mountPath: /snapshot
            - name: restore
              mountPath: /restore
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: snapshot
          persistentVolumeClaim:
            claimName: observability-grafana-restore-13-2-1
        - name: restore
          emptyDir:
            sizeLimit: 1Gi
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
        - name: scripts
          configMap:
            name: observability-grafana-sqlite-backup
