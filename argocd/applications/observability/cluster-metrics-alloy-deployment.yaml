apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-cluster-metrics-alloy
  namespace: observability
  labels:
    app.kubernetes.io/name: observability-cluster-metrics-alloy
    app.kubernetes.io/component: cluster-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-cluster-metrics-alloy
  template:
    metadata:
      annotations:
        observability.proompteng.ai/config-sha256: 1574a6d4edbea433cc9321f6ac2687ce811a6ef5164a0e9a3d9b4eeb3a87e0ea
      labels:
        app.kubernetes.io/name: observability-cluster-metrics-alloy
        app.kubernetes.io/component: cluster-metrics
    spec:
      serviceAccountName: observability-cluster-metrics-alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
          args:
            - run
            - /etc/alloy/config.river
          workingDir: /var/lib/alloy
          ports:
            - name: http
              containerPort: 12345
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy
      volumes:
        - name: config
          configMap:
            name: observability-cluster-metrics-alloy
        - name: data
          emptyDir: {}
