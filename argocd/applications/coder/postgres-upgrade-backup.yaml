apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: coder-cluster-major-upgrade
  namespace: coder
  labels:
    app.kubernetes.io/name: coder-cluster
    app.kubernetes.io/component: postgres-upgrade-backup
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: coder-cluster
  method: volumeSnapshot
  online: false
  target: primary
