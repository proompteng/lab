apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: coder-cluster
  namespace: coder
spec:
  instances: 2
  postgresql:
    parameters:
      wal_buffers: 16MB
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:13f5dc1b42c5d96233724be976740df031136ca013f98a56a2877a62b362b453
  primaryUpdateMethod: switchover
  inheritedMetadata:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "pgadmin"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "pgadmin"
  storage:
    storageClass: rook-ceph-block
    size: 10Gi
  bootstrap:
    initdb:
      dataChecksums: true
      encoding: "UTF8"
      database: coder
      owner: coder
  backup:
    volumeSnapshot:
      className: rook-ceph-block
      snapshotOwnerReference: backup
