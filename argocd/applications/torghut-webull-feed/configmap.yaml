apiVersion: v1
kind: ConfigMap
metadata:
  name: torghut-webull-feed-config
  namespace: torghut
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka-kafka-bootstrap.kafka:9092
  KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  WEBULL_TOPIC: dorvud.webull.raw.v1
  # Prioritize Bayn's equity symbols for streaming admission and completed-minute polling.
  WEBULL_PRIORITY_SYMBOLS: AAPL,AMD,AMZN,AVGO,COHR,CRDO,IWM,LITE,MRVL,MU,NVDA,QQQ,SMH,SNDK,SPY,WDC
