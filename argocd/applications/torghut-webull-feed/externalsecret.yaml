apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webull-openapi-ingestion
  namespace: torghut
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  refreshInterval: 0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: webull-openapi-ingestion
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: app-key
      remoteRef:
        key: webull-openapi-ingestion/app-key
    - secretKey: app-secret
      remoteRef:
        key: webull-openapi-ingestion/app-secret
