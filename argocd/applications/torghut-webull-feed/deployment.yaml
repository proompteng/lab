apiVersion: apps/v1
kind: Deployment
metadata:
  name: torghut-webull-feed
  namespace: torghut
  labels:
    app: torghut-webull-feed
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: torghut-webull-feed
  template:
    metadata:
      labels:
        app: torghut-webull-feed
    spec:
      automountServiceAccountToken: false
      serviceAccountName: torghut-runtime
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: feed
          # The Application follows only kargo/torghut-webull-feed, where Kargo replaces this with an eligible digest.
          image: registry.ide-newton.ts.net/lab/torghut-webull-feed:unpublished
          envFrom:
            - configMapRef:
                name: torghut-webull-feed-config
          env:
            - name: WEBULL_FEED_COMMIT
              value: 7beda0dba89d8a86523ae8da77669a16b0da40ed
            - name: WEBULL_FEED_IMAGE_DIGEST
              value: sha256:d064632813732976c9b54431841df53da3a33dd0f4f606a9b92e4452e806ab6b
            - name: WEBULL_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: webull-openapi-ingestion
                  key: app-key
            - name: WEBULL_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: webull-openapi-ingestion
                  key: app-secret
            - name: KAFKA_SASL_USER
              value: torghut-ws
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: torghut-ws
                  key: password
            - name: JAVA_TOOL_OPTIONS
              value: -XX:+UseContainerSupport -XX:InitialRAMPercentage=20.0 -XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
