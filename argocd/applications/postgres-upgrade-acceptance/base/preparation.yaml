apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-upgrade-default-deny
  namespace: postgres-upgrade-acceptance
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: app-db-pg18-20260909
  namespace: app
  labels:
    app.kubernetes.io/part-of: postgres-upgrade-acceptance
    postgres.proompteng.ai/generation: 18-6-v1
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: app-db
  method: volumeSnapshot
  online: false
  target: primary
