apiVersion: apps/v1
kind: Deployment
metadata:
  name: bilig-alloy
  namespace: bilig
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bilig-alloy
  template:
    metadata:
      labels:
        app: bilig-alloy
    spec:
      serviceAccountName: bilig-alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
          args:
            - run
            - /etc/alloy/config.river
          ports:
            - name: http
              containerPort: 12345
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
      volumes:
        - name: config
          configMap:
            name: bilig-alloy
            items:
              - key: config.river
                path: config.river
