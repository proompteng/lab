apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bullseye@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      encoding: UTF8
      dataChecksums: true
  storage:
    storageClass: rook-ceph-block
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  backup:
    volumeSnapshot:
      className: rook-ceph-block
      snapshotOwnerReference: backup
  monitoring:
    enablePodMonitor: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: paperless-db-daily
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  schedule: "0 0 11 * * *"
  backupOwnerReference: self
  method: volumeSnapshot
  cluster:
    name: paperless-db
