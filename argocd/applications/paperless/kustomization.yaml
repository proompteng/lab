apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless

resources:
  - secrets.yaml
  - agent-api.yaml
  - postgres.yaml
  - backup-retention.yaml
  - valkey.yaml
  - paperless.yaml
  - converters.yaml
  - network.yaml

configMapGenerator:
  - name: paperless-agent-bootstrap
    files:
      - bootstrap_agent.py
  - name: paperless-backup-maintenance
    files:
      - prune_backups.py

generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

replacements:
  - source:
      kind: ConfigMap
      name: paperless-config
      fieldPath: data.PAPERLESS_ALLOWED_HOSTS
    targets:
      - select:
          kind: Deployment
          name: paperless
        fieldPaths:
          - spec.template.metadata.annotations.[paperless.proompteng.ai/allowed-hosts]
        options:
          create: true
  - source:
      kind: Deployment
      name: paperless
      fieldPath: spec.template.spec.containers.[name=paperless].image
    targets:
      - select:
          kind: Job
          name: paperless-agent-bootstrap
        fieldPaths:
          - spec.template.spec.containers.[name=bootstrap].image
