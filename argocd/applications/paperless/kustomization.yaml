apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless

resources:
  - secrets.yaml
  - postgres.yaml
  - backup-retention.yaml
  - valkey.yaml
  - paperless.yaml
  - converters.yaml
  - network.yaml

configMapGenerator:
  - name: paperless-backup-maintenance
    files:
      - prune_backups.py

generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
