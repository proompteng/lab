apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: paperless-secret-key
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  length: 64
  digits: 16
  symbols: 0
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: paperless-admin-password
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  length: 48
  digits: 12
  symbols: 0
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: paperless-valkey-password
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  length: 48
  digits: 12
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshPolicy: CreatedOnce
  target:
    name: paperless-runtime
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      data:
        PAPERLESS_SECRET_KEY: '{{ .secret_key }}'
        PAPERLESS_ADMIN_PASSWORD: '{{ .admin_password }}'
        VALKEY_PASSWORD: '{{ .valkey_password }}'
        PAPERLESS_REDIS: 'redis://:{{ .valkey_password }}@paperless-valkey.paperless.svc.cluster.local:6379/0'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: paperless-secret-key
      rewrite:
        - regexp:
            source: '^password$'
            target: secret_key
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: paperless-admin-password
      rewrite:
        - regexp:
            source: '^password$'
            target: admin_password
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: paperless-valkey-password
      rewrite:
        - regexp:
            source: '^password$'
            target: valkey_password
