apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: synthesis-db-major-upgrade
  namespace: synthesis
  labels:
    app.kubernetes.io/name: synthesis-db
    app.kubernetes.io/component: postgres-upgrade-backup
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cluster:
    name: synthesis-db
  method: volumeSnapshot
  online: false
  target: primary
