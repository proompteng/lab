apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: torghut-keeper
  namespace: torghut
  labels:
    app.kubernetes.io/name: torghut-keeper
    app.kubernetes.io/part-of: torghut
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  taskID: torghut-keeper-26-8-44-3
  reconciling:
    cleanup:
      unknownObjects:
        pvc: Retain
  configuration:
    settings:
      keeper_server/enable_reconfiguration: "true"
    clusters:
      - name: default
        layout:
          replicasCount: 1
        templates:
          podTemplate: chk-default
          volumeClaimTemplate: chk-data
  templates:
    podTemplates:
      - name: chk-default
        spec:
          nodeSelector:
            kubernetes.io/arch: arm64
          containers:
            - name: clickhouse-keeper
              image: mirror.gcr.io/clickhouse/clickhouse-keeper:26.8.44.3@sha256:623f6ba6c337be87b7dea23c076c85d035c6703711462d542eeba95d33b52eb8
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
    volumeClaimTemplates:
      - name: chk-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          storageClassName: local-path
  defaults:
    storageManagement:
      reclaimPolicy: Retain
    templates:
      podTemplate: chk-default
      volumeClaimTemplate: chk-data
