apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: torghut-keeper
  namespace: torghut
  labels:
    app.kubernetes.io/name: torghut-keeper
    app.kubernetes.io/part-of: torghut
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  taskID: torghut-keeper-26-8-20260910
  reconciling:
    cleanup:
      unknownObjects:
        pvc: Retain
  configuration:
    settings:
      keeper_server/enable_reconfiguration: "true"
    clusters:
      - name: default
        layout:
          replicasCount: 3
  templates:
    podTemplates:
      - name: chk-nvme
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      clickhouse-keeper.altinity.com/chk: torghut-keeper
                  topologyKey: kubernetes.io/hostname
          tolerations:
            - key: workload.proompteng.ai/compute-local
              operator: Equal
              value: "true"
              effect: NoSchedule
          containers:
            - name: clickhouse-keeper
              image: mirror.gcr.io/clickhouse/clickhouse-keeper:26.8.2.7@sha256:0fbe266b275a23b53508a7a3dac2e6fe149d63cddf242897a5c5c3d7b5350568
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
    volumeClaimTemplates:
      - name: chk-nvme-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
          storageClassName: local-path-keeper
  defaults:
    storageManagement:
      reclaimPolicy: Retain
    templates:
      podTemplate: chk-nvme
      volumeClaimTemplate: chk-nvme-data
