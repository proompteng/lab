apiVersion: batch/v1
kind: Job
metadata:
  name: signal-historical-datasets-schema-v1
  namespace: torghut
  labels:
    app.kubernetes.io/name: signal-historical-datasets-schema
    app.kubernetes.io/part-of: signal
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-historical-datasets-schema
        app.kubernetes.io/part-of: signal
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      restartPolicy: Never
      serviceAccountName: torghut-runtime
      containers:
        - name: migrate
          image: altinity/clickhouse-server:25.3.6.10034.altinitystable
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
          args:
            - |
              set -euo pipefail
              client=(
                clickhouse-client
                --host torghut-clickhouse.torghut.svc.cluster.local
                --port 9000
                --user "${CLICKHOUSE_USERNAME}"
                --password "${CLICKHOUSE_PASSWORD}"
                --connect_timeout 5
                --send_timeout 120
                --receive_timeout 120
              )

              until "${client[@]}" --query "SELECT 1" >/dev/null; do sleep 3; done
              "${client[@]}" --multiquery --query "
                CREATE DATABASE IF NOT EXISTS signal ON CLUSTER default;
                CREATE TABLE IF NOT EXISTS signal.historical_market_records_v1 ON CLUSTER default
                (
                  dataset_id FixedString(64),
                  record_id FixedString(64),
                  row_ordinal UInt64,
                  query_hash FixedString(64),
                  provider LowCardinality(String),
                  transport LowCardinality(String),
                  feed LowCardinality(String),
                  session_date Date,
                  symbol LowCardinality(String),
                  kind LowCardinality(String),
                  event_at DateTime64(9, 'UTC'),
                  retrieved_at DateTime64(3, 'UTC'),
                  payload String,
                  CONSTRAINT historical_provider CHECK provider = 'alpaca',
                  CONSTRAINT historical_transport CHECK transport = 'historical-rest',
                  CONSTRAINT historical_kind CHECK kind IN ('bars', 'quotes', 'trades')
                )
                ENGINE = ReplicatedMergeTree('/clickhouse/tables/{cluster}/{shard}/signal_historical_market_records_v1', '{replica}')
                PARTITION BY toYYYYMM(session_date)
                ORDER BY (dataset_id, query_hash, row_ordinal);
                CREATE TABLE IF NOT EXISTS signal.historical_dataset_chunks_v1 ON CLUSTER default
                (
                  dataset_id FixedString(64),
                  query_hash FixedString(64),
                  metadata String
                )
                ENGINE = ReplicatedMergeTree('/clickhouse/tables/{cluster}/{shard}/signal_historical_dataset_chunks_v1', '{replica}')
                ORDER BY (dataset_id, query_hash);
                CREATE TABLE IF NOT EXISTS signal.historical_datasets_v1 ON CLUSTER default
                (
                  dataset_id FixedString(64),
                  manifest String,
                  coverage String,
                  calendar String,
                  archived_at DateTime64(3, 'UTC')
                )
                ENGINE = ReplicatedMergeTree('/clickhouse/tables/{cluster}/{shard}/signal_historical_datasets_v1', '{replica}')
                ORDER BY dataset_id;
                SELECT throwIf(
                  engine != 'ReplicatedMergeTree' OR position(create_table_query, 'TTL ') > 0,
                  'Historical datasets must retain immutable versions without the live archive TTL'
                ) FROM system.tables WHERE database = 'signal' AND name IN ('historical_market_records_v1', 'historical_dataset_chunks_v1', 'historical_datasets_v1');
              "
          env:
            - name: CLICKHOUSE_USERNAME
              value: torghut
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: torghut-clickhouse-auth
                  key: torghut_password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
