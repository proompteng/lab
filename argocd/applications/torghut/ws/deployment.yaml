apiVersion: apps/v1
kind: Deployment
metadata:
  name: torghut-ws
  namespace: torghut
  labels:
    app: torghut-ws
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: torghut-ws
  template:
    metadata:
      labels:
        app: torghut-ws
      annotations:
        kubectl.kubernetes.io/restartedAt: 2026-05-01T01:25:51.190Z
        torghut.proompteng.ai/ws-config-generation: bayn-jev-latest-iex-v1
    spec:
      serviceAccountName: torghut-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: torghut-ws
          image: registry.ide-newton.ts.net/lab/torghut-ws@sha256:13144ab12d16d5c2bbb6ef67b8134db0c1a851d0e315b38a0e017c58c487bfa9
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: torghut-ws-config
          env:
            - name: ALPACA_OBSERVATION_SYMBOLS
              valueFrom:
                configMapKeyRef:
                  name: bayn-universe-v2
                  key: UNIVERSE_SYMBOLS
            - name: MARKET_DATA_UNIVERSE_ID
              valueFrom:
                configMapKeyRef:
                  name: bayn-universe-v2
                  key: UNIVERSE_ID
            - name: MARKET_DATA_UNIVERSE_SYMBOL_HASH
              valueFrom:
                configMapKeyRef:
                  name: bayn-universe-v2
                  key: UNIVERSE_SYMBOL_HASH
            - name: ALPACA_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: torghut-alpaca
                  key: APCA_API_KEY_ID
            - name: ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: torghut-alpaca
                  key: APCA_API_SECRET_KEY
            - name: KAFKA_SASL_USER
              value: torghut-ws
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: torghut-ws
                  key: password
            - name: TORGHUT_WS_VERSION
              value: kargo-sha-65698e1ee1e63356e4899763dc5cdb41c2b0eef4
            - name: TORGHUT_WS_COMMIT
              value: 65698e1ee1e63356e4899763dc5cdb41c2b0eef4
            - name: JAVA_TOOL_OPTIONS
              value: -XX:+UseContainerSupport -XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError
            - name: DORVUD_GLITCHTIP_DSN
              valueFrom:
                configMapKeyRef:
                  name: dorvud-glitchtip
                  key: DORVUD_GLITCHTIP_DSN
            - name: DORVUD_ERROR_SERVICE
              value: torghut-ws
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      nodeSelector: {}
      tolerations: []
