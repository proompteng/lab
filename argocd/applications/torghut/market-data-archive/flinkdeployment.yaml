apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: market-data-archive
  namespace: torghut
  labels:
    app: market-data-archive
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # The TA release workflow pins the same immutable image used by the live and simulation TA jobs.
  image: registry.ide-newton.ts.net/lab/torghut-ta@sha256:3323f9c2035aaba337da46cac2f36e66a36980a6eaa37384586dd84f7dfb931c
  imagePullPolicy: IfNotPresent
  # Cut over from the skewed v2 quote consumer to the repartitioned v3 consumer.
  # Existing ClickHouse history stays intact; the new group begins at each topic's live head.
  restartNonce: 14
  flinkVersion: v2_2
  serviceAccount: torghut-runtime
  logConfiguration:
    log4j-console.properties: |-
      rootLogger.level = INFO
      rootLogger.appenderRef.console.ref = ConsoleAppender
      rootLogger.appenderRef.glitchtip.ref = GlitchTip
      appender.console.name = ConsoleAppender
      appender.console.type = CONSOLE
      appender.console.layout.type = PatternLayout
      appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n
      appender.glitchtip.type = DorvudGlitchTip
      appender.glitchtip.name = GlitchTip
  flinkConfiguration:
    kubernetes.operator.job.upgrade.last-state-fallback.enabled: "false"
    kubernetes.operator.job.restart.failed: "true"
    state.checkpoints.dir: s3a://flink-checkpoints/torghut/market-data-archive/checkpoints
    state.savepoints.dir: s3a://flink-checkpoints/torghut/market-data-archive/savepoints
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    execution.checkpointing.unaligned: "true"
    execution.checkpointing.tolerable-failed-checkpoints: "3"
    taskmanager.numberOfTaskSlots: "2"
    restart-strategy.type: exponential-delay
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    fs.s3a.endpoint: http://rook-ceph-rgw-objectstore.rook-ceph.svc:80
    fs.s3a.connection.ssl.enabled: "false"
    fs.s3a.path.style.access: "true"
  podTemplate:
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        app: market-data-archive
    spec:
      serviceAccountName: torghut-runtime
      containers:
        - name: flink-main-container
          envFrom:
            - configMapRef:
                name: market-data-archive-config
            - configMapRef:
                name: bayn-universe-v2
          env:
            - name: ARCHIVE_KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: torghut-ws
                  key: password
            - name: ARCHIVE_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signal-publisher-clickhouse-auth
                  key: password
            - name: TORGHUT_TA_VERSION
              value: kargo-sha-608e2d1127bab4479d65ab87b4947058f4cb269b
            - name: TORGHUT_TA_COMMIT
              value: 608e2d1127bab4479d65ab87b4947058f4cb269b
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: flink-checkpoints
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: flink-checkpoints
                  key: AWS_SECRET_ACCESS_KEY
            - name: DORVUD_GLITCHTIP_DSN
              valueFrom:
                configMapKeyRef:
                  name: dorvud-glitchtip
                  key: DORVUD_GLITCHTIP_DSN
            - name: DORVUD_ERROR_SERVICE
              value: market-data-archive
          ports:
            - containerPort: 9249
              name: metrics
  jobManager:
    resource:
      cpu: 0.5
      memory: 1024m
    replicas: 1
  taskManager:
    resource:
      cpu: 2
      memory: 2048m
    replicas: 8
  job:
    entryClass: ai.proompteng.dorvud.ta.flink.MarketDataArchiveJobKt
    jarURI: local:///opt/flink/usrlib/app.jar
    parallelism: 16
    upgradeMode: savepoint
    state: running
