apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-workflows-alloy
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: argo-workflows-alloy
    app.kubernetes.io/component: logging
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-workflows-alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argo-workflows-alloy
        app.kubernetes.io/component: logging
    spec:
      serviceAccountName: argo-workflows-alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.river
          workingDir: /var/lib/alloy
          ports:
            - name: http-metrics
              containerPort: 12345
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy
      volumes:
        - name: config
          configMap:
            name: argo-workflows-alloy
            items:
              - key: config.river
                path: config.river
        - name: data
          emptyDir: {}
