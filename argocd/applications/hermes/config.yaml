_config_version: 46

dashboard:
  public_url: https://hermes.ide-newton.ts.net
  show_token_analytics: false
  trusted_proxies:
    - 10.244.0.0/16

model:
  default: qwen36-flamingo
  provider: flamingo
  context_length: 262144

providers:
  flamingo:
    model: qwen36-flamingo
    base_url: http://flamingo.flamingo.svc.cluster.local/v1
    api_mode: chat_completions
    context_length: 262144
    extra_body:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
      chat_template_kwargs:
        enable_thinking: true

toolsets: [file, memory, session_search, terminal, todo, web, skills]

auxiliary:
  compression:
    provider: flamingo
    timeout: 180
    max_concurrency: 1
  title_generation:
    provider: flamingo
    timeout: 30
    max_concurrency: 1
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  vision:
    provider: flamingo
  memory_query_rewrite:
    provider: flamingo
    max_concurrency: 1
  skills_hub:
    provider: flamingo
    max_concurrency: 1
  background_review:
    enabled: false

terminal:
  backend: local
  cwd: /opt/data/workspace/tuslagch/lab
  timeout: 180
  lifetime_seconds: 900
  home_mode: profile
  shell_init_files:
    - /etc/profile.d/hermes-tools.sh

tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 3
    same_tool_failure: 4
    idempotent_no_progress: 3
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 7
    idempotent_no_progress: 5

compression:
  enabled: true
  threshold: 0.75
  threshold_tokens: 65536
  tail_mode: lean
  target_ratio: 0.32
  protect_last_n: 20
  protect_first_n: 3
  min_tail_user_messages: 3
  abort_on_summary_failure: true

memory:
  provider: ""
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 4400
  user_char_limit: 2200
  nudge_interval: 10

sessions:
  auto_prune: false

context:
  engine: compressor

max_concurrent_sessions: 4
max_live_sessions: 4
group_sessions_per_user: true

streaming:
  enabled: true

skills:
  creation_nudge_interval: 14
  project_discovery: true
  trusted_project_dirs:
    - /opt/data/workspace/tuslagch/lab
  inline_shell: false
  guard_agent_created: true

curator:
  enabled: false

display:
  streaming: true
  show_reasoning: true
  reasoning_full: false
  tool_progress_command: true

agent:
  max_turns: 80
  budget_warning_ratio: 0.75
  gateway_timeout: 1800
  gateway_timeout_warning: 1200
  restart_drain_timeout: 90
  api_max_retries: 2
  verify_on_stop: true
  verbose: false
  reasoning_effort: medium
  coding_context: "on"
  tool_use_enforcement: true
  intent_ack_continuation: true
  disabled_toolsets: [delegation, cronjob, code_execution, kanban]
  agent_cache:
    max_size: 4
    idle_ttl_secs: 1800
    protect_recent: 2
  coding_instructions:
    - Keep all mutable work inside /opt/data/workspace/tuslagch.
    - Treat /opt/data/workspace/tuslagch/lab as the project root and default working directory.
    - Use the authenticated tuslagch GitHub identity, codex/ branches, and pull requests for explicitly requested repository changes; never force-push or push directly to main.
    - Kubernetes access is cluster-wide read-only; never attempt to mutate resources or read Kubernetes Secrets.
    - Never claim an external action completed without a fresh readback.
    - Manage persistent configuration, plugins, tools, and integrations through reviewed GitOps changes; never use dashboard controls or runtime installers to configure this instance.
    - Work directly without subagents or delegation.

platform_toolsets:
  cli: [file, memory, session_search, terminal, todo, web, skills]
  api_server: [file, memory, session_search, terminal, todo, web, skills]
  discord: [file, memory, session_search, terminal, todo, web, skills]

platforms:
  discord:
    enabled: true
    reply_to_mode: first
    gateway_restart_notification: false
    typing_indicator: true
  api_server:
    enabled: true
    extra:
      host: 0.0.0.0
      port: 8642
      model_name: tuslagch

gateway:
  write_sessions_json: false
  multiplex_profiles: false
  auto_multiplex_migration: false
  api_server:
    max_concurrent_runs: 2

approvals:
  mode: manual
  timeout: 90
  cron_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true
  deny:
    - "*docker*"
    - "*podman*"
    - "*printenv*"
    - "* /proc/*/environ*"
    - "*curl*"
    - "*wget*"
    - "*nc *"
    - "*ncat*"
    - "*socat*"
    - "*dig *"
    - "*nslookup*"
    - "*ssh *"
    - "*scp *"
    - "*git push --force*"

command_allowlist:
  - "kubectl get *"
  - "kubectl * get *"
  - "kubectl describe *"
  - "kubectl * describe *"
  - "kubectl logs *"
  - "kubectl * logs *"
  - "kubectl top *"
  - "kubectl * top *"
  - "kubectl events *"
  - "kubectl * events *"
  - "kubectl api-resources*"
  - "kubectl api-versions*"
  - "kubectl cluster-info*"
  - "kubectl version*"
  - "kubectl explain *"
  - "kubectl auth can-i *"
  - "kubectl rollout status *"
  - "kubectl * rollout status *"
  - "kubectl rollout history *"
  - "kubectl * rollout history *"

checkpoints:
  enabled: true
  max_snapshots: 20

plugins:
  enabled: [security-guidance]
  disabled: []

web:
  search_backend: exa
  extract_backend: exa
  keyless_fallback: false
  keyless_rescue: false
  cache_enabled: true
  cache_ttl_minutes: 20

mcp_servers: {}

delegation:
  orchestrator_enabled: false
  subagent_auto_approve: false
  inherit_mcp_toolsets: false

stt:
  enabled: false

cron:
  allow_agent_scheduling: false

kanban:
  dispatch_in_gateway: false
  auto_decompose: false

security:
  redact_secrets: true
  protected_instruction_files: true
  allow_lazy_installs: false

telemetry:
  shared_metrics:
    enabled: false
    send: false

lsp:
  install_strategy: manual

logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3

privacy:
  redact_pii: true

hooks_auto_accept: false
timezone: America/Los_Angeles

updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: discard
