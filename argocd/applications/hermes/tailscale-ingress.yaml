apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-tailscale
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: gateway
  annotations:
    tailscale.com/tags: tag:k8s
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - hermes.ide-newton.ts.net
  rules:
    - host: hermes.ide-newton.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes
                port:
                  name: api
