apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: penpot-api-key
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  length: 64
  digits: 16
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: penpot-api-key
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: penpot-api-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        PENPOT_SECRET_KEY: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: penpot-api-key
