apiVersion: batch/v1
kind: Job
metadata:
  name: bayn-valkey-acceptance-v3
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-valkey-acceptance
        app.kubernetes.io/part-of: bayn
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        network.proompteng.ai/100g: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify
          image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
          command: [sh, /scripts/verify.sh]
          envFrom:
            - configMapRef:
                name: bayn-valkey-connection
          env:
            - name: TEST_RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: bayn-valkey-auth
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: client-tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: bayn-valkey-acceptance
        - name: client-tls
          secret:
            secretName: bayn-valkey-client-tls
