apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bayn-valkey-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bayn-valkey-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  isCA: true
  commonName: bayn-valkey-ca
  secretName: bayn-valkey-ca
  duration: 175200h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: bayn-valkey-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bayn-valkey-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ca:
    secretName: bayn-valkey-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bayn-valkey-client
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  commonName: bayn-valkey-client
  secretName: bayn-valkey-client-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - client auth
  issuerRef:
    name: bayn-valkey-ca
    kind: Issuer
