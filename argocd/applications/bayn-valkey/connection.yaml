apiVersion: v1
kind: ConfigMap
metadata:
  name: bayn-valkey-connection
data:
  VALKEY_HOST: rfr-bayn-valkey-readwrite.bayn.svc.cluster.local
  VALKEY_REPLICA_HOST: rfr-bayn-valkey-readonly.bayn.svc.cluster.local
  VALKEY_PORT: "6379"
  VALKEY_USERNAME: default
  VALKEY_TLS_SERVER_NAME: rfr-bayn-valkey-readwrite.bayn
  VALKEY_CLUSTER_MODE: "false"
  VALKEY_PASSWORD_SECRET: bayn-valkey-auth
  VALKEY_CLIENT_TLS_SECRET: bayn-valkey-client-tls
