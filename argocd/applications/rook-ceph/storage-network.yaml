    {
      "cniVersion": "0.3.1",
      "name": "ceph-cluster-100g",
      "type": "macvlan",
      "master": "storage0",
      "mode": "bridge",
      "mtu": 1500,
      "ipam": {
        "type": "whereabouts",
        "range": "10.100.0.0/24",
        "range_start": "10.100.0.64",
        "range_end": "10.100.0.239"
      }
    }
