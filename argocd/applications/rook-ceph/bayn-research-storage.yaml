apiVersion: ceph.rook.io/v1
kind: CephObjectStoreAccount
metadata:
  name: bayn-research
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  store: objectstore
  rootUser:
    displayName: bayn-research-owner
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: bayn-research-capture
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  store: objectstore
  displayName: bayn-research-capture
  accountRef:
    name: bayn-research
  opMask:
    - read
    - write
  quotas:
    maxBuckets: -1
---
apiVersion: v1
kind: Secret
metadata:
  name: rook-ceph-object-user-objectstore-bayn-research-capture
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: bayn
type: kubernetes.io/rook
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bayn-research-storage-bootstrap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bayn-research-storage-bootstrap
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: rook-ceph-rgw
              rook_cluster: rook-ceph
              rook_object_store: objectstore
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bayn-research-storage-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "4"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-research-storage-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/amazon/aws-cli:2.31.7@sha256:8173c3c7c71e25b0824025b90a85df6e24c696f646498dca9dd370ea446e4fc8
          command:
            - /bin/bash
            - /config/bootstrap.sh
          env:
            - name: HOME
              value: /tmp
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_PAGER
              value: ""
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: when_required
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: owner
              mountPath: /owner
              readOnly: true
            - name: capture
              mountPath: /capture
              readOnly: true
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: bayn-research-storage-bootstrap
        - name: owner
          secret:
            secretName: rook-ceph-object-root-user-bayn-research
            items:
              - key: AccessKey
                path: AccessKey
              - key: SecretKey
                path: SecretKey
        - name: capture
          secret:
            secretName: rook-ceph-object-user-objectstore-bayn-research-capture
            items:
              - key: AccessKey
                path: AccessKey
              - key: SecretKey
                path: SecretKey
        - name: scratch
          emptyDir:
            sizeLimit: 8Mi
