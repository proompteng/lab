apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nanoagent-qemu
  labels:
    app.kubernetes.io/name: nanoagent
    app.kubernetes.io/instance: qemu
    app.kubernetes.io/component: runtime-canary
    app.kubernetes.io/part-of: kata
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nanoagent
      app.kubernetes.io/instance: qemu
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanoagent
        app.kubernetes.io/instance: qemu
        app.kubernetes.io/component: runtime-canary
        app.kubernetes.io/part-of: kata
        runtime.proompteng.ai/vmm: qemu
    spec:
      runtimeClassName: kata-qemu
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      nodeSelector:
        runtime.proompteng.ai/kata-qemu: ready
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nanoagent
          image: ghcr.io/proompteng/nanoagent@sha256:78b7b6e52e9b3f6003d2663a5e85fbfb55eabba018a6ee61f6b39a722f71ad7c
          imagePullPolicy: IfNotPresent
          env:
            - name: MICROVM_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: MICROVM_BOOTSTRAP_TOKEN
              value: kata-canary-proof-v1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 256Mi
---
