apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metallb-system
resources:
  - github.com/metallb/metallb//config/native?ref=v0.16.2
  - ipaddresspool.yaml
  - l2advertisement.yaml
images:
  - name: quay.io/metallb/controller
    newName: quay.io/metallb/controller
    newTag: v0.16.2
    digest: sha256:34a6f107f29c4fc6e9d084a7f3bdb781aae7b5ee2b534195a2775ab68c09c503
  - name: quay.io/metallb/speaker
    newName: quay.io/metallb/speaker
    newTag: v0.16.2
    digest: sha256:01666518b091a6651d68891c802db84b2219495d7e0e41c2e61c46f9976be231
patches:
  - target:
      kind: Namespace
      name: metallb-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: metallb-system
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: speaker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --ignore-exclude-lb
      - op: add
        path: /spec/template/spec/tolerations/-
        value:
          key: workload.proompteng.ai/compute-local
          operator: Equal
          value: "true"
          effect: NoSchedule
