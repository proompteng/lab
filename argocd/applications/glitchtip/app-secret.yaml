# Generate a stable, per-installation Django key without storing plaintext in Git.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: glitchtip-app-key
  namespace: glitchtip
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  length: 64
  digits: 16
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-app-key
  namespace: glitchtip
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: glitchtip-app-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        SECRET_KEY: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: glitchtip-app-key
