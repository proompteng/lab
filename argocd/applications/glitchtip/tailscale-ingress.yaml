apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glitchtip-tailscale
  namespace: glitchtip
  annotations:
    tailscale.com/tags: tag:k8s
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - glitchtip.ide-newton.ts.net
  rules:
    - host: glitchtip.ide-newton.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glitchtip-web
                port:
                  number: 80
