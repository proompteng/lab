# Reuse the existing Brevo SMTP identity and sender in infra/brevo (1Password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-brevo-email
  namespace: glitchtip
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: glitchtip-brevo-email
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        EMAIL_URL: 'smtp+tls://{{ .username | urlquery }}:{{ .password | urlquery }}@smtp-relay.brevo.com:587'
        DEFAULT_FROM_EMAIL: '{{ .from }}'
        # This is the existing operations recipient, only used for smoke tests.
        EMAIL_TEST_RECIPIENT: '{{ .to }}'
  dataFrom:
    - extract:
        key: brevo
