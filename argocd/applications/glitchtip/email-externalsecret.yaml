# Reuse the existing Brevo SMTP identity and sender in infra/brevo (1Password).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glitchtip-brevo-email
  namespace: glitchtip
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: glitchtip-brevo-email
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        EMAIL_URL: 'smtp+tls://{{ .smtp_username | urlquery }}:{{ .smtp_password | urlquery }}@smtp-relay.brevo.com:587'
        DEFAULT_FROM_EMAIL: '{{ .smtp_from }}'
        # This is the existing operations recipient, only used for smoke tests.
        EMAIL_TEST_RECIPIENT: '{{ .email_to }}'
  data:
    - secretKey: smtp_username
      remoteRef:
        key: brevo/username
    - secretKey: smtp_password
      remoteRef:
        key: brevo/password
    - secretKey: smtp_from
      remoteRef:
        key: brevo/from
    - secretKey: email_to
      remoteRef:
        key: brevo/to
