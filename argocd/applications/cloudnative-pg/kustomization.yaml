apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudnative-pg
resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.16.0/manifest.yaml
helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.io/charts
    version: 0.29.2
    releaseName: cloudnative-pg
    namespace: cloudnative-pg
    includeCRDs: true
    valuesInline:
      config:
        data:
          CLUSTERS_ROLLOUT_DELAY: "30"
          INSTANCES_ROLLOUT_DELAY: "5"
patches:
  - target:
      kind: Deployment
      name: barman-cloud
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: barman-cloud
      spec:
        template:
          spec:
            containers:
              - name: barman-cloud
                image: ghcr.io/cloudnative-pg/plugin-barman-cloud:v0.16.0@sha256:6404a416718bd7aad943c67a25a7bb20d0558b43edfeab0bf167f013ca435882
                args:
                  - operator
                  - --server-cert=/server/tls.crt
                  - --server-key=/server/tls.key
                  - --client-cert=/client/tls.crt
                  - --server-address=:9090
                  - --leader-elect
                  - --log-level=info
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
  - target:
      kind: Secret
      name: plugin-barman-cloud-5kkd8f288d
    patch: |-
      - op: replace
        path: /data/SIDECAR_IMAGE
        value: Z2hjci5pby9jbG91ZG5hdGl2ZS1wZy9wbHVnaW4tYmFybWFuLWNsb3VkLXNpZGVjYXI6djAuMTYuMEBzaGEyNTY6YzY2OTI1OWUyMGVkMWUxMWZhZDgyMWY3MzVjMzk2YzE5ZDkyOTk4NWFhMDViOTU0NGIxM2VjYzhiNWEzODZkMA==
