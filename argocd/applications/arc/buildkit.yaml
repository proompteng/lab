---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arc-buildkit
  namespace: arc
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arc-buildkit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: runner
            matchExpressions:
              - key: actions.github.com/scale-set-name
                operator: In
                values:
                  - arc-amd64
                  - arc-arm64
      ports:
        - protocol: TCP
          port: 1234
