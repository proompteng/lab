          githubConfigSecret: github-token
          runnerScaleSetName: arc-arm64-tmpfs
          scaleSetLabels:
            - arc-arm64-tmpfs
          minRunners: 0
          maxRunners: 8
          listenerTemplate: &tmpfs-listener
            spec:
              nodeSelector:
                kubernetes.io/arch: amd64
                kubernetes.io/hostname: talos-192-168-1-194
              tolerations:
                - key: workload.proompteng.ai/compute-local
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
              dnsConfig:
                searches:
                  - ide-newton.ts.net
              containers:
                - name: listener
          template:
            spec:
              serviceAccountName: arc-arm64-gha-rs-kube-mode
              nodeSelector:
