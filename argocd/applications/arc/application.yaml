                    - name: CARGO_HOME
                      value: /home/runner/.cache/cargo
                    - name: RUSTUP_HOME
                      value: /home/runner/.cache/rustup
                  volumeMounts: &tmpfs-mounts
                    - name: scratch
                      mountPath: /nix
                      subPath: nix
                    - name: scratch
                      mountPath: /home/runner/.cache
                      subPath: cache
                    - name: scratch
                      mountPath: /tmp
                      subPath: tmp
                    - name: scratch
                      mountPath: /var/tmp
                      subPath: var-tmp
                    - name: scratch
                      mountPath: /home/runner/_work
                      subPath: work
              volumes:
                - name: scratch
                  emptyDir:
                    medium: Memory
                    sizeLimit: 16Gi
