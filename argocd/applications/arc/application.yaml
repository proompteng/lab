apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io
      chart: actions/actions-runner-controller-charts/gha-runner-scale-set-controller
      targetRevision: 0.15.1
      helm:
        releaseName: arc-controller
        valuesObject:
          nodeSelector:
            kubernetes.io/arch: amd64
            kubernetes.io/hostname: talos-192-168-1-194
          tolerations:
            - key: workload.proompteng.ai/compute-local
              operator: Equal
              value: "true"
              effect: NoSchedule
    - repoURL: ghcr.io
      chart: actions/actions-runner-controller-charts/gha-runner-scale-set
      targetRevision: 0.15.1
      helm:
        releaseName: arc-runner-set
        valuesObject:
          controllerServiceAccount:
            name: arc-controller-gha-rs-controller
            namespace: arc
          githubConfigUrl: https://github.com/proompteng/lab
          githubConfigSecret: github-token
          runnerScaleSetName: arc-arm64
          scaleSetLabels:
            - arc-arm64
          minRunners: 5
          maxRunners: 10
          listenerTemplate:
            spec:
              nodeSelector:
                kubernetes.io/arch: amd64
                kubernetes.io/hostname: talos-192-168-1-194
              tolerations:
                - key: workload.proompteng.ai/compute-local
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
              dnsConfig:
                searches:
                  - ide-newton.ts.net
              containers:
                - name: listener
          template:
            spec:
              serviceAccountName: arc-arm64-gha-rs-kube-mode
              nodeSelector:
                kubernetes.io/arch: arm64
                kubernetes.io/hostname: talos-192-168-1-85
              dnsConfig:
                searches:
                  - ide-newton.ts.net
              securityContext:
                runAsNonRoot: false
                fsGroup: 1001
                fsGroupChangePolicy: OnRootMismatch
              initContainers:
                - name: init-scratch
                  image: registry.ide-newton.ts.net/lab/arc-runner@sha256:a8c4b666048512444f9304166a049fd18dff51367af568e1248f59ec5bb59ea0
                  command: [ "/bin/bash", "-lc" ]
                  args:
                    - |
                      set -Eeuo pipefail

                      fail() {
                        echo "arc scratch bootstrap: $*" >&2
                        exit 1
                      }

                      tree_stats() {
                        find "$1" -xdev \( -type f -printf 'f %s\n' -o -type l -printf 'l\n' \) |
                          awk '
                            $1 == "f" { bytes += $2; files++ }
                            $1 == "l" { links++ }
                            END { printf "%.0f %d %d\n", bytes, files, links }
                          '
                      }

                      scratch=/scratch
                      root_device="$(df -P -T / | awk 'NR == 2 {print $1}')"
                      scratch_device="$(df -P -T "$scratch" | awk 'NR == 2 {print $1}')"
                      scratch_fstype="$(df -P -T "$scratch" | awk 'NR == 2 {print $2}')"

                      [[ "$scratch_device" && "$scratch_fstype" ]] ||
                        fail "scratch volume is not mounted"
                      [[ "$scratch_fstype" == ext4 ]] ||
                        fail "expected a Ceph RBD ext4 scratch volume, got filesystem $scratch_fstype"
                      [[ "$scratch_device" =~ ^/dev/rbd[0-9]+$ ]] ||
                        fail "expected a kernel RBD scratch device, got $scratch_device"
                      [[ "$scratch_device" != overlay && "$scratch_device" != "$root_device" ]] ||
                        fail "scratch path resolves to the runner root filesystem ($scratch_device)"

                      # A terminated init can leave a partial staging tree on the same ephemeral volume.
                      # Remove old attempts before measuring/copying so retries cannot consume capacity.
                      find "$scratch" -mindepth 1 -maxdepth 1 -type d -name '.arc-bootstrap.*' -exec rm -rf -- {} +
                      rm -rf "$scratch/nix" "$scratch/cache" "$scratch/tmp" "$scratch/var-tmp" "$scratch/work" "$scratch/.arc-bootstrap-complete"
                      scratch_available_kib="$(df -P -k "$scratch" | awk 'NR == 2 {print $4}')"
                      [[ "$scratch_available_kib" =~ ^[0-9]+$ ]] ||
                        fail "scratch volume has no readable capacity"

                      # The Ceph RBD claim has a real filesystem capacity limit. Keep at least 45GiB
                      # free after the image/cache copy so a runner cannot start on a nearly full volume.
                      mkdir -p /home/runner/.cache
                      reserve_bytes=$((45 * 1024 * 1024 * 1024))
                      stats="$(tree_stats "/nix")"
                      read -r nix_file_bytes nix_files nix_links <<< "$stats"
                      stats="$(tree_stats "/home/runner/.cache")"
                      read -r cache_file_bytes cache_files cache_links <<< "$stats"
                      required_bytes=$((nix_file_bytes + cache_file_bytes + reserve_bytes))
                      available_bytes=$((scratch_available_kib * 1024))
                      (( available_bytes >= required_bytes )) ||
                        fail "scratch free space ${available_bytes} is below required ${required_bytes}"

                      stage="$scratch/.arc-bootstrap.$$"
                      trap 'rm -rf "$stage"' EXIT
                      mkdir -p "$stage/nix" "$stage/cache" "$stage/tmp" "$stage/var-tmp" "$stage/work"

                      # Keep /nix visible from the image while copying. The runner mounts the
                      # completed subdirectory only after this init container exits successfully.
                      cp -a /nix/. "$stage/nix/"
                      cp -a /home/runner/.cache/. "$stage/cache/"

                      stats="$(tree_stats "$stage/nix")"
                      read -r staged_nix_file_bytes staged_nix_files staged_nix_links <<< "$stats"
                      stats="$(tree_stats "$stage/cache")"
                      read -r staged_cache_file_bytes staged_cache_files staged_cache_links <<< "$stats"
                      [[ "$staged_nix_file_bytes" == "$nix_file_bytes" ]] ||
                        fail "partial /nix copy: $staged_nix_file_bytes file bytes copied, expected $nix_file_bytes"
                      [[ "$staged_nix_files" == "$nix_files" ]] ||
                        fail "partial /nix copy: $staged_nix_files files copied, expected $nix_files"
                      [[ "$staged_nix_links" == "$nix_links" ]] ||
                        fail "partial /nix copy: $staged_nix_links symlinks copied, expected $nix_links"
                      [[ "$staged_cache_file_bytes" == "$cache_file_bytes" ]] ||
                        fail "partial cache copy: $staged_cache_file_bytes file bytes copied, expected $cache_file_bytes"
                      [[ "$staged_cache_files" == "$cache_files" ]] ||
                        fail "partial cache copy: $staged_cache_files files copied, expected $cache_files"
                      [[ "$staged_cache_links" == "$cache_links" ]] ||
                        fail "partial cache copy: $staged_cache_links symlinks copied, expected $cache_links"
                      [[ -d "$stage/nix/store" && -d "$stage/nix/var" ]] ||
                        fail "partial /nix copy: store or var is missing"

                      # The runner remains a single-user UID 1001 process after the mount. Preserve all
                      # copied modes and links while making writable Nix state owned by that user.
                      mkdir -p "$stage/cache/cargo" "$stage/cache/rustup"
                      chown -R 1001:1001 "$stage/nix" "$stage/cache"
                      chmod 755 "$stage/nix" "$stage/nix/store" "$stage/nix/var" "$stage/cache"
                      chmod 00700 "$stage/cache/cargo" "$stage/cache/rustup"
                      # The leading zero clears fsGroup's inherited setgid bit before Nix builds use /tmp.
                      chmod 01777 "$stage/tmp"
                      chmod 01777 "$stage/var-tmp"
                      chown 0:1001 "$stage/work"
                      chmod 2777 "$stage/work"

                      post_copy_available_kib="$(df -P -k "$scratch" | awk 'NR == 2 {print $4}')"
                      [[ "$post_copy_available_kib" =~ ^[0-9]+$ ]] ||
                        fail "scratch volume capacity cannot be read after copy"
                      post_copy_available_bytes=$((post_copy_available_kib * 1024))
                      (( post_copy_available_bytes >= reserve_bytes )) ||
                        fail "scratch free space ${post_copy_available_bytes} is below 45GiB after copy"

                      # Install only after all validation and copies have succeeded. A failed init leaves
                      # no runnable main container and the next retry rebuilds from the image again.
                      rm -rf "$scratch/nix" "$scratch/cache" "$scratch/tmp" "$scratch/var-tmp" "$scratch/work"
                      mv "$stage/nix" "$scratch/nix"
                      mv "$stage/cache" "$scratch/cache"
                      mv "$stage/tmp" "$scratch/tmp"
                      mv "$stage/var-tmp" "$scratch/var-tmp"
                      mv "$stage/work" "$scratch/work"
                      printf 'version=6\nnix_file_bytes=%s\nnix_files=%s\nnix_symlinks=%s\ncache_file_bytes=%s\ncache_files=%s\ncache_symlinks=%s\n' \
                        "$nix_file_bytes" "$nix_files" "$nix_links" "$cache_file_bytes" "$cache_files" "$cache_links" > "$scratch/.arc-bootstrap-complete"
                      chown 1001:1001 "$scratch/.arc-bootstrap-complete"
                      rm -rf "$stage"
                      trap - EXIT
                  securityContext:
                    runAsUser: 0
                    runAsGroup: 0
                  volumeMounts:
                    - name: scratch
                      mountPath: /scratch
                  resources:
                    requests:
                      cpu: "1"
                      memory: "2Gi"
                    limits:
                      cpu: "2"
                      memory: "8Gi"
              containers:
                - name: runner
                  image: registry.ide-newton.ts.net/lab/arc-runner@sha256:a8c4b666048512444f9304166a049fd18dff51367af568e1248f59ec5bb59ea0
                  securityContext:
                    privileged: true
                  command: [ "/home/runner/run.sh" ]
                  resources:
                    requests:
                      cpu: "4"
                      memory: "8Gi"
                      ephemeral-storage: "10Gi"
                    limits:
                      cpu: "20"
                      memory: "16Gi"
                      ephemeral-storage: "100Gi"
                  env:
                    - name: ACTIONS_RUNNER_CONTAINER_HOOKS
                      value: /home/runner/k8s/index.js
                    - name: ARC_RUNNER_NODE_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: spec.nodeName
                    - name: ACTIONS_RUNNER_POD_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.name
                    - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                      value: "false"
                    - name: CARGO_HOME
                      value: /home/runner/.cache/cargo
                    - name: RUSTUP_HOME
                      value: /home/runner/.cache/rustup
                  volumeMounts:
                    - name: scratch
                      mountPath: /nix
                      subPath: nix
                    - name: scratch
                      mountPath: /home/runner/.cache
                      subPath: cache
                    - name: scratch
                      mountPath: /tmp
                      subPath: tmp
                    - name: scratch
                      mountPath: /var/tmp
                      subPath: var-tmp
                    - name: scratch
                      mountPath: /home/runner/_work
                      subPath: work
              volumes:
                - name: scratch
                  ephemeral:
                    volumeClaimTemplate:
                      metadata:
                        labels:
                          actions.github.com/scale-set-name: arc-arm64
                          storage.proompteng.ai/durability: rebuildable
                      spec:
                        accessModes:
                          - ReadWriteOnce
                        storageClassName: rook-ceph-block
                        volumeMode: Filesystem
                        resources:
                          requests:
                            storage: 64Gi
