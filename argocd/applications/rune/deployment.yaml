apiVersion: apps/v1
kind: Deployment
metadata:
  name: rune
  labels:
    app.kubernetes.io/name: rune
spec:
  replicas: 1
  progressDeadlineSeconds: 14400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rune
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rune
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: turin
        nvidia.com/gpu.present: "true"
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rune
          image: registry.ide-newton.ts.net/lab/rune:unpromoted
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: rune-models
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
