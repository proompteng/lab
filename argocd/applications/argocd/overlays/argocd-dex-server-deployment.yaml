apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
spec:
  template:
    spec:
      containers:
        - name: dex
          readinessProbe:
            tcpSocket:
              port: 5556
            periodSeconds: 5
            timeoutSeconds: 2
          env:
            - name: ARGO_WORKFLOWS_SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: argo-workflows-sso
                  key: client-secret
                  optional: true
            - name: ARGO_WORKFLOWS_SSO_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: argo-workflows-sso
                  key: hash
                  optional: true
            - name: ARGOCD_DEX_SERVER_DISABLE_TLS
              value: "true"
              valueFrom: null
