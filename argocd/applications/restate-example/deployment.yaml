apiVersion: apps/v1
kind: Deployment
metadata:
  name: restate-example
  labels:
    app.kubernetes.io/name: restate-example
    app.kubernetes.io/part-of: restate-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: restate-example
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restate-example
        app.kubernetes.io/part-of: restate-example
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-bundle
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              cat /bundle/part-00.b64 /bundle/part-01.b64 /bundle/part-02.b64 \
                | base64 -d \
                | gzip -d > /app/server.js
              test -s /app/server.js
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: bundle-00
              mountPath: /bundle/part-00.b64
              subPath: part-00.b64
              readOnly: true
            - name: bundle-01
              mountPath: /bundle/part-01.b64
              subPath: part-01.b64
              readOnly: true
            - name: bundle-02
              mountPath: /bundle/part-02.b64
              subPath: part-02.b64
              readOnly: true
            - name: app
              mountPath: /app
      containers:
        - name: server
          image: oven/bun:1.4.0-slim
          imagePullPolicy: IfNotPresent
          command:
            - bun
            - /app/server.js
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "9080"
          ports:
            - name: restate
              containerPort: 9080
          readinessProbe:
            tcpSocket:
              port: restate
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: restate
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: bun-cache
              mountPath: /home/bun/.bun
      volumes:
        - name: bundle-00
          configMap:
            name: restate-example-bundle-00
        - name: bundle-01
          configMap:
            name: restate-example-bundle-01
        - name: bundle-02
          configMap:
            name: restate-example-bundle-02
        - name: app
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: bun-cache
          emptyDir: {}
