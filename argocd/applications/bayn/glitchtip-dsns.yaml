  bayn-execution: http://8731b10507a04c029414026eff307d5f@glitchtip-web.glitchtip.svc.cluster.local/3
  bayn-research: http://77fce066fb6a41478f5141ca97327403@glitchtip-web.glitchtip.svc.cluster.local/2
