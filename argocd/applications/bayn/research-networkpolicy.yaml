apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bayn-research
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bayn-research
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: restate
          podSelector:
            matchLabels:
              app: restate
      ports:
        - port: 9080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opencode
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opencode-research
      ports:
        - port: 4096
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: glitchtip
          podSelector:
            matchLabels:
              app.kubernetes.io/name: glitchtip
              app.kubernetes.io/component: web
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-egress-proxy
      ports:
        - port: 3128
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: restate
          podSelector:
            matchLabels:
              app: restate
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
          podSelector:
            matchLabels:
              app: rook-ceph-rgw
              rook_cluster: rook-ceph
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: bayn-db
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flamingo
          podSelector:
            matchLabels:
              app.kubernetes.io/name: flamingo
      ports:
        - port: 8000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4318
          protocol: TCP
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bayn-db-research-ingress
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: bayn-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-research
      ports:
        - port: 5432
          protocol: TCP
