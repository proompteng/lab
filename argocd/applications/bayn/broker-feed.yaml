apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayn-broker-feed
  annotations:
    # Activity ingestion requires the owner established by the activation hook in wave 0.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: bayn-broker-feed
    app.kubernetes.io/part-of: bayn
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # One verified process owns trade_updates plus finite-prefix and long-lived Activity SSE connections.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn-broker-feed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-broker-feed
        app.kubernetes.io/part-of: bayn
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      nodeSelector:
        network.proompteng.ai/100g: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker-feed
          image: bayn-broker-feed
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: DORVUD_SOURCE_REVISION
              value: 0c3102d45de2270942a95f2894f83d6cd62c995e
            - name: BAYN_ALPACA_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: account-id
            - name: BAYN_ALPACA_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: key-id
            - name: BAYN_ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: secret-key
            - name: BAYN_ALPACA_BASE_URL
              value: https://paper-api.alpaca.markets
            - name: BAYN_ALPACA_PROXY_URL
              value: http://bayn-egress-proxy:3128
            - name: RESTATE_INGRESS_URL
              value: http://restate.restate.svc.cluster.local:8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
