apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayn-broker-feed
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: bayn-broker-feed
    app.kubernetes.io/part-of: bayn
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # One verified account socket; reconnect emits a session boundary for gap repair.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn-broker-feed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-broker-feed
        app.kubernetes.io/part-of: bayn
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      nodeSelector:
        network.proompteng.ai/100g: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker-feed
          image: bayn-broker-feed
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: DORVUD_SOURCE_REVISION
              value: 236fcc9e5507e7186b21d158ba8cf6b085ad479a
            - name: BAYN_ALPACA_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: account-id
            - name: BAYN_ALPACA_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: key-id
            - name: BAYN_ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: secret-key
            - name: BAYN_ALPACA_BASE_URL
              value: https://paper-api.alpaca.markets
            - name: BAYN_ALPACA_PROXY_URL
              value: http://bayn-egress-proxy:3128
            - name: BAYN_BROKER_NOTIFICATIONS_TOPIC
              value: bayn.broker-notifications.v1
            - name: KAFKA_BOOTSTRAP
              value: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_PLAINTEXT
            - name: KAFKA_SASL_USER
              value: bayn-market-data
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-market-data
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
