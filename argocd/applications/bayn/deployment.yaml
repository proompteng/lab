apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayn
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: bayn
    app.kubernetes.io/part-of: bayn
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn
        app.kubernetes.io/part-of: bayn
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-09-08T06:37:35.585Z"
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      nodeSelector:
        network.proompteng.ai/100g: "true"
      serviceAccountName: bayn
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bayn
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bayn
          image: bayn-main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bayn-valkey-connection
          env:
            - name: BAYN_CODE_REVISION
              value: ea0bacc356b75d65db004851b8724bf4d05bfc89
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://bayn-telemetry.bayn.svc.cluster.local:4318/v1/traces
            - name: RESTATE_INGRESS_ORIGIN
              value: http://restate.restate.svc.cluster.local:8080
            - name: BAYN_GLITCHTIP_DSN
              valueFrom:
                configMapKeyRef:
                  name: bayn-glitchtip-dsns
                  key: bayn
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            # Kargo copies the reviewed source into kargo/bayn and updates this service,
            # the execution worker, and the activation Job to the same immutable image.
            - name: BAYN_EXPECTED_EXECUTION_CONTROLLER_PLAN_HASH
              value: "97e2dcb93e1a130ac27b6175be48eb937df0ea5dd6f3430bd249fead2f51807b"
            - name: BAYN_IMAGE_REPOSITORY
              value: registry.ide-newton.ts.net/lab/bayn
            - name: BAYN_IMAGE_DIGEST
              value: sha256:791688ff6257af0813b6308afd736a9ccef53201b9a0b407db3da8f8d8eed214
            - name: BAYN_STRATEGY_BEHAVIOR_HASH
              value: "76f0e134e622ada19cb1b087d83da60b54a36d33c86c6c0eee2642ee3fbd3e67"
            - name: BAYN_STRATEGY_PARAMETER_HASH
              value: "004604dcc48754ff553976d366a4d7643a6a3a1157acac4b89acc879b56c4696"
            # Runtime verifies the reviewed activation identity against its compiled strategy contract.
            - name: BAYN_STRATEGY_NAME
              value: jev
            - name: BAYN_STRATEGY_PROTOCOL_HASH
              value: "b97dc08473946b82b89f9e4bfae09d18c4bae4ebd8b854f5a6b2b805e35a19c9"
            - name: BAYN_EXECUTION_RISK_POLICY_HASH
              value: "817efba3d61cf0c3845999988cf4507e015a60ccf3d13c7f840dac366173007e"
            - name: BAYN_BROKER_ACCESS
              value: read-only
            - name: BAYN_CAPITAL_AUTHORITY
              value: none
            - name: BAYN_CAPITAL_ACTIVATION_REQUEST
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: capital-activation-request
            - name: BAYN_CAPITAL_ACTIVATION_KIND
              value: ResearchCapitalActivationRequest
            - name: BAYN_RESEARCH_CAPITAL_BUILD_LINEAGE
              value: "{\n  \"activation\": {\n    \"imageDigest\": \"sha256:791688ff6257af0813b6308afd736a9ccef53201b9a0b407db3da8f8d8eed214\",\n    \"imageRepository\": \"registry.ide-newton.ts.net/lab/bayn\",\n    \"sourceRevision\": \"ea0bacc356b75d65db004851b8724bf4d05bfc89\"\n  },\n  \"authoredActivation\": {\n    \"imageDigest\": \"sha256:0b6ddb52c548cb16791843a3a6c13e20e06abe81cce3f99e9b1833d6dd4cd841\",\n    \"imageRepository\": \"registry.ide-newton.ts.net/lab/bayn\",\n    \"sourceRevision\": \"503cb2d60c58c5309c2e031d032069481ac4b0db\"\n  },\n  \"requestHash\": \"6856f071e54529227ea48fa7b077506209ffd887c939d7351e948d7e03020130\",\n  \"schemaVersion\": \"bayn.research-capital-build-lineage.v1\"\n}\n"
            - name: BAYN_AUTHORITY_GENERATION_HASH
              value: "a528c5df0281c4f7ad5fbfcba52fa4e566e5ec49e35a4010b77f23b1c083594a"
            - name: BAYN_BROKER_PROVIDER
              value: alpaca
            - name: BAYN_BROKER_ENVIRONMENT
              value: sandbox
            - name: BAYN_ALPACA_BASE_URL
              value: https://paper-api.alpaca.markets
            - name: BAYN_ALPACA_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: account-id
            - name: BAYN_ALPACA_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: key-id
            - name: BAYN_ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: secret-key
            - name: BAYN_HEALTH_INTERVAL_MS
              value: "30000"
            - name: BAYN_OPERATION_TIMEOUT_MS
              value: "30000"
            - name: BAYN_CLICKHOUSE_URL
              value: http://torghut-clickhouse.torghut.svc.cluster.local:8123
            - name: BAYN_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: username
            - name: BAYN_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: password
            - name: BAYN_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: bayn-db-app
                  key: fqdn-uri
            - name: BAYN_POSTGRES_TLS
              value: "true"
            - name: BAYN_POSTGRES_CA_PATH
              value: /var/run/secrets/bayn/postgres/ca.crt
            - name: BAYN_TIGERBEETLE_CLUSTER_ID
              value: "122731676035874920802382025803517750735"
            - name: BAYN_TIGERBEETLE_ADDRESSES
              value: "ledger-0.ledger-headless.bayn.svc.cluster.local:3000,ledger-1.ledger-headless.bayn.svc.cluster.local:3000,ledger-2.ledger-headless.bayn.svc.cluster.local:3000"
            - name: BAYN_TIGERBEETLE_LEDGER
              value: "7001"
            - name: NODE_ENV
              value: production
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-valkey-auth
                  key: password
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /status-readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              # Read-only financial reports use a bounded verification pool; requests stay unchanged.
              cpu: "16"
              memory: 6Gi
          securityContext:
            # TigerBeetle's native client requires io_uring, which containerd's
            # RuntimeDefault seccomp profile blocks. Keep every other control.
            seccompProfile:
              type: Unconfined
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: valkey-client-tls
              mountPath: /var/run/secrets/bayn/valkey
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /var/run/secrets/bayn/postgres
              readOnly: true
      volumes:
        - name: valkey-client-tls
          secret:
            secretName: bayn-valkey-client-tls
            defaultMode: 288
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: postgres-ca
          secret:
            secretName: bayn-db-ca
            defaultMode: 444
            items:
              - key: ca.crt
                path: ca.crt
