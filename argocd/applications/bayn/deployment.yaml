apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayn
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: bayn
    app.kubernetes.io/part-of: bayn
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn
        app.kubernetes.io/part-of: bayn
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-09-08T06:37:35.585Z"
    spec:
      nodeSelector:
        network.proompteng.ai/100g: "true"
      serviceAccountName: bayn
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bayn
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bayn
          image: bayn-main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bayn-valkey-connection
          env:
            - name: BAYN_CODE_REVISION
              value: 1635ab983a20e594af977b1947c5d41256fcd504
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://bayn-telemetry.bayn.svc.cluster.local:4318/v1/traces
            - name: BAYN_GLITCHTIP_DSN
              valueFrom:
                configMapKeyRef:
                  name: bayn-glitchtip-dsns
                  key: bayn
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            # Kargo copies the reviewed source into kargo/bayn and updates this service,
            # the execution worker, and the activation Job to the same immutable image.
            - name: BAYN_EXPECTED_EXECUTION_CONTROLLER_PLAN_HASH
              value: "0c2f682a50bbd17fc1d780fbdb48f1dd588932f8f771474ecdce272091aaadcc"
            - name: BAYN_IMAGE_REPOSITORY
              value: registry.ide-newton.ts.net/lab/bayn
            - name: BAYN_IMAGE_DIGEST
              value: sha256:f69651524ccda2951d60b6ce5ee5c62f8280a90663d118a49350e95645478577
            - name: BAYN_STRATEGY_BEHAVIOR_HASH
              value: "76f0e134e622ada19cb1b087d83da60b54a36d33c86c6c0eee2642ee3fbd3e67"
            - name: BAYN_STRATEGY_PARAMETER_HASH
              value: "f9e6e142d22de772dca147cae29c07e17010026ee7c156874c1f6a1cccc32878"
            # Runtime verifies the reviewed activation identity against its compiled strategy contract.
            - name: BAYN_STRATEGY_NAME
              value: jev
            - name: BAYN_STRATEGY_PROTOCOL_HASH
              value: "224be13842b21f731e6ac0e97fd390dccb12c71149c3c44ca9dc5f7511a8c69f"
            - name: BAYN_EXECUTION_RISK_POLICY_HASH
              value: "5f0e0cd4aa5ee11556bede5ab9a6286744b589ef08efe2d1f8accbb30e63eeab"
            - name: BAYN_BROKER_ACCESS
              value: read-only
            - name: BAYN_CAPITAL_ACTIVATION_REQUEST
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: capital-activation-request
            - name: BAYN_CAPITAL_ACTIVATION_KIND
              value: ResearchCapitalActivationRequest
            - name: BAYN_RESEARCH_CAPITAL_BUILD_LINEAGE
              value: "{\n  \"activation\": {\n    \"imageDigest\": \"sha256:f69651524ccda2951d60b6ce5ee5c62f8280a90663d118a49350e95645478577\",\n    \"imageRepository\": \"registry.ide-newton.ts.net/lab/bayn\",\n    \"sourceRevision\": \"1635ab983a20e594af977b1947c5d41256fcd504\"\n  },\n  \"authoredActivation\": {\n    \"imageDigest\": \"sha256:f3657c70be3dd14af65ece9f1a61a0aeb53eacc42b64fbad1945baddbbb24c1d\",\n    \"imageRepository\": \"registry.ide-newton.ts.net/lab/bayn\",\n    \"sourceRevision\": \"3d33c510e66bca1c5fae247d2e3bf9075916b779\"\n  },\n  \"requestHash\": \"ce98123b57957e5ff2c3394debde0a0613fbc825d58897ccfb6574617c4220d2\",\n  \"schemaVersion\": \"bayn.research-capital-build-lineage.v1\"\n}\n"
            - name: BAYN_CAPITAL_AUTHORITY
              value: none
            # sha256("bayn/authority-generation/autonomous-observe-v16")
            - name: BAYN_AUTHORITY_GENERATION_HASH
              value: "fd1adaf06499346446c83ee8beb29200bd3d0b3f82155e13ed4c850d153deb89"
            - name: BAYN_CYCLE_POLL_INTERVAL_MS
              value: "30000"
            - name: BAYN_BROKER_PROVIDER
              value: alpaca
            - name: BAYN_BROKER_ENVIRONMENT
              value: sandbox
            - name: BAYN_ALPACA_BASE_URL
              value: https://paper-api.alpaca.markets
            - name: BAYN_ALPACA_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: account-id
            - name: BAYN_ALPACA_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: key-id
            - name: BAYN_ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: secret-key
            - name: BAYN_HEALTH_INTERVAL_MS
              value: "30000"
            - name: BAYN_OPERATION_TIMEOUT_MS
              value: "30000"
            - name: BAYN_CLICKHOUSE_URL
              value: http://torghut-clickhouse.torghut.svc.cluster.local:8123
            - name: BAYN_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: username
            - name: BAYN_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: password
            - name: BAYN_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: bayn-db-app
                  key: fqdn-uri
            - name: BAYN_POSTGRES_TLS
              value: "true"
            - name: BAYN_POSTGRES_CA_PATH
              value: /var/run/secrets/bayn/postgres/ca.crt
            - name: BAYN_TIGERBEETLE_CLUSTER_ID
              value: "122731676035874920802382025803517750735"
            - name: BAYN_TIGERBEETLE_ADDRESSES
              value: "ledger-0.ledger-headless.bayn.svc.cluster.local:3000,ledger-1.ledger-headless.bayn.svc.cluster.local:3000,ledger-2.ledger-headless.bayn.svc.cluster.local:3000"
            - name: BAYN_TIGERBEETLE_LEDGER
              value: "7001"
            - name: NODE_ENV
              value: production
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-valkey-auth
                  key: password
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /status-readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            # TigerBeetle's native client requires io_uring, which containerd's
            # RuntimeDefault seccomp profile blocks. Keep every other control.
            seccompProfile:
              type: Unconfined
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: valkey-client-tls
              mountPath: /var/run/secrets/bayn/valkey
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /var/run/secrets/bayn/postgres
              readOnly: true
      volumes:
        - name: valkey-client-tls
          secret:
            secretName: bayn-valkey-client-tls
            defaultMode: 288
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: postgres-ca
          secret:
            secretName: bayn-db-ca
            defaultMode: 444
            items:
              - key: ca.crt
                path: ca.crt
