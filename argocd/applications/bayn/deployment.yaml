apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayn
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: bayn
    app.kubernetes.io/part-of: bayn
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn
        app.kubernetes.io/part-of: bayn
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-08-20T14:58:19Z"
    spec:
      serviceAccountName: bayn
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bayn
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bayn
          image: bayn-main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BAYN_CODE_REVISION
              value: 5dbb887f926325b36eabc32245adb26b2f25d05e
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://observability-tempo-distributor.observability.svc.cluster.local:4318/v1/traces
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            # This is the immutable plan announced by the currently registered
            # execution worker. A cutover must update this binding atomically
            # with the worker image and activation generation.
            - name: BAYN_EXPECTED_EXECUTION_CONTROLLER_PLAN_HASH
              value: "a4894282066826ab3516bda712267f285e7b6b107f7b8946436eecbcb49de761"
            - name: BAYN_IMAGE_REPOSITORY
              value: registry.ide-newton.ts.net/lab/bayn
            - name: BAYN_IMAGE_DIGEST
              value: sha256:c433389487ebb4414ec45cbb761f37f3c19617411f067575d53b560739681fac
            - name: BAYN_STRATEGY_BEHAVIOR_HASH
              value: "a1a76f67f95493533cef505c6905163c85753b3f7903a1d74a016bfbadbe534c"
            - name: BAYN_STRATEGY_PARAMETER_HASH
              value: "3a6ee606f44434b968579fd2a7e8da4dd2aab26c99a3cc8c9e70433be16c6329"
            - name: BAYN_CAPITAL_ACTIVATION_REQUEST
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: capital-activation-request
            - name: BAYN_CAPITAL_ACTIVATION_KIND
              value: ResearchCapitalActivationRequest
            - name: BAYN_BROKER_ACCESS
              value: read-only
            - name: BAYN_CAPITAL_AUTHORITY
              value: none
            # sha256("bayn/authority-generation/autonomous-observe-v10")
            - name: BAYN_AUTHORITY_GENERATION_HASH
              value: "22793abfac57568433147fb6d7a47ce7a34fb500ee47e035353ae8935a3e3fa7"
            - name: BAYN_CYCLE_POLL_INTERVAL_MS
              value: "30000"
            - name: BAYN_BROKER_PROVIDER
              value: alpaca
            - name: BAYN_BROKER_ENVIRONMENT
              value: sandbox
            - name: BAYN_ALPACA_BASE_URL
              value: https://paper-api.alpaca.markets
            - name: BAYN_ALPACA_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: account-id
            - name: BAYN_ALPACA_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: key-id
            - name: BAYN_ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: secret-key
            - name: BAYN_HEALTH_INTERVAL_MS
              value: "30000"
            - name: BAYN_OPERATION_TIMEOUT_MS
              value: "30000"
            - name: BAYN_CLICKHOUSE_URL
              value: http://torghut-clickhouse.torghut.svc.cluster.local:8123
            - name: BAYN_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: username
            - name: BAYN_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: password
            - name: BAYN_SIGNAL_SNAPSHOT_ID
              value: "f50f63fecf62991203e8ddae519406a432b1d1a06c3376b18a2957b962c67a60"
            - name: BAYN_SIGNAL_PUBLICATION_ASOF
              value: "2026-08-04"
            - name: BAYN_SIGNAL_CALENDAR_VERSION
              value: "alpaca-us-equity-calendar-v1"
            - name: BAYN_SIGNAL_DATA_START
              value: "2016-01-04"
            - name: BAYN_SIGNAL_DATA_END
              value: "2026-08-04"
            - name: BAYN_SIGNAL_LOOKBACK_START
              value: "2016-01-04"
            - name: BAYN_SIGNAL_EVALUATION_START
              value: "2017-01-03"
            - name: BAYN_SIGNAL_EVALUATION_END
              value: "2026-08-04"
            - name: BAYN_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: bayn-db-app
                  key: fqdn-uri
            - name: BAYN_POSTGRES_TLS
              value: "true"
            - name: BAYN_POSTGRES_CA_PATH
              value: /var/run/secrets/bayn/postgres/ca.crt
            - name: BAYN_TIGERBEETLE_CLUSTER_ID
              value: "122731676035874920802382025803517750735"
            - name: BAYN_TIGERBEETLE_ADDRESSES
              value: "ledger-0.ledger-headless.bayn.svc.cluster.local:3000,ledger-1.ledger-headless.bayn.svc.cluster.local:3000,ledger-2.ledger-headless.bayn.svc.cluster.local:3000"
            - name: BAYN_TIGERBEETLE_LEDGER
              value: "7001"
            - name: NODE_ENV
              value: production
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            # TigerBeetle's native client requires io_uring, which containerd's
            # RuntimeDefault seccomp profile blocks. Keep every other control.
            seccompProfile:
              type: Unconfined
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /var/run/secrets/bayn/postgres
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: postgres-ca
          secret:
            secretName: bayn-db-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
