apiVersion: apps/v1
kind: Deployment
metadata:
  name: bayn
  labels:
    app.kubernetes.io/name: bayn
    app.kubernetes.io/part-of: bayn
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn
        app.kubernetes.io/part-of: bayn
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-07-31T06:22:53Z"
    spec:
      serviceAccountName: bayn
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bayn
          image: registry.ide-newton.ts.net/lab/bayn
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BAYN_CODE_REVISION
              value: 11f101786021a0c5ee683066b5221365d6843e33
            - name: BAYN_IMAGE_REPOSITORY
              value: registry.ide-newton.ts.net/lab/bayn
            - name: BAYN_IMAGE_DIGEST
              value: sha256:296e4e92461eb460b8280014f7fa7539f098f16e3ccc4aefd5ac90661c42c6ff
            - name: BAYN_STRATEGY_BEHAVIOR_HASH
              value: "9e87fe0f66048c48da2191ef1fae36ef3ee0eb4ddcd036ef40881f0fe0f6eb42"
            - name: BAYN_STRATEGY_PARAMETER_HASH
              value: "19bc51c7361b181aa48845d178cb63373b3f2e017bcbea1cf3b70ab16647f8a9"
            - name: BAYN_QUALIFICATION_RUN_ID
              value: "a6530496d594a5425f091f30148012b12b6b030d49b396f925efe9ead3496217"
            - name: BAYN_MAXIMUM_AUTHORITY
              value: OBSERVE
            # sha256("bayn/authority-generation/autonomous-observe-v1")
            - name: BAYN_AUTHORITY_GENERATION_HASH
              value: "d290539ec85334d8ce267f98919c139cb382068101042d69b5433832136dc063"
            - name: BAYN_CYCLE_POLL_INTERVAL_MS
              value: "30000"
            - name: BAYN_BROKER_PROVIDER
              value: alpaca
            - name: BAYN_BROKER_ENVIRONMENT
              value: sandbox
            - name: BAYN_ALPACA_BASE_URL
              value: https://paper-api.alpaca.markets
            - name: BAYN_ALPACA_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: account-id
            - name: BAYN_ALPACA_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: key-id
            - name: BAYN_ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: secret-key
            - name: BAYN_HEALTH_INTERVAL_MS
              value: "30000"
            - name: BAYN_OPERATION_TIMEOUT_MS
              value: "30000"
            - name: BAYN_CLICKHOUSE_URL
              value: http://torghut-clickhouse.torghut.svc.cluster.local:8123
            - name: BAYN_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: username
            - name: BAYN_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: password
            - name: BAYN_SIGNAL_SNAPSHOT_ID
              value: "2a91f0177684f7022f746207333e510c8268f9b77a04b778a04220a33ccf79e0"
            - name: BAYN_SIGNAL_PUBLICATION_ASOF
              value: "2026-07-27"
            - name: BAYN_SIGNAL_CALENDAR_VERSION
              value: "alpaca-us-equity-calendar-v1"
            - name: BAYN_SIGNAL_DATA_START
              value: "2016-01-04"
            - name: BAYN_SIGNAL_DATA_END
              value: "2026-07-27"
            - name: BAYN_SIGNAL_LOOKBACK_START
              value: "2016-01-04"
            - name: BAYN_SIGNAL_EVALUATION_START
              value: "2017-01-03"
            - name: BAYN_SIGNAL_EVALUATION_END
              value: "2026-07-27"
            - name: BAYN_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: bayn-db-app
                  key: fqdn-uri
            - name: BAYN_POSTGRES_TLS
              value: "true"
            - name: BAYN_POSTGRES_CA_PATH
              value: /var/run/secrets/bayn/postgres/ca.crt
            - name: BAYN_TIGERBEETLE_CLUSTER_ID
              value: "122731676035874920802382025803517750735"
            - name: BAYN_TIGERBEETLE_ADDRESSES
              value: "ledger-0.ledger-headless.bayn.svc.cluster.local:3000,ledger-1.ledger-headless.bayn.svc.cluster.local:3000,ledger-2.ledger-headless.bayn.svc.cluster.local:3000"
            - name: BAYN_TIGERBEETLE_LEDGER
              value: "7001"
            - name: NODE_ENV
              value: production
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            # TigerBeetle's native client requires io_uring, which containerd's
            # RuntimeDefault seccomp profile blocks. Keep every other control.
            seccompProfile:
              type: Unconfined
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /var/run/secrets/bayn/postgres
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: postgres-ca
          secret:
            secretName: bayn-db-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
