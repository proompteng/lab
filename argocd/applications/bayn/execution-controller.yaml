apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: bayn-execution-controller
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: bayn-execution-controller
    app.kubernetes.io/part-of: bayn
spec:
  replicas: 2
  revisionHistoryLimit: 2
  minReadySeconds: 5
  restate:
    register:
      service:
        name: restate
        namespace: restate
        port: 9070
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn-execution-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-execution-controller
        app.kubernetes.io/part-of: bayn
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      nodeSelector:
        network.proompteng.ai/100g: "true"
      serviceAccountName: bayn
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          # Restate intentionally retains older worker ReplicaSets while their
          # deployments drain. Scope spreading to this ReplicaSet revision so
          # those retained pods cannot make two current replicas look spread.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-execution-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: execution-controller
          image: registry.ide-newton.ts.net/lab/bayn@sha256:1dfdc17c6490eb2f603bb1f3e7372d2140508f283f5ffea5f6ff48b0be83ad74
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/restate-execution-server.js
          ports:
            - name: restate
              containerPort: 9080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bayn-valkey-connection
          env:
            - name: BAYN_CODE_REVISION
              value: d9a6108153060ff669264b73ff2d41f717b4485f
            - name: BAYN_GLITCHTIP_DSN
              valueFrom:
                configMapKeyRef:
                  name: bayn-glitchtip-dsns
                  key: bayn-execution
            - name: BAYN_IMAGE_REPOSITORY
              value: registry.ide-newton.ts.net/lab/bayn
            - name: BAYN_IMAGE_DIGEST
              value: sha256:1dfdc17c6490eb2f603bb1f3e7372d2140508f283f5ffea5f6ff48b0be83ad74
            # Bind the replacement to the exact immutable execution generation
            # currently owned by the active controller. The deployment stays
            # read-only; only the sealed, validated research mandate can
            # realize a mutation generation after startup.
            - name: BAYN_STRATEGY_BEHAVIOR_HASH
              value: "76f0e134e622ada19cb1b087d83da60b54a36d33c86c6c0eee2642ee3fbd3e67"
            - name: BAYN_STRATEGY_PARAMETER_HASH
              value: "6b47647a539b3a35971cfbc596c0a431300cababddea3d50ea460b4308a671bb"
            - name: BAYN_BROKER_ACCESS
              value: read-only
            - name: BAYN_CAPITAL_AUTHORITY
              value: none
            - name: BAYN_CAPITAL_ACTIVATION_REQUEST
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: capital-activation-request
            - name: BAYN_CAPITAL_ACTIVATION_KIND
              value: ResearchCapitalActivationRequest
            - name: BAYN_RESEARCH_CAPITAL_BUILD_LINEAGE
              value: "{\n  \"activation\": {\n    \"imageDigest\": \"sha256:1dfdc17c6490eb2f603bb1f3e7372d2140508f283f5ffea5f6ff48b0be83ad74\",\n    \"imageRepository\": \"registry.ide-newton.ts.net/lab/bayn\",\n    \"sourceRevision\": \"d9a6108153060ff669264b73ff2d41f717b4485f\"\n  },\n  \"authoredActivation\": {\n    \"imageDigest\": \"sha256:361183526d1c88848a294459a6f94e794d1773bc959c3638db26d3243bbdee01\",\n    \"imageRepository\": \"registry.ide-newton.ts.net/lab/bayn\",\n    \"sourceRevision\": \"0950a9fd9429cf3f0ee0e14d370225de55532218\"\n  },\n  \"requestHash\": \"a36ed2c6e987548b450069ca988bbec30fd43748b665fd0481128322f41d2d63\",\n  \"schemaVersion\": \"bayn.research-capital-build-lineage.v1\"\n}\n"
            - name: BAYN_AUTHORITY_GENERATION_HASH
              value: "a528c5df0281c4f7ad5fbfcba52fa4e566e5ec49e35a4010b77f23b1c083594a"
            - name: BAYN_BROKER_PROVIDER
              value: alpaca
            - name: BAYN_BROKER_ENVIRONMENT
              value: sandbox
            - name: BAYN_ALPACA_BASE_URL
              value: https://paper-api.alpaca.markets
            - name: BAYN_ALPACA_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: account-id
            - name: BAYN_ALPACA_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: key-id
            - name: BAYN_ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: secret-key
            - name: BAYN_RECONCILIATION_INTERVAL_MS
              value: "30000"
            - name: BAYN_HEALTH_INTERVAL_MS
              value: "30000"
            - name: BAYN_OPERATION_TIMEOUT_MS
              value: "30000"
            - name: BAYN_CLICKHOUSE_URL
              value: http://torghut-clickhouse.torghut.svc.cluster.local:8123
            - name: BAYN_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: username
            - name: BAYN_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: password
            - name: BAYN_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: bayn-db-app
                  key: fqdn-uri
            - name: BAYN_POSTGRES_TLS
              value: "true"
            - name: BAYN_POSTGRES_CA_PATH
              value: /var/run/secrets/bayn/postgres/ca.crt
            - name: BAYN_TIGERBEETLE_CLUSTER_ID
              value: "122731676035874920802382025803517750735"
            - name: BAYN_TIGERBEETLE_ADDRESSES
              value: "ledger-0.ledger-headless.bayn.svc.cluster.local:3000,ledger-1.ledger-headless.bayn.svc.cluster.local:3000,ledger-2.ledger-headless.bayn.svc.cluster.local:3000"
            - name: BAYN_TIGERBEETLE_LEDGER
              value: "7001"
            - name: BAYN_EXECUTION_ACTIVATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bayn-execution-bootstrap
                  key: token
            - name: RESTATE_REQUEST_IDENTITY_KEYS
              value: publickeyv1_6PArFXa3x8V1xx69kZVRyB7uP1fUoZ44wes6vAHYF6NL
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://bayn-telemetry.bayn.svc.cluster.local:4318/v1/traces
            - name: RESTATE_INGRESS_ORIGIN
              value: http://restate.restate.svc.cluster.local:8080
            - name: PORT
              value: "9080"
            - name: NODE_ENV
              value: production
            - name: BAYN_KAFKA_BROKERS
              value: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: BAYN_KAFKA_USERNAME
              value: bayn-market-data
            - name: BAYN_KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-market-data
                  key: password
            - name: BAYN_KAFKA_TECHNICAL_FEATURES_TOPIC
              value: torghut.technical-features.v1
            - name: BAYN_KAFKA_WEBULL_BARS_TOPIC
              value: dorvud.webull.raw.v1
            - name: BAYN_KAFKA_TIMESTAMP_POLICY
              value: dorvud.producer-clock.v1
            - name: BAYN_KAFKA_BOOTSTRAP_TIMEOUT_MS
              value: "300000"
            - name: BAYN_JEV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-jev-auth
                  key: api-key
                  optional: true
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-valkey-auth
                  key: password
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: http://observability-mimir-gateway.observability.svc.cluster.local/otlp/v1/metrics
          startupProbe:
            tcpSocket:
              port: restate
            periodSeconds: 2
            failureThreshold: 600
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  const session = require('node:http2').connect('http://127.0.0.1:9080');
                  const fail = () => { session.destroy(); process.exitCode = 1; };
                  session.on('error', fail);
                  const request = session.request({ ':method': 'GET', ':path': '/startup-ready' });
                  request.on('response', headers => { process.exitCode = headers[':status'] === 200 ? 0 : 1; });
                  request.on('error', fail);
                  request.on('end', () => session.close());
                  request.resume(); request.end();
                  session.setTimeout(1000, fail);
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: restate
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            # TigerBeetle's native client requires io_uring, which containerd's
            # RuntimeDefault seccomp profile blocks. Keep every other control.
            seccompProfile:
              type: Unconfined
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: valkey-client-tls
              mountPath: /var/run/secrets/bayn/valkey
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /var/run/secrets/bayn/postgres
              readOnly: true
      volumes:
        - name: valkey-client-tls
          secret:
            secretName: bayn-valkey-client-tls
            defaultMode: 288
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: postgres-ca
          secret:
            secretName: bayn-db-ca
            defaultMode: 444
            items:
              - key: ca.crt
                path: ca.crt
