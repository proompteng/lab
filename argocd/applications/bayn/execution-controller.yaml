apiVersion: restate.dev/v1beta1
kind: RestateDeployment
metadata:
  name: bayn-execution-controller
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: bayn-execution-controller
    app.kubernetes.io/part-of: bayn
spec:
  replicas: 2
  revisionHistoryLimit: 2
  minReadySeconds: 5
  restate:
    register:
      service:
        name: restate
        namespace: restate
        port: 9070
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn-execution-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-execution-controller
        app.kubernetes.io/part-of: bayn
    spec:
      serviceAccountName: bayn
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          # Restate intentionally retains older worker ReplicaSets while their
          # deployments drain. Scope spreading to this ReplicaSet revision so
          # those retained pods cannot make two current replicas look spread.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-execution-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: execution-controller
          image: registry.ide-newton.ts.net/lab/bayn@sha256:e710c9ed53be4df33c7875b84685b169ca6de5ec82f03990366963f8f5be3dec
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/restate-execution-server.js
          ports:
            - name: restate
              containerPort: 9080
              protocol: TCP
          env:
            - name: BAYN_CODE_REVISION
              value: 81ecf5cf2e2f7400eb795e50bfa2ea74ad60046a
            - name: BAYN_IMAGE_REPOSITORY
              value: registry.ide-newton.ts.net/lab/bayn
            - name: BAYN_IMAGE_DIGEST
              value: sha256:e710c9ed53be4df33c7875b84685b169ca6de5ec82f03990366963f8f5be3dec
            # Bind the replacement to the exact immutable execution generation
            # currently owned by the active controller. The deployment stays
            # read-only; only the sealed, validated research mandate can
            # realize a mutation generation after startup.
            - name: BAYN_EXECUTION_PREVIOUS_PLAN_HASH
              value: "a4894282066826ab3516bda712267f285e7b6b107f7b8946436eecbcb49de761"
            - name: BAYN_EXECUTION_PREVIOUS_SOURCE_REVISION
              value: 808bfa84609959712042174b6fd176fc56f8edb2
            - name: BAYN_STRATEGY_BEHAVIOR_HASH
              value: "48517ebba573e0e2b6fbf57c135ec56f5bf5198e0d5e936a05065cb23c39f001"
            - name: BAYN_STRATEGY_PARAMETER_HASH
              value: "f787f21d7824f533ae9e6fc9266f0f9fddadc5e85d0df019a15670a61bbb804a"
            - name: BAYN_CAPITAL_ACTIVATION_REQUEST
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: capital-activation-request
            - name: BAYN_CAPITAL_ACTIVATION_KIND
              value: ResearchCapitalActivationRequest
            - name: BAYN_RESEARCH_CAPITAL_BUILD_LINEAGE
              value: "{\n  \"activation\": {\n    \"imageDigest\": \"sha256:e710c9ed53be4df33c7875b84685b169ca6de5ec82f03990366963f8f5be3dec\",\n    \"imageRepository\": \"registry.ide-newton.ts.net/lab/bayn\",\n    \"sourceRevision\": \"81ecf5cf2e2f7400eb795e50bfa2ea74ad60046a\"\n  },\n  \"authoredActivation\": {\n    \"imageDigest\": \"sha256:4802491b70fce1d0cece839c7ee0a1400f4f605c9e8179ad0ea1ffd27f5198cc\",\n    \"imageRepository\": \"registry.ide-newton.ts.net/lab/bayn\",\n    \"sourceRevision\": \"808bfa84609959712042174b6fd176fc56f8edb2\"\n  },\n  \"requestHash\": \"8f85240c1a0f8d54650b0914cbfadf3245311c32c650f2a295cc76dabad7063f\",\n  \"schemaVersion\": \"bayn.research-capital-build-lineage.v1\"\n}\n"
            - name: BAYN_BROKER_ACCESS
              value: read-only
            - name: BAYN_CAPITAL_AUTHORITY
              value: none
            - name: BAYN_AUTHORITY_GENERATION_HASH
              value: "22793abfac57568433147fb6d7a47ce7a34fb500ee47e035353ae8935a3e3fa7"
            - name: BAYN_BROKER_PROVIDER
              value: alpaca
            - name: BAYN_BROKER_ENVIRONMENT
              value: sandbox
            - name: BAYN_ALPACA_BASE_URL
              value: https://paper-api.alpaca.markets
            - name: BAYN_ALPACA_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: account-id
            - name: BAYN_ALPACA_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: key-id
            - name: BAYN_ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-alpaca-auth
                  key: secret-key
            - name: BAYN_CYCLE_POLL_INTERVAL_MS
              value: "30000"
            - name: BAYN_RECONCILIATION_INTERVAL_MS
              value: "30000"
            - name: BAYN_HEALTH_INTERVAL_MS
              value: "30000"
            - name: BAYN_OPERATION_TIMEOUT_MS
              value: "30000"
            - name: BAYN_CLICKHOUSE_URL
              value: http://torghut-clickhouse.torghut.svc.cluster.local:8123
            - name: BAYN_CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: username
            - name: BAYN_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-clickhouse-auth
                  key: password
            - name: BAYN_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: bayn-db-app
                  key: fqdn-uri
            - name: BAYN_POSTGRES_TLS
              value: "true"
            - name: BAYN_POSTGRES_CA_PATH
              value: /var/run/secrets/bayn/postgres/ca.crt
            - name: BAYN_TIGERBEETLE_CLUSTER_ID
              value: "122731676035874920802382025803517750735"
            - name: BAYN_TIGERBEETLE_ADDRESSES
              value: "ledger-0.ledger-headless.bayn.svc.cluster.local:3000,ledger-1.ledger-headless.bayn.svc.cluster.local:3000,ledger-2.ledger-headless.bayn.svc.cluster.local:3000"
            - name: BAYN_TIGERBEETLE_LEDGER
              value: "7001"
            - name: BAYN_EXECUTION_ACTIVATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bayn-execution-bootstrap
                  key: token
            - name: RESTATE_REQUEST_IDENTITY_KEYS
              value: publickeyv1_6PArFXa3x8V1xx69kZVRyB7uP1fUoZ44wes6vAHYF6NL
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://observability-tempo-distributor.observability.svc.cluster.local:4318/v1/traces
            - name: PORT
              value: "9080"
            - name: NODE_ENV
              value: production
            - name: BAYN_KAFKA_BROKERS
              value: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: BAYN_KAFKA_USERNAME
              value: bayn-market-data
            - name: BAYN_KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bayn-market-data
                  key: password
            - name: BAYN_KAFKA_TECHNICAL_FEATURES_TOPIC
              value: torghut.technical-features.v1
            - name: BAYN_KAFKA_TIMESTAMP_POLICY
              value: dorvud.producer-clock.v1
            - name: BAYN_KAFKA_BOOTSTRAP_TIMEOUT_MS
              value: "300000"
            - name: BAYN_RESEARCH_CAPTURE_S3_ENDPOINT
              value: http://rook-ceph-rgw-objectstore.rook-ceph.svc.cluster.local:80
            - name: BAYN_RESEARCH_CAPTURE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: bayn-research-captures
                  key: BUCKET_NAME
            - name: BAYN_RESEARCH_CAPTURE_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: bayn-research-captures
                  key: BUCKET_REGION
            - name: BAYN_RESEARCH_CAPTURE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bayn-research-captures
                  key: AWS_ACCESS_KEY_ID
            - name: BAYN_RESEARCH_CAPTURE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-research-captures
                  key: AWS_SECRET_ACCESS_KEY
            - name: BAYN_JEV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bayn-jev-auth
                  key: api-key
                  optional: true
          startupProbe:
            tcpSocket:
              port: restate
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: restate
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: restate
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            # TigerBeetle's native client requires io_uring, which containerd's
            # RuntimeDefault seccomp profile blocks. Keep every other control.
            seccompProfile:
              type: Unconfined
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: postgres-ca
              mountPath: /var/run/secrets/bayn/postgres
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: postgres-ca
          secret:
            secretName: bayn-db-ca
            defaultMode: 444
            items:
              - key: ca.crt
                path: ca.crt
