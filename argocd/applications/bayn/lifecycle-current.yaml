apiVersion: batch/v1
kind: Job
metadata:
  name: bayn-lifecycle-register-2e6a1cbf1dce
  labels:
    app.kubernetes.io/name: bayn-lifecycle-register
    app.kubernetes.io/part-of: bayn
    app.kubernetes.io/version: 2e6a1cbf1dce
  annotations:
    # The command Service publishes not-ready Bayn endpoints, so this same-wave hook can activate the first durable
    # tick that makes strict Restate-owned readiness healthy. PostSync would deadlock behind that readiness gate.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 720
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-lifecycle-register
        app.kubernetes.io/part-of: bayn
        app.kubernetes.io/version: 2e6a1cbf1dce
    spec:
      serviceAccountName: bayn
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: registry.ide-newton.ts.net/lab/bayn:sha-2e6a1cbf1dce6737f6c96e25c097d214366af48d@sha256:ebe9ffea6582ae356b2ea870da1873ef74f46d064d60ca58b3fd8e27f535d3a3
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/restate-lifecycle-register.js
          env:
            - name: BAYN_CODE_REVISION
              value: 2e6a1cbf1dce6737f6c96e25c097d214366af48d
            - name: BAYN_LIFECYCLE_CONTROLLER_KEY
              value: primary
            - name: BAYN_OPERATION_TIMEOUT_MS
              value: "30000"
            - name: BAYN_RESTATE_ENDPOINT_URI
              value: http://bayn-lifecycle-2e6a1cbf1dce.bayn.svc.cluster.local:9080
            - name: RESTATE_ADMIN_ORIGIN
              value: http://restate.restate.svc.cluster.local:9070
            - name: RESTATE_INGRESS_ORIGIN
              value: http://restate.restate.svc.cluster.local:8080
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://observability-tempo-distributor.observability.svc.cluster.local:4318/v1/traces
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
