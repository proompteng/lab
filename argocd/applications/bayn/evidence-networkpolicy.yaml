apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bayn-evidence
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bayn-evidence
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: bayn-db
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
          podSelector:
            matchLabels:
              app: rook-ceph-rgw
              rook_cluster: rook-ceph
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bayn-db-evidence-ingress
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: bayn-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-evidence
      ports:
        - port: 5432
          protocol: TCP
