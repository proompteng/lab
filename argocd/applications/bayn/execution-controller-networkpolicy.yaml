apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bayn-execution-controller
  labels:
    app.kubernetes.io/name: bayn-execution-controller
    app.kubernetes.io/part-of: bayn
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bayn-execution-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: restate
          podSelector:
            matchLabels:
              app: restate
      ports:
        - port: restate
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: torghut
          podSelector:
            matchLabels:
              clickhouse.altinity.com/chi: torghut-clickhouse
      ports:
        - port: 8123
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
              app.kubernetes.io/component: distributor
      ports:
        - port: 4318
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: ledger
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: bayn-db
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-egress-proxy
      ports:
        - port: 3128
          protocol: TCP
