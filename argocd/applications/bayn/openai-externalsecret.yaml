# Prepared 1Password binding. The remote item intentionally does not exist yet;
# no placeholder API key, Kubernetes Secret, or automatic inference is provisioned.
# The research worker references this Secret optionally and remains runnable in dark mode.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bayn-openai-auth
  namespace: bayn
  annotations:
    # A missing source item is intentional during dark setup. It must not block
    # the live execution controller, research worker or Kargo health gates.
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/ignore-healthcheck: "true"
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
  labels:
    app.kubernetes.io/name: bayn-research
    app.kubernetes.io/part-of: bayn
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-infra
  target:
    name: bayn-openai-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: bayn-openai/api-key
