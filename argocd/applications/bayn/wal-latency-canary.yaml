apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bayn-wal-canary-data-v1
  labels:
    app.kubernetes.io/name: bayn-wal-canary
    app.kubernetes.io/part-of: bayn
spec:
  accessModes:
    - ReadWriteOncePod
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bayn-wal-canary-wal-v1
  labels:
    app.kubernetes.io/name: bayn-wal-canary
    app.kubernetes.io/part-of: bayn
spec:
  accessModes:
    - ReadWriteOncePod
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 4Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bayn-wal-canary
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bayn-wal-canary
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bayn-wal-canary-v1
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: bayn-wal-canary
    app.kubernetes.io/part-of: bayn
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-wal-canary
        app.kubernetes.io/part-of: bayn
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 90
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: talos-192-168-1-194
      securityContext:
        runAsUser: 26
        runAsGroup: 26
        runAsNonRoot: true
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5a6a677d3fa2bc3fdc61874e0de8324b5a987eb676ddca133e71365a8467d6c1
          command:
            - /bin/bash
            - -ceu
            - |
              sleep 300
              exec /bin/bash /opt/canary/wal-latency-canary.sh "$@"
            - --
          args:
            - /canary-data/bayn-wal-canary-v1
            - /canary-wal/bayn-wal-canary-v1
            - /canary-data/bayn-wal-canary-v1/evidence
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /canary-data
            - name: wal
              mountPath: /canary-wal
            - name: scratch
              mountPath: /tmp
            - name: script
              mountPath: /opt/canary
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bayn-wal-canary-data-v1
        - name: wal
          persistentVolumeClaim:
            claimName: bayn-wal-canary-wal-v1
        - name: scratch
          emptyDir:
            sizeLimit: 256Mi
        - name: script
          configMap:
            name: bayn-wal-canary-script
