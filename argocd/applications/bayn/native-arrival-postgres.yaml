apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bayn-native-arrival-db
  labels:
    app.kubernetes.io/name: bayn-native-arrival-db
    app.kubernetes.io/part-of: bayn
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Bayn immutable native market arrival archive
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5a6a677d3fa2bc3fdc61874e0de8324b5a987eb676ddca133e71365a8467d6c1
  imagePullPolicy: IfNotPresent
  enablePDB: true
  enableSuperuserAccess: false
  minSyncReplicas: 1
  maxSyncReplicas: 1
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: network.proompteng.ai/100g
                operator: In
                values:
                  - "true"
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  storage:
    storageClass: rook-ceph-block
    size: 100Gi
    resizeInUseVolumes: true
  bootstrap:
    initdb:
      database: bayn_native_arrival
      owner: bayn_native_arrival
      encoding: UTF8
      dataChecksums: true
  postgresql:
    parameters:
      shared_buffers: 512MB
      effective_cache_size: 1536MB
      wal_buffers: 16MB
      wal_compression: lz4
      max_wal_size: 4GB
      checkpoint_timeout: 15min
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3
      log_lock_waits: "on"
      deadlock_timeout: 1s
      log_min_duration_statement: 1000ms
      log_parameter_max_length: "0"
      log_parameter_max_length_on_error: "0"
      track_io_timing: "on"
      track_wal_io_timing: "on"
      wal_sender_timeout: 60s
      wal_receiver_timeout: 60s
  monitoring:
    metricsQueriesTTL: 1s
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bayn-db
        serverName: bayn-native-arrival-db-live
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bayn-native-arrival-db-daily
  labels:
    app.kubernetes.io/name: bayn-native-arrival-db
    app.kubernetes.io/part-of: bayn
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  schedule: "0 30 3 * * *"
  immediate: true
  backupOwnerReference: cluster
  target: prefer-standby
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: bayn-native-arrival-db
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bayn-native-arrival-db
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
  labels:
    app.kubernetes.io/name: bayn-native-arrival-db
    app.kubernetes.io/part-of: bayn
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: bayn-native-arrival-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bayn-execution-controller
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: bayn-native-arrival-db
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: bayn-native-arrival-db
        # Cross-node status and failsafe traffic can be source-NATed to the
        # Flannel VTEP (.0); node-local API proxy traffic uses the CNI gateway
        # (.1). Limit the exception to those two addresses on each node.
        - ipBlock:
            cidr: 10.244.0.0/31
        - ipBlock:
            cidr: 10.244.3.0/31
        - ipBlock:
            cidr: 10.244.5.0/31
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudnative-pg
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: observability-cluster-metrics-alloy
      ports:
        - port: 9187
          protocol: TCP
