apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bayn-restate-registration-cleanup
  labels:
    app.kubernetes.io/name: bayn-lifecycle-register
    app.kubernetes.io/part-of: bayn
  annotations:
    # Hooks do not contribute to Application sync status. This tracked no-op metadata change makes the final
    # retirement revision OutOfSync exactly once so automated sync executes the PostSync hook naturally.
    bayn.proompteng.ai/retirement-sync: final-legacy-registration-v2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bayn-lifecycle-register
      bayn.proompteng.ai/task: restate-registration-cleanup
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: restate
          podSelector:
            matchLabels:
              app: restate
      ports:
        - port: 9070
          protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  # Use a fresh fixed name for the v2 final retirement transaction. The v1 hook is intentionally retained after its
  # pre-mutation admin-connectivity failure, and named Argo hooks are not recreated without BeforeHookCreation.
  name: bayn-restate-registration-final-retirement-v2
  labels:
    app.kubernetes.io/name: bayn-lifecycle-register
    app.kubernetes.io/part-of: bayn
    bayn.proompteng.ai/task: restate-registration-cleanup
  annotations:
    argocd.argoproj.io/hook: PostSync
    # Successful executions are removed so later legitimate empty-state syncs may rerun. Failed executions are
    # intentionally retained under this fixed name, preventing an automatic retry from masking post-force failure.
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bayn-lifecycle-register
        app.kubernetes.io/part-of: bayn
        bayn.proompteng.ai/task: restate-registration-cleanup
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: docker.restate.dev/restatedev/restate-cli:1.7.2@sha256:6905cd107840658f8ef0338c95e3c691dba3da450e9e0fb12066d00fd57e69f9
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -eu
            - -c
          args:
            - |
              fail() {
                echo "bayn Restate registration cleanup: $*" >&2
                exit 1
              }

              readonly_admin_url='http://restate.restate.svc.cluster.local:9070'
              [ "${RESTATE_ADMIN_URL:-}" = "$readonly_admin_url" ] || fail 'unexpected Restate admin endpoint'
              sql_retry_attempts=30
              sql_retry_interval_seconds=2

              allowlist() {
                cat <<'EOF'
              dp_13XIXwisR4a4XPwInU61DdD|http://bayn-lifecycle-204d8a95a510.bayn.svc.cluster.local:9080/|204d8a95a5107fdb5061c25b09a801b3589eb936
              dp_12FbnURmXhz4YDXGMKwBMxH|http://bayn-lifecycle-c20d5ebb8bb4.bayn.svc.cluster.local:9080/|c20d5ebb8bb43c04ff93bd8887846133f9d12738
              dp_11BZh6bYzTynrUC6zv2hxkJ|http://bayn-lifecycle-f024ca5775cd.bayn.svc.cluster.local:9080/|f024ca5775cde0310175e8551cdbaf84def2e238
              dp_178DKWDx7eqEtZlwgKVZmYV|http://bayn-lifecycle-b919699d8530.bayn.svc.cluster.local:9080/|b919699d85305f688ebaec12bf17cd4463396505
              dp_12papCaGWaZ5kTxJ7J78LyV|http://bayn-lifecycle-2a534018c63d.bayn.svc.cluster.local:9080/|2a534018c63dfbf69aec51acc8f1cd50c292dc0f
              dp_10xLcEOYlB208R6PAKKTC25|http://bayn-lifecycle-23448de7ce3f.bayn.svc.cluster.local:9080/|23448de7ce3f2f3cf5ca8be9728802e2dbb0f60d
              dp_12nzmurqJv7aVfYOTVXItDH|http://bayn-lifecycle-9d3d287ef48c.bayn.svc.cluster.local:9080/|9d3d287ef48c0ba955bf7bb2f722264b8e0de433
              dp_10Di1UBU76eATDzMqugXgIN|http://bayn-lifecycle-b307fe01a289.bayn.svc.cluster.local:9080/|b307fe01a289db1fd400703fce06bc17cb6925a5
              dp_13vCdQ6lbjrevjrCLOWQ5H3|http://bayn-lifecycle-76365fc2b510.bayn.svc.cluster.local:9080/|76365fc2b510fb35b6048618b205cb917e1a58b3
              dp_16oanWtAAdHOuxdxwGKQlBT|http://bayn-lifecycle-20ddacc519c9.bayn.svc.cluster.local:9080/|20ddacc519c962b6de675f461b1136dfb5d14e52
              dp_12vwwQgU6Y6vnM3cw0VxSUh|http://bayn-lifecycle-df500668c6df.bayn.svc.cluster.local:9080/|df500668c6dfe137fde8e47231f39c3e64e47841
              dp_178ePC80z9ziJceYP31cKOt|http://bayn-lifecycle-1c19bedfe651.bayn.svc.cluster.local:9080/|1c19bedfe651b3cd8c7df219c9d7468be1ec13b0
              dp_13EX9jelryvC2VBhh4qp43v|http://bayn-lifecycle-7b4ba9bd0843.bayn.svc.cluster.local:9080/|7b4ba9bd084386a21c61dd573652c35074687f7a
              dp_14Ugdp5Jkw2fSxGJNVxuybf|http://bayn-lifecycle-6cec88e89559.bayn.svc.cluster.local:9080/|6cec88e89559bda203b6b8091f5b7562692e9200
              dp_16Q7AXpz3Jpq7uif6s31AZ3|http://bayn-lifecycle-d63a3156e6a3.bayn.svc.cluster.local:9080/|d63a3156e6a3da21b02edfec706f960f6c5c653c
              dp_14FawgX6SMmCTV5WNjjNHs5|http://bayn-lifecycle-75cb3d19ab93.bayn.svc.cluster.local:9080/|75cb3d19ab93bed5d35564423423d6f94bcc335d
              dp_12ofR4iEES29PwwttZZGqsN|http://bayn-lifecycle-bf16e466d988.bayn.svc.cluster.local:9080/|bf16e466d98825d889a71675bcc8ba9458ab12b6
              dp_14g38iazTnn3gWZzr8Ze0i5|http://bayn-lifecycle-2e6a1cbf1dce.bayn.svc.cluster.local:9080/|2e6a1cbf1dce6737f6c96e25c097d214366af48d
              EOF
              }

              sql_count() {
                query="$1"
                sql_attempt=1
                while [ "$sql_attempt" -le "$sql_retry_attempts" ]; do
                  if result="$(restate sql --jsonl "$query")"; then
                    count="$(printf '%s\n' "$result" | sed -n 's/^{"count":\([0-9][0-9]*\)}$/\1/p')"
                    [ -n "$count" ] || fail "unexpected Restate SQL result: $result"
                    printf '%s\n' "$count"
                    return 0
                  fi
                  [ "$sql_attempt" -lt "$sql_retry_attempts" ] ||
                    fail "Restate SQL query failed after $sql_retry_attempts attempts"
                  echo "Restate SQL read unavailable (attempt $sql_attempt/$sql_retry_attempts); retrying." >&2
                  sql_attempt=$((sql_attempt + 1))
                  sleep "$sql_retry_interval_seconds"
                done
              }

              expected_values=''
              expected_ids=''
              final_id='dp_14g38iazTnn3gWZzr8Ze0i5'
              final_endpoint='http://bayn-lifecycle-2e6a1cbf1dce.bayn.svc.cluster.local:9080/'
              final_source_revision='2e6a1cbf1dce6737f6c96e25c097d214366af48d'
              native_id='dp_14MYpEXKeHNXBkzJQMMIHSx'
              native_endpoint='http://bayn-execution-controller-686554d857.bayn.svc.cluster.local:9080/'
              native_revision='11'
              poll_attempts=30
              poll_interval_seconds=2
              while IFS='|' read -r id endpoint source_revision; do
                [ -n "$id" ] || continue
                if [ -n "$expected_values" ]; then
                  expected_values="$expected_values,"
                  expected_ids="$expected_ids,"
                fi
                expected_values="$expected_values('$id','$endpoint')"
                expected_ids="$expected_ids'$id'"
              done <<EOF
              $(allowlist)
              EOF

              deployment_present() {
                id="$1"
                count="$(sql_count "SELECT COUNT(*) AS count FROM sys_deployment WHERE id = '$id'")"
                case "$count" in
                  0) return 1 ;;
                  1) return 0 ;;
                  *) fail "deployment ID $id is not unique" ;;
                esac
              }

              field() {
                key="$1"
                source="$2"
                printf '%s\n' "$source" |
                  sed -n "s/^[[:space:]]*$key:[[:space:]]*//p" |
                  sed 's/[[:space:]]*$//'
              }

              validate_target() {
                id="$1"
                endpoint="$2"
                source_revision="$3"
                details="$(restate deployments describe "$id" --extra)" || fail "cannot describe $id"
                [ "$(field ID "$details")" = "$id" ] || fail "deployment $id changed identity"
                [ "$(field Endpoint "$details")" = "$endpoint" ] || fail "deployment $id changed endpoint"
                [ "$(field managed_by "$details")" = 'argocd' ] || fail "deployment $id changed managed_by metadata"
                [ "$(field source_revision "$details")" = "$source_revision" ] ||
                  fail "deployment $id changed source_revision metadata"
                [ "$(field service "$details")" = 'bayn-lifecycle' ] || fail "deployment $id changed service metadata"
              }

              validate_lifecycle_global() {
                violations="$(sql_count "
                  WITH expected(id, endpoint) AS (VALUES $expected_values),
                  classified AS (
                    SELECT d.id, d.endpoint, d.services
                    FROM sys_deployment d
                    WHERE d.id IN (SELECT id FROM expected)
                      OR d.endpoint LIKE 'http://bayn-lifecycle-%'
                      OR array_has(d.services, 'BaynLifecycle')
                      OR array_has(d.services, 'BaynLifecycleBootstrap')
                  )
                  SELECT COUNT(*) AS count
                  FROM classified d
                  LEFT JOIN expected e ON d.id = e.id
                  WHERE e.id IS NULL
                    OR d.endpoint <> e.endpoint
                    OR array_length(d.services) <> 2
                    OR NOT array_has(d.services, 'BaynLifecycle')
                    OR NOT array_has(d.services, 'BaynLifecycleBootstrap')
                ")"
                [ "$violations" -eq 0 ] || fail "unexpected lifecycle deployment classifier state ($violations violations)"

                invocations="$(sql_count "
                  SELECT COUNT(*) AS count
                  FROM sys_invocation
                  WHERE status <> 'completed'
                    AND (
                      target_service_name IN ('BaynLifecycle', 'BaynLifecycleBootstrap')
                      OR pinned_deployment_id IN ($expected_ids)
                    )
                ")"
                [ "$invocations" -eq 0 ] || fail "lifecycle or pinned nonterminal invocations exist ($invocations)"
              }

              remaining_count() {
                sql_count "
                  WITH expected(id, endpoint) AS (VALUES $expected_values)
                  SELECT COUNT(*) AS count
                  FROM sys_deployment d
                  JOIN expected e ON d.id = e.id
                "
              }

              lifecycle_service_count() {
                sql_count "
                  SELECT COUNT(*) AS count
                  FROM sys_service
                  WHERE name IN ('BaynLifecycle', 'BaynLifecycleBootstrap')
                    OR deployment_id IN ($expected_ids)
                "
              }

              validate_final_service_bindings() {
                service_count="$(lifecycle_service_count)"
                [ "$service_count" -eq 2 ] || fail "final lifecycle service binding count changed ($service_count)"
                exact_count="$(sql_count "
                  SELECT COUNT(*) AS count
                  FROM sys_service
                  WHERE
                    (name = 'BaynLifecycle'
                      AND revision = 18
                      AND public = false
                      AND ty = 'virtual_object'
                      AND deployment_id = '$final_id')
                    OR
                    (name = 'BaynLifecycleBootstrap'
                      AND revision = 18
                      AND public = true
                      AND ty = 'service'
                      AND deployment_id = '$final_id')
                ")"
                [ "$exact_count" -eq 2 ] || fail "final lifecycle service bindings changed ($exact_count exact rows)"
              }

              validate_no_lifecycle_services() {
                service_count="$(lifecycle_service_count)"
                [ "$service_count" -eq 0 ] || fail "legacy lifecycle service residue remains ($service_count rows)"
              }

              validate_final_active_revision() {
                current_remaining="$(remaining_count)"
                [ "$current_remaining" -eq 1 ] || fail "final retirement requires exactly one remaining allowlisted deployment, observed $current_remaining"
                deployment_present "$final_id" || fail 'final retirement requires the exact final allowlisted deployment'
                validate_target "$final_id" "$final_endpoint" "$final_source_revision"
                details="$(restate deployments describe "$final_id" --extra)" || fail "cannot describe $final_id"
                [ "$(field Status "$details")" = 'Active' ] || fail 'final retirement requires the final deployment to remain Active'
                latest_revision_count="$(printf '%s\n' "$details" | sed -n 's/^[[:space:]]*Revision:[[:space:]]*18 \[Latest\][[:space:]]*$/latest/p' | wc -l | tr -d ' ')"
                [ "$latest_revision_count" -eq 2 ] || fail 'final retirement requires both lifecycle services to remain revision 18 [Latest]'
                validate_final_service_bindings
              }

              validate_native_binding() {
                native_deployment_count="$(sql_count "
                  SELECT COUNT(*) AS count
                  FROM sys_deployment
                  WHERE id = '$native_id'
                    AND endpoint = '$native_endpoint'
                    AND array_length(services) = 2
                    AND array_has(services, 'BaynExecutionController')
                    AND array_has(services, 'BaynExecutionBootstrap')
                ")"
                [ "$native_deployment_count" -eq 1 ] || fail 'current native execution deployment binding changed'

                native_service_count="$(sql_count "
                  SELECT COUNT(*) AS count
                  FROM sys_service
                  WHERE name IN ('BaynExecutionController', 'BaynExecutionBootstrap')
                ")"
                [ "$native_service_count" -eq 2 ] || fail "native execution service binding count changed ($native_service_count)"

                native_exact_count="$(sql_count "
                  SELECT COUNT(*) AS count
                  FROM sys_service
                  WHERE
                    (name = 'BaynExecutionController'
                      AND revision = $native_revision
                      AND public = false
                      AND ty = 'virtual_object'
                      AND deployment_id = '$native_id')
                    OR
                    (name = 'BaynExecutionBootstrap'
                      AND revision = $native_revision
                      AND public = true
                      AND ty = 'service'
                      AND deployment_id = '$native_id')
                ")"
                [ "$native_exact_count" -eq 2 ] || fail "native execution service bindings changed ($native_exact_count exact rows)"
              }

              validate_native_tick_continuity() {
                completed_ticks="$(sql_count "
                  SELECT COUNT(*) AS count
                  FROM sys_invocation
                  WHERE target_service_name = 'BaynExecutionController'
                    AND target_handler_name = 'tick'
                    AND status = 'completed'
                    AND pinned_deployment_id = '$native_id'
                    AND completed_at >= now() - interval '5 minutes'
                ")"
                [ "$completed_ticks" -ge 2 ] || fail "native execution tick continuity is stale ($completed_ticks recent completed ticks)"

                nonterminal_ticks="$(sql_count "
                  SELECT COUNT(*) AS count
                  FROM sys_invocation
                  WHERE target_service_name = 'BaynExecutionController'
                    AND target_handler_name = 'tick'
                    AND status <> 'completed'
                ")"
                [ "$nonterminal_ticks" -ge 1 ] && [ "$nonterminal_ticks" -le 2 ] ||
                  fail "native execution tick continuity is unexpected ($nonterminal_ticks nonterminal ticks)"

                wrong_pinned_ticks="$(sql_count "
                  SELECT COUNT(*) AS count
                  FROM sys_invocation
                  WHERE target_service_name = 'BaynExecutionController'
                    AND target_handler_name = 'tick'
                    AND status <> 'completed'
                    AND pinned_deployment_id IS NOT NULL
                    AND pinned_deployment_id <> '$native_id'
                ")"
                [ "$wrong_pinned_ticks" -eq 0 ] || fail "native execution has nonterminal ticks pinned to another deployment ($wrong_pinned_ticks)"
              }

              validate_pre_remove() {
                validate_lifecycle_global
                validate_final_active_revision
                validate_native_binding
                validate_native_tick_continuity
              }

              validate_empty_legacy_state() {
                validate_lifecycle_global
                [ "$(remaining_count)" -eq 0 ] || fail 'legacy deployment reappeared after retirement'
                validate_no_lifecycle_services
              }

              validate_retirement_completion() {
                validate_empty_legacy_state
                validate_native_binding
                validate_native_tick_continuity
              }

              validate_lifecycle_global
              remaining="$(remaining_count)"
              [ "$remaining" -le 18 ] || fail "remaining deployment count exceeds immutable allowlist: $remaining"
              if [ "$remaining" -eq 0 ]; then
                # A later idempotent rerun must not pin future native execution rollouts to the rev11 deployment.
                validate_empty_legacy_state
                echo 'Bayn legacy Restate registration retirement already complete; empty-set rerun is safe.'
                exit 0
              fi
              [ "$remaining" -eq 1 ] || fail "unexpected non-final remaining subset ($remaining of 18); refusing final retirement"

              validate_pre_remove
              echo "Validated exact final Bayn lifecycle deployment $final_id and current native execution continuity."

              # Recheck the complete mutation contract immediately before the single force removal.
              validate_pre_remove
              echo "Force-removing the exact final Bayn lifecycle Restate deployment $final_id"
              if ! restate deployments remove --force -y "$final_id"; then
                fail "force removal refused for exact final deployment $final_id"
              fi

              attempt=1
              while [ "$attempt" -le "$poll_attempts" ]; do
                validate_lifecycle_global
                validate_native_binding
                validate_native_tick_continuity
                remaining="$(remaining_count)"
                service_count="$(lifecycle_service_count)"
                case "$remaining:$service_count" in
                  0:0)
                    # Completion of the force-removal transaction still requires the reviewed native rev11 continuity.
                    validate_retirement_completion
                    echo 'Bayn legacy Restate registration retirement completed.'
                    exit 0
                    ;;
                  1:2|0:2)
                    validate_final_service_bindings
                    ;;
                  *)
                    fail "unexpected asynchronous retirement state: $remaining deployment(s), $service_count lifecycle service row(s)"
                    ;;
                esac
                attempt=$((attempt + 1))
                sleep "$poll_interval_seconds"
              done

              fail "timed out waiting for exact final deployment and lifecycle services to disappear after $poll_attempts polls"
          env:
            - name: RESTATE_ADMIN_URL
              value: http://restate.restate.svc.cluster.local:9070
            - name: HOME
              value: /tmp
            - name: RESTATE_CLI_CONFIG_HOME
              value: /tmp/restate-cli
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
