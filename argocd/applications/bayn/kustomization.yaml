apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bayn
resources:
- telemetry.yaml
- glitchtip-dsns.yaml
- serviceaccount.yaml
- clickhouse-secret.yaml
- alpaca-sealedsecret.yaml
- objectbucketclaim.yaml
- research-storage.yaml
- research-objectbucket.yaml
- postgres-objectstore.yaml
- postgres-cluster.yaml
- postgres-monitoring.yaml
- postgres-scheduled-backup.yaml
- tigerbeetle-cluster.yaml
- tigerbeetle-networkpolicy.yaml
- egress-proxy.yaml
- deployment.yaml
- execution-bootstrap-sealedsecret.yaml
- execution-controller.yaml
- broker-feed.yaml
- broker-kafka-ingress.yaml
- broker-stream-networkpolicy.yaml
- execution-controller-pdb.yaml
- execution-controller-networkpolicy.yaml
- execution-activation.yaml
- execution-activation-networkpolicy.yaml
- service.yaml
- status-pdb.yaml
- networkpolicy.yaml
- jev-sealedsecret.yaml
- bayn-research-db-sealedsecret.yaml
- bayn-research-authority-sealedsecret.yaml
- research-worker.yaml
- opencode-retained-state.yaml
- research-networkpolicy.yaml
configMapGenerator:
- name: bayn-broker-kafka-health
  files:
  - probe.sh=broker-kafka-health.sh
  options:
    annotations:
      argocd.argoproj.io/sync-wave: "-2"
- name: bayn-telemetry
  files:
  - config.alloy=telemetry.alloy
  options:
    annotations:
      argocd.argoproj.io/sync-wave: "-4"
- name: bayn-egress-proxy
  files:
  - squid.conf
images:
- name: bayn-broker-feed
  newName: registry.ide-newton.ts.net/lab/bayn-broker-feed
  digest: sha256:a2f11d98fd1999c3ba3de5a00eab1802197d78dc2403a286037ea1bfeeda56f1
- name: bayn-main
  newName: registry.ide-newton.ts.net/lab/bayn
  digest: sha256:66f07b5e5f1abaeb133b3349e226601a2cba3ed44f97c29871916fa46d82253f
- name: bayn-research
  newName: registry.ide-newton.ts.net/lab/bayn-research
  digest: sha256:9f8b88be5e253772dd772e6b6e85e902b98f648018a803ec890ff231d5b2b94a
