apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bayn
resources:
  - serviceaccount.yaml
  - clickhouse-secret.yaml
  - alpaca-sealedsecret.yaml
  - objectbucketclaim.yaml
  - postgres-objectstore.yaml
  - postgres-cluster.yaml
  - postgres-scheduled-backup.yaml
  - tigerbeetle-cluster.yaml
  - tigerbeetle-networkpolicy.yaml
  - egress-proxy.yaml
  - deployment.yaml
  - lifecycle-current.yaml
  - lifecycle-previous.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: bayn-egress-proxy
    files:
      - squid.conf
images:
  - name: bayn-main
    newName: registry.ide-newton.ts.net/lab/bayn
    newTag: "sha-df500668c6dfe137fde8e47231f39c3e64e47841"
    digest: sha256:763ec6b492f688c66a792f64ac1e283c25588b68086c32c8a38a2e22d281e142
