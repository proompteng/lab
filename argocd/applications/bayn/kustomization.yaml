apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bayn
resources:
  - serviceaccount.yaml
  - clickhouse-secret.yaml
  - alpaca-sealedsecret.yaml
  - objectbucketclaim.yaml
  - postgres-objectstore.yaml
  - postgres-cluster.yaml
  - postgres-scheduled-backup.yaml
  - tigerbeetle-cluster.yaml
  - tigerbeetle-networkpolicy.yaml
  - egress-proxy.yaml
  - deployment.yaml
  - lifecycle-current.yaml
  - lifecycle-previous.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: bayn-egress-proxy
    files:
      - squid.conf
images:
  - name: bayn-main
    newName: registry.ide-newton.ts.net/lab/bayn
    newTag: "sha-1c19bedfe651b3cd8c7df219c9d7468be1ec13b0"
    digest: sha256:dbb0ab1d4c407e98d28c073b674f8e22ed605a64a4da0a2d307f70b062d0ffaf
