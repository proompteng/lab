apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bayn
resources:
  - serviceaccount.yaml
  - clickhouse-secret.yaml
  - alpaca-sealedsecret.yaml
  - objectbucketclaim.yaml
  - postgres-objectstore.yaml
  - postgres-cluster.yaml
  - postgres-scheduled-backup.yaml
  - tigerbeetle-cluster.yaml
  - tigerbeetle-networkpolicy.yaml
  - egress-proxy.yaml
  - deployment.yaml
  - execution-bootstrap-sealedsecret.yaml
  - execution-controller.yaml
  - execution-controller-networkpolicy.yaml
  - execution-activation.yaml
  - lifecycle-current.yaml
  - lifecycle-previous.yaml
  - service.yaml
  - networkpolicy.yaml
patches:
  - target:
      kind: Job
      labelSelector: app.kubernetes.io/name=bayn-lifecycle-register
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ignored
  - target:
      kind: NetworkPolicy
      labelSelector: app.kubernetes.io/name=bayn-lifecycle-register
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: ignored
configMapGenerator:
  - name: bayn-egress-proxy
    files:
      - squid.conf
images:
  - name: bayn-main
    newName: registry.ide-newton.ts.net/lab/bayn
    newTag: "sha-9101af1d4e51da3d68f0a0a8b4928404f4566fb3"
    digest: sha256:e3161c70906a4689fdaeca68d7802651ae8ff9031bcb61e6b09b59603c6516ad
