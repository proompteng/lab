apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bayn
resources:
- telemetry.yaml
- glitchtip-dsns.yaml
- serviceaccount.yaml
- clickhouse-secret.yaml
- alpaca-sealedsecret.yaml
- objectbucketclaim.yaml
- research-storage.yaml
- research-objectbucket.yaml
- postgres-objectstore.yaml
- postgres-cluster.yaml
- postgres-monitoring.yaml
- postgres-scheduled-backup.yaml
- tigerbeetle-cluster.yaml
- tigerbeetle-networkpolicy.yaml
- egress-proxy.yaml
- deployment.yaml
- execution-bootstrap-sealedsecret.yaml
- execution-controller.yaml
- execution-controller-pdb.yaml
- execution-controller-networkpolicy.yaml
- execution-activation.yaml
- execution-activation-networkpolicy.yaml
- service.yaml
- status-pdb.yaml
- networkpolicy.yaml
- jev-sealedsecret.yaml
- bayn-research-db-sealedsecret.yaml
- bayn-research-authority-sealedsecret.yaml
- research-worker.yaml
- opencode-retained-state.yaml
- research-networkpolicy.yaml
configMapGenerator:
- name: bayn-telemetry
  files:
  - config.alloy=telemetry.alloy
  options:
    annotations:
      argocd.argoproj.io/sync-wave: "-4"
- name: bayn-egress-proxy
  files:
  - squid.conf
images:
- name: bayn-main
  newName: registry.ide-newton.ts.net/lab/bayn
  digest: sha256:9939a7540e0bd68c5999beaf2a9a1d4083bee835143b002b42d5469cc8fa5a6d
- name: bayn-research
  newName: registry.ide-newton.ts.net/lab/bayn-research
  digest: sha256:bb1f70393024ef89412fe0f804079e9cf5b524a929492a26e5b64fa64249f315
