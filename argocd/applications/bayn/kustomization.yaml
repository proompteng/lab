apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bayn
resources:
  - serviceaccount.yaml
  - clickhouse-secret.yaml
  - alpaca-sealedsecret.yaml
  - objectbucketclaim.yaml
  - postgres-objectstore.yaml
  - postgres-cluster.yaml
  - postgres-scheduled-backup.yaml
  - tigerbeetle-cluster.yaml
  - tigerbeetle-networkpolicy.yaml
  - egress-proxy.yaml
  - deployment.yaml
  - lifecycle-current.yaml
  - lifecycle-previous.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: bayn-egress-proxy
    files:
      - squid.conf
images:
  - name: bayn-main
    newName: registry.ide-newton.ts.net/lab/bayn
    newTag: "sha-7b4ba9bd084386a21c61dd573652c35074687f7a"
    digest: sha256:2bcbd374bc3043bcb8bde8d39a1679d1448bb4e595f8fc15b8ec41aa0d4a2eb5
