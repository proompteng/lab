apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bayn
resources:
  - serviceaccount.yaml
  - clickhouse-secret.yaml
  - alpaca-sealedsecret.yaml
  - objectbucketclaim.yaml
  - postgres-objectstore.yaml
  - postgres-cluster.yaml
  - postgres-scheduled-backup.yaml
  - tigerbeetle-cluster.yaml
  - tigerbeetle-networkpolicy.yaml
  - egress-proxy.yaml
  - deployment.yaml
  - lifecycle-current.yaml
  - lifecycle-previous.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
