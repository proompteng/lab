apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bayn-execution-controller
  labels:
    app.kubernetes.io/name: bayn-execution-controller
    app.kubernetes.io/part-of: bayn
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: bayn-execution-controller
