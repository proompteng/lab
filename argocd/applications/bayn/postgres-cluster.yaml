apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bayn-db
  labels:
    app.kubernetes.io/name: bayn-db
    app.kubernetes.io/part-of: bayn
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: Bayn control and evaluation evidence
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:5a6a677d3fa2bc3fdc61874e0de8324b5a987eb676ddca133e71365a8467d6c1
  imagePullPolicy: IfNotPresent
  enablePDB: true
  enableSuperuserAccess: false
  minSyncReplicas: 1
  maxSyncReplicas: 1
  managed:
    roles:
      - name: bayn_research
        ensure: present
        login: true
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        connectionLimit: 2
        comment: Isolated native Jev editor claims and receipts
        passwordSecret:
          name: bayn-research-db
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: network.proompteng.ai/100g
                operator: In
                values:
                  - "true"
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  storage:
    storageClass: rook-ceph-block
    size: 100Gi
    resizeInUseVolumes: true
  bootstrap:
    initdb:
      database: bayn
      owner: bayn_app
      encoding: UTF8
      dataChecksums: true
  postgresql:
    parameters:
      shared_buffers: 512MB
      effective_cache_size: 1536MB
      wal_buffers: 16MB
      wal_compression: lz4
      max_wal_size: 4GB
      checkpoint_timeout: 15min
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3
      log_lock_waits: "on"
      deadlock_timeout: 1s
      log_min_duration_statement: 1000ms
      log_parameter_max_length: "0"
      log_parameter_max_length_on_error: "0"
      track_io_timing: "on"
      track_wal_io_timing: "on"
      wal_sender_timeout: 60s
      wal_receiver_timeout: 60s
  monitoring:
    metricsQueriesTTL: 1s
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
      - name: bayn-postgres-monitoring
        key: queries
    disableDefaultQueries: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bayn-db
        serverName: bayn-db-live
