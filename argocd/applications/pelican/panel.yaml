apiVersion: v1
kind: ConfigMap
metadata:
  name: pelican-config
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://pelican.ide-newton.ts.net
  APP_INSTALLED: "true"
  XDG_DATA_HOME: /pelican-data
  BEHIND_PROXY: "true"
  TRUSTED_PROXIES: 10.244.0.0/16
  DB_CONNECTION: sqlite
  DB_DATABASE: /pelican-data/database/database.sqlite
  CACHE_STORE: file
  QUEUE_CONNECTION: database
  SESSION_DRIVER: file
  SESSION_SECURE_COOKIE: "true"
  MAIL_MAILER: log
  SKIP_MIGRATIONS: "true"
  ADMIN_USERNAME: greg
  ADMIN_EMAIL: admin@pelican.local
  WINGS_FQDN: pelican-wings.ide-newton.ts.net
  WINGS_NODE_UUID: 4e5308ee-d0d8-4d13-b808-5c15f5effd62
  WINGS_TOKEN_ID: pelicangalactic1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pelican-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelican
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pelican-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pelican-panel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize
          image: ghcr.io/pelican/panel
          command: [/bin/ash, -ec]
          args:
            - |
              umask 077
              mkdir -p /pelican-data/database /pelican-data/storage /pelican-data/plugins
              if [ -f /pelican-data/.env ]; then
                saved_key=$(sed -n 's/^APP_KEY=//p' /pelican-data/.env | tr -d "\r\"'")
                if [ "$saved_key" != "$APP_KEY" ]; then
                  echo 'Persisted APP_KEY differs from Secret; restore the matching key before continuing.' >&2
                  exit 1
                fi
              else
                printf 'APP_KEY=%s\nAPP_INSTALLED=true\n' "$APP_KEY" > /pelican-data/.env
              fi
              touch /pelican-data/database/database.sqlite
              php artisan migrate --force --no-interaction
              if [ ! -f /pelican-data/.initialized ]; then
                php artisan db:seed --force --no-interaction
              fi
              php /bootstrap/bootstrap.php
              touch /pelican-data/.initialized
          envFrom:
            - configMapRef:
                name: pelican-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: pelican-bootstrap
                  key: APP_KEY
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pelican-bootstrap
                  key: ADMIN_PASSWORD
            - name: WINGS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pelican-bootstrap
                  key: WINGS_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /pelican-data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: panel
          image: ghcr.io/pelican/panel
          envFrom:
            - configMapRef:
                name: pelican-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: pelican-bootstrap
                  key: APP_KEY
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /pelican-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pelican-data
        - name: bootstrap
          configMap:
            name: pelican-bootstrap
