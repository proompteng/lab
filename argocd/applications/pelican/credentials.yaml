apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: pelican-app-key
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  length: 32
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: pelican-admin-password
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  length: 48
  digits: 12
  symbols: 0
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: pelican-wings-token
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  length: 64
  digits: 16
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pelican-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshPolicy: CreatedOnce
  target:
    name: pelican-bootstrap
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      data:
        APP_KEY: 'base64:{{ .app_key | b64enc }}'
        ADMIN_PASSWORD: '{{ .admin_password }}'
        WINGS_TOKEN: '{{ .wings_token }}'
        userdata: |
          #cloud-config
          hostname: pelican-wings
          manage_etc_hosts: true
          ssh_pwauth: false
          disable_root: true
          package_update: true
          packages:
            - ca-certificates
            - curl
            - qemu-guest-agent
          write_files:
            - path: /etc/pelican/config.yml
              owner: root:root
              permissions: '0600'
              content: |
                debug: false
                uuid: 4e5308ee-d0d8-4d13-b808-5c15f5effd62
                token_id: pelicangalactic1
                token: '{{ .wings_token }}'
                api:
                  host: 0.0.0.0
                  port: 8080
                  ssl:
                    enabled: false
                  upload_limit: 256
                  trusted_proxies:
                    - 10.244.0.0/16
                system:
                  data: /var/lib/pelican/volumes
                  sftp:
                    bind_port: 2022
                allowed_mounts: []
                remote: https://pelican.ide-newton.ts.net
            - path: /etc/docker/daemon.json
              owner: root:root
              permissions: '0644'
              content: |
                {"log-driver":"local","log-opts":{"max-size":"10m","max-file":"3"}}
            - path: /etc/systemd/system/wings.service
              owner: root:root
              permissions: '0644'
              content: |
                [Unit]
                Description=Pelican Wings
                Wants=network-online.target
                After=network-online.target docker.service
                Requires=docker.service
                PartOf=docker.service
                StartLimitIntervalSec=0
                [Service]
                User=root
                WorkingDirectory=/etc/pelican
                LimitNOFILE=4096
                ExecStart=/usr/local/bin/wings --config /etc/pelican/config.yml
                Restart=on-failure
                RestartSec=10s
                [Install]
                WantedBy=multi-user.target
            - path: /usr/local/sbin/install-pelican-wings
              owner: root:root
              permissions: '0700'
              content: |
                #!/bin/bash
                set -euo pipefail
                export DEBIAN_FRONTEND=noninteractive
                install -m 0755 -d /etc/apt/keyrings /var/run/wings
                curl --fail --silent --show-error --retry 5 --location \
                  https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
                chmod a+r /etc/apt/keyrings/docker.asc
                echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' \
                  > /etc/apt/sources.list.d/docker.list
                apt-get update
                apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                curl --fail --silent --show-error --retry 5 --location \
                  https://github.com/pelican/wings/releases/download/v1.0.0-rc.1/wings_linux_amd64 \
                  -o /usr/local/bin/wings
                echo '19dda386e02041da1f1fbcc73f34e4bb01c1fbc2d499aac79a6be3a51ba7f0e8  /usr/local/bin/wings' | sha256sum -c -
                chmod 0755 /usr/local/bin/wings
                systemctl daemon-reload
                systemctl enable --now docker qemu-guest-agent wings
          runcmd:
            - [/usr/local/sbin/install-pelican-wings]
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pelican-app-key
      rewrite:
        - regexp:
            source: '^password$'
            target: app_key
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pelican-admin-password
      rewrite:
        - regexp:
            source: '^password$'
            target: admin_password
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pelican-wings-token
      rewrite:
        - regexp:
            source: '^password$'
            target: wings_token
