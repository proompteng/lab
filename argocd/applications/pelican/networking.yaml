apiVersion: v1
kind: Service
metadata:
  name: pelican
spec:
  selector:
    app.kubernetes.io/name: pelican-panel
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pelican
  annotations:
    tailscale.com/tags: tag:k8s
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [pelican.ide-newton.ts.net]
  rules:
    - host: pelican.ide-newton.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pelican
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pelican-wings
spec:
  selector:
    kubevirt.io/domain: pelican-wings
  ports:
    - name: api
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pelican-wings
  annotations:
    tailscale.com/tags: tag:k8s
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [pelican-wings.ide-newton.ts.net]
  rules:
    - host: pelican-wings.ide-newton.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pelican-wings
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pelican-games
  annotations:
    tailscale.com/hostname: pelican-games
    tailscale.com/tags: tag:k8s
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    kubevirt.io/domain: pelican-wings
  ports:
    - name: sftp
      port: 2022
      targetPort: 2022
      protocol: TCP
    - name: forest
      port: 10999
      targetPort: 10999
      protocol: UDP
    - name: caves
      port: 11000
      targetPort: 11000
      protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pelican-panel-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pelican-panel
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 80
