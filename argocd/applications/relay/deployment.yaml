apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay
  namespace: relay
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: relay
  namespace: relay
spec:
  selector:
    app.kubernetes.io/name: relay
  ports:
    - name: grpc
      port: 9443
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: relay
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay
        spiffe.io/spire-managed-identity: 'true'
    spec:
      serviceAccountName: relay
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: relay-main
          ports:
            - name: grpc
              containerPort: 9443
          env:
            - name: RELAY_CONFIG_FILE
              value: /etc/relay/config.json
            - name: OFZ_GRPC_TARGET
              value: ofz-api.ofz.svc.cluster.local:9443
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/spire-agent.sock
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: grpc
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/relay
              readOnly: true
            - name: workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: kubernetes
              mountPath: /var/run/relay/kubernetes
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: relay-config
        - name: workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: kubernetes
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: relay
  namespace: relay
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relay
