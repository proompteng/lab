apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: relay
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: relay
      containers:
        - name: relay
          image: registry.ide-newton.ts.net/lab/relay:bootstrap
          ports:
            - name: mcp
              containerPort: 8443
            - name: health
              containerPort: 8080
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/spire-agent.sock
            - name: SPIFFE_TRUST_DOMAIN
              value: proompteng.ai
            - name: RELAY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /livez
              port: health
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 15
          volumeMounts:
            - name: workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: credentials
              mountPath: /var/run/secrets/relay-credentials
              readOnly: true
      volumes:
        - name: workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: credentials
          secret:
            secretName: relay-credentials
            optional: true
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: relay
spec:
  selector:
    app.kubernetes.io/name: relay
  ports:
    - name: mcp
      port: 8443
      targetPort: mcp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: relay
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: relay
