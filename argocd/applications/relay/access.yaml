apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: relay-grants
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [relay-grants]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: relay-grants
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: relay-grants
subjects:
  - kind: ServiceAccount
    name: relay
    namespace: relay
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: relay
spec:
  spiffeIDTemplate: spiffe://{{ .TrustDomain }}/ns/relay/sa/relay
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: relay
  podSelector:
    matchLabels:
      app.kubernetes.io/name: relay
  workloadSelectorTemplates:
    - k8s:ns:relay
    - k8s:sa:relay
    - k8s:container-name:relay
  ttl: 2m
  fallback: false
