apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: relay-namespace-identity
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  resourceNames:
  - ofz
  - tengri
  - opencode
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: relay-namespace-identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: relay-namespace-identity
subjects:
- kind: ServiceAccount
  name: relay
  namespace: relay
---
