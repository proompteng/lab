apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: microvm-agent-qemu
  labels:
    app.kubernetes.io/name: microvm-agent
    app.kubernetes.io/instance: qemu
    app.kubernetes.io/component: runtime-canary
    app.kubernetes.io/part-of: kata-runtimes
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: microvm-agent
      app.kubernetes.io/instance: qemu
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: microvm-agent
        app.kubernetes.io/instance: qemu
        app.kubernetes.io/component: runtime-canary
        app.kubernetes.io/part-of: kata-runtimes
        runtime.proompteng.ai/vmm: qemu
    spec:
      runtimeClassName: kata-qemu
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      nodeSelector:
        runtime.proompteng.ai/kata-qemu: ready
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/proompteng/microvm-agent@sha256:5573551391d01240297680da6ac172d3c819b57d493c3c3e2e11fa1388b06640
          imagePullPolicy: IfNotPresent
          env:
            - name: MICROVM_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: MICROVM_BOOTSTRAP_TOKEN
              value: kata-canary-proof-v1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
---
