---
apiVersion: v1
kind: Pod
metadata:
  name: firecracker-turin-spike
  namespace: microvm-spike
  labels:
    app.kubernetes.io/name: firecracker-turin-spike
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: turin
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  containers:
    - name: launcher
      image: >-
        ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
      imagePullPolicy: IfNotPresent
      command:
        - /spike/launcher.sh
      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
      resources:
        requests:
          cpu: 500m
          ephemeral-storage: 2Gi
          memory: 1Gi
        limits:
          cpu: "2"
          ephemeral-storage: 5Gi
          memory: 4Gi
      volumeMounts:
        - name: kvm
          mountPath: /dev/kvm
        - name: tun
          mountPath: /dev/net/tun
        - name: scripts
          mountPath: /spike
          readOnly: true
        - name: work
          mountPath: /work
  volumes:
    - name: kvm
      hostPath:
        path: /dev/kvm
        type: CharDevice
    - name: tun
      hostPath:
        path: /dev/net/tun
        type: CharDevice
    - name: scripts
      configMap:
        name: firecracker-turin-spike
        defaultMode: 0555
    - name: work
      emptyDir:
        sizeLimit: 5Gi
