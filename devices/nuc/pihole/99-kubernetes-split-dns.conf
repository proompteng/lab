# Forward Kubernetes internal DNS to the in-cluster CoreDNS service.
#
# Keep this aligned with the active service CIDR and kube-dns/CoreDNS ClusterIP.
server=/cluster.local/10.96.0.10
# Resolve this tailnet locally; public resolvers return NXDOMAIN for these names.
server=/ide-newton.ts.net/100.100.100.100
