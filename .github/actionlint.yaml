self-hosted-runner:
  # Labels of self-hosted runner in array of strings.
  labels:
    - arc-amd64
    - arc-arm64

# Configuration variables in array of strings defined in your repository or
# organization. `null` means disabling configuration variables check.
# Empty array means no configuration variable is allowed.
config-variables: null

# Configuration for file paths. The keys are glob patterns to match to file
# paths relative to the repository root. The values are the configurations for
# the file paths. Note that the path separator is always '/'.
# The following configurations are available.
#
# "ignore" is an array of regular expression patterns. Matched error messages
# are ignored. This is similar to the "-ignore" command line option.
paths:
  .github/workflows/bayn-build-push.yml:
    # GitHub supports queue: max; actionlint 1.7.7 and 1.7.12 do not parse it yet.
    # https://github.com/rhysd/actionlint/issues/657
    # affected-inputs.test.ts binds the exact queue policy to the dependency-only skip boundary.
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
  .github/workflows/temporal-bun-sdk.yml:
    # GitHub supports queue: max; actionlint has not implemented it yet.
    # https://github.com/rhysd/actionlint/issues/657
    # temporal-static-libraries-workflow.test.ts checks these concurrency settings.
    ignore:
      - '^unexpected key "queue" for "concurrency" section\.'
  .github/workflows/bayn-formal.yml:
    # The input is supported by setup-java v5 but absent from actionlint's embedded metadata.
    # https://github.com/actions/setup-java/blob/v5/action.yml
    ignore:
      - '^input "jdk-file" is not defined in action "actions/setup-java@v5"\. available inputs are '
