name: Codex devbox

on:
  pull_request:
    paths:
      - services/devbox/**
      - packages/scripts/src/shared/cli.ts
      - packages/scripts/src/shared/docker.ts
      - argocd/applications/devbox/**
      - .github/workflows/codex-devbox.yml
      - .github/workflows/codex-devbox-validate.yml
      - flake.nix
      - flake.lock
      - nix/packages.nix
      - nix/toolchain-doctor.sh
  push:
    branches: [main]
    paths:
      - services/devbox/**
      - packages/scripts/src/shared/cli.ts
      - packages/scripts/src/shared/docker.ts
      - argocd/applications/devbox/**
      - .github/workflows/codex-devbox.yml
      - .github/workflows/codex-devbox-validate.yml
      - flake.nix
      - flake.lock
      - nix/packages.nix
      - nix/toolchain-doctor.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-devbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/codex-devbox-validate.yml
    with:
      publish: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: arc-amd64
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Publish and verify the immutable index
        env:
          SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/codex-devbox.yml@refs/heads/main
        run: bash services/devbox/publish.sh prepare
      - uses: actions/upload-artifact@v4
        with:
          name: codex-devbox-release-contract
          path: .artifacts/codex-devbox/
          include-hidden-files: true
          if-no-files-found: error
      - name: Make the complete release discoverable
        run: bash services/devbox/publish.sh expose
