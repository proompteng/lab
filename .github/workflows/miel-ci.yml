name: miel

on:
  push:
    branches:
      - main
    paths:
      - 'services/miel/**'
      - '.github/workflows/miel-ci.yml'
      - '.github/actions/validate-go-service/**'
  pull_request:
    paths:
      - 'services/miel/**'
      - '.github/workflows/miel-ci.yml'
      - '.github/actions/validate-go-service/**'

concurrency:
  group: miel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
      - uses: ./.github/actions/validate-go-service
        with:
          service: miel
