name: Kata validation

on:
  workflow_call:
    inputs:
      build-extensions:
        type: boolean
        default: true
      validate-catalog:
        type: boolean
        default: true
      publish-extension:
        type: boolean
        default: false
    outputs:
      image:
        value: ${{ jobs.build.outputs.image }}
      version:
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

env:
  IMAGE: registry.ide-newton.ts.net/lab/talos-kata-runtimes
  KATA_SOURCE_COMMIT: 894e1956bb340752b30f7ad49879972234a0098c
  VERSION: 4.1.0-talos-v1.13.9-r6

jobs:
  catalog:
    name: Validate Talos 1.14 catalog
    if: inputs.validate-catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Verify immutable input and build catalog
        run: devices/galactic/releases/catalog.sh build out/catalog
      - name: Upload catalog receipt
        uses: actions/upload-artifact@v4
        with:
          name: talos-v1.14.0-catalog
          path: out/catalog/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.architecture }} extension
    if: inputs.build-extensions
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      EXPORT_EXTENSION: ${{ inputs.publish-extension && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout lab
        uses: actions/checkout@v6

      - name: Checkout pinned Kata source
        uses: actions/checkout@v6
        with:
          repository: kata-containers/kata-containers
          ref: ${{ env.KATA_SOURCE_COMMIT }}
          path: .kata-source
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96'

      - name: Set up pinned native test dependencies
        uses: ./.github/actions/setup-nix-toolchain

      - name: Build and test patched Kata components
        run: |
          nix develop --file devices/galactic/extensions/kata/shell.nix \
            --command devices/galactic/extensions/kata/build-patched-kata.sh \
            .kata-source \
            "devices/galactic/extensions/kata/artifacts/${{ matrix.architecture }}"

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildkit

      - name: Build native extension image
        id: extension
        uses: docker/build-push-action@v6
        with:
          context: devices/galactic/extensions/kata
          platforms: linux/${{ matrix.architecture }}
          push: false
          outputs: ${{ env.EXPORT_EXTENSION == 'true' && format('type=oci,tar=false,dest={0}/kata-extension', runner.temp) || '' }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.architecture }}
          labels: org.opencontainers.image.version=${{ env.VERSION }}
          provenance: mode=max
          sbom: true

      - name: Record native extension digest
        if: env.EXPORT_EXTENSION == 'true'
        shell: bash
        env:
          EXTENSION_DIGEST: ${{ steps.extension.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$EXTENSION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$EXTENSION_DIGEST" > "$RUNNER_TEMP/kata-extension/digest.txt"

      - name: Upload native extension
        if: env.EXPORT_EXTENSION == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kata-extension-${{ matrix.architecture }}
          path: ${{ runner.temp }}/kata-extension/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Record extension reference
        id: release
        shell: bash
        run: |
          printf 'image=%s\nversion=%s\n' "$IMAGE" "$VERSION" >> "$GITHUB_OUTPUT"
