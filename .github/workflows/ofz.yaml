name: Ofz authorization

on:
  pull_request:
    paths:
      - 'services/ofz/**'
      - 'argocd/applications/ofz/**'
      - 'proto/proompteng/authz/**'
      - 'services/relay/**'
      - 'packages/platform-client/**'
      - 'proto/proompteng/relay/**'
      - 'apps/landing/src/lib/platform/**'
      - 'apps/landing/src/app/api/platform/**'
      - 'services/tengri/**'
      - 'services/nanoagent/**'
      - 'apps/landing/src/app/api/tengri/**'
      - 'apps/landing/src/app/api/auth/**'
      - 'apps/landing/src/lib/tengri/**'
      - 'apps/landing/src/components/tengri/**'
      - 'apps/landing/src/components/platform/**'
      - 'argocd/applications/keycloak/tengri/**'
      - 'argocd/applications/proompteng/ingressroute.yaml'
      - 'apps/landing/package.json'
      - 'bun.lock'
      - '.github/scripts/install-tengri-chromium.mjs'
      - '.github/workflows/ofz.yaml'
      - 'nix/images/ofz.nix'
      - 'nix/images/ofz-fixture-tools.nix'
      - 'nix/images/agentrun-tools.nix'
      - 'nix/tengri-schema-hash.py'
      - 'nix/packages.nix'
      - 'flake.nix'
      - 'flake.lock'
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tengri-images.yml'
      - 'apps/landing/**'
      - 'apps/landing/package.json'
      - 'apps/landing/src/app/api/auth/**'
      - 'apps/landing/src/app/api/tengri/**'
      - 'apps/landing/src/components/tengri/**'
      - 'apps/landing/src/lib/tengri/**'
      - 'argocd/applications/keycloak/tengri/**'
      - 'argocd/applications/ofz/**'
      - 'argocd/applications/proompteng/**'
      - 'argocd/applications/proompteng/ingressroute.yaml'
      - 'argocd/applications/tengri/**'
      - 'argocd/applications/tengri/crd.yaml'
      - 'bun.lock'
      - 'devices/galactic/omni/tengri-runner-*.json'
      - 'flake.lock'
      - 'flake.nix'
      - 'nix/images/bun-workspace-service.nix'
      - 'nix/images/ofz.nix'
      - 'nix/images/proompteng.nix'
      - 'nix/packages.nix'
      - 'nix/tengri-schema-hash.py'
      - 'packages/backend/**'
      - 'packages/design/**'
      - 'packages/scripts/src/tengri/**'
      - '!packages/scripts/src/tengri/__tests__/**'
      - '!packages/scripts/src/tengri/**/*.test.ts'
      - 'proto/proompteng/authz/**'
      - 'services/relay/**'
      - 'packages/platform-client/**'
      - 'proto/proompteng/relay/**'
      - 'apps/landing/src/lib/platform/**'
      - 'apps/landing/src/app/api/platform/**'
      - 'services/nanoagent/**'
      - 'services/ofz/**'
      - 'services/ofz/Cargo.*'
      - 'services/ofz/build.rs'
      - 'services/ofz/migrations/**'
      - 'services/ofz/operations.json'
      - 'services/ofz/schema.zed'
      - 'services/ofz/src/**'
      - 'services/ofz/test-control.sh'
      - 'services/tengri/**'
      - package.json
      - bunfig.toml
      - .npmrc
      - patches/**
      - tsconfig.base.json
      - nix/images/relativize-bun-cache.sh
      - nix/images/prune-bun-dependency-metadata.sh
      - '!apps/landing/README.md'
      - '!services/ofz/README.md'
      - '!services/tengri/README.md'
      - '!services/nanoagent/README.md'
  workflow_dispatch:

concurrency:
  group: ofz-authorization-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: ${{ github.event_name == 'pull_request' && 'blob:none' || '' }}
      - uses: ./.github/actions/affected-inputs
        id: inputs
        if: github.event_name == 'pull_request'
        with:
          workflow: .github/workflows/ofz.yaml
          workspaces: |
            ofz: ['', 'apps/landing', 'packages/backend', 'packages/design']
      - name: Record Ofz validation selection
        id: selection
        if: github.event_name == 'pull_request'
        env:
          AFFECTED: ${{ steps.inputs.outputs.affected }}
        run: |
          set -euo pipefail
          run="$(jq -er '.ofz | if type == "boolean" then tostring else error("Missing Ofz validation decision") end' <<< "$AFFECTED")"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Run Ofz validation: $run" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.selection.outputs.run != 'false'
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        if: steps.selection.outputs.run != 'false'
        with:
          shared-key: ofz-validation
          workspaces: |
            services/ofz -> target
            services/tengri -> target
      - name: Install native build tools
        if: steps.selection.outputs.run != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential protobuf-compiler python3
      - uses: ./.github/actions/setup-nix-toolchain
        if: steps.selection.outputs.run != 'false'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Buf
        if: steps.selection.outputs.run != 'false'
        run: |
          set -euo pipefail
          buf_tools="$(nix build --no-link --print-out-paths .#buf)"
          echo "${buf_tools}/bin" >> "$GITHUB_PATH"
      - name: Validate typed contract and inventory
        if: steps.selection.outputs.run != 'false'
        run: |
          set -euo pipefail
          buf lint --path proto/proompteng/authz --path proto/proompteng/relay
          buf format --path proto/proompteng/authz --path proto/proompteng/relay --diff --exit-code
          python3 services/ofz/tests/inventory.py
          python3 -m unittest discover -s services/ofz/tests -p 'test_*.py'
      - name: Install pinned native platform fixture tools
        if: steps.selection.outputs.run != 'false'
        run: |
          set -euo pipefail
          tools="$(nix build --no-link --print-out-paths .#ofz-fixture-tools)"
          "${tools}/bin/postgres" --version
          echo "${tools}/bin" >> "$GITHUB_PATH"
      - name: Validate Ofz
        if: steps.selection.outputs.run != 'false'
        working-directory: services/ofz
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          bash test-policy.sh
      - name: Verify initial bootstrap and archive-gated activation
        if: steps.selection.outputs.run != 'false'
        run: bash services/ofz/test-control.sh bootstrap
      - name: Verify platform clients in isolated fixtures
        if: steps.selection.outputs.run != 'false'
        run: |
          bash services/ofz/test-control.sh platform
          bash services/ofz/qualify-platform.sh
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.selection.outputs.run != 'false'
        with:
          version: '0.9.15'
          enable-cache: false
      - name: Verify independent immutable audit export
        if: steps.selection.outputs.run != 'false'
        run: bash services/ofz/test-control.sh archive
      # The promotion fixture seeds its database by running the full control integration test.
      - name: Verify control state and synchronous physical database promotion
        if: steps.selection.outputs.run != 'false'
        run: bash services/tengri/test-database-failover.sh
      - uses: oven-sh/setup-bun@v2
        if: github.event_name != 'pull_request'
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v5
        if: steps.selection.outputs.run != 'false'
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Keycloak 26.8.2 fixture archive
        if: steps.selection.outputs.run != 'false'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ofz-keycloak/keycloak-26.8.2.tar.gz
          key: keycloak-26.8.2-dd124787283918bc597628887168333465ee2a811a389e0003569e52be7e487f
      - name: Install identity fixture dependencies
        if: steps.selection.outputs.run != 'false'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter landing --filter @proompteng/backend --filter @proompteng/design
          node .github/scripts/install-tengri-chromium.mjs
          keycloak_fixture_bin="$(bash services/ofz/tests/keycloak-runtime.sh "$RUNNER_TEMP/ofz-keycloak")"
          echo "KEYCLOAK_FIXTURE_BIN=${keycloak_fixture_bin}" >> "$GITHUB_ENV"
      - name: Verify generated authorization client
        if: steps.selection.outputs.run != 'false'
        run: |
          buf generate --template services/ofz/buf.gen.yaml --path proto/proompteng/authz --path proto/proompteng/relay
          git diff --exit-code -- apps/landing/src/lib/tengri/generated
      - name: Verify real browser identity and shared sessions
        if: steps.selection.outputs.run != 'false'
        run: bash services/ofz/test-control.sh identity

  build-ofz:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    uses: ./.github/workflows/nix-oci-build-common.yml
    with:
      image_name: ofz
      package_attr: ofz-image
      source_revision: ${{ github.sha }}
      tag: sha-${{ github.sha }}
      publish_kargo_tag: true
      kargo_tag_include_run_id: true
      release_artifact_name: ofz-image-release
    secrets: inherit
