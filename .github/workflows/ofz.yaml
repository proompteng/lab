name: Ofz authorization

on:
  pull_request:
    paths:
      - 'services/ofz/**'
      - 'proto/proompteng/authz/**'
      - 'services/tengri/**'
      - 'services/nanoagent/**'
      - 'apps/landing/src/app/api/tengri/**'
      - 'apps/landing/src/app/api/auth/**'
      - 'apps/landing/src/lib/tengri/**'
      - 'apps/landing/src/components/tengri/**'
      - 'argocd/applications/keycloak/tengri/**'
      - 'argocd/applications/proompteng/ingressroute.yaml'
      - 'apps/landing/package.json'
      - 'bun.lock'
      - '.github/workflows/ofz.yaml'
  push:
    branches: [main]
    paths:
      - 'services/ofz/**'
      - 'proto/proompteng/authz/**'
      - 'services/tengri/**'
      - 'services/nanoagent/**'
      - 'apps/landing/src/app/api/tengri/**'
      - 'apps/landing/src/app/api/auth/**'
      - 'apps/landing/src/lib/tengri/**'
      - 'apps/landing/src/components/tengri/**'
      - 'argocd/applications/keycloak/tengri/**'
      - 'argocd/applications/proompteng/ingressroute.yaml'
      - 'apps/landing/package.json'
      - 'bun.lock'
      - '.github/workflows/ofz.yaml'
  workflow_dispatch:

concurrency:
  group: ofz-authorization-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: arc-amd64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential protobuf-compiler python3
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.59.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate typed contract and inventory
        run: |
          set -euo pipefail
          buf lint --path proto/proompteng/authz/v1/authz.proto
          buf format --path proto/proompteng/authz/v1/authz.proto --diff --exit-code
          python3 services/ofz/tests/inventory.py
          python3 -m unittest discover -s services/ofz/tests -p 'test_*.py'
      - name: Validate Ofz
        working-directory: services/ofz
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          bash test-policy.sh
          bash test-control.sh
      - name: Validate shared runtime state and replica fencing
        run: bash services/tengri/test-runtime.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install identity fixture dependencies
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter landing --filter @proompteng/backend --filter @proompteng/design
          bunx playwright install --with-deps chromium
          echo "KEYCLOAK_FIXTURE_BIN=$(bash services/ofz/tests/keycloak-runtime.sh "$RUNNER_TEMP/ofz-keycloak")" >> "$GITHUB_ENV"
      - name: Verify generated authorization client
        run: |
          buf generate --template services/ofz/buf.gen.yaml --path proto/proompteng/authz
          git diff --exit-code -- apps/landing/src/lib/tengri/generated
      - name: Validate BFF identity and administration
        run: |
          set -euo pipefail
          bunx tsc --noEmit --project apps/landing/tsconfig.json --pretty false
          bun run --cwd apps/landing test
      - name: Verify real browser identity and shared sessions
        run: bash services/ofz/test-control.sh identity
