name: Semantic Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate PR metadata
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install workspace lint tools
        run: bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source

      - name: Lint workspace
        run: bun run lint:oxlint

      - name: Validate title and commit subjects
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate-pr-metadata.sh
