name: ARC placement acceptance

on:
  # Run after the existing build wave clears; the readiness check has a five-minute budget.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: arc-placement-acceptance
  cancel-in-progress: false

jobs:
  publication-tools:
    name: Publication slot ${{ matrix.slot }}
    runs-on: arc-amd64-publish
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    env:
      SLOT: ${{ matrix.slot }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify publication runner isolation
        run: |
          set -euo pipefail
          case "$ARC_RUNNER_NODE_NAME" in talos-192-168-1-194|turin) ;; *) exit 1 ;; esac
          test ! -S /var/run/docker.sock
          test -z "${DOCKER_HOST:-}"
          test -z "${BUILDKIT_HOST:-}"
          jq -n --arg node "$ARC_RUNNER_NODE_NAME" --arg pod "$ACTIONS_RUNNER_POD_NAME" --argjson slot "$SLOT" \
            '{role:"publication",node:$node,pod:$pod,slot:$slot}' > "$RUNNER_TEMP/arc-ready.json"
      - name: Publish ready publication slot
        uses: actions/upload-artifact@v4
        with:
          name: arc-ready-${{ github.run_attempt }}-publication-${{ matrix.slot }}
          path: ${{ runner.temp }}/arc-ready.json
          retention-days: 1
      - name: Verify publication while all runner slots are occupied
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          prefix="arc-ready-$RUN_ATTEMPT-"
          deadline=$((SECONDS + 5 * 60))
          count=0
          while (( SECONDS < deadline )); do
            count="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.expired == false and (.name | startswith(\"$prefix\")))] | length")"
            test "$count" = 10 && break
            sleep 60
          done
          test "$count" = 10 || { echo 'Eight build and two publication slots did not become ready within five minutes' >&2; exit 1; }
          jq --argjson start "$(date +%s)" '. + {start:$start}' "$RUNNER_TEMP/arc-ready.json" > "$RUNNER_TEMP/arc-proof.json"
          nix eval --offline --expr '40 + 2' | grep -qx 42
          crane digest registry.ide-newton.ts.net/lab/arc-runner:latest
          docker buildx imagetools inspect registry.ide-newton.ts.net/lab/arc-runner:latest
          cosign version
          sleep 180
          jq --argjson end "$(date +%s)" '. + {end:$end}' "$RUNNER_TEMP/arc-proof.json" > "$RUNNER_TEMP/arc-complete.json"
      - name: Publish publication concurrency proof
        uses: actions/upload-artifact@v4
        with:
          name: arc-proof-${{ github.run_attempt }}-publication-${{ matrix.slot }}
          path: ${{ runner.temp }}/arc-complete.json
          retention-days: 1
  local-build:
    name: Build slot ${{ matrix.slot }} local scratch build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: arc-amd64
    env:
      SLOT: ${{ matrix.slot }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-buildkit
      - name: Verify local scratch, Nix, and BuildKit output bytes
        shell: bash
        run: |
          set -euo pipefail
          case "$ARC_RUNNER_NODE_NAME" in talos-192-168-1-194|turin) ;; *) exit 1 ;; esac
          for path in /nix /home/runner/.cache /tmp /home/runner/_work; do
            test "$(df -P -T "$path" | awk 'NR == 2 {print $2}')" = xfs
          done
          test "$(nix eval --offline --expr '40 + 2')" = 42
          nix --version
          buildctl debug workers
          proof_dir="$(mktemp -d "$RUNNER_TEMP/arc-local-proof.XXXXXX")"
          trap 'rm -rf "$proof_dir"' EXIT
          dd if=/dev/urandom of="$proof_dir/payload" bs=1M count=16 conv=fsync
          input_bytes="$(wc -c < "$proof_dir/payload")"
          input_sha="$(sha256sum "$proof_dir/payload" | awk '{print $1}')"
          cat > "$proof_dir/Dockerfile" <<'DOCKERFILE'
          FROM busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          COPY payload /payload
          RUN test "$(wc -c < /payload)" = 16777216
          FROM scratch
          COPY --from=0 /payload /payload
          DOCKERFILE
          buildctl build --frontend dockerfile.v0 --local "context=$proof_dir" --local "dockerfile=$proof_dir" \
            --output "type=local,dest=$proof_dir/output"
          output_bytes="$(wc -c < "$proof_dir/output/payload")"
          output_sha="$(sha256sum "$proof_dir/output/payload" | awk '{print $1}')"
          test "$input_bytes" = 16777216
          test "$output_bytes" = "$input_bytes"
          test "$output_sha" = "$input_sha"
          jq -n --arg node "$ARC_RUNNER_NODE_NAME" --arg pod "$ACTIONS_RUNNER_POD_NAME" --argjson slot "$SLOT" \
            --argjson inputBytes "$input_bytes" --argjson outputBytes "$output_bytes" \
            --arg inputSha256 "$input_sha" --arg outputSha256 "$output_sha" \
            '{role:"build",node:$node,pod:$pod,slot:$slot,inputBytes:$inputBytes,outputBytes:$outputBytes,inputSha256:$inputSha256,outputSha256:$outputSha256}' \
            > "$RUNNER_TEMP/arc-ready.json"
      - name: Publish ready build slot
        uses: actions/upload-artifact@v4
        with:
          name: arc-ready-${{ github.run_attempt }}-build-${{ matrix.slot }}
          path: ${{ runner.temp }}/arc-ready.json
          retention-days: 1
      - name: Require all eight build and two publication slots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          prefix="arc-ready-$RUN_ATTEMPT-"
          deadline=$((SECONDS + 5 * 60))
          count=0
          while (( SECONDS < deadline )); do
            count="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.expired == false and (.name | startswith(\"$prefix\")))] | length")"
            test "$count" = 10 && break
            sleep 60
          done
          test "$count" = 10 || { echo 'Eight build and two publication slots did not become ready within five minutes' >&2; exit 1; }
          jq --argjson start "$(date +%s)" '. + {start:$start}' "$RUNNER_TEMP/arc-ready.json" > "$RUNNER_TEMP/arc-proof.json"
          sleep 180
          jq --argjson end "$(date +%s)" '. + {end:$end}' "$RUNNER_TEMP/arc-proof.json" > "$RUNNER_TEMP/arc-complete.json"
      - name: Publish build concurrency proof
        uses: actions/upload-artifact@v4
        with:
          name: arc-proof-${{ github.run_attempt }}-build-${{ matrix.slot }}
          path: ${{ runner.temp }}/arc-complete.json
          retention-days: 1
  verify-placement:
    needs: [local-build, publication-tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: arc-proof-${{ github.run_attempt }}-*
          path: proof
      - name: Verify eight builders and two publication runners overlapped
        run: |
          jq -s -e '
            length == 10 and
            ([.[] | select(.role == "build") | .slot] | sort) == [1,2,3,4,5,6,7,8] and
            ([.[] | select(.role == "publication") | .slot] | sort) == [1,2] and
            ([.[].pod] | unique | length) == 10 and
            all(.[]; .node == "talos-192-168-1-194" or .node == "turin") and
            all(.[] | select(.role == "build");
              .inputBytes == 16777216 and .outputBytes == .inputBytes and .inputSha256 == .outputSha256) and
            ([.[].end] | min) - ([.[].start] | max) >= 45
          ' proof/*/arc-complete.json
