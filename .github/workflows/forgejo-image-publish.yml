name: forgejo-image-publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/forgejo-image-publish.yml
      - scripts/forgejo/**
      - argocd/applications/forgejo/**

permissions:
  contents: read

concurrency:
  group: forgejo-image-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: arc-arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: imjasonh/setup-crane@v0.4
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."registry.registry.svc.cluster.local"]
              http = true
              insecure = true
      - name: Verify tools and release contract
        run: |
          skopeo --version
          python3 -m unittest discover -s scripts/forgejo -p '*_test.py'
      - name: Prepare and verify complete release image
        run: bash scripts/forgejo/publish-image.sh prepare
      - name: Upload image verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: forgejo-image-${{ github.sha }}
          path: forgejo-image-evidence/
          if-no-files-found: error
      - name: Publish immutable Kargo discovery tag
        run: bash scripts/forgejo/publish-image.sh publish
