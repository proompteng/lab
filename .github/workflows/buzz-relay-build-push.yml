name: Buzz Relay Build and Push

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'third_party/buzz/**'
      - '.github/workflows/buzz-relay-build-push.yml'
      - 'argocd/applications/buzz/**'
  push:
    branches:
      - main
    paths:
      - 'third_party/buzz/**'
      - '.github/workflows/buzz-relay-build-push.yml'
      - 'argocd/applications/buzz/**'
  workflow_dispatch:

env:
  UPSTREAM_REVISION: acfbb1bb6af54cb29cb152496ff43b8285dcb8cf
  UPSTREAM_IMAGE: ghcr.io/block/buzz@sha256:29fe13981a726fe43642fe03cbd6cc87142579a90bbf9897e3c1b370d1037428
  IMAGE_REPOSITORY: registry.ide-newton.ts.net/lab/buzz

jobs:
  verify:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: arc-amd64
            upstream_image: ghcr.io/block/buzz@sha256:0c015d0942b2b302b7264362a103165093960aaacc87d3c0f7bbcf68116950f5
          - architecture: arm64
            runner: arc-arm64
            upstream_image: ghcr.io/block/buzz@sha256:5a091bb6b91572dbc34743cb36d6e56fd170408243b263c825ff764017c524f5
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v5

      - name: Checkout pinned Buzz source
        uses: actions/checkout@v5
        with:
          repository: block/buzz
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream
          persist-credentials: false

      - name: Verify and apply compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_REVISION"
          git -C upstream apply --check ../third_party/buzz/ceph-rgw.patch
          git -C upstream apply ../third_party/buzz/ceph-rgw.patch
          git -C upstream diff --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and test native image
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: third_party/buzz/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          push: false
          build-args: |
            LAB_GIT_SHA=${{ github.sha }}
            UPSTREAM_IMAGE=${{ matrix.upstream_image }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPOSITORY }}:cache-${{ matrix.architecture }}

  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: arc-amd64
            upstream_image: ghcr.io/block/buzz@sha256:0c015d0942b2b302b7264362a103165093960aaacc87d3c0f7bbcf68116950f5
          - architecture: arm64
            runner: arc-arm64
            upstream_image: ghcr.io/block/buzz@sha256:5a091bb6b91572dbc34743cb36d6e56fd170408243b263c825ff764017c524f5
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v5

      - name: Checkout pinned Buzz source
        uses: actions/checkout@v5
        with:
          repository: block/buzz
          ref: ${{ env.UPSTREAM_REVISION }}
          path: upstream
          persist-credentials: false

      - name: Verify and apply compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_REVISION"
          git -C upstream apply --check ../third_party/buzz/ceph-rgw.patch
          git -C upstream apply ../third_party/buzz/ceph-rgw.patch
          git -C upstream diff --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push native image
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: third_party/buzz/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          build-args: |
            LAB_GIT_SHA=${{ github.sha }}
            UPSTREAM_IMAGE=${{ matrix.upstream_image }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPOSITORY }}:cache-${{ matrix.architecture }}

  publish-index:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: arc-arm64
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v5

      - name: Resolve source commit metadata
        id: source
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          expected_source_sha="$(git rev-parse "${EXPECTED_SOURCE_REVISION}^{commit}")"
          [[ "${source_sha}" == "${expected_source_sha}" ]]
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"
          printf 'source_timestamp=%s\n' "$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-architecture index
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TIMESTAMP: ${{ steps.source.outputs.source_timestamp }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" == "${GITHUB_SHA}" ]]
          for architecture in amd64 arm64; do
            reference="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}-${architecture}"
            crane mutate --platform "linux/${architecture}" "${reference}" \
              --label "org.opencontainers.image.created=${SOURCE_TIMESTAMP}" \
              --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
              --tag "${reference}" >/dev/null
            crane config --platform "linux/${architecture}" "${reference}" | jq -e \
              --arg source_timestamp "${SOURCE_TIMESTAMP}" \
              --arg source_sha "${SOURCE_SHA}" \
              '.config.Labels["org.opencontainers.image.created"] == $source_timestamp and
               .config.Labels["org.opencontainers.image.revision"] == $source_sha' >/dev/null
          done
          tag="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
            --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "$tag" \
            "${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}-amd64" \
            "${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}-arm64"
          docker buildx imagetools inspect --raw "$tag" > index.json
          jq -e \
            --arg source_url "${SOURCE_URL}" \
            --arg source_sha "${SOURCE_SHA}" '
            .annotations["org.opencontainers.image.source"] == $source_url and
            .annotations["org.opencontainers.image.revision"] == $source_sha and
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
          ' index.json
          digest="$(
            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' \
              "${tag}" |
              jq -er '.digest'
          )"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            kargo_tag="kargo-sha-${SOURCE_SHA}"
            kargo_reference="${IMAGE_REPOSITORY}:${kargo_tag}"
            probe_error="$(mktemp)"
            trap 'rm -f "${probe_error}"' EXIT
            if kargo_digest="$(
              docker buildx imagetools inspect \
                --format '{{json .Manifest}}' \
                "${kargo_reference}" 2>"${probe_error}" |
                jq -er '.digest' 2>>"${probe_error}"
            )"; then
              [[ "${kargo_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "${kargo_digest}" == "${digest}" ]]
            else
              probe_output="$(cat "${probe_error}")"
              if ! grep -Eiq 'manifest[[:space:]_-]+(unknown|not[[:space:]]+found)|manifest[^[:cntrl:]]*404|404[^[:cntrl:]]*(manifest|not[[:space:]]+found)' <<<"${probe_output}"; then
                echo "Unable to inspect immutable Kargo tag ${kargo_reference}: ${probe_output}" >&2
                exit 1
              fi
              docker buildx imagetools create --tag "${kargo_reference}" "${tag}"
              kargo_digest="$(
                docker buildx imagetools inspect \
                  --format '{{json .Manifest}}' \
                  "${kargo_reference}" |
                  jq -er '.digest'
              )"
              [[ "${kargo_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "${kargo_digest}" == "${digest}" ]]
            fi
          fi
          {
            echo '### Buzz relay image'
            echo
            echo "- Image: ${tag}@${digest}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "- Kargo image: ${kargo_reference}@${kargo_digest}"
            fi
            echo '- Platforms: linux/amd64, linux/arm64'
            echo "- Upstream: ${UPSTREAM_REVISION}"
          } >> "$GITHUB_STEP_SUMMARY"
