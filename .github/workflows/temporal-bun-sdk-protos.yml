name: Temporal Bun SDK Proto Regen

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: temporal-bun-sdk-proto-regen
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24.11.1'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Buf CLI
        uses: bufbuild/buf-action@v1.5.0
        with:
          version: '1.72.0'
          setup_only: true

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter @proompteng/temporal-bun-sdk

      - name: Run Temporal proto regeneration
        run: bun packages/temporal-bun-sdk/scripts/update-temporal-protos.ts

      - name: Check for proto changes
        id: proto_changes
        run: |
          if git status --short proto/temporal packages/temporal-bun-sdk/src/proto | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open proto update pull request
        if: steps.proto_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/temporal-bun-sdk-proto-regen
          title: 'chore: refresh temporal-bun-sdk protos'
          commit-message: 'chore: refresh temporal-bun-sdk protos'
          body: |
            ## Summary
            Automated Temporal proto regeneration for `@proompteng/temporal-bun-sdk`.

            - Ran `bun packages/temporal-bun-sdk/scripts/update-temporal-protos.ts`
            - Updated vendored proto sources and generated TypeScript stubs

            Review the generated diff and approve its workflows if GitHub requests it. Merge only after CI passes.

      - name: No changes detected
        if: steps.proto_changes.outputs.changed != 'true'
        run: echo 'Temporal proto sources already up to date'
