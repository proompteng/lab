name: headlamp

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/workflows/headlamp-ci.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/packages.nix'
      - 'nix/verify-headlamp-image-assets.sh'
      - 'services/headlamp/**'
      - '!services/headlamp/**/*.md'
      - '!services/headlamp/**/*.mdx'
      - 'nix/images/headlamp.nix'
      - 'argocd/applications/headlamp/**'
      - '!argocd/**/*.md'
      - '!argocd/**/*.mdx'
  push:
    branches:
      - main
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/packages.nix'
      - 'nix/verify-headlamp-image-assets.sh'
      - 'services/headlamp/**'
      - '!services/headlamp/**/*.md'
      - '!services/headlamp/**/*.mdx'
      - 'nix/images/headlamp.nix'
      - 'argocd/applications/headlamp/**'
      - '!argocd/**/*.md'
      - '!argocd/**/*.mdx'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.image == 'true' }}
      manifests: ${{ steps.filter.outputs.manifests }}
      upstream: ${{ steps.filter.outputs.upstream }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            image:
              - 'nix/images/headlamp.nix'
              - 'nix/verify-headlamp-image-assets.sh'
              - 'services/headlamp/patches/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/packages.nix'
            manifests:
              - 'argocd/applications/headlamp/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/packages.nix'
              - '.github/workflows/headlamp-ci.yml'
            upstream:
              - 'services/headlamp/patches/**'
              - 'services/headlamp/scripts/**'
              - 'nix/images/headlamp.nix'
              - '.github/workflows/headlamp-ci.yml'
  validate-manifests:
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.manifests == 'true' || needs.changes.outputs.upstream == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Nix toolchain
        if: needs.changes.outputs.manifests == 'true'
        uses: ./.github/actions/setup-nix-toolchain
        with:
          github-token: ${{ github.token }}

      - name: Render Headlamp manifests
        if: needs.changes.outputs.manifests == 'true'
        run: nix run .#render-headlamp

      - uses: actions/setup-go@v6
        if: needs.changes.outputs.upstream == 'true'
        with:
          go-version-file: go.work
          cache: false

      - name: Run upstream multiplexer regression tests
        if: needs.changes.outputs.upstream == 'true'
        run: sh services/headlamp/scripts/test-upstream.sh

  nix-image-pr:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/nix-oci-build-common.yml
    with:
      image_name: headlamp
      package_attr: headlamp-image
      tag: sha-${{ github.sha }}
      publish_kargo_tag: true

  nix-image:
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.image == 'true' && (github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !contains(github.event.head_commit.message || '', 'automated release PR')
        ))
      }}
    uses: ./.github/workflows/nix-oci-build-common.yml
    with:
      image_name: headlamp
      package_attr: headlamp-image
      tag: sha-${{ github.sha }}
      publish_kargo_tag: true
      latest: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    secrets:
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
