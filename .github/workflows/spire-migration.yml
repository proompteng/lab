name: SPIRE datastore migration
on:
  pull_request:
    paths:
      - argocd/applications/spire-server/migrate/**
      - .github/workflows/spire-migration.yml
  push:
    branches: [main]
    paths:
      - argocd/applications/spire-server/migrate/**
      - .github/workflows/spire-migration.yml
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: migration-fixture
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: argocd/applications/spire-server/migrate
    env:
      GOWORK: 'off'
      SPIRE_MIGRATION_TEST_DSN: postgres://postgres:migration-fixture@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: argocd/applications/spire-server/migrate/go.mod
          cache-dependency-path: argocd/applications/spire-server/migrate/go.sum
      - name: Verify data preservation and refusal to overwrite an existing database
        run: go test -ldflags='-X github.com/spiffe/spire/pkg/common/version.gittag=1.15.3' ./...
      - name: Build migration utility
        run: go build -ldflags='-X github.com/spiffe/spire/pkg/common/version.gittag=1.15.3' -o /tmp/spire-migrate .
