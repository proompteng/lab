name: symphony-post-deploy-verify

on:
  push:
    branches:
      - kargo/symphony
    paths:
      - 'argocd/applications/symphony/**'
      - 'argocd/applications/symphony-jangar/**'
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Optional full commit SHA expected in Argo sync revision
        required: false
        type: string

concurrency:
  group: symphony-post-deploy-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: arc-arm64
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.2

      - name: Configure in-cluster kubeconfig when context is missing
        shell: bash
        run: |
          set -euo pipefail

          if kubectl config current-context >/dev/null 2>&1; then
            echo "Kubectl context already configured"
            exit 0
          fi

          if [ -z "${KUBERNETES_SERVICE_HOST:-}" ] || [ -z "${KUBERNETES_SERVICE_PORT:-}" ]; then
            echo "KUBERNETES_SERVICE_HOST/PORT are not set and no kubectl context exists"
            exit 1
          fi
          if [ ! -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
            echo "Service account token is missing"
            exit 1
          fi
          if [ ! -f /var/run/secrets/kubernetes.io/serviceaccount/ca.crt ]; then
            echo "Service account CA cert is missing"
            exit 1
          fi

          KUBECONFIG_PATH="${RUNNER_TEMP}/kubeconfig"
          echo "KUBECONFIG=${KUBECONFIG_PATH}" >> "${GITHUB_ENV}"

          kubectl config set-cluster in-cluster \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
            --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            --embed-certs=true \
            --kubeconfig="${KUBECONFIG_PATH}"

          kubectl config set-credentials gha-runner \
            --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            --kubeconfig="${KUBECONFIG_PATH}"

          kubectl config set-context in-cluster \
            --cluster=in-cluster \
            --user=gha-runner \
            --namespace=jangar \
            --kubeconfig="${KUBECONFIG_PATH}"

          kubectl config use-context in-cluster --kubeconfig="${KUBECONFIG_PATH}"

      - name: Validate kubectl context
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context

      - name: Verify Symphony fleet deployment health and digest
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_REVISION_INPUT: ${{ inputs.expected_revision || '' }}
        run: |
          set -euo pipefail
          ARGS=(
            --require-synced
            --health-attempts 90
            --health-interval-seconds 10
          )

          if [ "${EVENT_NAME}" = "push" ]; then
            ARGS+=(--expected-revision "${GITHUB_SHA}" --expected-revision-mode ancestor)
          elif [ -n "${EXPECTED_REVISION_INPUT}" ]; then
            ARGS+=(--expected-revision "${EXPECTED_REVISION_INPUT}")
          fi

          bun run packages/scripts/src/symphony/verify-deployment.ts \
            "${ARGS[@]}" \
            --namespace jangar \
            --deployment symphony \
            --kustomization-path argocd/applications/symphony/kustomization.yaml \
            --argo-application symphony \
            --service-base-url http://symphony.jangar.svc.cluster.local:8080

          bun run packages/scripts/src/symphony/verify-deployment.ts \
            "${ARGS[@]}" \
            --namespace jangar \
            --deployment symphony-jangar \
            --kustomization-path argocd/applications/symphony-jangar/kustomization.yaml \
            --argo-application symphony-jangar \
            --service-base-url http://symphony-jangar.jangar.svc.cluster.local:8080
