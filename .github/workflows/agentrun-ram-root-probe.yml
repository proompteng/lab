name: AgentRun RAM root probe

on:
  push:
    branches: [codex/probe-agentrun-ram-root]
    paths: [.github/workflows/agentrun-ram-root-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: ram-root
          wait: 120s
      - name: Test a seeded tmpfs mounted at the container root
        shell: bash
        run: |
          set -euo pipefail
          kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.containerRuntimeVersion}{"\n"}'
          kubectl apply -f - <<'POD'
          apiVersion: v1
          kind: Pod
          metadata:
            name: ram-root
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            initContainers:
              - name: seed
                image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
                command: [/bin/sh, -ec]
                args:
                  - |
                    for directory in /bin /sbin /etc /usr /lib /lib64; do
                      if test -e "$directory"; then cp -a "$directory" /ram/; fi
                    done
                    mkdir -p /ram/dev /ram/proc /ram/sys /ram/tmp /ram/root /ram/var/run
                    echo 'seeded-in-ram' >/ram/seed-proof
                volumeMounts:
                  - name: root
                    mountPath: /ram
            containers:
              - name: agent
                image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
                command: [/bin/sh, -ec]
                args:
                  - |
                    test "$(cat /seed-proof)" = seeded-in-ram
                    awk '{for (i=6;i<NF;i++) if ($i=="-") { print $5, $(i+1); break }}' /proc/self/mountinfo
                    test "$(stat -f -c %T /)" = tmpfs
                volumeMounts:
                  - name: root
                    mountPath: /
            volumes:
              - name: root
                emptyDir:
                  medium: Memory
                  sizeLimit: 128Mi
          POD
          if ! kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/ram-root --timeout=100s; then
            kubectl describe pod/ram-root
            kubectl logs pod/ram-root --all-containers || true
            exit 1
          fi
          kubectl logs pod/ram-root -c agent
