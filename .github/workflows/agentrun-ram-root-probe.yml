name: AgentRun RAM root probe

on:
  push:
    branches: [codex/probe-agentrun-ram-root]
    paths: [.github/workflows/agentrun-ram-root-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prepare RAM for the disposable node
        run: |
          sudo mkdir -m 0700 -p /dev/shm/agentrun-proof/containerd /dev/shm/agentrun-proof/kubelet
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: ram-root
          wait: 120s
          config: .github/ci/agentrun-ram-root-kind.yaml
      - name: Verify the container root and file mounts with node storage in RAM
        shell: bash
        run: |
          set -euo pipefail
          kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.containerRuntimeVersion}{"\n"}'
          for path in /var/lib/containerd /var/lib/kubelet; do
            test "$(docker exec ram-root-control-plane findmnt -no FSTYPE -T "$path")" = tmpfs
          done
          kubectl create configmap agent-run-inputs --from-literal=run.json=inputs
          kubectl create secret generic agent-run-auth --from-literal=auth.json=fixture
          kubectl apply -f - <<'POD'
          apiVersion: v1
          kind: Pod
          metadata:
            name: ram-root
          spec:
            restartPolicy: Never
            containers:
              - name: agent
                image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
                command: [/bin/sh, -ec]
                args:
                  - |
                    awk '
                      {
                        for (i=6;i<NF;i++) if ($i=="-") {
                          print $5, $(i+1), $(i+3)
                          if ($(i+1) !~ /^(overlay|tmpfs|proc|devpts|mqueue|sysfs|cgroup2)$/) invalid=1
                          break
                        }
                      }
                      END { exit invalid }
                    ' /proc/self/mountinfo
                    for file in /etc/hosts /etc/hostname /etc/resolv.conf /workspace/run.json \
                                /workspace/status.json /root/.codex /root/.codex/auth.json \
                                /dev/shm /var/run/secrets/kubernetes.io/serviceaccount/token; do
                      test "$(stat -f -c %T "$file")" = tmpfs
                    done
                    test "$(cat /workspace/run.json)" = inputs
                    test "$(cat /root/.codex/auth.json)" = fixture
                    printf ram-root-verified >/workspace/status.json
                terminationMessagePath: /workspace/status.json
                volumeMounts:
                  - name: inputs
                    mountPath: /workspace/run.json
                    subPath: run.json
                    readOnly: true
                  - name: codex-home
                    mountPath: /root/.codex
                  - name: auth
                    mountPath: /root/.codex/auth.json
                    subPath: auth.json
                    readOnly: true
            volumes:
              - name: inputs
                configMap:
                  name: agent-run-inputs
              - name: codex-home
                emptyDir: {}
              - name: auth
                secret:
                  secretName: agent-run-auth
          POD
          if ! kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/ram-root --timeout=100s; then
            kubectl describe pod/ram-root
            kubectl logs pod/ram-root --all-containers || true
            exit 1
          fi
          kubectl logs pod/ram-root -c agent
          kubectl logs pod/ram-root -c agent | awk '
            $2=="overlay" {
              hasLower=0
              hasUpper=0
              n=split($3, options, ",")
              for (i=1;i<=n;i++) {
                if (options[i] !~ /^(lowerdir|upperdir|workdir)=/) continue
                if (options[i] ~ /^lowerdir=/) hasLower=1
                if (options[i] ~ /^upperdir=/) hasUpper=1
                sub(/^[^=]*=/, "", options[i])
                count=split(options[i], paths, ":")
                for (j=1;j<=count;j++) if (paths[j] !~ /^\/var\/lib\/containerd\//) invalid=1
              }
              if ($1=="/") verified=(hasLower && hasUpper)
            }
            END { exit invalid || !verified }
          '
          test "$(kubectl get pod ram-root -o jsonpath='{.status.containerStatuses[0].state.terminated.message}')" = ram-root-verified
