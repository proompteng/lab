name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan changed-area validation
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.impact.outputs.targets }}
      delegated: ${{ steps.impact.outputs.delegated }}
      changed_files: ${{ steps.impact.outputs.changed_files }}
      changed_manifests: ${{ steps.active_files.outputs.changed_manifests || '[]' }}
      jangar_affected: ${{ fromJSON(steps.jangar.outputs.affected || '{}').jangar }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Derive changed files from Git
        id: files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed_files="${RUNNER_TEMP}/changed-files.txt"
          changed_manifests="${RUNNER_TEMP}/changed-manifests.txt"
          git rev-parse --verify 'HEAD^1' >/dev/null
          git rev-parse --verify 'HEAD^2' >/dev/null
          git diff --merge-base --find-renames --name-only --diff-filter=ACDMRTUXB 'HEAD^1' 'HEAD^2' > "${changed_files}"
          git diff --merge-base --find-renames --name-only --diff-filter=ACMRTUXB 'HEAD^1' 'HEAD^2' > "${changed_manifests}"
          printf 'changed_files=%s\n' "${changed_files}" >> "${GITHUB_OUTPUT}"
          printf 'changed_manifests=%s\n' "${changed_manifests}" >> "${GITHUB_OUTPUT}"

      - name: Resolve impact targets
        id: impact
        env:
          CHANGED_FILES: ${{ steps.files.outputs.changed_files }}
          FULL_VALIDATION: ${{ github.event_name == 'merge_group' }}
        shell: bash
        run: |
          set -euo pipefail
          input=(--full)
          if [[ "${FULL_VALIDATION}" == false ]]; then
            input=(--files "${CHANGED_FILES}")
          fi
          bun run packages/scripts/src/ci/impact-router.ts "${input[@]}" \
            --map .github/ci/impact-map.yml --github-output "${GITHUB_OUTPUT}"

      - name: Resolve Jangar runtime inputs
        id: jangar
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/affected-inputs
        with:
          workspaces: |
            jangar: ['services/jangar', 'packages/cx-tools']
          filters: |
            jangar:
              - 'services/jangar/**'
              - 'services/bumba/src/**'
              - 'services/bumba/tsconfig.json'
              - 'packages/agent-contracts/**'
              - 'packages/codex/src/**'
              - 'packages/codex/scripts/**'
              - 'packages/codex/tsconfig.json'
              - 'packages/cx-tools/src/**'
              - 'packages/cx-tools/tsconfig.json'
              - 'packages/design/**'
              - 'packages/discord/**'
              - 'packages/otel/src/**'
              - 'packages/otel/tsconfig.json'
              - 'packages/temporal-bun-sdk/src/**'
              - 'packages/temporal-bun-sdk/tsconfig.json'
              - '!packages/**/*.test.*'
              - '!packages/**/*.spec.*'
              - '!packages/**/__tests__/**'
              - '!packages/**/__snapshots__/**'
              - 'packages/scripts/src/jangar/**'
              - 'argocd/applications/jangar/**'
              - 'argocd/bootstrap/jangar/**'
              - 'nix/images/jangar.nix'
              - 'patches/effect@4.1.4.patch'
              - 'tsconfig.base.json'
              - 'bunfig.toml'
              - '.npmrc'
              - '.github/workflows/jangar-ci.yml'
              - '.github/workflows/common-monorepo.yml'
              - '.github/workflows/nix-bun-dependency-closure.yml'

      - name: Serialize active changed files
        id: active_files
        if: github.event_name == 'pull_request'
        env:
          CHANGED_MANIFESTS: ${{ steps.files.outputs.changed_manifests }}
        run: |
          set -euo pipefail
          printf 'changed_manifests=%s\n' "$(jq -Rsc 'split("\n") | map(select(length > 0))' "${CHANGED_MANIFESTS}")" >> "${GITHUB_OUTPUT}"

      - name: Summarize impact plan
        env:
          TARGETS: ${{ steps.impact.outputs.targets }}
          DELEGATED: ${{ steps.impact.outputs.delegated }}
          JANGAR: ${{ fromJSON(steps.jangar.outputs.affected || '{}').jangar }}
        run: |
          {
            echo '### CI validation plan'
            echo
            echo "- Router validations: \`${TARGETS}\`"
            echo "- Delegated service workflows: \`${DELEGATED}\`"
            echo "- Jangar runtime checks: \`${JANGAR:-not evaluated}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  landing:
    name: PR validation (landing)
    needs: plan
    if: ${{ needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.targets), 'landing') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up editor acceptance Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/nanoagent/go.mod
          cache-dependency-path: services/nanoagent/go.sum

      - name: Set up editor acceptance Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Cache editor acceptance Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: landing-editor-acceptance
          save-if: false
          workspaces: |
            services/tengri -> target
            services/ofz -> target

      - name: Install editor acceptance prerequisites
        run: sudo apt-get install --yes --no-install-recommends protobuf-compiler iproute2

      - name: Run landing validation
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter landing --filter @proompteng/backend --filter @proompteng/design
          node .github/scripts/install-tengri-chromium.mjs
          bun run --cwd apps/landing test
          PLATFORM_UI_SCREENSHOT_DIR=/tmp/admin-portal-screenshots bun run --cwd apps/landing test:admin
          bun run --filter landing build
          bun run --cwd apps/landing test:e2e
          bun run --cwd apps/landing format:check
          bun run --cwd apps/landing lint:oxlint
          bun run --cwd apps/landing lint:oxlint:type
          TENGRI_EDITOR_NEXT_MODE=start bash services/nanoagent/test-vscode-browser.sh

      - name: Upload landing browser artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: landing-browser-${{ github.run_attempt }}
          path: |
            /tmp/admin-portal-screenshots
            apps/landing/playwright-report
            apps/landing/test-results
            /tmp/tengri-vscode.*/guest.log
            /tmp/tengri-vscode.*/gateway.log
            /tmp/tengri-vscode.*/desktop.log
            /tmp/tengri-vscode.*/proxy.log
            /tmp/tengri-vscode.*/vscode.log
            /tmp/tengri-vscode.*/browser.log
            /tmp/tengri-vscode.*/browser-results
          if-no-files-found: ignore
          retention-days: 7

  validate:
    name: PR validation (${{ matrix.target }})
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.targets != '["landing"]' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        exclude:
          - target: landing
          # Design already runs App's consumer checks.
          - target: ${{ contains(fromJSON(needs.plan.outputs.targets), 'design') && 'app' || 'landing' }}
    runs-on: >-
      ${{
        (matrix.target == 'docs' || matrix.target == 'app' || matrix.target == 'olden' || matrix.target == 'cms' || matrix.target == 'kitty-krew' || matrix.target == 'reviseur' || matrix.target == 'design') && 'ubuntu-24.04-arm' ||
        'ubuntu-latest'
      }}
    env:
      CHANGED_FILES_JSON: ${{ needs.plan.outputs.changed_files }}
      CHANGED_MANIFESTS_JSON: ${{ needs.plan.outputs.changed_manifests }}
      FULL_VALIDATION: ${{ github.event_name == 'merge_group' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        if: ${{ matrix.target != 'shellcheck' && matrix.target != 'workflow-lint' && matrix.target != 'argo-lint' && matrix.target != 'kubeconform' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify preinstalled ARM64 build tools
        if: ${{ matrix.target == 'docs' || matrix.target == 'app' || matrix.target == 'olden' || matrix.target == 'cms' || matrix.target == 'kitty-krew' || matrix.target == 'reviseur' || matrix.target == 'design' }}
        shell: bash
        run: >-
          dpkg-checkbuilddeps -d
          'dpkg-dev (>= 1.17.11), g++ (>= 4:12.3), gcc (>= 4:12.3), libc6-dev | libc-dev, make'
          /dev/null

      - name: Set up Nix toolchain
        if: ${{ matrix.target == 'shared-compat' || matrix.target == 'argo-lint' || matrix.target == 'kubeconform' || matrix.target == 'cdk8s' }}
        uses: ./.github/actions/setup-nix-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-nix-config: |
            experimental-features = nix-command flakes

      - name: Run selected validation
        shell: bash
        env:
          APP_VALIDATION_SELECTED: ${{ contains(fromJSON(needs.plan.outputs.targets), 'app') }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          case "${target}" in
            planner)
              echo 'No owned validation target; planner success is sufficient.'
              ;;
            docs)
              bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter docs --filter @proompteng/design
              bun run --cwd apps/docs lint:oxlint
              bun run --cwd apps/docs lint:oxlint:type
              bun run --filter docs build
              ;;
            app | design)
              bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter app --filter @proompteng/design
              status=0
              if [[ "${target}" == design ]]; then
                bunx oxfmt --check packages/design || status=1
                bun run --cwd packages/design lint:oxlint || status=1
                bun run --cwd packages/design lint:oxlint:type || status=1
                bun run --filter @proompteng/design build || status=1
              fi
              if [[ "${APP_VALIDATION_SELECTED}" == true ]]; then
                bun run --cwd apps/app lint:oxlint || status=1
              fi
              bun run --cwd apps/app lint:oxlint:type || status=1
              bun run --filter app build || status=1
              exit "${status}"
              ;;
            olden)
              bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter olden --filter @proompteng/design
              bunx oxfmt --check apps/olden
              bun run --cwd apps/olden lint:oxlint
              bun run --cwd apps/olden lint:oxlint:type
              bun run --filter olden test
              bun run --filter olden build
              ;;
            cms)
              PAYLOAD_SECRET=ci-build-secret bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter cms
              bun run --cwd apps/cms lint:oxlint
              bun run --cwd apps/cms lint:oxlint:type
              PAYLOAD_SECRET=ci-build-secret bun run --filter cms build
              ;;
            bonjour)
              bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter @proompteng/bonjour --filter @proompteng/otel
              bun run --filter @proompteng/otel build
              bun run --filter @proompteng/bonjour build
              bun run --filter @proompteng/bonjour synth
              test "$(find services/bonjour/manifests -type f -name '*.yaml' | wc -l | tr -d ' ')" = 3
              ! grep -R '^---$' services/bonjour/manifests
              ;;
            discord)
              bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter @proompteng/discord
              bun run --cwd packages/discord lint:oxlint
              bun run --cwd packages/discord lint:oxlint:type
              bun run --filter @proompteng/discord test
              bun run --filter @proompteng/discord build
              ;;
            kitty-krew)
              bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter tanstack-router-react-example-with-trpc-react-query
              bun run --cwd apps/kitty-krew lint:oxlint
              bun run --cwd apps/kitty-krew lint:oxlint:type
              bunx oxfmt --check --no-error-on-unmatched-pattern 'apps/kitty-krew/**/*.{js,jsx,mjs,cjs,ts,tsx}'
              bun tsc --noEmit --project apps/kitty-krew/tsconfig.json
              bun run --cwd apps/kitty-krew build
              ;;
            reviseur)
              bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter reviseur
              bun run --cwd apps/reviseur lint:oxlint
              bun run --cwd apps/reviseur lint:oxlint:type
              bun run --cwd apps/reviseur build
              ;;
            root-scripts)
              bun install --frozen-lockfile
              input=(--full)
              if [[ "${FULL_VALIDATION}" == false ]]; then
                jq -r '.[]' <<< "${CHANGED_FILES_JSON}" > "${RUNNER_TEMP}/root-script-files.txt"
                input=(--files "${RUNNER_TEMP}/root-script-files.txt")
              fi
              plan=$(bun run packages/scripts/src/ci/impact-router.ts \
                "${input[@]}" --map .github/ci/root-script-map.yml)
              if [[ "${FULL_VALIDATION}" == false ]] && jq -e '.validationTargets | index("all") != null' <<< "${plan}" >/dev/null; then
                plan=$(bun run packages/scripts/src/ci/impact-router.ts --full --map .github/ci/root-script-map.yml)
              fi
              suites=$(jq -r '.validationTargets[] | select(. != "all")' <<< "${plan}")
              printf 'Root script suites: %s\n' "${suites}" | tee -a "${GITHUB_STEP_SUMMARY}"
              while IFS= read -r suite; do
                case "${suite}" in
                  flamingo)
                    bun run lint:flamingo-hard-migration
                    ;;
                  hermes)
                    bun run scripts/hermes/validate-production.ts
                    bun test scripts/hermes/*.test.ts
                    ;;
                  kube-router)
                    bun run scripts/kube-router/validate-production.ts
                    bun test scripts/kube-router/*.test.ts
                    ;;
                  cluster-upgrades)
                    bunx oxlint --config .oxlintrc.json scripts/cluster-upgrades/*.test.ts
                    bunx oxfmt --check scripts/cluster-upgrades/*.test.ts
                    bun test scripts/cluster-upgrades/*.test.ts
                    python3 -m unittest discover -s scripts/cluster-upgrades -p 'ceph*_test.py'
                    python3 scripts/cluster-upgrades/temporal_cassandra_gate_test.py
                    python3 scripts/cluster-upgrades/temporal_cassandra_verifier_test.py
                    python3 scripts/cluster-upgrades/temporal_elasticsearch_snapshot_test.py
                    python3 scripts/cluster-upgrades/postgres_upgrade_gate_test.py
                    ;;
                  forgejo)
                    python3 -m unittest discover -s scripts/forgejo -p '*_test.py'
                    ;;
                  tengri-secrets)
                    bunx oxlint --config .oxlintrc.json scripts/seal-tengri-runtime.ts scripts/seal-tengri-runtime.test.ts
                    bunx oxfmt --check scripts/seal-tengri-runtime.ts scripts/seal-tengri-runtime.test.ts
                    bun test scripts/seal-tengri-runtime.test.ts
                    ;;
                  planner) echo 'No root script suite owns these changes.' ;;
                  *) echo "Unknown root script suite: ${suite}" >&2; exit 1 ;;
                esac
              done <<< "${suites}"
              ;;
            sag)
              bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter @proompteng/sag
              bun run --filter @proompteng/sag lint:oxlint
              bun run --filter @proompteng/sag lint:oxlint:type
              bun run --filter @proompteng/sag tsc
              bun run --filter @proompteng/sag test
              bun run --filter @proompteng/sag build
              ;;
            shared-compat)
              bun install --frozen-lockfile --ignore-scripts
              if [[ "${FULL_VALIDATION}" == true ]] || jq -e 'any(.[]; . == "flake.lock" or . == "flake.nix" or startswith("nix/") or startswith(".github/actions/setup-nix-toolchain/"))' <<< "${CHANGED_FILES_JSON}" >/dev/null; then
                nix flake check --no-build
              fi
              ;;
            jangar-inventory)
              bun run --cwd services/jangar docs:inventory:check
              ;;
            argo-lint)
              nix run .#lint-argo-workflows
              ;;
            kubeconform)
              if [[ "${FULL_VALIDATION}" == true ]] || jq -e 'any(.[]; startswith("argocd/applications/bayn/") or . == "scripts/test-bayn-secret-file-mode.sh" or . == ".github/workflows/pull-request.yml")' <<< "${CHANGED_FILES_JSON}" >/dev/null; then
                nix develop -c bash scripts/test-bayn-secret-file-mode.sh
              fi
              if [[ "${FULL_VALIDATION}" == true ]] || jq -e 'any(.[]; startswith("argocd/prepared/") or startswith("argocd/applications/ofz/") or startswith("argocd/applications/keycloak/") or startswith("argocd/applications/cloudflare/") or startswith("argocd/applications/tengri/") or startswith("argocd/applications/proompteng/") or . == "services/ofz/test-ha-manifests.sh" or . == "services/ofz/tests/ha_manifests.py" or . == ".github/workflows/pull-request.yml")' <<< "${CHANGED_FILES_JSON}" >/dev/null; then
                nix develop -c bash services/ofz/test-ha-manifests.sh
              fi
              if [[ "${FULL_VALIDATION}" == true ]]; then
                git ls-files -z -- ':(glob)argocd/**/*.yaml' ':(glob)argocd/**/*.yml' \
                  ':(glob)kubernetes/**/*.yaml' ':(glob)kubernetes/**/*.yml' > "${RUNNER_TEMP}/all-manifests"
                mapfile -d '' -t changed_manifests < "${RUNNER_TEMP}/all-manifests"
              else
                mapfile -t changed_manifests < <(jq -r '.[] | select(test("^(argocd|kubernetes)/.*\\.ya?ml$"))' <<< "${CHANGED_MANIFESTS_JSON}")
              fi
              if [ "${#changed_manifests[@]}" -gt 0 ]; then
                nix shell .#kubeconform .#yq --command bash scripts/kubeconform.sh "${changed_manifests[@]}"
              else
                nix shell .#kubeconform .#yq --command bash scripts/kubeconform.sh argocd
              fi
              if [[ "${FULL_VALIDATION}" == true ]] || jq -e 'any(.[]; startswith("argocd/applications/auto-ontology/"))' <<< "${CHANGED_FILES_JSON}" >/dev/null; then
                nix develop -c bun test argocd/applications/auto-ontology/oauth-discovery.test.ts
              fi
              if [[ "${FULL_VALIDATION}" == true ]] || jq -e 'any(.[]; startswith("argocd/applications/temporal/") or startswith("scripts/cluster-upgrades/temporal_"))' <<< "${CHANGED_FILES_JSON}" >/dev/null; then
                nix develop -c kustomize build --enable-helm argocd/applications/temporal >"${RUNNER_TEMP}/temporal-render.yaml"
                nix develop -c yq eval-all -o=json -I=0 '[.]' "${RUNNER_TEMP}/temporal-render.yaml" |
                  python3 scripts/cluster-upgrades/temporal_manifest_check.py
              fi
              if [[ "${FULL_VALIDATION}" == true ]] || jq -e 'any(.[]; startswith("argocd/applications/rook-ceph/") or . == ".github/workflows/pull-request.yml")' <<< "${CHANGED_FILES_JSON}" >/dev/null; then
                rendered="${RUNNER_TEMP}/rook-ceph-render.yaml"
                nix develop -c kustomize build --enable-helm argocd/applications/rook-ceph >"${rendered}"
                nix shell .#kubeconform .#yq --command bash scripts/kubeconform.sh "${rendered}"
                nix develop -c yq eval-all -o=json -I=0 '[.]' "${rendered}" | jq -e '
                  any(.[]; .kind == "ObjectBucketClaim" and .metadata.name == "bayn-research-captures"
                    and .spec == {generateBucketName: "bayn-research-captures", storageClassName: "rook-ceph-bucket"})
                  and all(.[]; ((.kind == "Job" or .kind == "ConfigMap")
                    and (.metadata.name | startswith("bayn-research-storage-bootstrap"))) | not)
                '
                if grep -Eq 'bootstrap\.sh|bayn-research-storage-policy\.json' "${rendered}"; then
                  echo 'Obsolete Bayn bootstrap code must not remain in the shared Rook render' >&2
                  exit 1
                fi
              fi
              ;;
            cdk8s)
              bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter @proompteng/k8s
              bunx oxfmt --check packages/k8s
              bun run --filter @proompteng/k8s lint:oxlint
              bun run --filter @proompteng/k8s lint:oxlint:type
              bun run --filter @proompteng/k8s typecheck
              bun run --filter @proompteng/k8s test
              bun run --filter @proompteng/k8s imports:check
              git diff --exit-code -- packages/k8s/src/imports
              bun run --filter @proompteng/k8s synth:check -- --all
              git diff --exit-code -- ':(glob)argocd/applications/*/generated/**'
              mapfile -t applications < <(bun run packages/k8s/src/cli.ts list)
              test "${#applications[@]}" -gt 0
              for application in "${applications[@]}"; do
                rendered="${RUNNER_TEMP}/${application}.yaml"
                nix shell .#kubeconform .#yq --command bash scripts/kubeconform.sh "argocd/applications/${application}/generated"
                nix develop -c kustomize build "argocd/applications/${application}" >"${rendered}"
                nix shell .#kubeconform .#yq --command bash scripts/kubeconform.sh "${rendered}"
              done
              if grep -R -E '^kind: (Namespace|Secret)$' argocd/applications/{docs,analysis}/generated; then
                echo 'Generated applications must not contain Namespace or plaintext Secret resources' >&2
                exit 1
              fi
              grep -Eq 'image: registry\.ide-newton\.ts\.net/lab/docs@sha256:[0-9a-f]{64}$' "${RUNNER_TEMP}/docs.yaml"
              grep -Eq 'image: registry\.ide-newton\.ts\.net/lab/analysis@sha256:[0-9a-f]{64}$' "${RUNNER_TEMP}/analysis.yaml"
              ;;
            shellcheck)
              if ! command -v shellcheck >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y shellcheck
              fi
              mapfile -t shell_scripts < <(git ls-files '*.sh')
              if [ "${#shell_scripts[@]}" -gt 0 ]; then shellcheck "${shell_scripts[@]}"; fi
              ;;
            workflow-lint)
              actionlint_archive="${RUNNER_TEMP}/actionlint.tar.gz"
              curl --fail --silent --show-error --location \
                https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
                --output "${actionlint_archive}"
              printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "${actionlint_archive}" \
                | sha256sum -c -
              tar -xzf "${actionlint_archive}" -C "${RUNNER_TEMP}" actionlint
              "${RUNNER_TEMP}/actionlint" -shellcheck '' -pyflakes ''
              ;;
            *)
              echo "Unknown impact target: ${target}" >&2
              exit 2
              ;;
          esac

  agents:
    name: Agents CI
    needs: plan
    if: ${{ github.event_name == 'pull_request' && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.delegated), 'agents-ci') }}
    uses: ./.github/workflows/agents-ci.yml
    with:
      changed_files_json: ${{ needs.plan.outputs.changed_files }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

  agents-full:
    name: Agents full CI
    needs: plan
    if: github.event_name == 'merge_group' && needs.plan.result == 'success'
    uses: ./.github/workflows/agents-ci.yml
    with:
      changed_files_json: ${{ needs.plan.outputs.changed_files }}

  jangar:
    name: Jangar CI
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.jangar_affected == 'true'
    uses: ./.github/workflows/jangar-ci.yml

  bayn:
    name: Bayn CI
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/bayn-ci.yml

  ofz:
    name: Ofz authorization
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/ofz.yaml

  relay:
    name: Relay platform
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/relay.yml

  tengri:
    name: Tengri and Nanoagent
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/tengri-validation.yml

  buf:
    name: Protobuf validation
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/buf-ci.yml

  scripts:
    name: Repository scripts
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/scripts-ci.yml

  torghut:
    name: Torghut CI
    if: github.event_name == 'merge_group'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/torghut-ci.yml

  torghut-schema:
    name: Torghut ClickHouse schema
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/torghut-schema.yml

  torghut-notebooks:
    name: Torghut notebooks
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/torghut-notebooks-ci.yml

  queue-services:
    name: Queue service validation
    if: github.event_name == 'merge_group'
    uses: ./.github/workflows/queue-service-validation.yml

  ci-pr:
    name: ci-pr
    if: ${{ always() }}
    needs:
      - plan
      - validate
      - landing
      - agents
      - agents-full
      - jangar
      - bayn
      - ofz
      - relay
      - tengri
      - buf
      - scripts
      - torghut
      - torghut-schema
      - torghut-notebooks
      - queue-services
    runs-on: ubuntu-latest
    steps:
      - name: Enforce selected validation results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VALIDATE_EXPECTED: ${{ github.event_name == 'pull_request' && needs.plan.outputs.targets == '["landing"]' && 'skipped' || 'success' }}
          LANDING_RESULT: ${{ needs.landing.result }}
          LANDING_EXPECTED: ${{ (github.event_name == 'merge_group' || contains(fromJSON(needs.plan.outputs.targets || '[]'), 'landing')) && 'success' || 'skipped' }}
          AGENTS_RESULT: ${{ github.event_name == 'merge_group' && needs.agents-full.result || needs.agents.result }}
          BAYN_RESULT: ${{ needs.bayn.result }}
          OFZ_RESULT: ${{ needs.ofz.result }}
          RELAY_RESULT: ${{ needs.relay.result }}
          TENGRI_RESULT: ${{ needs.tengri.result }}
          BUF_RESULT: ${{ needs.buf.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
          TORGHUT_RESULT: ${{ needs.torghut.result }}
          TORGHUT_SCHEMA_RESULT: ${{ needs.torghut-schema.result }}
          TORGHUT_NOTEBOOKS_RESULT: ${{ needs.torghut-notebooks.result }}
          QUEUE_SERVICES_RESULT: ${{ needs.queue-services.result }}
          DELEGATED: ${{ needs.plan.outputs.delegated }}
          FULL_VALIDATION: ${{ github.event_name == 'merge_group' }}
        run: |
          set -euo pipefail
          if [ "${PLAN_RESULT}" != success ] || [ "${VALIDATE_RESULT}" != "${VALIDATE_EXPECTED}" ]; then
            echo "CI validation failed: plan=${PLAN_RESULT}, validate=${VALIDATE_RESULT}, expected=${VALIDATE_EXPECTED}" >&2
            exit 1
          fi
          if [ "${LANDING_RESULT}" != "${LANDING_EXPECTED}" ]; then
            echo "Landing validation failed: landing=${LANDING_RESULT}, expected=${LANDING_EXPECTED}" >&2
            exit 1
          fi
          if [[ "${AGENTS_RESULT}" != success && ( "${FULL_VALIDATION}" == true || "${AGENTS_RESULT}" != skipped ) ]]; then
            echo "Agents validation failed: agents=${AGENTS_RESULT}" >&2
            exit 1
          fi
          if [[ "${FULL_VALIDATION}" == true && "${BAYN_RESULT}" != success ]]; then
            echo "Bayn validation failed: bayn=${BAYN_RESULT}" >&2
            exit 1
          fi
          if [[ "${FULL_VALIDATION}" == true && ( "${OFZ_RESULT}" != success || "${RELAY_RESULT}" != success || "${TENGRI_RESULT}" != success ) ]]; then
            echo "Platform validation failed: ofz=${OFZ_RESULT}, relay=${RELAY_RESULT}, tengri=${TENGRI_RESULT}" >&2
            exit 1
          fi
          if [[ "${FULL_VALIDATION}" == true && ( "${BUF_RESULT}" != success || "${SCRIPTS_RESULT}" != success ) ]]; then
            echo "Tooling validation failed: buf=${BUF_RESULT}, scripts=${SCRIPTS_RESULT}" >&2
            exit 1
          fi
          if [[ "${FULL_VALIDATION}" == true && ( "${TORGHUT_RESULT}" != success || "${TORGHUT_SCHEMA_RESULT}" != success || "${TORGHUT_NOTEBOOKS_RESULT}" != success ) ]]; then
            echo "Torghut validation failed: core=${TORGHUT_RESULT}, schema=${TORGHUT_SCHEMA_RESULT}, notebooks=${TORGHUT_NOTEBOOKS_RESULT}" >&2
            exit 1
          fi
          if [[ "${FULL_VALIDATION}" == true && "${QUEUE_SERVICES_RESULT}" != success ]]; then
            echo "Queue service validation failed: ${QUEUE_SERVICES_RESULT}" >&2
            exit 1
          fi
          echo "Router validation passed: agents=${AGENTS_RESULT}, bayn=${BAYN_RESULT}. Delegated workflows: ${DELEGATED}"

      - name: Enforce Jangar validation result
        if: github.event_name == 'pull_request'
        env:
          JANGAR_RESULT: ${{ needs.jangar.result }}
          JANGAR_AFFECTED: ${{ needs.plan.outputs.jangar_affected }}
        run: |
          set -euo pipefail
          case "${JANGAR_AFFECTED}" in
            true) expected=success ;;
            false) expected=skipped ;;
            *)
              echo 'Missing Jangar impact decision' >&2
              exit 1
              ;;
          esac
          if [[ "${JANGAR_RESULT}" != "${expected}" ]]; then
            echo "Jangar validation failed: jangar=${JANGAR_RESULT}, expected=${expected}" >&2
            exit 1
          fi
