name: bayn-paper-activation
run-name: >-
  ${{
    format(
      'bayn-paper-activation-qualification-{0}-{1}',
      github.event.workflow_run.id,
      github.event.workflow_run.run_attempt
    )
  }}

# This workflow only authenticates immutable qualification material and opens
# bounded GitOps proposals. Runtime discovery, reconciliation, and PREPARE
# remain inside the Bayn process after startup.
permissions:
  actions: read
  contents: read

on:
  workflow_run:
    workflows:
      - bayn-qualification
    types:
      - completed
    branches:
      - main

concurrency:
  group: >-
    ${{
      format(
        'bayn-paper-activation-qualification-{0}-{1}',
        github.event.workflow_run.id,
        github.event.workflow_run.run_attempt
      )
    }}
  cancel-in-progress: false

jobs:
  verify-and-propose:
    name: Verify request and propose bounded GitOps transition
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: arc-arm64
    timeout-minutes: 20
    outputs:
      live: ${{ steps.identity.outputs.live }}
      activation_id: ${{ steps.identity.outputs.activation_id }}
      current_main_sha: ${{ steps.identity.outputs.current_main_sha }}
      producer_head_sha: ${{ steps.identity.outputs.producer_head_sha }}
      request_hash: ${{ steps.request.outputs.request_hash }}
      cutoff_at: ${{ steps.request.outputs.cutoff_at }}
      expires_at: ${{ steps.request.outputs.expires_at }}
      activation_branch: ${{ steps.gitops.outputs.activation_branch }}
      activation_commit_sha: ${{ steps.gitops.outputs.activation_commit_sha }}
      rollback_branch: ${{ steps.gitops.outputs.rollback_branch }}
      rollback_commit_sha: ${{ steps.gitops.outputs.rollback_commit_sha }}
      activation_pr: ${{ steps.gitops.outputs.activation_pr }}
      rollback_pr: ${{ steps.gitops.outputs.rollback_pr }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Authenticate producer, artifact identity, and current main
        id: identity
        env:
          ACTIVATION_ID: ${{ format('qualification-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
          ARTIFACT_NAME: ${{ format('bayn-paper-activation-evidence-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EVIDENCE_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${ACTIVATION_ID}" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          [[ "${EVIDENCE_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${EVIDENCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "${ARTIFACT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          [[ "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${current_main_sha}"

          self_workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bayn-paper-activation.yml" --jq '.id')"
          prior_runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/${self_workflow_id}/runs?event=workflow_run&per_page=100")"
          duplicate_count="$(jq -s --argjson current "${GITHUB_RUN_ID}" --arg title "bayn-paper-activation-${ACTIVATION_ID}" '[.[].workflow_runs[]] | map(select(.id != $current and .display_title == $title)) | length' <<<"${prior_runs}")"
          [[ "${duplicate_count}" == 0 ]] || {
            echo 'BAYN_PAPER_ACTIVATION_HOLD activation-already-claimed' >&2
            exit 1
          }

          qualification_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bayn-qualification.yml")"
          qualification_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}")"
          qualification_attempt="$(jq -r '.run_attempt' <<<"${qualification_run}")"
          expected_artifact="bayn-paper-activation-evidence-${EVIDENCE_RUN_ID}-${qualification_attempt}"
          if
            [[ "$(jq -r '.workflow_id' <<<"${qualification_run}")" != "$(jq -r '.id' <<<"${qualification_workflow}")" ]] ||
            [[ "$(jq -r '.path' <<<"${qualification_run}")" != '.github/workflows/bayn-qualification.yml' ]] ||
            [[ "$(jq -r '.event' <<<"${qualification_run}")" != 'schedule' ]] ||
            [[ "$(jq -r '.status' <<<"${qualification_run}")" != 'completed' ]] ||
            [[ "$(jq -r '.conclusion' <<<"${qualification_run}")" != 'success' ]] ||
            [[ "$(jq -r '.head_branch' <<<"${qualification_run}")" != 'main' ]] ||
            [[ "$(jq -r '.repository.full_name' <<<"${qualification_run}")" != "${GITHUB_REPOSITORY}" ]] ||
            [[ "${qualification_attempt}" != "${EVIDENCE_RUN_ATTEMPT}" ]] ||
            [[ "${ARTIFACT_NAME}" != "${expected_artifact}" ]]
          then
            echo 'BAYN_PAPER_ACTIVATION_HOLD untrusted-evidence-run' >&2
            exit 1
          fi
          producer_head_sha="$(jq -er '.head_sha' <<<"${qualification_run}")"
          [[ "${producer_head_sha}" =~ ^[0-9a-f]{40}$ ]]

          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}/artifacts?name=${ARTIFACT_NAME}&per_page=100")"
          artifact_count="$(jq --arg name "${ARTIFACT_NAME}" '[.artifacts[] | select(.expired == false and .name == $name)] | length' <<<"${artifacts}")"
          if [[ "${artifact_count}" == 0 ]]; then
            echo 'No qualified activation artifact exists; Bayn remains dormant.'
            {
              echo "activation_id=${ACTIVATION_ID}"
              echo "current_main_sha=${current_main_sha}"
              echo "producer_head_sha=${producer_head_sha}"
              echo 'live=false'
            } >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          [[ "${artifact_count}" == 1 ]] || {
            echo 'BAYN_PAPER_ACTIVATION_HOLD evidence-artifact-ambiguous' >&2
            exit 1
          }
          {
            echo "activation_id=${ACTIVATION_ID}"
            echo "current_main_sha=${current_main_sha}"
            echo "producer_head_sha=${producer_head_sha}"
            echo 'live=true'
          } >>"${GITHUB_OUTPUT}"

      - name: Download exactly one authenticated qualified terminal
        if: steps.identity.outputs.live == 'true'
        env:
          ARTIFACT_NAME: ${{ format('bayn-paper-activation-evidence-{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
          EVIDENCE_RUN_ID: ${{ github.event.workflow_run.id }}
          PRODUCER_HEAD_SHA: ${{ steps.identity.outputs.producer_head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p activation-evidence
          gh run download "${EVIDENCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${ARTIFACT_NAME}" --dir activation-evidence
          mapfile -t files < <(find activation-evidence -type f -name '*.json' -print)
          test "${#files[@]}" -eq 1
          mv "${files[0]}" activation-evidence/terminal.json
          jq -e --arg producer_head_sha "${PRODUCER_HEAD_SHA}" '
            .schemaVersion == "bayn.qualification-collector-terminal.v1" and
            .terminal.verdict == "QUALIFIED" and
            .currentMainSha == $producer_head_sha and
            .sourceSha == $producer_head_sha
          ' activation-evidence/terminal.json >/dev/null

      - name: Extract source-controlled manifest pins
        if: steps.identity.outputs.live == 'true'
        run: |
          set -euo pipefail
          bun packages/scripts/src/bayn/verify-paper-activation.ts \
            --mode extract-manifest-pins \
            --deployment argocd/applications/bayn/deployment.yaml \
            --kustomization argocd/applications/bayn/kustomization.yaml \
            --output activation-evidence/manifest-pins.json

      - name: Assemble compact runtime-owned activation request
        id: request
        if: steps.identity.outputs.live == 'true'
        env:
          CURRENT_MAIN_SHA: ${{ steps.identity.outputs.current_main_sha }}
          PRODUCER_HEAD_SHA: ${{ steps.identity.outputs.producer_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          request_now="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          bun packages/scripts/src/bayn/verify-paper-activation.ts \
            --mode assemble-request \
            --terminal activation-evidence/terminal.json \
            --manifest-pins activation-evidence/manifest-pins.json \
            --repository "${GITHUB_REPOSITORY}" \
            --current-main-sha "${CURRENT_MAIN_SHA}" \
            --producer-head-sha "${PRODUCER_HEAD_SHA}" \
            --now "${request_now}" \
            --output activation-evidence/request.json
          {
            echo "now=${request_now}"
            echo "request_hash=$(jq -r '.requestHash' activation-evidence/request.json)"
            echo "cutoff_at=$(jq -r '.cutoffAt' activation-evidence/request.json)"
            echo "expires_at=$(jq -r '.expiresAt' activation-evidence/request.json)"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify request against exact source and image pins
        if: steps.identity.outputs.live == 'true'
        env:
          CURRENT_MAIN_SHA: ${{ steps.identity.outputs.current_main_sha }}
          PRODUCER_HEAD_SHA: ${{ steps.identity.outputs.producer_head_sha }}
          REQUEST_NOW: ${{ steps.request.outputs.now }}
        shell: bash
        run: |
          set -euo pipefail
          bun packages/scripts/src/bayn/verify-paper-activation.ts \
            --mode verify-request \
            --request activation-evidence/request.json \
            --manifest-pins activation-evidence/manifest-pins.json \
            --repository "${GITHUB_REPOSITORY}" \
            --current-main-sha "${CURRENT_MAIN_SHA}" \
            --producer-head-sha "${PRODUCER_HEAD_SHA}" \
            --now "${REQUEST_NOW}"

      - name: Render request and bounded rollback manifests
        if: steps.identity.outputs.live == 'true'
        run: |
          set -euo pipefail
          bun packages/scripts/src/bayn/verify-paper-activation.ts \
            --mode render-request-transition \
            --deployment argocd/applications/bayn/deployment.yaml \
            --request activation-evidence/request.json \
            --request-output deployment.request.yaml \
            --rollback-output deployment.rollback.yaml
          diff -u argocd/applications/bayn/deployment.yaml deployment.request.yaml > request.patch || true
          diff -u deployment.request.yaml deployment.rollback.yaml > rollback.patch || true
          test -s request.patch
          test -s rollback.patch
          grep -q 'BAYN_PAPER_ACTIVATION_REQUEST' request.patch
          ! grep -Eq 'value: PAPER|value: mutation|value: sandbox-capital' request.patch

      - name: Persist authenticated request contract
        if: steps.identity.outputs.live == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bayn-paper-activation-contract-${{ steps.identity.outputs.activation_id }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            request.patch
            rollback.patch
            activation-evidence/terminal.json
            activation-evidence/request.json
            activation-evidence/manifest-pins.json

      - name: Create ready bounded activation and rollback pull requests
        id: gitops
        if: steps.identity.outputs.live == 'true'
        env:
          ACTIVATION_ID: ${{ steps.identity.outputs.activation_id }}
          CURRENT_MAIN_SHA: ${{ steps.identity.outputs.current_main_sha }}
          PRODUCER_HEAD_SHA: ${{ steps.identity.outputs.producer_head_sha }}
          REQUEST_HASH: ${{ steps.request.outputs.request_hash }}
          CUTOFF_AT: ${{ steps.request.outputs.cutoff_at }}
          EXPIRES_AT: ${{ steps.request.outputs.expires_at }}
          GH_TOKEN: ${{ secrets.AGENTS_SPLIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN}" ]] || {
            echo 'BAYN_PAPER_ACTIVATION_HOLD protected-gitops-token-missing' >&2
            exit 1
          }
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')" = "${CURRENT_MAIN_SHA}"
          activation_branch="codex/bayn-paper-activation/${ACTIVATION_ID}"
          rollback_branch="codex/bayn-paper-rollback/${ACTIVATION_ID}"
          if git ls-remote --exit-code --heads origin "refs/heads/${activation_branch}" >/dev/null 2>&1; then
            echo 'BAYN_PAPER_ACTIVATION_HOLD activation-branch-already-exists' >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/${rollback_branch}" >/dev/null 2>&1; then
            echo 'BAYN_PAPER_ACTIVATION_HOLD rollback-branch-already-exists' >&2
            exit 1
          fi

          make_commit() {
            local base="$1" deployment="$2" message="$3"
            local index tree blob commit
            index="$(mktemp)"
            rm -f "${index}"
            GIT_INDEX_FILE="${index}" git read-tree "${base}"
            blob="$(git hash-object -w "${deployment}")"
            GIT_INDEX_FILE="${index}" git update-index --add --cacheinfo 100644,"${blob}",argocd/applications/bayn/deployment.yaml
            tree="$(GIT_INDEX_FILE="${index}" git write-tree)"
            commit="$(printf '%s\n' "${message}" | git commit-tree "${tree}" -p "${base}")"
            rm -f "${index}"
            printf '%s' "${commit}"
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          activation_commit="$(make_commit "${CURRENT_MAIN_SHA}" deployment.request.yaml "chore(bayn): submit bounded PAPER request ${ACTIVATION_ID}")"
          rollback_commit="$(make_commit "${activation_commit}" deployment.rollback.yaml "chore(bayn): remove bounded PAPER request ${ACTIVATION_ID}")"
          gh auth setup-git
          git push origin "${activation_commit}:refs/heads/${activation_branch}"
          git push origin "${rollback_commit}:refs/heads/${rollback_branch}"

          cat > activation-pr-body.md <<EOF
          ## Summary

          - Add one immutable Bayn PAPER activation request for runtime-owned discovery and OBSERVE PREPARE.
          - Keep the configured service authority OBSERVE/read-only/no-capital until the live process validates the request and realizes the exact v2 generation.
          - Qualification source: ${PRODUCER_HEAD_SHA}; activation source: ${CURRENT_MAIN_SHA}.

          ## Related Issues

          PROOMPT-445

          ## Testing

          - The workflow authenticated exactly one QUALIFIED terminal artifact and verified its canonical request hash, source, image, strategy, zero-order limits, cutoff, and expiry.
          - No kubectl, broker mutation, deployment, or PAPER activation operation is performed by this workflow.

          ## Breaking Changes

          None

          ## Checklist

          - [x] Testing section documents the exact validation performed.
          - [x] Screenshots and Breaking Changes sections are handled appropriately.
          - [x] Documentation, release notes, and follow-ups are updated or tracked.
          EOF
          cat > rollback-pr-body.md <<EOF
          ## Summary

          - Remove the bounded Bayn PAPER activation request from the paired activation branch.
          - This rollback PR targets main and restores the exact OBSERVE/read-only/no-capital deployment.

          ## Related Issues

          PROOMPT-445

          ## Testing

          - The parent workflow rendered and checked the exact request and rollback manifests before opening either ready PR.
          - Request hash: ${REQUEST_HASH}; immutable cutoff: ${CUTOFF_AT}; expiry: ${EXPIRES_AT}.

          ## Breaking Changes

          None

          ## Checklist

          - [x] Testing section documents the exact validation performed.
          - [x] Screenshots and Breaking Changes sections are handled appropriately.
          - [x] Documentation, release notes, and follow-ups are updated or tracked.
          EOF

          activation_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${activation_branch}" --title "chore(bayn): submit bounded PAPER request ${ACTIVATION_ID}" --body-file activation-pr-body.md)"
          rollback_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${rollback_branch}" --title "chore(bayn): remove bounded PAPER request ${ACTIVATION_ID}" --body-file rollback-pr-body.md)"
          {
            echo "activation_branch=${activation_branch}"
            echo "activation_commit_sha=${activation_commit}"
            echo "activation_pr=${activation_url##*/}"
            echo "rollback_branch=${rollback_branch}"
            echo "rollback_commit_sha=${rollback_commit}"
            echo "rollback_pr=${rollback_url##*/}"
          } >>"${GITHUB_OUTPUT}"
