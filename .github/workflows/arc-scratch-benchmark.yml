name: ARC scratch benchmark

on:
  pull_request:
    paths:
      - .github/workflows/arc-scratch-benchmark.yml
      - argocd/applications/arc/application.yaml

permissions:
  contents: read

concurrency:
  group: arc-scratch-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: ${{ matrix.runner }} Ceph and tmpfs pair ${{ matrix.pair }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        pair: [1, 2, 3, 4, 5]
        runner: [arc-amd64, arc-arm64]
    env:
      PAIR: ${{ matrix.pair }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Compare seed copy and offline OCI export
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/arc-scratch-benchmark"
          mkdir -p "$evidence"
          manifest=argocd/applications/arc/application.yaml
          template='.spec.sources[1].helm.valuesObject.template.spec'
          git show "$BASE_SHA:$manifest" | yq "$template.initContainers[0].args[0]" - > "$evidence/ceph.sh"
          yq "$template.initContainers[0].args[0]" "$manifest" > "$evidence/tmpfs.sh"
          size="$(yq "$template.volumes[0].emptyDir.sizeLimit" "$manifest")"
          [[ "$size" =~ ^[0-9]+Gi$ ]]
          capacity_bytes=$(( ${size%Gi} * 1024 * 1024 * 1024 ))

          nix_binary="$(readlink -f "$(command -v nix)")"
          nix-store --query --requisites "${nix_binary%/bin/nix}" | sed 's@^/nix/store/@@' | sort > "$evidence/paths"
          tar -C /nix/store -cf "$evidence/payload.tar" -T "$evidence/paths"
          sha="$(sha256sum "$evidence/payload.tar" | cut -d' ' -f1)"
          order=(ceph tmpfs)
          if (( PAIR % 2 == 0 )); then order=(tmpfs ceph); fi
          for filesystem in "${order[@]}"; do
            sudo -n -E /usr/bin/env "PATH=$PATH" unshare --mount --propagation private \
              bash -s -- "$filesystem" "$evidence" "$capacity_bytes" "$sha" <<'BENCHMARK'
          set -euo pipefail
          filesystem="$1"
          evidence="$2"
          capacity_bytes="$3"
          expected_sha="$4"
          exec 3>"$evidence/$filesystem.json"
          cd /
          mkdir -p /scratch
          if [[ "$filesystem" == ceph ]]; then
            mkdir "$evidence/ceph"
            mount --bind "$evidence/ceph" /scratch
          else
            mount -t tmpfs -o "size=$capacity_bytes" tmpfs /scratch
          fi
          uptime
          start="$(date +%s%N)"
          bash "$evidence/$filesystem.sh"
          bootstrapped="$(date +%s%N)"

          work=/scratch/work
          context="$work/context"
          install -d -o 1001 -g 1001 "$context"
          cp --reflink=never "$evidence/payload.tar" "$context/payload.tar"
          printf 'FROM scratch\nCOPY payload.tar /payload.tar\n' > "$context/Dockerfile"
          for mount_spec in nix:/nix cache:/home/runner/.cache tmp:/tmp var-tmp:/var/tmp work:/home/runner/_work; do
            mount --bind "/scratch/${mount_spec%%:*}" "${mount_spec#*:}"
            test "$(stat -c %d "${mount_spec#*:}")" = "$(stat -c %d /scratch)"
          done
          as_runner=(setpriv --reuid=1001 --regid=1001 --init-groups)
          test "$("${as_runner[@]}" nix eval --offline --expr '40 + 2')" = 42
          export BUILDKIT_HOST="unix://$work/buildkitd.sock"
          buildkitd --addr "$BUILDKIT_HOST" --root "$work/buildkit" --group 1001 \
            --oci-worker=true --containerd-worker=false >"$work/buildkitd.log" 2>&1 &
          pid="$!"
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" || true' EXIT
          for _ in $(seq 1 45); do
            if "${as_runner[@]}" buildctl debug workers > "$work/workers.txt" 2>/dev/null; then break; fi
            sleep 1
          done
          if ! test -s "$work/workers.txt"; then cat "$work/buildkitd.log" >&2; exit 1; fi

          archive="$context/image.tar"
          build_start="$(date +%s%N)"
          "${as_runner[@]}" buildctl build --frontend dockerfile.v0 --local "context=$context" \
            --local "dockerfile=$context" --output "type=oci,dest=$archive"
          built="$(date +%s%N)"
          manifest_digest="$(tar -xOf "$archive" index.json | jq -er '.manifests[0].digest')"
          layer_digest="$(tar -xOf "$archive" "blobs/sha256/${manifest_digest#sha256:}" | jq -er '.layers | select(length == 1) | .[0].digest')"
          sha="$(tar -xOf "$archive" "blobs/sha256/${layer_digest#sha256:}" | tar -xzOf - --wildcards '*payload.tar' | sha256sum | cut -d' ' -f1)"
          verified="$(date +%s%N)"
          test "$sha" = "$expected_sha"
          read -r scratch_bytes capacity < <(df -P -B1 /scratch | awk 'NR == 2 { print $3, $2 }')
          if [[ "$filesystem" == tmpfs ]]; then test "$capacity" = "$capacity_bytes"; fi
          cg="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          jq -n --arg filesystem "$filesystem" --arg node "$ARC_RUNNER_NODE_NAME" --arg pod "$ACTIONS_RUNNER_POD_NAME" \
            --arg sha256 "$sha" --argjson pair "$PAIR" --argjson initNs "$((bootstrapped-start))" \
            --argjson buildNs "$((built-build_start))" --argjson verifyNs "$((verified-built))" \
            --argjson payloadBytes "$(wc -c < "$context/payload.tar")" --argjson scratchBytes "$scratch_bytes" \
            --argjson memoryPeakBytes "$(cat "$cg/memory.peak")" \
            '{filesystem:$filesystem,node:$node,pod:$pod,sha256:$sha256,pair:$pair,initNs:$initNs,buildNs:$buildNs,
              verifyNs:$verifyNs,payloadBytes:$payloadBytes,scratchBytes:$scratchBytes,memoryPeakBytes:$memoryPeakBytes}' >&3
          BENCHMARK
            if [[ "$filesystem" == ceph ]]; then sudo -n rm -rf -- "$evidence/ceph"; fi
          done
          jq -s -e 'length == 2 and ([.[].sha256] | unique | length) == 1' "$evidence/"{ceph,tmpfs}.json
          {
            echo '| Filesystem | Seed init (s) | OCI build (s) | Layer verification (s) |'
            echo '|---|---:|---:|---:|'
            jq -r '"| \(.filesystem) | \(.initNs / 1e9) | \(.buildNs / 1e9) | \(.verifyNs / 1e9) |"' "$evidence/"{ceph,tmpfs}.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-scratch-${{ matrix.runner }}-${{ matrix.pair }}
          path: ${{ runner.temp }}/arc-scratch-benchmark/*.json
          if-no-files-found: error
          retention-days: 7
