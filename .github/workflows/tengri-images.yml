name: Tengri images

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    paths:
      - '.github/workflows/tengri-validation.yml'
      - 'services/tengri/**'
      - 'services/ofz/src/**'
      - 'services/ofz/Cargo.*'
      - 'services/ofz/build.rs'
      - 'services/ofz/migrations/**'
      - 'services/ofz/schema.zed'
      - 'services/ofz/operations.json'
      - 'services/ofz/test-control.sh'
      - 'proto/proompteng/authz/**'
      - 'services/relay/**'
      - 'packages/platform-client/**'
      - 'proto/proompteng/relay/**'
      - 'apps/landing/src/lib/platform/**'
      - 'apps/landing/src/app/api/platform/**'
      - 'services/nanoagent/**'
      - 'devices/galactic/omni/tengri-runner-*.json'
      - 'nix/tengri-schema-hash.py'
      - 'argocd/applications/tengri/**'
      - 'argocd/applications/tengri/crd.yaml'
      - 'packages/scripts/src/tengri/**'
      - '!packages/scripts/src/tengri/__tests__/**'
      - '!packages/scripts/src/tengri/**/*.test.ts'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tengri-images.yml'
      - 'apps/landing/**'
      - 'apps/landing/package.json'
      - 'apps/landing/src/app/api/auth/**'
      - 'apps/landing/src/app/api/tengri/**'
      - 'apps/landing/src/components/tengri/**'
      - 'apps/landing/src/lib/tengri/**'
      - 'argocd/applications/keycloak/tengri/**'
      - 'argocd/applications/ofz/**'
      - 'argocd/applications/proompteng/**'
      - 'argocd/applications/proompteng/ingressroute.yaml'
      - 'argocd/applications/tengri/**'
      - 'argocd/applications/tengri/crd.yaml'
      - 'bun.lock'
      - 'devices/galactic/omni/tengri-runner-*.json'
      - 'flake.lock'
      - 'flake.nix'
      - 'nix/images/bun-workspace-service.nix'
      - 'nix/images/ofz.nix'
      - 'nix/images/proompteng.nix'
      - 'nix/packages.nix'
      - 'nix/tengri-schema-hash.py'
      - 'packages/backend/**'
      - 'packages/design/**'
      - 'packages/scripts/src/tengri/**'
      - '!packages/scripts/src/tengri/__tests__/**'
      - '!packages/scripts/src/tengri/**/*.test.ts'
      - 'proto/proompteng/authz/**'
      - 'services/relay/**'
      - 'packages/platform-client/**'
      - 'proto/proompteng/relay/**'
      - 'apps/landing/src/lib/platform/**'
      - 'apps/landing/src/app/api/platform/**'
      - 'services/nanoagent/**'
      - 'services/ofz/**'
      - 'services/ofz/Cargo.*'
      - 'services/ofz/build.rs'
      - 'services/ofz/migrations/**'
      - 'services/ofz/operations.json'
      - 'services/ofz/schema.zed'
      - 'services/ofz/src/**'
      - 'services/ofz/test-control.sh'
      - 'services/tengri/**'
      - package.json
      - bunfig.toml
      - .npmrc
      - patches/**
      - tsconfig.base.json
      - nix/images/relativize-bun-cache.sh
      - nix/images/prune-bun-dependency-metadata.sh
      - '!apps/landing/README.md'
      - '!services/ofz/README.md'
      - '!services/tengri/README.md'
      - '!services/nanoagent/README.md'
  workflow_dispatch:

concurrency:
  group: tengri-images-${{ github.event_name == 'push' && github.run_id || github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && github.run_id || 'source' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NANOAGENT_IMAGE: registry.ide-newton.ts.net/lab/nanoagent
  TENGRI_IMAGE: registry.ide-newton.ts.net/lab/tengri

jobs:
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ fromJSON(steps.filter.outputs.affected).desktop }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/affected-inputs
        id: filter
        with:
          workflow: .github/workflows/tengri-images.yml
          dependency-aware-push: 'true'
          workspaces: |
            desktop: ['', 'apps/landing', 'packages/backend', 'packages/design']

  validate:
    name: Validate Tengri and Nanoagent
    needs: changes
    if: >-
      !cancelled() && (github.event.action != 'edited' || github.event.changes.base) &&
      (github.event_name == 'pull_request' || (needs.changes.result == 'success' && needs.changes.outputs.changed == 'true'))
    uses: ./.github/workflows/tengri-validation.yml

  build:
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.changed == 'true'
    name: Build native (${{ format('{0}, {1}', matrix.image, matrix.architecture) }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        image: [nanoagent, tengri]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - image: tengri
            build_contexts: |
              ofz-proto=proto
              ofz-catalog=services/ofz
              nanoagent-src=services/nanoagent
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildkit

      - name: Read source timestamp
        id: source
        run: |
          set -euo pipefail
          timestamp="$(git show -s --format=%cI HEAD)"
          printf 'timestamp=%s\n' "$timestamp" >> "$GITHUB_OUTPUT"

      - name: Build native image archive
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.image }}
          build-args: ${{ matrix.image == 'tengri' && format('SOURCE_REVISION={0}', github.sha) || '' }}
          build-contexts: ${{ matrix.build_contexts }}
          platforms: linux/${{ matrix.architecture }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.image }}-${{ matrix.architecture }}.tar
          labels: |
            org.opencontainers.image.created=${{ steps.source.outputs.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Hand native image to publisher
        uses: actions/upload-artifact@v4
        with:
          name: tengri-native-${{ matrix.image }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/${{ matrix.image }}-${{ matrix.architecture }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs:
      - build
      - validate
    concurrency:
      group: tengri-publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: arc-amd64
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve source commit metadata
        id: source
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          expected_source_sha="$(git rev-parse "${EXPECTED_SOURCE_REVISION}^{commit}")"
          [[ "${source_sha}" == "${expected_source_sha}" ]]
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"
          printf 'source_timestamp=%s\n' "$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Verify pinned Cosign
        run: cosign version

      - name: Download native image archives
        uses: actions/download-artifact@v5
        with:
          pattern: tengri-native-*
          path: ${{ runner.temp }}/tengri-native
          merge-multiple: true

      - name: Import native images into the private registry
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          for image in "$TENGRI_IMAGE" "$NANOAGENT_IMAGE"; do
            service="${image##*/}"
            for architecture in amd64 arm64; do
              archive="$RUNNER_TEMP/tengri-native/$service-$architecture.tar"
              regctl image import "$image:sha-$SOURCE_SHA-$architecture" "$archive"
              rm "$archive"
            done
          done

      - name: Verify paired boot artifact checksums
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          directory="$(mktemp -d)"
          trap 'rm -rf "$directory"' EXIT
          for architecture in amd64 arm64; do
            guest="$NANOAGENT_IMAGE:sha-$SOURCE_SHA-$architecture"
            crane export --platform "linux/$architecture" "$guest" - | tar -xf - -C "$directory" guest/
            sed 's| /guest/| ./guest/|' "$directory/guest/SHA256SUMS" > "$directory/SHA256SUMS"
            (cd "$directory" && sha256sum --check SHA256SUMS)
            rm -r "$directory/guest"
          done

      - name: Publish, verify, and sign multi-architecture images
        id: images
        shell: bash
        env:
          SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/tengri-images.yml@refs/heads/main
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TIMESTAMP: ${{ steps.source.outputs.source_timestamp }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/tengri
          [[ "${SOURCE_SHA}" == "${GITHUB_SHA}" ]]
          tag="sha-${SOURCE_SHA}"
          schema_hash="$(python3 nix/tengri-schema-hash.py)"

          publish_image() {
            set -euo pipefail
            local image="$1"
            local service="${image##*/}"
            local index_path=".artifacts/tengri/${service}-index.json"

            for architecture in amd64 arm64; do
              local reference="${image}:${tag}-${architecture}"
              crane config --platform "linux/${architecture}" "${reference}" | jq -e \
                --arg source_timestamp "${SOURCE_TIMESTAMP}" \
                --arg source_sha "${SOURCE_SHA}" \
                '.config.Labels["org.opencontainers.image.created"] == $source_timestamp and
                 .config.Labels["org.opencontainers.image.revision"] == $source_sha' >/dev/null
            done

            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
              --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}" \
              --annotation "index:ai.proompteng.tengri-schema=${schema_hash}" \
              --tag "${image}:${tag}" \
              "${image}:${tag}-amd64" \
              "${image}:${tag}-arm64" >&2
            docker buildx imagetools inspect --raw "${image}:${tag}" > "${index_path}"
            jq -e \
              --arg source_url "${SOURCE_URL}" \
              --arg schema_hash "${schema_hash}" \
              --arg source_sha "${SOURCE_SHA}" '
              .annotations["ai.proompteng.tengri-schema"] == $schema_hash and
              .annotations["org.opencontainers.image.source"] == $source_url and
              .annotations["org.opencontainers.image.revision"] == $source_sha and
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
            ' "${index_path}" >&2

            local digest
            digest="$(
              docker buildx imagetools inspect \
                --format '{{json .Manifest}}' \
                "${image}:${tag}" |
                jq -er '.digest'
            )"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            local reference="${image}@${digest}"
            cosign sign --yes "${reference}" >&2
            cosign verify \
              --certificate-identity "${SIGNING_IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${reference}" >/dev/null

            printf '%s' "${digest}"
          }

          tengri_digest="$(publish_image "${TENGRI_IMAGE}")"
          nanoagent_digest="$(publish_image "${NANOAGENT_IMAGE}")"
          printf 'tengri_digest=%s\nnanoagent_digest=%s\n' \
            "${tengri_digest}" "${nanoagent_digest}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Tengri images'
            echo
            echo "- ${TENGRI_IMAGE}@${tengri_digest}"
            echo "- ${NANOAGENT_IMAGE}@${nanoagent_digest}"
            echo "- Source: ${SOURCE_SHA}"
            echo '- Platforms: linux/amd64, linux/arm64'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain verified image indexes
        uses: actions/upload-artifact@v4
        with:
          name: tengri-image-indexes-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .artifacts/tengri/*-index.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Expose both verified images to Kargo
        env:
          TENGRI_PREPARED_SLOT_GUEST_API_VERSION: ${{ vars.TENGRI_PREPARED_SLOT_GUEST_API_VERSION || '' }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TENGRI_DIGEST: ${{ steps.images.outputs.tengri_digest }}
          NANOAGENT_DIGEST: ${{ steps.images.outputs.nanoagent_digest }}
        run: |
          set -euo pipefail
          required_guest_api_version="$(sed -nE 's/^pub const GUEST_API_PROTOCOL_VERSION: u32 = ([1-9][0-9]*);$/\1/p' services/tengri/src/lib.rs)"
          if [[ ! "${required_guest_api_version}" =~ ^[1-9][0-9]*$ || "${TENGRI_PREPARED_SLOT_GUEST_API_VERSION}" != "${required_guest_api_version}" ]]; then
            echo 'Prepared-slot publication held: both Kargo aliases require retained homes enrolled in this release guest API protocol. Set TENGRI_PREPARED_SLOT_GUEST_API_VERSION to the qualified source protocol only after fencing and enrollment are complete.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          [[ "${SOURCE_SHA}" == "${GITHUB_SHA}" ]]
          [[ "${TENGRI_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${NANOAGENT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          tag="sha-${SOURCE_SHA}"
          publish_kargo_alias() {
            local image="$1"
            local digest="$2"
            local kargo_tag="kargo-sha-${SOURCE_SHA}"
            local kargo_reference="${image}:${kargo_tag}"
            local kargo_digest=''
            local probe_error
            probe_error="$(mktemp)"
            if kargo_digest="$(
              crane digest "${kargo_reference}" 2>"${probe_error}"
            )"; then
              [[ "${kargo_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "${kargo_digest}" == "${digest}" ]]
            else
              probe_output="$(cat "${probe_error}")"
              if ! grep -Eiq 'manifest[[:space:]_-]+(unknown|not[[:space:]]+found)|manifest[^[:cntrl:]]*404|404[^[:cntrl:]]*(manifest|not[[:space:]]+found)' <<<"${probe_output}"; then
                rm -f "${probe_error}"
                echo "Unable to inspect immutable Kargo tag ${kargo_reference}: ${probe_output}" >&2
                exit 1
              fi
              docker buildx imagetools create --tag "${kargo_reference}" "${image}:${tag}" >&2
              kargo_digest="$(
                crane digest "${kargo_reference}"
              )"
              [[ "${kargo_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "${kargo_digest}" == "${digest}" ]]
            fi
            rm -f "${probe_error}"
          }
          publish_kargo_alias "${TENGRI_IMAGE}" "${TENGRI_DIGEST}"
          publish_kargo_alias "${NANOAGENT_IMAGE}" "${NANOAGENT_DIGEST}"
