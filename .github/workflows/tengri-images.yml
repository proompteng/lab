name: Tengri images

on:
  pull_request:
    paths:
      - 'services/tengri/**'
      - 'services/nanoagent/**'
      - '.github/workflows/tengri-images.yml'
      - 'argocd/applications/tengri/**'
      - 'argocd/applications/tengri/crd.yaml'
      - 'packages/scripts/src/tengri/**'
      - 'packages/scripts/src/shared/cli.ts'
      - 'packages/scripts/package.json'
      - 'bun.lock'
  push:
    branches:
      - main
    paths:
      - 'services/tengri/**'
      - 'services/nanoagent/**'
      - '.github/workflows/tengri-images.yml'
      - 'argocd/applications/tengri/**'
      - 'argocd/applications/tengri/crd.yaml'
      - 'packages/scripts/src/tengri/**'
      - 'packages/scripts/src/shared/cli.ts'
      - 'packages/scripts/package.json'
      - 'bun.lock'
  workflow_dispatch:

concurrency:
  group: tengri-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NANOAGENT_IMAGE: registry.ide-newton.ts.net/lab/nanoagent
  TENGRI_IMAGE: registry.ide-newton.ts.net/lab/tengri

jobs:
  validate-tengri:
    name: Validate Tengri
    runs-on: arc-amd64
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential protobuf-compiler

      - name: Validate controller and generated CRD
        working-directory: services/tengri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo run --locked --quiet --bin crdgen > /tmp/tengri-crd.yaml
          diff -u /tmp/tengri-crd.yaml crd.yaml
          diff -u /tmp/tengri-crd.yaml ../../argocd/applications/tengri/crd.yaml

  validate-nanoagent:
    name: Validate Nanoagent
    runs-on: arc-amd64
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/nanoagent/go.mod
          cache-dependency-path: services/nanoagent/go.sum

      - name: Install race detector build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential

      - name: Validate guest service
        working-directory: services/nanoagent
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          bash -n bootstrap-codex.sh
          bash -n bootstrap-toolchain.sh
          bash bootstrap-codex.sh --validate-manifest
          test -z "$(gofmt -l .)"
          GOWORK=off go test -race ./...
          GOWORK=off go vet ./...

  build:
    name: Build ${{ matrix.service }} (${{ matrix.architecture }})
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: tengri
            architecture: amd64
            runner: arc-amd64
            context: services/tengri
            image: registry.ide-newton.ts.net/lab/tengri
          - service: tengri
            architecture: arm64
            runner: arc-arm64
            context: services/tengri
            image: registry.ide-newton.ts.net/lab/tengri
          - service: nanoagent
            architecture: amd64
            runner: arc-amd64
            context: services/nanoagent
            image: registry.ide-newton.ts.net/lab/nanoagent
          - service: nanoagent
            architecture: arm64
            runner: arc-arm64
            context: services/nanoagent
            image: registry.ide-newton.ts.net/lab/nanoagent
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build native image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.architecture }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ matrix.image }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=registry,ref=${{ matrix.image }}:cache-${{ matrix.architecture }}
          provenance: mode=max
          sbom: true

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - build
      - validate-tengri
      - validate-nanoagent
    runs-on: arc-arm64
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve source commit metadata
        id: source
        env:
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          expected_source_sha="$(git rev-parse "${EXPECTED_SOURCE_REVISION}^{commit}")"
          [[ "${source_sha}" == "${expected_source_sha}" ]]
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"
          printf 'source_timestamp=%s\n' "$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Publish, verify, and sign multi-architecture images
        shell: bash
        env:
          SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/tengri-images.yml@refs/heads/main
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TIMESTAMP: ${{ steps.source.outputs.source_timestamp }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/tengri
          [[ "${SOURCE_SHA}" == "${GITHUB_SHA}" ]]
          tag="sha-${SOURCE_SHA}"

          publish_image() {
            local image="$1"
            local service="${image##*/}"
            local index_path=".artifacts/tengri/${service}-index.json"

            for architecture in amd64 arm64; do
              local reference="${image}:${tag}-${architecture}"
              crane mutate --platform "linux/${architecture}" "${reference}" \
                --label "org.opencontainers.image.created=${SOURCE_TIMESTAMP}" \
                --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
                --tag "${reference}" >/dev/null
              crane config --platform "linux/${architecture}" "${reference}" | jq -e \
                --arg source_timestamp "${SOURCE_TIMESTAMP}" \
                --arg source_sha "${SOURCE_SHA}" \
                '.config.Labels["org.opencontainers.image.created"] == $source_timestamp and
                 .config.Labels["org.opencontainers.image.revision"] == $source_sha' >/dev/null
            done

            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
              --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}" \
              --tag "${image}:${tag}" \
              "${image}:${tag}-amd64" \
              "${image}:${tag}-arm64" >&2
            docker buildx imagetools inspect --raw "${image}:${tag}" > "${index_path}"
            jq -e \
              --arg source_url "${SOURCE_URL}" \
              --arg source_sha "${SOURCE_SHA}" '
              .annotations["org.opencontainers.image.source"] == $source_url and
              .annotations["org.opencontainers.image.revision"] == $source_sha and
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
            ' "${index_path}" >&2

            local digest
            digest="$(
              docker buildx imagetools inspect \
                --format '{{json .Manifest}}' \
                "${image}:${tag}" |
                jq -er '.digest'
            )"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            local reference="${image}@${digest}"
            cosign sign --yes "${reference}" >&2
            cosign verify \
              --certificate-identity "${SIGNING_IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${reference}" >/dev/null

            local kargo_tag="kargo-sha-${SOURCE_SHA}"
            local kargo_reference="${image}:${kargo_tag}"
            local kargo_digest=''
            local probe_error
            probe_error="$(mktemp)"
            if kargo_digest="$(
              crane digest "${kargo_reference}" 2>"${probe_error}"
            )"; then
              [[ "${kargo_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "${kargo_digest}" == "${digest}" ]]
            else
              probe_output="$(cat "${probe_error}")"
              if ! grep -Eiq 'manifest[[:space:]_-]+(unknown|not[[:space:]]+found)|manifest[^[:cntrl:]]*404|404[^[:cntrl:]]*(manifest|not[[:space:]]+found)' <<<"${probe_output}"; then
                rm -f "${probe_error}"
                echo "Unable to inspect immutable Kargo tag ${kargo_reference}: ${probe_output}" >&2
                exit 1
              fi
              docker buildx imagetools create --tag "${kargo_reference}" "${image}:${tag}" >&2
              kargo_digest="$(
                crane digest "${kargo_reference}"
              )"
              [[ "${kargo_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "${kargo_digest}" == "${digest}" ]]
            fi
            rm -f "${probe_error}"
            printf '%s' "${digest}"
          }

          tengri_digest="$(publish_image "${TENGRI_IMAGE}")"
          nanoagent_digest="$(publish_image "${NANOAGENT_IMAGE}")"
          {
            echo '### Tengri images'
            echo
            echo "- ${TENGRI_IMAGE}@${tengri_digest}"
            echo "- ${NANOAGENT_IMAGE}@${nanoagent_digest}"
            echo "- Source: ${SOURCE_SHA}"
            echo '- Platforms: linux/amd64, linux/arm64'
          } >> "${GITHUB_STEP_SUMMARY}"
