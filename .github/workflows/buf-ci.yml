name: buf

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - 'proto/**'
      - 'buf.work.yaml'
      - 'buf.yaml'
      - 'buf.lock'
      - 'buf.gen.yaml'
      - '.github/workflows/buf-ci.yml'
  pull_request:
    paths:
      - 'proto/**'
      - 'buf.work.yaml'
      - 'buf.yaml'
      - 'buf.lock'
      - 'buf.gen.yaml'
      - '.github/workflows/buf-ci.yml'

concurrency:
  group: buf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf format check
        run: buf format --diff

      - name: Buf lint
        run: buf lint

      - name: Buf breaking
        env:
          BASE_REVISION: ${{ github.event_name != 'merge_group' && 'origin/main' || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse --verify "${BASE_REVISION}^{commit}")"
          buf breaking --against ".git#ref=${base_sha}"
