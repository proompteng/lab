name: MicroVM agent

on:
  pull_request:
    paths:
      - 'services/microvm-agent/**'
      - '.github/workflows/microvm-agent.yaml'
  push:
    branches:
      - main
    paths:
      - 'services/microvm-agent/**'
      - '.github/workflows/microvm-agent.yaml'
  workflow_dispatch:

concurrency:
  group: microvm-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/microvm-agent

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/microvm-agent/go.mod
          cache-dependency-path: services/microvm-agent/go.mod

      - name: Test
        working-directory: services/microvm-agent
        run: |
          go test ./...
          go vet ./...

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/microvm-agent
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign and summarize the image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE}@${DIGEST}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/microvm-agent.yaml@refs/heads/main"

          cosign sign --yes "$image_ref"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image_ref"
          {
            echo '### MicroVM agent'
            echo
            echo "\`${image_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"
