name: bayn-qualification

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: bayn-qualification-exactly-once
  cancel-in-progress: false

jobs:
  eligibility:
    name: Run governed qualification once
    runs-on: arc-arm64
    timeout-minutes: 180
    steps:
      - name: Reject manual invocation
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'Manual qualification dispatch is forbidden.' >&2
          exit 1

      - name: Checkout exact scheduled main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install local Bayn lifecycle dependencies
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts --filter @proompteng/bayn --filter @proompteng/scripts

      - name: Verify candidate lifecycle before any image or credential access
        id: lifecycle
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${GITHUB_SHA}"
          bun packages/scripts/src/bayn/verify-qualification-dormancy.ts \
            --repository-root "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Stop safely while qualification is dormant
        if: steps.lifecycle.outputs.eligible != 'true'
        run: |
          echo "Qualification remains dormant: ${{ steps.lifecycle.outputs.reason }}"
          echo 'No credentials, Signal data, PostgreSQL state, holdout, image, or qualification command were accessed.'

      - name: Set up the local image-build toolchain
        if: steps.lifecycle.outputs.eligible == 'true'
        uses: ./.github/actions/setup-nix-toolchain
        with:
          require-preinstalled: 'true'

      - name: Build and load the exact checked-out source image locally
        id: image
        if: steps.lifecycle.outputs.eligible == 'true'
        shell: bash
        env:
          IMAGE_REPOSITORY: registry.ide-newton.ts.net/lab/bayn
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${GITHUB_SHA}"

          output_link="${RUNNER_TEMP}/bayn-qualification-image"
          nix build .#bayn-image --print-build-logs --out-link "$output_link"
          image_tar="$(readlink -f "$output_link")"
          test -f "$image_tar"
          bash nix/verify-bayn-image-command.sh "$image_tar"
          docker load --input "$image_tar"

          run_reference="${IMAGE_REPOSITORY}:nix"
          local_manifest_digest="$(bash nix/oci-inspect-archive.sh "$image_tar" | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          published_reference="${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"
          published_digest="$(regctl image digest "$published_reference")"
          [[ "$published_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          published_manifest="$(regctl manifest get "$published_reference" --format raw-body)"
          jq -e --arg local_manifest_digest "$local_manifest_digest" '
            (.manifests | type == "array")
            and any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")
            and any(
              .manifests[];
              .platform.os == "linux"
              and .platform.architecture == "arm64"
              and .digest == $local_manifest_digest
            )
          ' <<<"$published_manifest" >/dev/null
          source_revision="$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "$run_reference")"
          test "$source_revision" = "${GITHUB_SHA}"
          echo "run_reference=${run_reference}" >> "$GITHUB_OUTPUT"
          echo "binding=${IMAGE_REPOSITORY}@${published_digest}" >> "$GITHUB_OUTPUT"

      - name: Run exactly one isolated read-only qualification
        id: qualify
        if: steps.lifecycle.outputs.eligible == 'true'
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.run_reference }}
          IMAGE_BINDING: ${{ steps.image.outputs.binding }}
          GITHUB_TOKEN: ${{ github.token }}
          BAYN_CLICKHOUSE_USERNAME: ${{ secrets.BAYN_QUALIFICATION_CLICKHOUSE_USERNAME }}
          BAYN_CLICKHOUSE_PASSWORD: ${{ secrets.BAYN_QUALIFICATION_CLICKHOUSE_PASSWORD }}
          BAYN_POSTGRES_URL: ${{ secrets.BAYN_QUALIFICATION_POSTGRES_URL }}
          BAYN_QUALIFICATION_POSTGRES_CA_PEM: ${{ secrets.BAYN_QUALIFICATION_POSTGRES_CA_PEM }}
          BAYN_AUDIT_SIGNAL_PUBLISHER_USERNAME: ${{ secrets.BAYN_QUALIFICATION_SIGNAL_PUBLISHER_USERNAME }}
          BAYN_AUDIT_CLICKHOUSE_USERNAME: ${{ secrets.BAYN_QUALIFICATION_AUDIT_CLICKHOUSE_USERNAME }}
          BAYN_AUDIT_CLICKHOUSE_PASSWORD: ${{ secrets.BAYN_QUALIFICATION_AUDIT_CLICKHOUSE_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          log="${RUNNER_TEMP}/bayn-qualification.log"
          terminal="${RUNNER_TEMP}/bayn-qualification-terminal.json"
          rm -f -- "$log" "$terminal"

          docker run --rm \
            --pull=never \
            --network host \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            -e GITHUB_API_URL \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ATTEMPT \
            -e GITHUB_RUN_ID \
            -e GITHUB_SHA \
            -e GITHUB_TOKEN \
            -e BAYN_CLICKHOUSE_USERNAME \
            -e BAYN_CLICKHOUSE_PASSWORD \
            -e BAYN_POSTGRES_URL \
            -e BAYN_QUALIFICATION_POSTGRES_CA_PEM \
            -e BAYN_AUDIT_SIGNAL_PUBLISHER_USERNAME \
            -e BAYN_AUDIT_CLICKHOUSE_USERNAME \
            -e BAYN_AUDIT_CLICKHOUSE_PASSWORD \
            -e BAYN_QUALIFICATION_REPOSITORY_PATH=/workspace \
            -e BAYN_QUALIFICATION_TRUSTED_REPOSITORY="${GITHUB_REPOSITORY}" \
            -e BAYN_QUALIFICATION_IMAGE_REFERENCE="$IMAGE_BINDING" \
            -e BAYN_QUALIFICATION_MODE=execute \
            --entrypoint bayn-qualification-collector \
            "$IMAGE_REFERENCE" >"$log" 2>&1

          terminal_lines=()
          while IFS= read -r terminal_line; do terminal_lines+=("$terminal_line"); done < <(grep '^BAYN_QUALIFICATION_TERMINAL=' "$log")
          test "${#terminal_lines[@]}" -eq 1
          printf '%s\n' "${terminal_lines[0]#BAYN_QUALIFICATION_TERMINAL=}" > "$terminal"
          echo "terminal=${terminal}" >> "$GITHUB_OUTPUT"

      - name: Build typed PAPER activation evidence
        id: activation-evidence
        if: steps.lifecycle.outputs.eligible == 'true' && steps.qualify.outcome == 'success'
        shell: bash
        env:
          TERMINAL: ${{ steps.qualify.outputs.terminal }}
          REVIEWED_PINS_JSON: ${{ vars.BAYN_PAPER_ACTIVATION_REVIEWED_PINS_JSON }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          output_directory="${RUNNER_TEMP}/bayn-paper-activation-evidence"
          rm -rf -- "$output_directory"
          if [[ -z "${REVIEWED_PINS_JSON:-}" ]]; then
            echo 'Reviewed PAPER activation pins are not configured; activation evidence remains dormant.'
            echo 'emit=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          reviewed_pins="${RUNNER_TEMP}/bayn-paper-activation-reviewed-pins.json"
          printf '%s' "$REVIEWED_PINS_JSON" > "$reviewed_pins"
          bun packages/scripts/src/bayn/verify-paper-activation.ts \
            --mode build-evidence \
            --terminal "$TERMINAL" \
            --reviewed-pins "$reviewed_pins" \
            --output-dir "$output_directory" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload immutable terminal qualification evidence
        if: steps.lifecycle.outputs.eligible == 'true' && steps.qualify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bayn-qualification-terminal-${{ github.sha }}-${{ github.run_id }}
          path: ${{ steps.qualify.outputs.terminal }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload immutable PAPER activation evidence
        if: steps.lifecycle.outputs.eligible == 'true' && steps.activation-evidence.outcome == 'success' && steps.activation-evidence.outputs.emit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bayn-paper-activation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bayn-paper-activation-evidence/evidence.json
            ${{ runner.temp }}/bayn-paper-activation-evidence/pins.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Summarize terminal qualification evidence
        if: steps.lifecycle.outputs.eligible == 'true' && steps.qualify.outcome == 'success'
        shell: bash
        env:
          TERMINAL: ${{ steps.qualify.outputs.terminal }}
        run: |
          set -euo pipefail
          {
            echo '## Bayn governed qualification'
            jq -r '
              "- Source: `\(.sourceSha)`\n" +
              "- Image: `\(.image.repository)@\(.image.digest)`\n" +
              "- Candidate ordinal: `\(.candidateOrdinal)`\n" +
              "- Run: `\(.terminal.runId)`\n" +
              "- Lock: `\(.terminal.lockId)`\n" +
              "- Result: `\(.terminal.resultHash)`\n" +
              "- Verdict: `\(.terminal.verdict)`\n" +
              "- Audit: `\(.audit.auditHash)`\n" +
              "- Terminal evidence: `\(.evidenceHash)`"
            ' "$TERMINAL"
          } >> "$GITHUB_STEP_SUMMARY"
