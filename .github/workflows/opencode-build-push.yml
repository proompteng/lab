name: opencode-build-push

permissions:
  actions: read
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'services/opencode/**'
      - '!services/opencode/**/*.md'
      - '!services/opencode/**/*.mdx'
      - 'services/relay/**'
      - 'packages/platform-client/**'
      - 'proto/proompteng/authz/**'
      - 'proto/proompteng/relay/**'
      - 'services/bayn/**'
      - '!services/bayn/**/*.md'
      - '!services/bayn/**/*.mdx'
      - '!services/bayn/**/*.test.ts'
      - 'services/bayn/src/opencode/server.integration.test.ts'
      - '!services/bayn/tools/test-*'
      - '!services/bayn/tools/ci-*-timings.json'
      - '!services/bayn/tools/verify-image-metadata.ts'
      - 'docs/bayn/jev-migration-acceptance-v2.json'
      - 'flake.nix'
      - 'flake.lock'
      - 'bun.lock'
      - '**/package.json'
      - '.npmrc'
      - 'bunfig.toml'
      - 'patches/**'
      - 'argocd/applications/opencode/**'
      - 'argocd/applicationsets/platform.yaml'
      - nix/images/opencode.nix
      - nix/images/opencode-cli.nix
      - nix/images/opencode-validation-tools.nix
      - nix/packages/relay.nix
      - nix/images/bayn-runtime-root.nix
      - nix/images/bayn-deps-hash.nix
      - nix/images/normalize-bayn-bun-deps.sh
      - nix/images/bun-workspace-service.nix
      - nix/images/bun-workspace-deps-source.nix
      - nix/images/prune-bun-dependency-metadata.sh
      - nix/images/relativize-bun-cache.sh
      - nix/packages.nix
      - nix/toolchain-doctor.sh
      - nix/cache-doctor.sh
      - nix/oci-doctor.sh
      - nix/cache-push.sh
      - nix/oci-push.sh
      - nix/oci-inspect-archive.sh
      - nix/oci-release-contract.sh
      - '!argocd/**/*.md'
      - '!argocd/**/*.mdx'

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ fromJSON(steps.filter.outputs.affected).image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/affected-inputs
        id: filter
        with:
          workflow: .github/workflows/opencode-build-push.yml
          dependency-aware-push: 'true'
          workspaces: |
            image: ['', 'services/bayn']

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/nix-oci-build-common.yml
    with:
      image_name: opencode
      package_attr: opencode-image
      tag: sha-${{ github.sha }}
      publish_kargo_tag: true
      source_revision: ${{ github.sha }}
      pr_number: ''
      latest: true
      publish_on_dispatch: false
    secrets: inherit
