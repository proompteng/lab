name: bayn-build-push

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'services/bayn/**'
      - 'packages/scripts/src/bayn/update-manifests.ts'
      - 'nix/images/bayn.nix'
      - 'nix/images/bun-workspace-service.nix'
      - 'nix/images/bun-workspace-deps-source.nix'
      - 'nix/packages.nix'
      - 'nix/cache-push.sh'
      - 'nix/ci-nix-oci-summary.sh'
      - 'nix/ci-run-timed.sh'
      - 'nix/oci-inspect-archive.sh'
      - 'nix/oci-push.sh'
      - 'flake.nix'
      - 'flake.lock'
      - 'bun.lock'
      - 'package.json'
      - '**/package.json'
      - '.npmrc'
      - 'bunfig.toml'
      - 'patches/**'
      - 'tsconfig.base.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/nix-oci-build-common.yml
    with:
      image_name: bayn
      package_attr: bayn-image
      tag: sha-${{ github.sha }}
      # Keep OCI builds out of the repository-wide `ci-pr-*` concurrency group.
      pr_number: ''
      latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      publish_on_dispatch: true
      release_artifact_name: bayn-release-contract
    secrets: inherit
