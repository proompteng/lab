name: bayn-build-push

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
    paths:
      - 'services/bayn/**'
      - 'packages/scripts/src/bayn/update-manifests.ts'
      - 'packages/scripts/src/bayn/verify-release-review.ts'
      - 'nix/images/bayn.nix'
      - 'nix/images/bayn-runtime-root.nix'
      - 'nix/images/bun-workspace-service.nix'
      - 'nix/images/bun-workspace-deps-source.nix'
      - 'nix/packages.nix'
      - 'nix/cache-push.sh'
      - 'nix/ci-nix-oci-summary.sh'
      - 'nix/ci-run-timed.sh'
      - 'nix/oci-inspect-archive.sh'
      - 'nix/oci-push.sh'
      - 'nix/oci-release-contract.sh'
      - 'nix/verify-bayn-image-command.sh'
      - 'flake.nix'
      - 'flake.lock'
      - 'bun.lock'
      - 'package.json'
      - '**/package.json'
      - '.npmrc'
      - 'bunfig.toml'
      - 'patches/**'
      - 'tsconfig.base.json'
      - '.github/actions/setup-nix-toolchain/**'
      - '.github/workflows/bayn-*.yml'
      - '.github/workflows/nix-oci-build-common.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-review-eligibility:
    name: Verify exact-head Codex review
    runs-on: arc-arm64
    timeout-minutes: 6
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Hold until source PR review is release-eligible
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          bun packages/scripts/src/bayn/verify-release-review.ts \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --push-before "${PUSH_BEFORE}" \
            --max-attempts 10 \
            --poll-interval-ms 10000 \
            --request-timeout-ms 10000

  image:
    needs: release-review-eligibility
    uses: ./.github/workflows/nix-oci-build-common.yml
    with:
      image_name: bayn
      package_attr: bayn-image
      tag: sha-${{ github.sha }}
      # Keep OCI builds out of the repository-wide `ci-pr-*` concurrency group.
      pr_number: ''
      latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      release_artifact_name: bayn-release-contract
    secrets: inherit
