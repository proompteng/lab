name: Verify Bun dependency closure

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.service }} dependency closure (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: arc-amd64
            system: x86_64-linux
          - arch: arm64
            runner: arc-arm64
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ATTIC_CACHE_ENDPOINT: http://attic.attic.svc.cluster.local
      ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
      NIX_BUN_FOD_TIMEOUT: 10m
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require Attic public key
        run: test -n "${ATTIC_PUBLIC_KEY}"

      - name: Set up Nix toolchain
        uses: ./.github/actions/setup-nix-toolchain
        with:
          github-token: ${{ github.token }}
          require-preinstalled: 'true'
          install-ci-toolchain: 'false'
          extra-nix-config: |
            experimental-features = nix-command flakes
            substituters = http://attic.attic.svc.cluster.local/lab https://cache.nixos.org/
            extra-trusted-public-keys = ${{ vars.ATTIC_PUBLIC_KEY }}
            fallback = true
            connect-timeout = 10
            stalled-download-timeout = 60
            download-attempts = 1

      - name: Prove dependency source boundary
        if: inputs.service != 'app'
        run: bash nix/images/bun-workspace-deps-source.test.sh

      - name: Recompute Bun fixed-output dependency closure
        env:
          BUN_SYSTEM: ${{ matrix.system }}
          BUN_SERVICE: ${{ inputs.service }}
        run: bash nix/check-bun-dependency-closure.sh "${BUN_SERVICE}" "${BUN_SYSTEM}"
