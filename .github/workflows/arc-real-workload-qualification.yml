name: ARC real workload qualification

on:
  pull_request:
    paths:
      - .github/workflows/arc-real-workload-qualification.yml

permissions:
  contents: read

concurrency:
  group: arc-real-workload-registry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: ${{ matrix.image.package }} / ${{ matrix.arch }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-${{ matrix.arch }}
    timeout-minutes: 38
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [amd64, arm64]
        image:
          - package: opencode-image
            revision: 9af2ccad3e6579fb0417e9691287532a81fe8596
            build_from_inputs: true
    env:
      ARCH: ${{ matrix.arch }}
      PACKAGE: ${{ matrix.image.package }}
      BUILD_FROM_INPUTS: ${{ matrix.image.build_from_inputs }}
      EXPECTED_SOURCE: ${{ matrix.image.revision }}
      ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.image.revision }}
          persist-credentials: false
      - name: Run native build and stage the result on a 16Gi tmpfs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -n "$ATTIC_PUBLIC_KEY"
          evidence="$RUNNER_TEMP/arc-real-workload"
          mkdir -p "$evidence"
          crane export --platform "linux/$ARCH" \
            docker.io/library/registry:3@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33 - |
            tar -x -C "$evidence" bin/registry
          test -x "$evidence/bin/registry"
          sudo -n -E /usr/bin/env "PATH=$PATH" unshare --mount --propagation private \
            bash -s -- "$evidence" "$GITHUB_WORKSPACE" <<'TRIAL'
          set -euo pipefail
          cd /
          evidence="$1"
          source="$2"
          state=/run/arc-real-workload
          mkdir -p "$state" /scratch
          mount --bind "$evidence" "$state"
          mount -t tmpfs -o size=16g tmpfs /scratch
          for subdir in nix cache tmp var-tmp work; do mkdir "/scratch/$subdir"; done
          cp -a /nix/. /scratch/nix/
          cp -a /home/runner/.cache/. /scratch/cache/
          cp -a "$source/." /scratch/work/repository/
          install -d -o 1001 -g 1001 -m 700 /scratch/cache/{cargo,rustup}
          chown 1001:1001 /scratch/{nix,cache,work} /scratch/work/repository
          chmod 1777 /scratch/tmp /scratch/var-tmp
          for mount_spec in nix:/nix cache:/home/runner/.cache tmp:/tmp var-tmp:/var/tmp work:/home/runner/_work; do
            mount --bind "/scratch/${mount_spec%%:*}" "${mount_spec#*:}"
            test "$(stat -c %d "${mount_spec#*:}")" = "$(stat -c %d /scratch)"
          done
          cd /home/runner/_work/repository
          export RUNNER_TEMP=/home/runner/_work/_temp
          export GITHUB_WORKSPACE="$PWD"
          export CARGO_HOME=/home/runner/.cache/cargo RUSTUP_HOME=/home/runner/.cache/rustup
          install -d -o 1001 -g 1001 "$RUNNER_TEMP"
          cgroup="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          test "$(cat "$cgroup/memory.max")" = 17179869184
          test "$(df -P -B1 /scratch | awk 'NR == 2 {print $2}')" = 17179869184
          cp "$cgroup/memory.events" "$state/before.txt"
          printf '%s\n' checkout > "$state/phase"
          python3 - "$cgroup" "$state" > "$state/samples.tsv" <<'SAMPLER' &
          import pathlib
          import os
          import sys
          import time

          cgroup, state = map(pathlib.Path, sys.argv[1:])
          print("epoch\tphase\tscratch\tmemory\tinactive_file\tanon\tshmem\tmax\toom\toom_kill\tregistry_rss", flush=True)
          while True:
              fs = os.statvfs("/scratch")
              mem = dict(line.split() for line in (cgroup / "memory.stat").read_text().splitlines())
              events = dict(line.split() for line in (cgroup / "memory.events").read_text().splitlines())
              try:
                  pid = (state / "registry.pid").read_text().strip()
                  status = (pathlib.Path("/proc") / pid / "status").read_text()
                  registry_rss = next(int(line.split()[1]) * 1024 for line in status.splitlines()
                                      if line.startswith("VmRSS:"))
              except (FileNotFoundError, StopIteration):
                  registry_rss = 0
              print(time.time(), (state / "phase").read_text().strip(),
                    (fs.f_blocks - fs.f_bfree) * fs.f_frsize, int((cgroup / "memory.current").read_text()),
                    mem["inactive_file"], mem["anon"], mem["shmem"],
                    events["max"], events["oom"], events["oom_kill"], registry_rss, sep="\t", flush=True)
              time.sleep(0.5)
          SAMPLER
          sampler=$!
          registry=
          phase=setup
          start="$(date +%s)"
          finish() {
            status=$?
            trap - EXIT
            kill "$sampler" 2>/dev/null || true
            if [[ -n "$registry" ]]; then kill "$registry" 2>/dev/null || true; fi
            wait "$sampler" 2>/dev/null || true
            if [[ -n "$registry" ]]; then wait "$registry" 2>/dev/null || true; fi
            cp "$cgroup/memory.events" "$state/after.txt"
            jq -n --arg phase "$phase" --arg node "$ARC_RUNNER_NODE_NAME" --arg pod "$ACTIONS_RUNNER_POD_NAME" \
              --arg source "$EXPECTED_SOURCE" --arg package "$PACKAGE" --arg arch "$(uname -m)" \
              --argjson status "$status" --argjson start "$start" --argjson end "$(date +%s)" \
              --argjson memoryPeak "$(cat "$cgroup/memory.peak")" \
              '{phase:$phase,node:$node,pod:$pod,source:$source,package:$package,arch:$arch,status:$status,start:$start,end:$end,memoryPeak:$memoryPeak}' > "$state/result.json"
            exit "$status"
          }
          trap finish EXIT
          export NIX_CONFIG="experimental-features = nix-command flakes
          substituters = http://attic.attic.svc.cluster.local/lab https://cache.nixos.org/
          extra-trusted-public-keys = $ATTIC_PUBLIC_KEY
          fallback = false
          connect-timeout = 10
          stalled-download-timeout = 60
          download-attempts = 3"
          export NIX_REMOTE=local
          as_runner=(setpriv --reuid=1001 --regid=1001 --init-groups)
          target=".#$PACKAGE"
          build_flags=()
          if [[ "$BUILD_FROM_INPUTS" == true ]]; then
            phase=build-inputs
            printf '%s\n' "$phase" > "$state/phase"
            "${as_runner[@]}" nix derivation show "$target" > "$state/derivation.json"
            jq -er 'to_entries[0].value.inputDrvs | to_entries[] |
              .key + "^" + (.value | if type == "array" then . else .outputs end | join(","))' \
              "$state/derivation.json" > "$state/inputs.txt"
            mapfile -t inputs < "$state/inputs.txt"
            test "${#inputs[@]}" -gt 0
            "${as_runner[@]}" bash nix/ci-retry-attic-download.sh nix build --no-link "${inputs[@]}"
            jq -er 'to_entries[0].value.outputs.out.path' "$state/derivation.json" > "$state/output-path"
            test ! -e "$(cat "$state/output-path")"
            build_flags=(--option substitute false)
          fi
          phase=build
          printf '%s\n' "$phase" > "$state/phase"
          "${as_runner[@]}" bash nix/ci-retry-attic-download.sh nix build "$target" \
            --print-build-logs --out-link "$RUNNER_TEMP/result" "${build_flags[@]}"
          archive="$(readlink -f "$RUNNER_TEMP/result")"
          phase=inspect
          printf '%s\n' "$phase" > "$state/phase"
          "${as_runner[@]}" bash nix/oci-inspect-archive.sh "$archive"
          case "$PACKAGE" in
            bayn-image) "${as_runner[@]}" bash nix/verify-bayn-image-command.sh "$archive" trading ;;
            bayn-research-image) "${as_runner[@]}" bash nix/verify-bayn-image-command.sh "$archive" research ;;
            proompteng-image)
              "${as_runner[@]}" python3 nix/test-verify-proompteng-image-cache.py
              "${as_runner[@]}" python3 nix/verify-proompteng-image-cache.py "$archive"
              ;;
          esac
          phase=stage-to-loopback
          printf '%s\n' "$phase" > "$state/phase"
          mkdir "$state/registry"
          cat > "$state/registry.yaml" <<'REGISTRY'
          version: 0.1
          log:
            level: error
          storage:
            filesystem:
              rootdirectory: /run/arc-real-workload/registry
          http:
            addr: 127.0.0.1:18251
          REGISTRY
          OTEL_TRACES_EXPORTER=none "$state/bin/registry" serve "$state/registry.yaml" > "$state/registry.log" 2>&1 &
          registry=$!
          printf '%s\n' "$registry" > "$state/registry.pid"
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18251/v2/ >/dev/null; then break; fi
            sleep 1
          done
          "${as_runner[@]}" skopeo --insecure-policy copy --dest-precompute-digests --image-parallel-copies 1 \
            --format oci --dest-tls-verify=false "docker-archive:$archive" docker://127.0.0.1:18251/replay:tested
          crane digest --insecure 127.0.0.1:18251/replay:tested | tee "$state/digest.txt"
          phase=complete
          TRIAL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-real-${{ matrix.image.package }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/arc-real-workload/samples.tsv
            ${{ runner.temp }}/arc-real-workload/before.txt
            ${{ runner.temp }}/arc-real-workload/after.txt
            ${{ runner.temp }}/arc-real-workload/result.json
            ${{ runner.temp }}/arc-real-workload/digest.txt
            ${{ runner.temp }}/arc-real-workload/output-path
          if-no-files-found: warn
          retention-days: 7
