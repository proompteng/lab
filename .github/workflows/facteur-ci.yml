name: facteur
on:
  push:
    branches:
      - main
    paths:
      - services/facteur/**
      - .github/workflows/facteur-ci.yml
      - .github/actions/validate-go-service/**
  pull_request:
    paths:
      - services/facteur/**
      - .github/workflows/facteur-ci.yml
      - .github/actions/validate-go-service/**

concurrency:
  group: facteur-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
      - uses: ./.github/actions/validate-go-service
        with:
          service: facteur
          coverage-title: Facteur Coverage
