name: ARC live build timing

on:
  push:
    branches: [codex/arc-tmpfs]
    paths: [.github/workflows/arc-live-build-timing.yml]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image.package }} / ${{ matrix.arch }} / ${{ matrix.storage }} / ${{ matrix.repeat }}
    runs-on: arc-${{ matrix.arch }}${{ matrix.storage == 'tmpfs' && '-tmpfs' || '' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        repeat: [1, 2]
        image:
          - package: bayn-image
            revision: d6316076f3668423dab04d6b65f3e95fd4da60fb
          - package: torghut-image
            revision: 892f9290e9704b3d754cdede40e0406a5eb11616
        arch: [amd64, arm64]
        storage: [ceph, tmpfs]
    env:
      ARCH: ${{ matrix.arch }}
      PACKAGE: ${{ matrix.image.package }}
      REVISION: ${{ matrix.image.revision }}
      STORAGE: ${{ matrix.storage }}
      REPEAT: ${{ matrix.repeat }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.image.revision }}
          persist-credentials: false
      - name: Set up Nix toolchain
        uses: ./.github/actions/setup-nix-toolchain
        with:
          github-token: ${{ github.token }}
          require-preinstalled: 'true'
          install-ci-toolchain: 'false'
          extra-nix-config: |
            experimental-features = nix-command flakes
            substituters = http://attic.attic.svc.cluster.local/lab https://cache.nixos.org/
            extra-trusted-public-keys = ${{ vars.ATTIC_PUBLIC_KEY }}
            fallback = false
            connect-timeout = 10
            stalled-download-timeout = 60
            download-attempts = 3
      - name: Time dependency fetch, image assembly and verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          expected_fs=ext2/ext3
          if [[ "$STORAGE" == tmpfs ]]; then expected_fs=tmpfs; fi
          test "$(stat -f -c %T /nix)" = "$expected_fs"
          test "$(stat -c %d /nix)" = "$(stat -c %d "$RUNNER_TEMP")"
          evidence="$RUNNER_TEMP/arc-live-build"
          mkdir -p "$evidence"
          start="$(date +%s%N)"
          nix derivation show ".#$PACKAGE" > "$evidence/derivation.json"
          jq -er 'to_entries[0].value.inputDrvs | to_entries[] |
            .key + "^" + (.value | if type == "array" then . else .outputs end | join(","))' \
            "$evidence/derivation.json" > "$evidence/inputs.txt"
          mapfile -t inputs < "$evidence/inputs.txt"
          test "${#inputs[@]}" -gt 0
          bash nix/ci-retry-attic-download.sh nix build --no-link "${inputs[@]}"
          archive="$(jq -er 'to_entries[0].value.outputs.out.path' "$evidence/derivation.json")"
          test ! -e "$archive"
          inputs_ready="$(date +%s%N)"
          nix build ".#$PACKAGE" --option substitute false --print-build-logs --out-link "$evidence/result"
          test "$(readlink -f "$evidence/result")" = "$archive"
          built="$(date +%s%N)"
          bash nix/oci-inspect-archive.sh "$archive" > "$evidence/inspect.json"
          if [[ "$PACKAGE" == bayn-image ]]; then
            bash nix/verify-bayn-image-command.sh "$archive" trading
          fi
          digest="$(jq -er --arg arch "$ARCH" 'select(.architecture == $arch and .os == "linux").digest | select(startswith("sha256:"))' "$evidence/inspect.json")"
          verified="$(date +%s%N)"
          jq -n --arg arch "$ARCH" --arg package "$PACKAGE" --arg storage "$STORAGE" --arg repeat "$REPEAT" \
            --arg revision "$REVISION" --arg node "$ARC_RUNNER_NODE_NAME" --arg pod "$ACTIONS_RUNNER_POD_NAME" \
            --arg digest "$digest" --argjson dependenciesNs "$((inputs_ready-start))" \
            --argjson assemblyNs "$((built-inputs_ready))" --argjson verifyNs "$((verified-built))" \
            --argjson totalNs "$((verified-start))" \
            '{arch:$arch,package:$package,storage:$storage,repeat:$repeat,revision:$revision,node:$node,pod:$pod,digest:$digest,
              dependenciesNs:$dependenciesNs,assemblyNs:$assemblyNs,verifyNs:$verifyNs,totalNs:$totalNs}' |
            tee "$evidence/timing.json"
      - uses: actions/upload-artifact@v4
        with:
          name: arc-live-${{ matrix.image.package }}-${{ matrix.arch }}-${{ matrix.storage }}-${{ matrix.repeat }}
          path: ${{ runner.temp }}/arc-live-build/timing.json
          if-no-files-found: error
          retention-days: 7
