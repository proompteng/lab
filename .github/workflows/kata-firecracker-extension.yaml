name: Kata multi-runtime Talos extension

on:
  pull_request:
    paths:
      - 'devices/galactic/extensions/kata-firecracker/**'
      - '.github/workflows/kata-firecracker-extension.yaml'
  push:
    branches:
      - main
    paths:
      - 'devices/galactic/extensions/kata-firecracker/**'
      - '.github/workflows/kata-firecracker-extension.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/talos-kata-runtimes
  CATALOG_IMAGE: ghcr.io/${{ github.repository_owner }}/talos-extensions
  TALOS_VERSION: v1.13.9
  VERSION: 4.1.0-talos-v1.13.9

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: devices/galactic/extensions/kata-firecracker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign the multi-architecture image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE}@${DIGEST}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/kata-firecracker-extension.yaml@refs/heads/main"

          cosign sign --yes "$image_ref"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image_ref"

  catalog:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Crane
        uses: imjasonh/setup-crane@v0.4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Build the combined extension catalog
        env:
          EXTENSION_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          extension_ref="${IMAGE}:${VERSION}@${EXTENSION_DIGEST}"
          devices/galactic/extensions/kata-firecracker/build-catalog.sh \
            "ghcr.io/siderolabs/extensions:${TALOS_VERSION}" \
            "$extension_ref" \
            out/catalog

      - name: Publish, sign and verify the catalog
        id: publish
        run: |
          set -euo pipefail
          catalog_ref="${CATALOG_IMAGE}:${TALOS_VERSION}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/kata-firecracker-extension.yaml@refs/heads/main"

          crane append \
            --oci-empty-base \
            --new_layer out/catalog/catalog.tar \
            --new_tag "$catalog_ref"

          digest="$(crane digest "$catalog_ref")"
          immutable_ref="${CATALOG_IMAGE}@${digest}"
          cosign sign --yes "$immutable_ref"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$immutable_ref"

          crane export "$immutable_ref" - | tar -xOf - image-digests \
            | grep -Fqx "${IMAGE}:${VERSION}@${{ needs.build.outputs.digest }}"

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '### Talos extension catalog'
            echo
            echo "\`${immutable_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  installers:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ryzen-amd64
            arch: amd64
            tag: installer-v1.13.9-kata-4.1.0-ryzen-amd64
          - profile: turin-amd64
            arch: amd64
            tag: installer-v1.13.9-kata-4.1.0-turin-amd64
          - profile: altra-arm64
            arch: arm64
            tag: installer-v1.13.9-kata-4.1.0-altra-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Crane
        uses: imjasonh/setup-crane@v0.4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Build Talos installer
        id: installer
        env:
          EXTENSION_REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          installer_tar="$(
            devices/galactic/extensions/kata-firecracker/build-installer.sh \
              "$PROFILE" \
              "$EXTENSION_REF" \
              out
          )"
          echo "tar=$installer_tar" >> "$GITHUB_OUTPUT"

      - name: Push, verify and sign Talos installer
        env:
          ARCH: ${{ matrix.arch }}
          INSTALLER_TAG: ${{ matrix.tag }}
          INSTALLER_TAR: ${{ steps.installer.outputs.tar }}
        run: |
          set -euo pipefail
          installer_ref="${IMAGE}:${INSTALLER_TAG}"
          crane push "$INSTALLER_TAR" "$installer_ref"

          digest="$(crane digest "$installer_ref")"
          architecture="$(crane config "$installer_ref" | jq -r .architecture)"
          test "$architecture" = "$ARCH"

          cosign sign --yes "${IMAGE}@${digest}"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/kata-firecracker-extension.yaml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${digest}"
          {
            echo "### ${INSTALLER_TAG}"
            echo
            echo "\`${IMAGE}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
