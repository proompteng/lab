name: Kata multi-runtime Talos extension validation

on:
  pull_request:
    paths:
      - 'devices/galactic/extensions/kata/10-kata-firecracker.part'
      - 'devices/galactic/extensions/kata/Dockerfile'
      - 'devices/galactic/extensions/kata/build-catalog.sh'
      - 'devices/galactic/extensions/kata/build-installer.sh'
      - 'devices/galactic/extensions/kata/configuration-clh-runtime-rs.toml'
      - 'devices/galactic/extensions/kata/manifest.yaml'
      - '.github/workflows/kata-firecracker-extension.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate multi-architecture extension build
        uses: docker/build-push-action@v6
        with:
          context: devices/galactic/extensions/kata
          platforms: linux/amd64,linux/arm64
          push: false
          tags: talos-kata-runtimes:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
