name: Kata multi-runtime Talos extension

on:
  pull_request:
    paths:
      - 'devices/galactic/extensions/kata/**'
      - 'devices/galactic/releases/**'
      - 'devices/nuc/image-factory/release.json'
      - 'flake.lock'
      - '.github/actions/setup-nix-toolchain/**'
      - '.github/workflows/kata-firecracker-extension.yaml'
      - '.github/workflows/kata-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'devices/galactic/extensions/kata/**'
      - 'devices/galactic/releases/**'
      - 'devices/nuc/image-factory/release.json'
      - 'flake.lock'
      - '.github/actions/setup-nix-toolchain/**'
      - '.github/workflows/kata-firecracker-extension.yaml'
      - '.github/workflows/kata-validation.yml'
  workflow_dispatch:

concurrency:
  group: kata-extension-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Select Kata and catalog jobs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      extensions: ${{ steps.filter.outputs.extensions }}
      catalog: ${{ steps.filter.outputs.catalog }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            extensions:
              - 'devices/galactic/extensions/kata/**'
              - 'flake.lock'
              - '.github/actions/setup-nix-toolchain/**'
              - '.github/workflows/kata-firecracker-extension.yaml'
              - '.github/workflows/kata-validation.yml'
            catalog:
              - 'devices/galactic/releases/**'
              - 'devices/nuc/image-factory/release.json'
              - 'devices/galactic/extensions/kata/build-catalog.sh'
              - '.github/workflows/kata-firecracker-extension.yaml'
              - '.github/workflows/kata-validation.yml'

  catalog:
    needs: changes
    if: needs.changes.outputs.catalog == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/kata-validation.yml
    with:
      build-extensions: false

  publish-catalog:
    name: Publish signed Talos 1.14 catalog
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: catalog
    runs-on: arc-amd64
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3.10.0
      - uses: actions/download-artifact@v4
        with:
          name: talos-v1.14.0-catalog
          path: out/catalog
      - name: Publish signed extension and catalog
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          devices/galactic/releases/catalog.sh publish out/catalog
      - name: Upload publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: talos-v1.14.0-published-catalog
          path: out/catalog/
          if-no-files-found: error

  build:
    needs: changes
    if: needs.changes.outputs.extensions == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/kata-validation.yml
    with:
      validate-catalog: false
      publish-extension: true

  publish:
    name: Publish signed multi-architecture extension
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.changes.outputs.extensions == 'true' || github.event_name == 'workflow_dispatch')
    needs: [changes, build]
    runs-on: arc-amd64
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      VERSION: ${{ needs.build.outputs.version }}
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Download native extensions
        uses: actions/download-artifact@v4
        with:
          pattern: kata-extension-*
          path: ${{ runner.temp }}/kata-platforms

      - name: Publish, sign, and verify extension
        id: publish
        env:
          SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/kata-firecracker-extension.yaml@refs/heads/main
        run: |
          set -euo pipefail
          reference="${IMAGE}:${VERSION}"
          for arch in amd64 arm64; do
            layout="$RUNNER_TEMP/kata-platforms/kata-extension-${arch}"
            expected="$(cat "$layout/digest.txt")"
            [[ "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]
            skopeo copy --all --preserve-digests "oci:$layout" "docker://${reference}-${arch}"
            [[ "$(crane digest "${reference}-${arch}")" == "$expected" ]]
          done
          docker buildx imagetools create \
            --tag "${reference}" \
            "${reference}-amd64" \
            "${reference}-arm64"
          docker buildx imagetools inspect --raw "${reference}" > /tmp/kata-extension-index.json
          jq -e '
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
          ' /tmp/kata-extension-index.json

          digest="$(
            docker buildx imagetools inspect \
              --format '{{json .Manifest}}' \
              "${reference}" |
              jq -er '.digest'
          )"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable_reference="${IMAGE}@${digest}"
          cosign sign --yes "${immutable_reference}"
          cosign verify \
            --certificate-identity "${SIGNING_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${immutable_reference}" >/dev/null
          printf 'image=%s\ndigest=%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"
          {
            echo '### Kata runtime extension'
            echo
            echo "\`${immutable_reference}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  installers:
    name: Build ${{ matrix.profile }} installer
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.changes.outputs.extensions == 'true' || github.event_name == 'workflow_dispatch')
    needs: [changes, publish]
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
    runs-on: arc-amd64
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Installer images contain a large artifacts layer. Keep registry imports serial.
      max-parallel: 1
      matrix:
        include:
          - profile: ryzen-amd64
            architecture: amd64
          - profile: turin-amd64
            architecture: amd64
          - profile: altra-arm64
            architecture: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Crane
        uses: imjasonh/setup-crane@v0.4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - uses: ./.github/actions/setup-buildkit

      - name: Build installer
        id: build
        env:
          EXTENSION_REFERENCE: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          installer_tar="$(
            devices/galactic/extensions/kata/build-installer.sh \
              '${{ matrix.profile }}' \
              "${EXTENSION_REFERENCE}" \
              out
          )"
          echo "tar=${installer_tar}" >> "${GITHUB_OUTPUT}"

      - name: Publish, sign, and verify installer
        env:
          INSTALLER_TAR: ${{ steps.build.outputs.tar }}
          SIGNING_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/kata-firecracker-extension.yaml@refs/heads/main
        run: |
          set -euo pipefail
          tag="installer-v1.13.9-kata-4.1.0-r6-${{ matrix.profile }}"
          reference="${IMAGE}:${tag}"
          tar -xOf "${INSTALLER_TAR}" manifest.json | jq -e \
            'length == 1 and (.[0].RepoTags | length) == 1' >/dev/null
          regctl registry set "${IMAGE%%/*}" --tls enabled --blob-chunk 4194304 --blob-max 4194304 --req-concurrent 1
          push_log="$(mktemp)"
          trap 'rm -f "${push_log}"' EXIT
          for attempt in 1 2 3 4; do
            if regctl image import "${reference}" "${INSTALLER_TAR}" 2>&1 | tee "${push_log}"; then
              break
            fi
            if ! grep -Eiq \
              'timeout awaiting response headers|connection reset by peer|TLS handshake timeout|unexpected EOF|i/o timeout|HTTP status (429|500|502|503|504)' \
              "${push_log}"; then
              echo 'installer push failed with a non-retryable registry error' >&2
              exit 1
            fi
            if [[ "${attempt}" -eq 4 ]]; then
              echo 'installer push exhausted transient registry retries' >&2
              exit 1
            fi
            delay="$((attempt * 15))"
            echo "::warning::installer push hit a transient registry error; retrying in ${delay}s"
            sleep "${delay}"
          done
          digest="$(crane digest "${reference}")"
          test "$(crane config "${reference}" | jq -r .architecture)" = '${{ matrix.architecture }}'
          immutable_reference="${IMAGE}@${digest}"
          cosign sign --yes "${immutable_reference}"
          cosign verify \
            --certificate-identity "${SIGNING_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${immutable_reference}" >/dev/null
          {
            echo '### ${{ matrix.profile }} installer'
            echo
            echo "\`${immutable_reference}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
