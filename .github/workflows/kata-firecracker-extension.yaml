name: Kata Firecracker Talos extension

on:
  push:
    branches:
      - main
    paths:
      - 'devices/galactic/extensions/kata-firecracker/**'
      - '.github/workflows/kata-firecracker-extension.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/talos-kata-firecracker
  VERSION: 4.1.0-talos-v1.13.9

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: devices/galactic/extensions/kata-firecracker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign the multi-architecture image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  installers:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ryzen-amd64
            arch: amd64
            tag: installer-v1.13.9-kata-4.1.0-ryzen-amd64
          - profile: nvidia-amd64
            arch: amd64
            tag: installer-v1.13.9-kata-4.1.0-nvidia-amd64
          - profile: nvidia-arm64
            arch: arm64
            tag: installer-v1.13.9-kata-4.1.0-nvidia-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Crane
        uses: imjasonh/setup-crane@v0.4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Build Talos installer
        id: installer
        env:
          EXTENSION_REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          installer_tar="$(
            devices/galactic/extensions/kata-firecracker/build-installer.sh \
              "$PROFILE" \
              "$EXTENSION_REF" \
              out
          )"
          echo "tar=$installer_tar" >> "$GITHUB_OUTPUT"

      - name: Push, verify and sign Talos installer
        env:
          ARCH: ${{ matrix.arch }}
          INSTALLER_TAG: ${{ matrix.tag }}
          INSTALLER_TAR: ${{ steps.installer.outputs.tar }}
        run: |
          set -euo pipefail
          installer_ref="${IMAGE}:${INSTALLER_TAG}"
          crane push "$INSTALLER_TAR" "$installer_ref"

          digest="$(crane digest "$installer_ref")"
          architecture="$(crane config "$installer_ref" | jq -r .architecture)"
          test "$architecture" = "$ARCH"

          cosign sign --yes "${IMAGE}@${digest}"
          {
            echo "### ${INSTALLER_TAG}"
            echo
            echo "\`${IMAGE}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
