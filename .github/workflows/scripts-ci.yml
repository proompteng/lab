  push:
    branches:
      - main
    paths:
      - 'packages/scripts/**'
      - 'scripts/jangar/**'
      - 'argocd/root.yaml'
      - 'argocd/applications/argocd/**'
      - 'argocd/applications/observability/**'
      - 'argocd/applications/froussard/**'
      - 'argocd/applications/kargo/**'
      - 'argocd/applications/proompteng/**'
      - 'argocd/applications/app/**'
      - 'argocd/applications/synthesis/**'
      - 'argocd/applications/docs/**'
      - 'argocd/applications/bumba/**'
      - 'argocd/applications/oirat/**'
      - 'argocd/applications/arc/**'
      - 'argocd/applications/attic/**'
      - 'argocd/applications/headlamp/**'
      - 'argocd/applications/hermes/**'
      - 'argocd/applications/jangar/**'
      - 'argocd/applications/symphony/**'
      - 'argocd/applications/symphony-jangar/**'
      - 'argocd/applications/symphony-torghut/**'
      - 'argocd/applications/symphony-base/**'
      - 'argocd/applications/torghut/**'
      - 'argocd/applications/torghut-options/**'
      - 'argocd/applications/torghut-hyperliquid-runtime/**'
      - 'argocd/applications/torghut-hyperliquid-feed/**'
      - 'argocd/applications/agents/**'
      - 'argocd/applications/tengri/**'
      - 'argocd/applications/buzz/**'
      - 'argocd/applications/bilig/**'
      - 'argocd/applications/analysis/**'
      - 'charts/agents/**'
      - 'argocd/applicationsets/**'
      - '.github/workflows/tengri.yaml'
      - 'docs/torghut/ceph-migration.md'
      - 'docs/agents/designs/handoff-common.md'
      - 'docs/agents/primitives/**'
      - 'docs/jangar/primitives/**'
      - 'docs/agents/runbooks.md'
      - 'docs/agents/leader-election-design.md'
      - 'docs/agents/agentctl-cli-design.md'
      - 'docs/documentation-authority.md'
      - 'docs/runbooks/rook-ceph-client-ops-performance.md'
      - 'docs/nix-enabled-app-build-performance-rollout-plan.md'
      - 'devices/galactic/docs/troubleshooting-networking.md'
      - 'devices/galactic/docs/tailscale.md'
      - 'kubernetes/rook-ceph-rbd-canary/README.md'
      - 'kubernetes/rook-ceph-rwx-benchmarks/README.md'
      - '.github/workflows/scripts-ci.yml'
      - '.github/workflows/manual-docker-build-push.yaml'
      - '.github/scripts/validate-oci-mirror-inputs.sh'
  pull_request:
    paths:
      - 'packages/scripts/**'
      - 'scripts/jangar/**'
      - '.github/workflows/pull-request.yml'
      - '.github/workflows/scripts-ci.yml'
      - 'argocd/root.yaml'
      - 'argocd/applications/argocd/**'
      - 'argocd/applications/observability/**'
      - 'argocd/applications/froussard/**'
      - 'argocd/applications/kargo/**'
      - 'argocd/applications/proompteng/**'
      - 'argocd/applications/app/**'
      - 'argocd/applications/synthesis/**'
      - 'argocd/applications/docs/**'
      - 'argocd/applications/bumba/**'
      - 'argocd/applications/oirat/**'
      - 'argocd/applications/arc/**'
      - 'argocd/applications/attic/**'
      - 'argocd/applications/headlamp/**'
      - 'argocd/applications/hermes/**'
      - 'argocd/applications/jangar/**'
      - 'argocd/applications/symphony/**'
      - 'argocd/applications/symphony-jangar/**'
      - 'argocd/applications/symphony-torghut/**'
      - 'argocd/applications/symphony-base/**'
      - 'argocd/applications/torghut/**'
      - 'argocd/applications/torghut-options/**'
      - 'argocd/applications/torghut-hyperliquid-runtime/**'
      - 'argocd/applications/torghut-hyperliquid-feed/**'
      - 'argocd/applications/agents/**'
      - 'argocd/applications/tengri/**'
      - 'argocd/applications/buzz/**'
      - 'argocd/applications/bilig/**'
      - 'argocd/applications/analysis/**'
      - 'charts/agents/**'
      - 'argocd/applicationsets/**'
      - '.github/workflows/tengri.yaml'
      - 'docs/torghut/ceph-migration.md'
      - 'docs/agents/designs/handoff-common.md'
      - 'docs/agents/primitives/**'
      - 'docs/jangar/primitives/**'
      - 'docs/agents/runbooks.md'
      - 'docs/agents/leader-election-design.md'
      - 'docs/agents/agentctl-cli-design.md'
      - 'docs/documentation-authority.md'
      - 'docs/runbooks/rook-ceph-client-ops-performance.md'
      - 'docs/nix-enabled-app-build-performance-rollout-plan.md'
      - 'devices/galactic/docs/troubleshooting-networking.md'
      - 'devices/galactic/docs/tailscale.md'
      - 'kubernetes/rook-ceph-rbd-canary/README.md'
      - 'kubernetes/rook-ceph-rwx-benchmarks/README.md'
      - '.github/workflows/manual-docker-build-push.yaml'
      - '.github/scripts/validate-oci-mirror-inputs.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    uses: ./.github/workflows/common-monorepo.yml
    with:
      bun-version: 1.4.0
      node-version: 24.11.1
      install-command: sudo apt-get update && sudo apt-get install --yes lua5.4 && bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter @proompteng/scripts --filter @proompteng/bumba --filter @proompteng/temporal-bun-sdk && bun run --filter @proompteng/temporal-bun-sdk build
      lint-command: bun run --filter @proompteng/scripts lint
      oxlint-command: bun run --cwd packages/scripts lint:oxlint
      oxlint-type-command: bun run --cwd packages/scripts lint:oxlint:type
      test-command: bunx tsc --noEmit --project packages/scripts/tsconfig.atlas.json && bun test packages/scripts/src && bun test scripts/jangar/validate-primitives.test.ts
