name: signal-publisher-build-push

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'services/torghut/**'
      - 'packages/scripts/src/torghut/**'
      - '!packages/scripts/src/torghut/__tests__/**'
      - '!packages/scripts/src/torghut/**/*.test.ts'
      - 'services/dorvud/gradle/**'
      - 'services/dorvud/gradlew'
      - 'services/dorvud/gradle.properties'
      - 'services/dorvud/settings.gradle.kts'
      - 'services/dorvud/build.gradle.kts'
      - 'services/dorvud/platform/**'
      - 'services/dorvud/technical-analysis/**'
      - 'services/dorvud/technical-analysis-flink/**'
      - 'services/dorvud/websockets/**'
      - 'services/signal-publisher/**'
      - 'nix/images/torghut.nix'
      - 'nix/images/torghut-notebook.nix'
      - 'nix/images/torghut-ta.nix'
      - 'nix/images/dorvud-jvm-service.nix'
      - 'nix/images/torghut-ws.nix'
      - 'nix/images/signal-publisher.nix'
      - 'nix/images/bun-workspace-service.nix'
      - 'nix/images/bun-workspace-deps-source.nix'
      - 'nix/images/bun-workspace-deps-source.test.sh'
      - 'nix/images/prune-bun-dependency-metadata.sh'
      - 'nix/check-bun-dependency-closure.sh'
      - '.github/workflows/nix-bun-dependency-closure.yml'
      - 'services/torghut/uv.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'bun.lock'
      - '**/package.json'
      - 'bunfig.toml'
      - '.npmrc'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/nix-oci-build-common.yml'
      - '.github/workflows/torghut-ta-build-push.yaml'
      - 'packages/scripts/src/shared/oci.ts'
      - '.github/workflows/torghut-post-deploy-verify.yml'
      - 'nix/oci-push.sh'
      - 'argocd/applications/torghut/**'
      - 'argocd/applications/torghut-options/**'
      - 'argocd/applications/torghut-hyperliquid-runtime/**'
  pull_request:
    paths:
      - '.github/actions/affected-inputs/**'
      - 'packages/scripts/src/ci/**'
      - 'services/torghut/**'
      - 'packages/scripts/src/torghut/**'
      - '!packages/scripts/src/torghut/__tests__/**'
      - '!packages/scripts/src/torghut/**/*.test.ts'
      - 'services/dorvud/gradle/**'
      - 'services/dorvud/gradlew'
      - 'services/dorvud/gradle.properties'
      - 'services/dorvud/settings.gradle.kts'
      - 'services/dorvud/build.gradle.kts'
      - 'services/dorvud/platform/**'
      - 'services/dorvud/technical-analysis/**'
      - 'services/dorvud/technical-analysis-flink/**'
      - 'services/dorvud/websockets/**'
      - 'services/signal-publisher/**'
      - 'nix/images/torghut.nix'
      - 'nix/images/torghut-notebook.nix'
      - 'nix/images/torghut-ta.nix'
      - 'nix/images/dorvud-jvm-service.nix'
      - 'nix/images/torghut-ws.nix'
      - 'nix/images/signal-publisher.nix'
      - 'nix/images/bun-workspace-service.nix'
      - 'nix/images/bun-workspace-deps-source.nix'
      - 'nix/images/bun-workspace-deps-source.test.sh'
      - 'nix/images/prune-bun-dependency-metadata.sh'
      - 'nix/check-bun-dependency-closure.sh'
      - '.github/workflows/nix-bun-dependency-closure.yml'
      - 'services/torghut/uv.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'bun.lock'
      - '**/package.json'
      - 'bunfig.toml'
      - '.npmrc'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/nix-oci-build-common.yml'
      - 'packages/scripts/src/shared/oci.ts'
      - 'nix/oci-push.sh'
      - 'argocd/applications/torghut/**'
      - 'argocd/applications/torghut-options/**'
      - 'argocd/applications/torghut-hyperliquid-runtime/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ fromJSON(steps.filter.outputs.affected).service }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/affected-inputs
        id: filter
        with:
          workflow: .github/workflows/signal-publisher-build-push.yml
          workspaces: |
            service: ['', 'services/signal-publisher']

  dependency-closure:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/nix-bun-dependency-closure.yml
    with:
      service: signal-publisher
    secrets: inherit

  image:
    needs: dependency-closure
    uses: ./.github/workflows/nix-oci-build-common.yml
    with:
      image_name: signal-publisher
      package_attr: signal-publisher-image
      tag: sha-${{ github.event.pull_request.head.sha || github.sha }}
      publish_kargo_tag: true
      pr_number: ''
      latest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      publish_on_dispatch: true
    secrets: inherit
