name: Restate images

on:
  pull_request:
    paths:
      - '.github/actions/affected-inputs/**'
      - 'packages/scripts/src/ci/**'
      - '.github/workflows/restate-images.yml'
      - 'packages/scripts/src/restate/**'
      - 'services/restate/**'
      - 'argocd/applications/restate/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/restate-images.yml'
      - 'packages/scripts/src/restate/**'
      - 'services/restate/**'
      - 'argocd/applications/restate/**'

concurrency:
  group: restate-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: registry.ide-newton.ts.net/lab/restate

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ fromJSON(steps.filter.outputs.affected).service }}
      reuse: ${{ steps.plan.outputs.reuse }}
      source: ${{ steps.plan.outputs.source }}
      run: ${{ steps.plan.outputs.run }}
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/affected-inputs
        id: filter
        with:
          workflow: .github/workflows/restate-images.yml
          workspaces: |
            service: ['', 'packages/scripts']
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install script dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter @proompteng/scripts
      - name: Validate configuration and release selection
        run: |
          bun test packages/scripts/src/shared/__tests__/restate-resilience-contract.test.ts packages/scripts/src/restate/release-inputs.test.ts \
            packages/scripts/src/ci/__tests__/affected-inputs.test.ts packages/scripts/src/shared/__tests__/kargo.test.ts
          bun packages/scripts/src/ci/generate-observability-workflows.ts --check
      - name: Select build or qualified runtime reuse
        id: plan
        run: bun packages/scripts/src/restate/release-inputs.ts

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true' && needs.changes.outputs.reuse != 'true'
    name: Restate build and fault tests (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: arc-amd64
          - architecture: arm64
            runner: arc-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install script dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter @proompteng/scripts
      - name: Resolve source metadata
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-buildkit
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Restore trusted Cargo cache mounts
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          reference="${IMAGE}:cargo-cache-${ARCHITECTURE}"
          utility="$(awk '$1 == "FROM" {print $2; exit}' services/restate/Dockerfile)"
          if digest="$(crane digest "$reference" 2>/tmp/restate-cache-error)"; then
            cosign verify --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/restate-images.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${digest}" >/dev/null
            docker buildx build --file packages/scripts/src/restate/cargo-cache.Dockerfile \
              --build-arg "UTILITY_IMAGE=$utility" --build-arg "CACHE_IMAGE=${IMAGE}@${digest}" \
              --target restore --platform "linux/${ARCHITECTURE}" .
          else
            grep -Eiq 'manifest[[:space:]_-]+(unknown|not[[:space:]]+found)|manifest[^[:cntrl:]]*404|404[^[:cntrl:]]*(manifest|not[[:space:]]+found)' /tmp/restate-cache-error
            echo 'No persisted Cargo cache yet; the first source build will populate it.'
          fi
      - name: Prove metadata writes and cold-peer elections
        uses: docker/build-push-action@v6
        with:
          context: services/restate
          target: evidence
          platforms: linux/${{ matrix.architecture }}
          outputs: type=local,dest=.artifacts/restate
          provenance: false
          cache-from: type=gha,scope=restate-test-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=restate-test-${{ matrix.architecture }}
      - name: Build runtime
        uses: docker/build-push-action@v6
        with:
          context: services/restate
          platforms: linux/${{ matrix.architecture }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          outputs: type=image,oci-mediatypes=true
          provenance: false
          tags: ${{ env.IMAGE }}:prepare-sha-${{ github.sha }}-run-${{ github.run_id }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.source.outputs.timestamp }}
          cache-from: type=gha,scope=restate-runtime-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=restate-runtime-${{ matrix.architecture }}
      - name: Persist Cargo cache mounts for future source builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          utility="$(awk '$1 == "FROM" {print $2; exit}' services/restate/Dockerfile)"
          cache_args=(--file packages/scripts/src/restate/cargo-cache.Dockerfile --build-arg "UTILITY_IMAGE=$utility"
            --build-arg "CACHE_NONCE=$GITHUB_RUN_ID" --platform "linux/$ARCHITECTURE")
          docker buildx build "${cache_args[@]}" --target status --output type=local,dest=.artifacts/cache-status .
          : > .artifacts/restate/cache-digest
          if grep -Fxq true .artifacts/cache-status/populated; then
            reference="${IMAGE}:cargo-cache-pending-${ARCHITECTURE}"
            docker buildx build "${cache_args[@]}" --target archive --provenance=false \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$reference" --push .
            crane digest "$reference" > .artifacts/restate/cache-digest
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restate-proof-${{ matrix.architecture }}-${{ github.run_id }}
          path: .artifacts/restate
          if-no-files-found: error

  cache-proof:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prove Cargo cache handoff between empty workers
        run: bash packages/scripts/src/restate/verify-cargo-cache.sh

  publish:
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.changes.outputs.changed == 'true' &&
      needs.cache-proof.result == 'success' &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.changes.outputs.reuse == 'true'))
    needs: [changes, build, cache-proof]
    runs-on: arc-amd64-publish
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3.10.0
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          pattern: restate-proof-*-${{ github.run_id }}
          path: .artifacts/native
      - name: Sign and retain the new compiler caches
        if: needs.build.result == 'success'
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            digest="$(cat ".artifacts/native/restate-proof-${architecture}-${GITHUB_RUN_ID}/cache-digest")"
            if test -z "$digest"; then continue; fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            crane config "${IMAGE}@${digest}" | jq -e --arg sha "$GITHUB_SHA" --arg arch "$architecture" \
              '.architecture == $arch and .config.Labels["org.opencontainers.image.revision"] == $sha' >/dev/null
            cosign sign --yes "${IMAGE}@${digest}"
            crane tag "${IMAGE}@${digest}" "cargo-cache-${architecture}"
          done
      - name: Reuse the signed runtime for unchanged build inputs
        if: needs.changes.outputs.reuse == 'true'
        env:
          QUALIFIED_DIGEST: ${{ needs.changes.outputs.digest }}
          QUALIFIED_SOURCE: ${{ needs.changes.outputs.source }}
          QUALIFIED_RUN: ${{ needs.changes.outputs.run }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/restate
          reference="${IMAGE}@${QUALIFIED_DIGEST}"
          cosign verify --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/restate-images.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$reference" \
            > .artifacts/restate/reused-signature.json
          crane manifest "$reference" > .artifacts/restate/reused-index.json
          jq -e --arg sha "$QUALIFIED_SOURCE" --arg run "$QUALIFIED_RUN" \
            --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            '.annotations["org.opencontainers.image.revision"] == $sha and
             .annotations["org.opencontainers.image.source"] == $source and
             .annotations["ai.proompteng.github-actions-run-id"] == $run and
             .annotations["ai.proompteng.github-actions-build-conclusion"] == "success" and
             ([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]' \
            .artifacts/restate/reused-index.json >/dev/null
          source_timestamp="$(git show -s --format=%cI HEAD)"
          for architecture in amd64 arm64; do
            target="${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${architecture}"
            crane mutate --platform "linux/${architecture}" "$reference" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.created=${source_timestamp}" --tag "$target"
            diff <(crane manifest --platform "linux/${architecture}" "$reference" | jq -S '.layers') \
                 <(crane manifest "$target" | jq -S '.layers')
          done
      - name: Assemble and validate the immutable release index
        id: release
        run: |
          set -euo pipefail
          mkdir -p .artifacts/restate
          source_timestamp="$(git show -s --format=%cI HEAD)"
          for architecture in amd64 arm64; do
            reference="${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${architecture}"
            crane config --platform "linux/${architecture}" "$reference" | jq -e --arg sha "$GITHUB_SHA" --arg time "$source_timestamp" \
              --arg arch "$architecture" \
              '.architecture == $arch and .config.Labels["org.opencontainers.image.revision"] == $sha and
               .config.Labels["org.opencontainers.image.created"] == $time' >/dev/null
          done
          reference="${IMAGE}:sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          docker buildx imagetools create --tag "$reference" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:ai.proompteng.github-actions-run-id=${GITHUB_RUN_ID}" \
            --annotation 'index:ai.proompteng.github-actions-build-conclusion=success' \
            "${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-amd64" \
            "${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-arm64"
          crane manifest "$reference" > .artifacts/restate/index.json
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            '.annotations["org.opencontainers.image.revision"] == $sha and
             .annotations["org.opencontainers.image.source"] == $source and
             .annotations["ai.proompteng.github-actions-run-id"] == $run and
             .annotations["ai.proompteng.github-actions-build-conclusion"] == "success" and
             ([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]' \
            .artifacts/restate/index.json >/dev/null
          digest="$(crane digest "$reference")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${IMAGE}@${digest}"
          cosign verify --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/restate-images.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${digest}" \
            > .artifacts/restate/signature.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: restate-release-${{ github.run_id }}
          path: .artifacts/restate
          if-no-files-found: error
      - name: Expose the validated digest to Kargo
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          alias="${IMAGE}:kargo-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          if existing="$(crane digest "$alias" 2>/tmp/restate-alias-error)"; then
            test "$existing" = "$DIGEST"
          else
            grep -Eiq 'manifest[[:space:]_-]+(unknown|not[[:space:]]+found)|manifest[^[:cntrl:]]*404|404[^[:cntrl:]]*(manifest|not[[:space:]]+found)' /tmp/restate-alias-error
            crane tag "${IMAGE}@${DIGEST}" "kargo-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          fi
          test "$(crane digest "$alias")" = "$DIGEST"
