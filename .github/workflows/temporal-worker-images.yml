name: Temporal worker images

on:
  pull_request:
    paths:
      - 'services/temporal-worker/**'
      - '.github/workflows/temporal-worker-images.yml'
      - 'argocd/applications/temporal/**'
      - 'argocd/applications/kargo/**'
      - 'argocd/applicationsets/platform.yaml'
      - 'packages/scripts/src/shared/__tests__/kargo.test.ts'
  push:
    branches: [main]
    paths:
      - 'services/temporal-worker/**'
      - '.github/workflows/temporal-worker-images.yml'
      - 'argocd/applications/temporal/**'
      - 'argocd/applications/kargo/**'
      - 'argocd/applicationsets/platform.yaml'
      - 'packages/scripts/src/shared/__tests__/kargo.test.ts'

concurrency:
  group: temporal-worker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: registry.ide-newton.ts.net/lab/temporal-worker

jobs:
  build:
    name: Temporal worker build and heartbeat tests (${{ matrix.architecture }})
    runs-on: ${{ github.event_name == 'pull_request' && matrix.prRunner || matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: arc-amd64
            prRunner: ubuntu-24.04
          - architecture: arm64
            runner: arc-arm64
            prRunner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Resolve source metadata
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build runtime
        uses: docker/build-push-action@v6
        with:
          context: services/temporal-worker
          platforms: linux/${{ matrix.architecture }}
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:prepare-sha-${{ github.sha }}-run-${{ github.run_id }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.source.outputs.timestamp }}
          cache-from: |
            type=gha,scope=temporal-worker-runtime-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=temporal-worker-runtime-${{ matrix.architecture }}
      - name: Retain SDK heartbeat proof and verify server version
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/temporal-worker
          reference="${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${ARCHITECTURE}"
          docker run --rm --entrypoint temporal-server "$reference" --version | tee .artifacts/temporal-worker/version.log
          grep -F '1.31.2' .artifacts/temporal-worker/version.log
          docker buildx build services/temporal-worker --target evidence --platform "linux/${ARCHITECTURE}" \
            --output type=local,dest=.artifacts/temporal-worker \
            --cache-from "type=gha,scope=temporal-worker-runtime-${ARCHITECTURE}"
          docker image inspect "$reference" > .artifacts/temporal-worker/runtime-image.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-worker-proof-${{ matrix.architecture }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .artifacts/temporal-worker
          if-no-files-found: error
      - name: Publish tested platform image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          REGCTL_CONFIG: ${{ runner.temp }}/temporal-worker-regctl-${{ matrix.architecture }}.json
        run: |
          set -euo pipefail
          reference="${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${ARCHITECTURE}"
          archive="${RUNNER_TEMP}/temporal-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCHITECTURE}.tar"
          trap 'rm -f "$archive" "$REGCTL_CONFIG"' EXIT
          regctl version
          regctl registry set "${IMAGE%%/*}" --tls enabled \
            --blob-chunk 4194304 --blob-max 4194304 --req-concurrent 1
          docker image save --output "$archive" "$reference"
          config_path="$(tar -xOf "$archive" manifest.json | jq -er 'if length == 1 then .[0].Config else error("expected one saved image") end')"
          config_digest="sha256:$(tar -xOf "$archive" "$config_path" | sha256sum | cut -d ' ' -f 1)"
          regctl image import "$reference" "$archive"
          regctl manifest get "$reference" --platform "linux/${ARCHITECTURE}" --format raw-body \
            | jq -e --arg config "$config_digest" '.config.digest == $config' >/dev/null

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: arc-arm64
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v3.10.0
      - name: Assemble and validate the immutable release index
        id: release
        run: |
          set -euo pipefail
          mkdir -p .artifacts/temporal-worker
          source_timestamp="$(git show -s --format=%cI HEAD)"
          for architecture in amd64 arm64; do
            reference="${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${architecture}"
            crane config --platform "linux/${architecture}" "$reference" | jq -e --arg sha "$GITHUB_SHA" --arg time "$source_timestamp" \
              --arg arch "$architecture" \
              '.architecture == $arch and .config.Labels["org.opencontainers.image.revision"] == $sha and
               .config.Labels["org.opencontainers.image.created"] == $time' >/dev/null
          done
          reference="${IMAGE}:sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          docker buildx imagetools create --tag "$reference" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:ai.proompteng.github-actions-run-id=${GITHUB_RUN_ID}" \
            --annotation 'index:ai.proompteng.github-actions-build-conclusion=success' \
            "${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-amd64" \
            "${IMAGE}:prepare-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-arm64"
          crane manifest "$reference" > .artifacts/temporal-worker/index.json
          jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            '.annotations["org.opencontainers.image.revision"] == $sha and
             .annotations["org.opencontainers.image.source"] == $source and
             .annotations["ai.proompteng.github-actions-run-id"] == $run and
             .annotations["ai.proompteng.github-actions-build-conclusion"] == "success" and
             ([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]' \
            .artifacts/temporal-worker/index.json >/dev/null
          digest="$(crane digest "$reference")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${IMAGE}@${digest}"
          cosign verify --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/temporal-worker-images.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${digest}" \
            > .artifacts/temporal-worker/signature.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: temporal-worker-release-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .artifacts/temporal-worker
          if-no-files-found: error
      - name: Expose the validated digest to Kargo
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          alias="${IMAGE}:kargo-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          if existing="$(crane digest "$alias" 2>/tmp/temporal-worker-alias-error)"; then
            test "$existing" = "$DIGEST"
          else
            grep -Eiq 'manifest[[:space:]_-]+(unknown|not[[:space:]]+found)|manifest[^[:cntrl:]]*404|404[^[:cntrl:]]*(manifest|not[[:space:]]+found)' /tmp/temporal-worker-alias-error
            crane tag "${IMAGE}@${DIGEST}" "kargo-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          fi
          test "$(crane digest "$alias")" = "$DIGEST"
