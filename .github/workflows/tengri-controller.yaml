name: Tengri controller

on:
  pull_request:
    paths:
      - 'services/tengri/**'
      - 'services/nanoagent/**'
      - 'services/tengri/crd.yaml'
      - 'argocd/applications/tengri/crd.yaml'
      - '.github/workflows/tengri-controller.yaml'
  push:
    branches:
      - main
    paths:
      - 'services/tengri/**'
      - 'services/nanoagent/**'
      - 'services/tengri/crd.yaml'
      - 'argocd/applications/tengri/crd.yaml'
      - '.github/workflows/tengri-controller.yaml'
  workflow_dispatch:

concurrency:
  group: tengri-controller-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: arc-amd64
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential protobuf-compiler

      - name: Set up Go for guest interoperability
        uses: actions/setup-go@v6
        with:
          go-version-file: services/nanoagent/go.mod
          cache-dependency-path: services/nanoagent/go.sum

      - name: Validate controller
        working-directory: services/tengri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          bash test-rpc-interop.sh

      - name: Verify generated CRD
        working-directory: services/tengri
        run: |
          set -euo pipefail
          cargo run --locked --quiet --bin crdgen > /tmp/tengri-crd.yaml
          diff -u /tmp/tengri-crd.yaml crd.yaml
          diff -u /tmp/tengri-crd.yaml ../../argocd/applications/tengri/crd.yaml
