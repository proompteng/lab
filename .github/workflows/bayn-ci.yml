name: bayn

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
    inputs:
      exact_head_sha:
        description: Exact commit SHA approved for the protected Alpaca sandbox proof
        required: true
        type: string
      image_build_run_id:
        description: Successful exact-head bayn-build-push workflow_dispatch run containing bayn-release-contract
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bayn: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.bayn || steps.filter.outputs.bayn }}
      image: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.image || steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Bayn release inputs
        id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bayn=false
          image=false
          while IFS= read -r path; do
            case "${path}" in
              services/bayn/* | \
              packages/scripts/src/bayn/* | \
              argocd/applications/bayn/* | \
              argocd/applications/torghut/clickhouse/* | \
              argocd/applicationsets/product.yaml | \
              nix/images/bayn.nix | \
              nix/images/bayn-runtime-root.nix | \
              nix/images/bun-workspace-service.nix | \
              nix/images/bun-workspace-deps-source.nix | \
              nix/images/bun-workspace-deps-source.test.sh | \
              nix/packages.nix | \
              nix/cache-push.sh | \
              nix/ci-nix-oci-summary.sh | \
              nix/ci-run-timed.sh | \
              nix/oci-inspect-archive.sh | \
              nix/oci-push.sh | \
              nix/oci-release-contract.sh | \
              flake.nix | flake.lock | bun.lock | package.json | */package.json | \
              .npmrc | bunfig.toml | patches/* | tsconfig.base.json | \
              .github/actions/setup-nix-toolchain/* | \
              .github/workflows/bayn-*.yml | \
              .github/workflows/common-monorepo.yml | \
              .github/workflows/nix-oci-build-common.yml)
                bayn=true
                ;;
            esac
            case "${path}" in
              services/bayn/* | \
              packages/scripts/src/bayn/update-manifests.ts | \
              nix/images/bayn.nix | \
              nix/images/bayn-runtime-root.nix | \
              nix/images/bun-workspace-service.nix | \
              nix/images/bun-workspace-deps-source.nix | \
              nix/packages.nix | \
              nix/cache-push.sh | \
              nix/ci-nix-oci-summary.sh | \
              nix/ci-run-timed.sh | \
              nix/oci-inspect-archive.sh | \
              nix/oci-push.sh | \
              flake.nix | flake.lock | bun.lock | package.json | */package.json | \
              .npmrc | bunfig.toml | patches/* | tsconfig.base.json)
                image=true
                ;;
              .github/actions/setup-nix-toolchain/* | \
              .github/workflows/bayn-*.yml | \
              .github/workflows/nix-oci-build-common.yml)
                image=true
                ;;
            esac
          done < <(git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}")
          {
            echo "bayn=${bayn}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"

      - name: Select all checks for manual validation
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo 'bayn=true'
            echo 'image=false'
          } >> "$GITHUB_OUTPUT"

  pr-checks:
    needs: changes
    if: needs.changes.outputs.bayn == 'true'
    uses: ./.github/workflows/common-monorepo.yml
    with:
      bun-version: 1.3.14
      node-version: 24.11.1
      install-command: bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter @proompteng/bayn --filter @proompteng/scripts
      lint-command: bunx oxfmt --check services/bayn argocd/applications/bayn argocd/applications/torghut/clickhouse/bayn-sealed-secret.yaml argocd/applications/torghut/clickhouse/clickhouse-cluster.yaml
      oxlint-command: bun run --cwd services/bayn lint:oxlint
      oxlint-type-command: bun run --cwd services/bayn lint:oxlint:type
      test-command: bun run --cwd services/bayn tsc && bun run --cwd services/bayn lint:effect && bun run --cwd services/bayn test && bun test packages/scripts/src/bayn
      build-command: bun run --cwd services/bayn build
    secrets: inherit

  effect-runtime-compatibility:
    needs: changes
    if: needs.changes.outputs.bayn == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install focused dependencies
        run: >-
          bun install --frozen-lockfile --ignore-scripts
          --filter @proompteng/source
          --filter @proompteng/bayn
      - name: Verify Effect runtime compatibility cohort
        run: bun run --cwd services/bayn test:effect-runtime

  broker-sandbox-contract:
    needs: changes
    if: needs.changes.outputs.bayn == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install focused dependencies
        run: >-
          bun install --frozen-lockfile --ignore-scripts
          --filter @proompteng/source
          --filter @proompteng/bayn
      - name: Verify OBSERVE sandbox contract without broker I/O
        run: >-
          env -u BAYN_ALPACA_ACCOUNT_ID
          -u BAYN_ALPACA_KEY_ID
          -u BAYN_ALPACA_SECRET_KEY
          bun run --cwd services/bayn test:broker-sandbox

  postgres-integration:
    needs: changes
    if: needs.changes.outputs.bayn == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bayn
          POSTGRES_PASSWORD: bayn
          POSTGRES_DB: bayn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bayn -d bayn_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      BAYN_TEST_POSTGRES_URL: postgresql://bayn:bayn@127.0.0.1:5432/bayn_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install focused dependencies
        run: >-
          bun install --frozen-lockfile --ignore-scripts
          --filter @proompteng/source
          --filter @proompteng/bayn
      - name: Verify complete Bayn PostgreSQL persistence workflows
        run: bun run --cwd services/bayn test:postgres

  dependency-input-invariant:
    needs: changes
    if: needs.changes.outputs.bayn == 'true'
    runs-on: arc-amd64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Nix toolchain
        uses: ./.github/actions/setup-nix-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          require-preinstalled: 'true'
          install-ci-toolchain: 'false'
          extra-nix-config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org/
      - name: Prove dependency source boundary
        run: bash nix/images/bun-workspace-deps-source.test.sh

  image:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/nix-oci-build-common.yml
    with:
      image_name: bayn
      package_attr: bayn-image
      tag: sha-${{ github.event.pull_request.head.sha || github.sha }}
      source_revision: ${{ github.event.pull_request.head.sha }}
      pr_number: ''
      latest: false
      publish_on_dispatch: false
    secrets: inherit

  required:
    name: Bayn release gate
    if: always()
    needs:
      - changes
      - pr-checks
      - effect-runtime-compatibility
      - broker-sandbox-contract
      - postgres-integration
      - dependency-input-invariant
      - image
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable Bayn release check
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BAYN_RELEVANT: ${{ needs.changes.outputs.bayn }}
          IMAGE_RELEVANT: ${{ needs.changes.outputs.image }}
          PR_CHECKS_RESULT: ${{ needs.pr-checks.result }}
          EFFECT_RESULT: ${{ needs.effect-runtime-compatibility.result }}
          BROKER_RESULT: ${{ needs.broker-sandbox-contract.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          DEPENDENCY_INPUT_RESULT: ${{ needs.dependency-input-invariant.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          set -euo pipefail
          if [[ "${CHANGES_RESULT}" != 'success' ]]; then
            echo "Bayn change detection failed: ${CHANGES_RESULT}" >&2
            exit 1
          fi
          if [[ "${BAYN_RELEVANT}" != 'true' ]]; then
            echo 'No Bayn release inputs changed; the required gate is satisfied without running Bayn-specific jobs.'
            exit 0
          fi
          for result_name in \
            PR_CHECKS_RESULT \
            EFFECT_RESULT \
            BROKER_RESULT \
            POSTGRES_RESULT \
            DEPENDENCY_INPUT_RESULT; do
            result="${!result_name}"
            if [[ "${result}" != 'success' ]]; then
              echo "${result_name} must be success, got ${result}" >&2
              exit 1
            fi
          done
          if [[ "${IMAGE_RELEVANT}" == 'true' && "${IMAGE_RESULT}" != 'success' ]]; then
            echo "IMAGE_RESULT must be success for image-affecting changes, got ${IMAGE_RESULT}" >&2
            exit 1
          fi
          echo 'All applicable Bayn unit, type, Effect, PostgreSQL, dependency-boundary, and multi-architecture image checks passed.'

  alpaca-sandbox-contract-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bayn-alpaca-sandbox
    permissions:
      actions: read
      contents: read
    env:
      BAYN_ALPACA_SANDBOX_CONTRACT: '1'
      BAYN_ALPACA_BASE_URL: https://paper-api.alpaca.markets
      BAYN_ALPACA_ACCOUNT_ID: ${{ secrets.BAYN_ALPACA_SANDBOX_ACCOUNT_ID }}
      BAYN_ALPACA_KEY_ID: ${{ secrets.BAYN_ALPACA_SANDBOX_KEY_ID }}
      BAYN_ALPACA_SECRET_KEY: ${{ secrets.BAYN_ALPACA_SANDBOX_SECRET_KEY }}
      BAYN_ALPACA_SANDBOX_EXACT_HEAD_SHA: ${{ inputs.exact_head_sha }}
      BAYN_ALPACA_SANDBOX_IMAGE_BUILD_RUN_ID: ${{ inputs.image_build_run_id }}
      BAYN_ALPACA_SANDBOX_RECEIPT_PATH: /tmp/alpaca-sandbox-contract-receipt.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate protected dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${BAYN_ALPACA_SANDBOX_EXACT_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BAYN_ALPACA_SANDBOX_IMAGE_BUILD_RUN_ID}" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BAYN_ALPACA_SANDBOX_EXACT_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact checked-out head
        run: test "$(git rev-parse HEAD)" = "${BAYN_ALPACA_SANDBOX_EXACT_HEAD_SHA}"
      - name: Fail closed on protected credential binding
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077

          jq -n \
            --arg sourceSha "${GITHUB_SHA}" \
            --arg imageBuildRunId "${BAYN_ALPACA_SANDBOX_IMAGE_BUILD_RUN_ID}" \
            --arg startedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: "bayn.alpaca-sandbox-contract-receipt.v2",
              proofStatus: "GUARD_PENDING",
              sourceSha: $sourceSha,
              image: { buildRunId: $imageBuildRunId },
              timestamps: { startedAt: $startedAt },
              endpointClass: "ALPACA_PAPER"
            }' > "${BAYN_ALPACA_SANDBOX_RECEIPT_PATH}"

          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_SHA}" == "${BAYN_ALPACA_SANDBOX_EXACT_HEAD_SHA}" ]]
          [[ "${BAYN_ALPACA_BASE_URL}" == 'https://paper-api.alpaca.markets' ]]
          [[ "${BAYN_ALPACA_SANDBOX_CONTRACT}" == '1' ]]
          [[ "${BAYN_ALPACA_SANDBOX_IMAGE_BUILD_RUN_ID}" =~ ^[0-9]+$ ]]

          required_secrets=(
            BAYN_ALPACA_ACCOUNT_ID
            BAYN_ALPACA_KEY_ID
            BAYN_ALPACA_SECRET_KEY
          )
          for name in "${required_secrets[@]}"; do
            value="${!name:-}"
            if [[ -z "${value}" || "${value}" != "${value//[$'\t\r\n ']/}" ]]; then
              echo "::error title=Missing protected Alpaca binding::${name} is absent or malformed in environment bayn-alpaca-sandbox." >&2
              exit 2
            fi
          done
          [[ "${BAYN_ALPACA_ACCOUNT_ID}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "${BAYN_ALPACA_ACCOUNT_ID}" != "${BAYN_ALPACA_KEY_ID}" ]]
          [[ "${BAYN_ALPACA_KEY_ID}" != "${BAYN_ALPACA_SECRET_KEY}" ]]
      - name: Bind the proof to the exact multi-architecture image
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077

          image_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BAYN_ALPACA_SANDBOX_IMAGE_BUILD_RUN_ID}")"
          jq -e \
            --arg sourceSha "${GITHUB_SHA}" '
            .name == "bayn-build-push"
            and .path == ".github/workflows/bayn-build-push.yml"
            and .event == "workflow_dispatch"
            and .head_sha == $sourceSha
            and .status == "completed"
            and .conclusion == "success"
          ' <<<"${image_run_json}" >/dev/null

          image_contract_dir="$(mktemp -d "${RUNNER_TEMP}/bayn-image-contract.XXXXXXXX")"
          gh run download "${BAYN_ALPACA_SANDBOX_IMAGE_BUILD_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name bayn-release-contract \
            --dir "${image_contract_dir}"
          image_contract="${image_contract_dir}/release-contract.json"
          test -f "${image_contract}"
          jq -e \
            --arg sourceSha "${GITHUB_SHA}" '
            .service == "bayn"
            and .image == "registry.ide-newton.ts.net/lab/bayn"
            and .tag == ("sha-" + $sourceSha)
            and .sourceSha == $sourceSha
            and .packageAttr == "bayn-image"
            and .builder == "nix-dockerTools-skopeo"
            and .invocation == "github-actions"
            and (.digest | test("^sha256:[0-9a-f]{64}$"))
            and .reference == (.image + "@" + .digest)
            and ((.platforms | sort) == ["linux/amd64", "linux/arm64"])
            and (.platformDigests["linux/amd64"] | test("^sha256:[0-9a-f]{64}$"))
            and (.platformDigests["linux/arm64"] | test("^sha256:[0-9a-f]{64}$"))
          ' "${image_contract}" >/dev/null

          image_identity="$(jq -r '.reference' "${image_contract}")"
          image_tag="$(jq -r '.image + ":" + .tag' "${image_contract}")"
          printf 'BAYN_ALPACA_SANDBOX_IMAGE_IDENTITY=%s\n' "${image_identity}" >> "${GITHUB_ENV}"
          printf 'BAYN_ALPACA_SANDBOX_IMAGE_TAG=%s\n' "${image_tag}" >> "${GITHUB_ENV}"

          receipt_tmp="${BAYN_ALPACA_SANDBOX_RECEIPT_PATH}.tmp"
          jq \
            --arg imageIdentity "${image_identity}" \
            --arg imageTag "${image_tag}" '
            .proofStatus = "GUARD_READY"
            | .image.identity = $imageIdentity
            | .image.tag = $imageTag
          ' "${BAYN_ALPACA_SANDBOX_RECEIPT_PATH}" > "${receipt_tmp}"
          mv "${receipt_tmp}" "${BAYN_ALPACA_SANDBOX_RECEIPT_PATH}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install focused dependencies
        run: >-
          bun install --frozen-lockfile --ignore-scripts
          --filter @proompteng/source
          --filter @proompteng/bayn
      - name: Execute bounded real Alpaca sandbox proof
        run: bun test --cwd services/bayn src/broker/alpaca-sandbox-contract.test.ts
      - name: Upload redacted exact-head contract receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-sandbox-contract-${{ github.sha }}
          path: /tmp/alpaca-sandbox-contract-receipt.json
          if-no-files-found: error
          retention-days: 30
