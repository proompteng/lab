name: bayn

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: bayn-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bayn: ${{ github.event_name != 'pull_request' && steps.manual.outputs.bayn || fromJSON(steps.filter.outputs.affected).bayn }}
      formal: ${{ github.event_name != 'pull_request' && steps.manual.outputs.formal || fromJSON(steps.filter.outputs.affected).formal }}
      integration: ${{ steps.tests.outputs.integration }}
      unit_files: ${{ steps.tests.outputs.unit_files }}
      unit_shards: ${{ steps.tests.outputs.unit_shards }}
      unit_shard_count: ${{ steps.tests.outputs.unit_shard_count }}
      gepa: ${{ github.event_name != 'pull_request' && steps.manual.outputs.gepa || fromJSON(steps.filter.outputs.affected).gepa }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Bayn release inputs
        id: filter
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/affected-inputs
        with:
          workspaces: |
            bayn: ['', 'services/bayn', 'packages/scripts']
            formal: ['', 'services/bayn']
            gepa: ['']
          filters: |
            bayn:
              - 'services/bayn/**'
              - '!services/bayn/**/*.md'
              - '!services/bayn/**/*.mdx'
              - 'docs/bayn/jev-migration-acceptance-v2.json'
              - '!services/bayn/formal/**'
              - 'services/dorvud/**'
              - 'packages/scripts/src/bayn/**'
              - 'packages/scripts/src/shared/__tests__/bayn-cnpg-contract.test.ts'
              - 'argocd/applications/bayn/**'
              - '!argocd/applications/bayn/**/*.md'
              - '!argocd/applications/bayn/**/*.mdx'
              - 'argocd/applications/torghut/clickhouse/**'
              - 'argocd/applicationsets/product.yaml'
              - 'nix/images/bayn.nix'
              - 'nix/images/bayn-runtime-root.nix'
              - 'nix/images/bayn-frozen-control.nix'
              - 'nix/images/normalize-bayn-bun-deps.sh'
              - 'nix/images/normalize-bayn-bun-deps.test.sh'
              - 'nix/images/bun-workspace-service.nix'
              - 'nix/images/bun-workspace-deps-source.nix'
              - 'nix/images/bun-workspace-deps-source.test.sh'
              - 'nix/images/prune-bun-dependency-metadata.sh'
              - 'nix/packages.nix'
              - 'nix/verify-bayn-image-command.sh'
              - 'flake.nix'
              - 'flake.lock'
              - 'bun.lock'
              - 'package.json'
              - '*/package.json'
              - '.npmrc'
              - 'bunfig.toml'
              - 'patches/**'
              - 'tsconfig.base.json'
            formal:
              - 'services/bayn/src/**'
              - '!services/bayn/**/*.test.ts'
              - 'services/bayn/src/db/entry-inference-postgres.integration.test.ts'
              - 'services/bayn/src/system-assessment/postgres.integration.test.ts'
              - 'services/bayn/src/db/risk-clock-rejection.integration.test.ts'
              - 'services/bayn/src/db/candidate-observation-window.integration.test.ts'
              - 'services/bayn/migrations/**'
              - 'services/bayn/formal/**'
              - 'services/bayn/package.json'
              - 'services/bayn/tsconfig*.json'
              - 'tsconfig.base.json'
              - 'bunfig.toml'
              - 'patches/**'
              - '.github/workflows/bayn-formal.yml'
              - '.github/workflows/bayn-ci.yml'
            gepa:
              - 'services/bayn/gepa/**'
              - '.github/workflows/bayn-ci.yml'

      - name: Select all checks for exact-revision validation
        id: manual
        if: github.event_name != 'pull_request'
        run: |
          {
            echo 'bayn=true'
            echo 'formal=true'
            echo 'gepa=true'
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: github.event_name != 'pull_request'
        with:
          bun-version: 1.4.2

      - name: Plan owned test execution
        id: tests
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.files || '[]' }}
          BAYN_RELEVANT: ${{ github.event_name != 'pull_request' && steps.manual.outputs.bayn || fromJSON(steps.filter.outputs.affected).bayn }}
        run: bun services/bayn/tools/test-plan.ts

  formal-verification:
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    uses: ./.github/workflows/bayn-formal.yml

  pr-checks:
    needs: changes
    if: needs.changes.outputs.bayn == 'true'
    uses: ./.github/workflows/common-monorepo.yml
    with:
      bun-version: 1.4.2
      node-version: 24.11.1
      install-command: bun install --frozen-lockfile --ignore-scripts --filter @proompteng/source --filter @proompteng/bayn --filter @proompteng/scripts
      lint-command: bunx oxfmt --check services/bayn argocd/applications/bayn argocd/applications/torghut/clickhouse/bayn-sealed-secret.yaml argocd/applications/torghut/clickhouse/clickhouse-cluster.yaml
      oxlint-command: bun run --cwd services/bayn lint:oxlint
      oxlint-type-command: bun run --cwd services/bayn lint:oxlint:type
      test-command: bun run --cwd services/bayn tsc && bun test packages/scripts/src/bayn packages/scripts/src/shared/__tests__/bayn-cnpg-contract.test.ts && bash packages/scripts/src/bayn/verify-egress-proxy-restart.sh
      build-command: >-
        bun run --cwd services/bayn build &&
        bun services/bayn/tools/verify-image-metadata.ts &&
        bun run --cwd services/bayn build:research &&
        bash packages/scripts/src/bayn/verify-research-commands.sh
    secrets: inherit

  gepa:
    needs: changes
    if: needs.changes.outputs.gepa == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/bayn/gepa/requirements.txt
      - run: python -m unittest discover -s services/bayn/gepa -p 'test_*.py' -v

  unit-tests:
    needs: changes
    if: needs.changes.outputs.bayn == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.unit_shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # 1.4.3 fixes callbacks outliving isolated file globals under --parallel.
          bun-version: 1.4.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24.11.1
      - name: Install focused dependencies
        run: >-
          bun install --frozen-lockfile --ignore-scripts
          --filter @proompteng/source
          --filter @proompteng/bayn
      - name: Verify isolated unit shard without broker credentials
        working-directory: services/bayn
        env:
          BAYN_UNIT_FILES: ${{ needs.changes.outputs.unit_files }}
        run: >-
          env -u BAYN_ALPACA_ACCOUNT_ID
          -u BAYN_ALPACA_KEY_ID
          -u BAYN_ALPACA_SECRET_KEY
          bun tools/test-unit.ts ${{ matrix.shard }}/${{ needs.changes.outputs.unit_shard_count }}
      - name: Retain test durations and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayn-unit-${{ matrix.shard }}
          path: |
            services/bayn/unit-results.xml
            services/bayn/tools/ci-unit-timings.json

  market-data-replay:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24.11.1
      - name: Install focused dependencies
        run: >-
          bun install --frozen-lockfile --ignore-scripts
          --filter @proompteng/source
          --filter @proompteng/bayn
      - name: Verify market-data replay and controller recovery against disposable Kafka and Restate
        run: timeout 8m bash services/bayn/scripts/test-market-data-replay.sh

  postgres-integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bayn
          POSTGRES_PASSWORD: bayn
          POSTGRES_DB: bayn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bayn -d bayn_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      BAYN_TEST_POSTGRES_URL: postgresql://bayn:bayn@127.0.0.1:5432/bayn_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install focused dependencies
        run: >-
          bun install --frozen-lockfile --ignore-scripts
          --filter @proompteng/source
          --filter @proompteng/bayn
      - name: Verify isolated PostgreSQL persistence shard
        run: bun run --cwd services/bayn test:postgres ${{ matrix.shard }}/4
      - name: Retain PostgreSQL file timings and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bayn-postgres-${{ matrix.shard }}
          path: |
            services/bayn/postgres-results.xml
            services/bayn/tools/ci-postgres-timings.json

  archive-integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: altinity/clickhouse-server:25.3.6.10034.altinitystable
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      BAYN_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install focused dependencies
        run: >-
          bun install --frozen-lockfile --ignore-scripts
          --filter @proompteng/source
          --filter @proompteng/bayn
      - name: Bind ClickHouse endpoint to the disposable job service
        env:
          CLICKHOUSE_SERVICE_CONTAINER: ${{ job.services.clickhouse.id }}
        run: |
          set -euo pipefail
          guard_token="$(tr -d '-' < /proc/sys/kernel/random/uuid)"
          docker exec "${CLICKHOUSE_SERVICE_CONTAINER}" clickhouse-client --multiquery --query "
            CREATE DATABASE bayn_ci_guard;
            CREATE TABLE bayn_ci_guard.endpoint_identity
            (
              token FixedString(32)
            )
            ENGINE = Memory;
            INSERT INTO bayn_ci_guard.endpoint_identity VALUES ('${guard_token}');
          "
          echo "BAYN_TEST_CLICKHOUSE_GUARD_TOKEN=${guard_token}" >> "${GITHUB_ENV}"
      - name: Verify Bayn ClickHouse Date query semantics
        run: bun test services/bayn/src/market-data.clickhouse.integration.test.ts services/bayn/src/market-data/crypto-archive.integration.test.ts
      - name: Set up Java 25 for shared Dorvud features
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build the production Dorvud feature jar
        working-directory: services/dorvud
        run: ./gradlew :technical-analysis-flink:uberJar
      - name: Verify production archive JDBC timestamp and crypto payload precision
        working-directory: services/dorvud
        env:
          BAYN_TEST_JDBC_RETAIN_ARCHIVE: 'true'
        run: |
          ./gradlew :technical-analysis-flink:test --tests '*ArchiveTimestampPrecisionIntegrationTest' --tests '*CryptoMarketDataClickhouseIntegrationTest' --tests '*CryptoMarketFeatureClickhouseIntegrationTest' || {
            cat technical-analysis-flink/build/test-results/test/TEST-*ArchiveTimestampPrecisionIntegrationTest.xml
            cat technical-analysis-flink/build/test-results/test/TEST-*CryptoMarketDataClickhouseIntegrationTest.xml
            cat technical-analysis-flink/build/test-results/test/TEST-*CryptoMarketFeatureClickhouseIntegrationTest.xml
            exit 1
          }
          cat technical-analysis-flink/build/test-results/test/TEST-*ArchiveTimestampPrecisionIntegrationTest.xml
          cat technical-analysis-flink/build/test-results/test/TEST-*CryptoMarketDataClickhouseIntegrationTest.xml
          cat technical-analysis-flink/build/test-results/test/TEST-*CryptoMarketFeatureClickhouseIntegrationTest.xml
      - name: Verify Bayn reads the actual JDBC archive fixture
        run: bun test services/bayn/src/market-data/archive-jdbc-readback.integration.test.ts
      - name: Verify historical storage and shared feature export
        env:
          BAYN_TEST_DORVUD_JAR: ${{ github.workspace }}/services/dorvud/technical-analysis-flink/build/libs/technical-analysis-flink-all.jar
        run: bun test services/bayn/src/market-data/alpaca-history/history.integration.test.ts

  ledger-integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group:
          - runtime
          - backtest
          - latency-jev
          - latency-ablation
          - latency-momentum
          - latency-momentum-trading
          - frozen-control
          - restart
          - inference
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bayn
          POSTGRES_PASSWORD: bayn
          POSTGRES_DB: bayn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bayn -d bayn_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      BAYN_TEST_POSTGRES_URL: postgresql://bayn:bayn@127.0.0.1:5432/bayn_test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24.11.1
      - name: Install focused dependencies
        run: >-
          bun install --frozen-lockfile --ignore-scripts
          --filter @proompteng/source
          --filter @proompteng/bayn
      - name: Start isolated TigerBeetle for durable replay acceptance
        run: |
          set -euo pipefail
          replay_tb_image='ghcr.io/tigerbeetle/tigerbeetle:0.17.9@sha256:48f623f9c1e9b6cc44d77ca93634595ae99cce3246ded418763eb1a62eee45e9'
          replay_tb_directory="$(mktemp -d)"
          docker run --rm --security-opt seccomp=unconfined \
            -v "${replay_tb_directory}:/data" "${replay_tb_image}" \
            format --cluster=20912 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle
          docker run -d --name bayn-replay-tigerbeetle --security-opt seccomp=unconfined \
            --memory 2g --cpus 2 -p 127.0.0.1::3000 \
            -v "${replay_tb_directory}:/data" "${replay_tb_image}" \
            start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
          for _attempt in {1..30}; do
            if [[ "$(docker logs bayn-replay-tigerbeetle 2>&1)" == *'listening on'* ]]; then
              replay_tb_address="$(docker port bayn-replay-tigerbeetle 3000/tcp)"
              [[ "${replay_tb_address}" =~ ^127[.]0[.]0[.]1:[1-9][0-9]{0,4}$ ]]
              echo "BAYN_TEST_TIGERBEETLE_ADDRESS=${replay_tb_address}" >> "${GITHUB_ENV}"
              exit 0
            fi
            sleep 1
          done
          docker logs bayn-replay-tigerbeetle
          exit 1
      - name: Verify replay accounting with PostgreSQL and TigerBeetle
        run: bun run --cwd services/bayn test:ledger ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && startsWith(matrix.group, 'latency-') }}
        with:
          name: bayn-${{ matrix.group }}-${{ github.sha }}
          path: services/bayn/node_modules/.cache/bayn-latency
          if-no-files-found: error
      - name: Stop isolated replay TigerBeetle
        if: always()
        run: docker rm -f bayn-replay-tigerbeetle || true

  replay-execution-observer:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker with platform manifest evidence
        uses: docker/setup-docker-action@v5
        with:
          version: v29.9.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Set up Nix toolchain
        uses: ./.github/actions/setup-nix-toolchain
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-ci-toolchain: 'false'
          extra-nix-config: |
            experimental-features = nix-command flakes
      - name: Verify dependency boundaries and replay image execution
        env:
          BAYN_TEST_REPLAY_BASE_IMAGE: alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
          BAYN_TEST_REGISTRY_IMAGE: registry@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
          BAYN_TEST_REPLAY_EXECUTION: '1'
          BAYN_TEST_REPLAY_IMAGE: '1'
        run: |
          nix develop .#bayn-replay --command bash -euo pipefail <<'SCRIPT'
          bash nix/images/normalize-bayn-bun-deps.test.sh
          bash nix/images/bun-workspace-deps-source.test.sh
          bun install --frozen-lockfile --ignore-scripts --filter @proompteng/bayn
          bun run --cwd services/bayn test:production-runtime
          docker pull "${BAYN_TEST_REPLAY_BASE_IMAGE}"
          docker pull "${BAYN_TEST_REGISTRY_IMAGE}"
          bun test --isolate --no-orphans services/bayn/src/system-assessment/replay-image.integration.test.ts services/bayn/src/system-assessment/replay-execution.integration.test.ts
          SCRIPT

  required:
    name: Bayn release gate
    if: always()
    needs:
      - changes
      - pr-checks
      - formal-verification
      - gepa
      - unit-tests
      - archive-integration
      - ledger-integration
      - postgres-integration
      - market-data-replay
      - replay-execution-observer
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable Bayn release check
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BAYN_RELEVANT: ${{ needs.changes.outputs.bayn }}
          INTEGRATION_RELEVANT: ${{ needs.changes.outputs.integration }}
          PR_CHECKS_RESULT: ${{ needs.pr-checks.result }}
          FORMAL_RELEVANT: ${{ needs.changes.outputs.formal }}
          FORMAL_RESULT: ${{ needs.formal-verification.result }}
          GEPA_RELEVANT: ${{ needs.changes.outputs.gepa }}
          GEPA_RESULT: ${{ needs.gepa.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          ARCHIVE_RESULT: ${{ needs.archive-integration.result }}
          LEDGER_RESULT: ${{ needs.ledger-integration.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          MARKET_DATA_REPLAY_RESULT: ${{ needs.market-data-replay.result }}
          REPLAY_EXECUTION_RESULT: ${{ needs.replay-execution-observer.result }}
        run: |
          set -euo pipefail
          if [[ "${CHANGES_RESULT}" != 'success' ]]; then
            echo "Bayn change detection failed: ${CHANGES_RESULT}" >&2
            exit 1
          fi
          if [[ "${FORMAL_RELEVANT}" == 'true' && "${FORMAL_RESULT}" != 'success' ]]; then
            echo "FORMAL_RESULT must be success for proof or conformance inputs, got ${FORMAL_RESULT}" >&2
            exit 1
          fi
          if [[ "${GEPA_RELEVANT}" == 'true' && "${GEPA_RESULT}" != 'success' ]]; then
            echo "GEPA_RESULT must be success for Python inputs, got ${GEPA_RESULT}" >&2
            exit 1
          fi
          if [[ "${BAYN_RELEVANT}" != 'true' ]]; then
            echo 'No Bayn release inputs changed; the required gate is satisfied without running Bayn-specific jobs.'
            exit 0
          fi
          for result_name in \
            PR_CHECKS_RESULT \
            UNIT_RESULT; do
            if [[ "${!result_name}" != 'success' ]]; then
              echo "${result_name} must be success, got ${!result_name}" >&2
              exit 1
            fi
          done
          for result_name in \
            ARCHIVE_RESULT \
            LEDGER_RESULT \
            POSTGRES_RESULT \
            MARKET_DATA_REPLAY_RESULT \
            REPLAY_EXECUTION_RESULT; do
            result="${!result_name}"
            if [[ "${INTEGRATION_RELEVANT}" != 'true' && "${result}" == 'skipped' ]]; then
              continue
            fi
            if [[ "${result}" != 'success' ]]; then
              echo "${result_name} must be success, got ${result}" >&2
              exit 1
            fi
          done
          echo 'All applicable Bayn unit, type, archive, PostgreSQL, ledger, replay, and dependency-boundary checks passed.'
