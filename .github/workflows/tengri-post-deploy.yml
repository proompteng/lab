name: Tengri real guest acceptance

on:
  pull_request:
    paths:
      - 'packages/scripts/src/tengri/**'
      - '.github/workflows/tengri-post-deploy.yml'
  push:
    branches:
      - kargo/tengri
      - kargo/proompteng
    paths:
      - 'argocd/applications/tengri/**'
      - 'argocd/applications/proompteng/**'
  workflow_dispatch:
    inputs:
      stage:
        description: Kargo stage to diagnose
        required: true
        type: choice
        options:
          - tengri
          - proompteng
      expected_revision:
        description: Full 40-character Kargo branch revision expected by the diagnostic run
        required: true
        type: string

concurrency:
  group: tengri-real-guest-acceptance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install acceptance dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts --filter @proompteng/scripts

      - name: Run acceptance helper tests
        run: bun test packages/scripts/src/tengri/__tests__/acceptance.test.ts

      - name: Lint acceptance sources
        shell: bash
        run: |
          set -euo pipefail
          bunx oxfmt --check \
            packages/scripts/src/tengri/acceptance.ts \
            packages/scripts/src/tengri/__tests__/acceptance.test.ts
          bunx oxlint --config .oxlintrc.json \
            packages/scripts/src/tengri/acceptance.ts \
            packages/scripts/src/tengri/__tests__/acceptance.test.ts

      - name: Type-check acceptance sources
        shell: bash
        run: |
          set -euo pipefail
          bunx oxlint --config .oxlintrc.json --type-aware \
            --tsconfig packages/scripts/tsconfig.json \
            packages/scripts/src/tengri/acceptance.ts \
            packages/scripts/src/tengri/__tests__/acceptance.test.ts

  acceptance:
    needs: validate
    if: ${{ needs.validate.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: arc-arm64
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install acceptance dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts --filter @proompteng/scripts

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.2

      - name: Configure in-cluster kubeconfig when context is missing
        shell: bash
        run: |
          set -euo pipefail

          if kubectl config current-context >/dev/null 2>&1; then
            echo "Kubectl context already configured"
            exit 0
          fi

          if [ -z "${KUBERNETES_SERVICE_HOST:-}" ] || [ -z "${KUBERNETES_SERVICE_PORT:-}" ]; then
            echo "KUBERNETES_SERVICE_HOST/PORT are not set and no kubectl context exists" >&2
            exit 1
          fi
          if [ ! -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
            echo "Service account token is missing" >&2
            exit 1
          fi
          if [ ! -f /var/run/secrets/kubernetes.io/serviceaccount/ca.crt ]; then
            echo "Service account CA cert is missing" >&2
            exit 1
          fi

          kubeconfig_path="${RUNNER_TEMP}/tengri-acceptance-kubeconfig"
          echo "KUBECONFIG=${kubeconfig_path}" >> "${GITHUB_ENV}"

          kubectl config set-cluster in-cluster \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" \
            --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            --embed-certs=true \
            --kubeconfig="${kubeconfig_path}"
          kubectl config set-credentials gha-runner \
            --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            --kubeconfig="${kubeconfig_path}"
          kubectl config set-context in-cluster \
            --cluster=in-cluster \
            --user=gha-runner \
            --namespace=tengri \
            --kubeconfig="${kubeconfig_path}"
          kubectl config use-context in-cluster --kubeconfig="${kubeconfig_path}"

      - name: Validate Kubernetes identity and read access
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context
          kubectl auth whoami -n tengri

      - name: Run real guest acceptance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_STAGE: ${{ inputs.stage || '' }}
          DISPATCH_REVISION: ${{ inputs.expected_revision || '' }}
          TENGRI_AUTH_COOKIE: ${{ secrets.TENGRI_AUTH_COOKIE }}
          TENGRI_REJECTION_AUTH_COOKIE: ${{ secrets.TENGRI_REJECTION_AUTH_COOKIE }}
          TENGRI_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/tengri-real-guest-acceptance/evidence.json
          TENGRI_ACCEPTANCE_LEASE_FILE: ${{ runner.temp }}/tengri-real-guest-acceptance/lease.json
        run: |
          set -euo pipefail

          stage=''
          expected_revision=''
          case "${EVENT_NAME}:${REF_NAME}" in
            push:kargo/tengri)
              stage='tengri'
              expected_revision="${GITHUB_SHA}"
              ;;
            push:kargo/proompteng)
              stage='proompteng'
              expected_revision="${GITHUB_SHA}"
              ;;
            workflow_dispatch:*)
              stage="${DISPATCH_STAGE}"
              expected_revision="${DISPATCH_REVISION}"
              ;;
            *)
              echo "Unsupported event/ref for Tengri acceptance: ${EVENT_NAME}:${REF_NAME}" >&2
              exit 1
              ;;
          esac
          if [[ ! "${expected_revision}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The acceptance run requires a full expected Kargo branch revision" >&2
            exit 1
          fi

          bun run packages/scripts/src/tengri/acceptance.ts \
            --stage "${stage}" \
            --expected-revision "${expected_revision}" \
            --run-id "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload redacted acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: tengri-real-guest-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tengri-real-guest-acceptance/evidence.json
          if-no-files-found: warn
          retention-days: 14
