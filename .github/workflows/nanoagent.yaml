name: Nanoagent

on:
  pull_request:
    paths:
      - 'services/nanoagent/**'
      - 'services/tengri/proto/**'
      - '.github/workflows/nanoagent.yaml'
  push:
    branches:
      - main
    paths:
      - 'services/nanoagent/**'
      - 'services/tengri/proto/**'
      - '.github/workflows/nanoagent.yaml'
  workflow_dispatch:

concurrency:
  group: nanoagent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/nanoagent/go.mod
          cache-dependency-path: services/nanoagent/go.sum

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Verify guest protobuf bindings
        working-directory: services/nanoagent
        run: |
          set -euo pipefail
          buf lint ../tengri/proto --path ../tengri/proto/proompteng/runtime/guest/v1/nanoagent.proto
          buf format ../tengri/proto --path ../tengri/proto/proompteng/runtime/guest/v1/nanoagent.proto --diff --exit-code
          bash generate-proto.sh
          git diff --exit-code -- internal/guestpb

      - name: Test
        working-directory: services/nanoagent
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          GOWORK=off go test -race ./...
          GOWORK=off go vet ./...
