name: Nanoagent

on:
  pull_request:
    paths:
      - 'services/nanoagent/**'
      - '.github/workflows/nanoagent.yaml'
  push:
    branches:
      - main
    paths:
      - 'services/nanoagent/**'
      - '.github/workflows/nanoagent.yaml'
  workflow_dispatch:

concurrency:
  group: nanoagent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: registry.ide-newton.ts.net/lab/nanoagent

jobs:
  test:
    runs-on: arc-amd64
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/nanoagent/go.mod
          cache-dependency-path: services/nanoagent/go.sum

      - name: Install race detector build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential

      - name: Validate guest service
        working-directory: services/nanoagent
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          GOWORK=off go test -race ./...
          GOWORK=off go vet ./...

  image:
    needs: test
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: arc-amd64
          - architecture: arm64
            runner: arc-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build native guest image
        uses: docker/build-push-action@v6
        with:
          context: services/nanoagent
          platforms: linux/${{ matrix.architecture }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-${{ matrix.architecture }}
          provenance: mode=max
          sbom: true

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: arc-arm64
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Publish and sign multi-architecture guest image
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${tag}" \
            "${IMAGE}:${tag}-amd64" \
            "${IMAGE}:${tag}-arm64"
          docker buildx imagetools inspect --raw "${IMAGE}:${tag}" > nanoagent-index.json
          jq -e '
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
            any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
          ' nanoagent-index.json
          digest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format "{{.Manifest.Digest}}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="${IMAGE}@${digest}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/nanoagent.yaml@refs/heads/main"
          cosign sign --yes "${reference}"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${reference}"
          printf "### Nanoagent\n\n\`%s\`\n" "${reference}" >> "${GITHUB_STEP_SUMMARY}"
