name: Nanoagent

on:
  pull_request:
    paths:
      - 'services/nanoagent/**'
      - '.github/workflows/nanoagent.yaml'
  push:
    branches:
      - main
    paths:
      - 'services/nanoagent/**'
      - '.github/workflows/nanoagent.yaml'
  workflow_dispatch:

concurrency:
  group: nanoagent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: arc-amd64
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/nanoagent/go.mod
          cache-dependency-path: services/nanoagent/go.sum

      - name: Validate guest service
        working-directory: services/nanoagent
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          GOWORK=off go test -race ./...
          GOWORK=off go vet ./...

  image:
    needs: test
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: arc-amd64
          - architecture: arm64
            runner: arc-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build native guest image
        uses: docker/build-push-action@v6
        with:
          context: services/nanoagent
          platforms: linux/${{ matrix.architecture }}
          push: false
          provenance: mode=max
          sbom: true
