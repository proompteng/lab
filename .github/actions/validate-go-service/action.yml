name: Validate Go service
description: Build, vet and test a Go service with the pinned toolchain.
inputs:
  service:
    description: Service directory name under services
    required: true
  coverage-title:
    description: Heading for the coverage summary. Omit to run tests without coverage.
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.5'
        cache: true
    - name: Download dependencies
      shell: bash
      working-directory: services/${{ inputs.service }}
      run: go mod download
    - name: Build
      shell: bash
      working-directory: services/${{ inputs.service }}
      run: go build ./...
    - name: Vet
      shell: bash
      working-directory: services/${{ inputs.service }}
      run: go vet ./...
    - name: Test
      if: inputs.coverage-title == ''
      shell: bash
      working-directory: services/${{ inputs.service }}
      run: go test ./...
    - name: Test (with coverage)
      if: inputs.coverage-title != ''
      shell: bash
      working-directory: services/${{ inputs.service }}
      run: go test ./... -coverprofile=coverage.out
    - name: Publish coverage summary
      if: inputs.coverage-title != ''
      shell: bash
      working-directory: services/${{ inputs.service }}
      env:
        COVERAGE_TITLE: ${{ inputs.coverage-title }}
      run: |
        summary=$(go tool cover -func=coverage.out | grep '^total:')
        echo "### $COVERAGE_TITLE" >> "$GITHUB_STEP_SUMMARY"
        echo "- ${summary}" >> "$GITHUB_STEP_SUMMARY"
