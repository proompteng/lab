name: Set up direct BuildKit
description: Connect Buildx to the native architecture's standalone BuildKit worker.
runs:
  using: composite
  steps:
    - name: Select native BuildKit worker
      id: worker
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in
          X64) architecture=amd64 ;;
          ARM64) architecture=arm64 ;;
          *) echo "Unsupported native architecture $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        endpoint="tcp://arc-buildkit-${architecture}.arc.svc.cluster.local:1234"
        echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
        echo "BUILDKIT_HOST=$endpoint" >> "$GITHUB_ENV"
    - uses: docker/setup-buildx-action@v3
      with:
        driver: remote
        endpoint: ${{ steps.worker.outputs.endpoint }}
